interface:
  display_name: "Total Parks"
  short_description: "Find & book Holiday Parks"
  default_prompt: "Planning a caravan, camping, or cabin trip around Australia? Total Parks helps you find holiday parks, caravan parks, and campgrounds by destination, features, room or site details, trip vibe, dates, guests, pets, and rig details, then check the real facts before you commit. Ask for parks near a place, options that look open for a travel window, powered or ensuite sites, accessible or spa cabins, whether a park welcomes dogs, if your caravan or motorhome will fit a site, or what a cabin actually includes - and get answers based on current Total Parks listing, capability, policy, and planning availability checks instead of guesswork. In compatible ChatGPT surfaces, search and stay-assessment results can also appear as Total Parks cards with photos, badges, availability labels, prices, and Book Now or View Park links. Every answer links back to totalparks.com.au, and when a stay looks like a good fit you'll get a booking link with your dates, guests, and pet or rig details already filled in. Coverage spans the parks and site types listed on Total Parks; planning search is indicative, and booking and payment always happen on the Total Parks website."
dependencies:
  tools:
    - type: "mcp"
      value: "totalParks"
      description: "Total Parks read-only MCP server for Australian holiday park, caravan park, and campground data"
      transport: "streamable_http"
      url: "https://mcp.totalparks.com.au/mcp"
policy:
  allow_implicit_invocation: true
