interface:
  display_name: lg product shopping
  short_description: 'LG product shopping workflow for product discovery, recommendations,

    refinement, comparison, pricing, availability, specifications, details,

    or follow-up requests about earlier product results, even when the user

    does not explicitly mention LG.'
  icon_small: assets/icon.png
  icon_large: assets/icon.png

dependencies:
  tools:
    - type: "mcp"
      value: "lgProductCatalog"
      description: "Official LG product catalog MCP server"
      transport: "streamable_http"
      url: "https://aco.gp1dev.aws.lge.com/mcp"

policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
