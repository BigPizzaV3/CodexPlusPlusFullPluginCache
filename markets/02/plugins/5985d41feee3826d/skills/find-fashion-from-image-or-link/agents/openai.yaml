interface:
  display_name: "Shop fashion with Remode"
  short_description: "Find, compare, and watch fashion from photos, links, or text"
  default_prompt: "Use $find-fashion-from-image-or-link to find or compare the fashion product I describe, photograph, or link."
dependencies:
  tools:
    - type: "mcp"
      value: "remode-assistant"
      description: "Search live fashion listings from retailers and resale marketplaces"
      transport: "streamable_http"
      url: "https://remode-assistant-mcp.onrender.com/mcp?platform=chatgpt"
policy:
  allow_implicit_invocation: true
