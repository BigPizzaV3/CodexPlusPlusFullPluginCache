interface:
  display_name: "Valuation Brief Builder"
  short_description: "Prepare pre-valuation briefs with Propalt data"
  default_prompt: "Use $valuation-brief-builder to prepare a pre-valuation brief for these UK properties."

dependencies:
  tools:
    - type: "mcp"
      value: "propalt"
      description: "Propalt UK property data MCP server"
      transport: "streamable_http"
      url: "https://api-gateway.propalt.io/mcp"
