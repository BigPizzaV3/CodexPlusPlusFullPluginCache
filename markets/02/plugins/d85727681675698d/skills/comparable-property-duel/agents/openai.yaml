interface:
  display_name: "Comparable Property Duel"
  short_description: "Compare two UK properties side by side"
  default_prompt: "Use $comparable-property-duel to compare these two UK properties with Propalt evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "propalt"
      description: "Propalt UK property data MCP server"
      transport: "streamable_http"
      url: "https://api-gateway.propalt.io/mcp"
