interface:
  display_name: "Propalt CSV Export"
  short_description: "Export selected properties for Propalt My Lists"
  default_prompt: "Use $propalt-csv-export to export the selected property list as a Propalt-compatible CSV."

dependencies:
  tools:
    - type: "mcp"
      value: "propalt"
      description: "Propalt UK property data MCP server"
      transport: "streamable_http"
      url: "https://api-gateway.propalt.io/mcp"
