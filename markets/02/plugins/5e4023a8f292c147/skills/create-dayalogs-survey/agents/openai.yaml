interface:
  display_name: "Create Dayalogs Survey"
  short_description: "Author and preview validated surveys"
  default_prompt: "Use $create-dayalogs-survey to turn my requirements into a validated Dayalogs survey and give me a preview."
dependencies:
  tools:
    - type: "mcp"
      value: "dayalogs"
      description: "Dayalogs survey authoring and validation MCP"
      transport: "streamable_http"
      url: "https://www.dayalogs.com/mcp-openai"
policy:
  allow_implicit_invocation: true
