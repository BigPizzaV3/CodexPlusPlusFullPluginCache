interface:
  display_name: "Analyze Dayalogs Results"
  short_description: "Inspect confidence, answers, and exports"
  default_prompt: "Use $analyze-dayalogs-results to analyze this survey's current responses, explain the population and confidence signals, and recommend an export."
dependencies:
  tools:
    - type: "mcp"
      value: "dayalogs"
      description: "Dayalogs survey responses, quality, campaign telemetry, and exports MCP"
      transport: "streamable_http"
      url: "https://www.dayalogs.com/mcp-openai"
policy:
  allow_implicit_invocation: true
