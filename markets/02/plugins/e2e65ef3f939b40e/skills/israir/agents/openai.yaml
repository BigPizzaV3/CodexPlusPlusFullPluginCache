interface:
  display_name: Israir
  short_description: Book Israir flights, vacation packages, and organized group trips.
  brand_color: '#003C71'
  default_prompt: Find me an Israir flight

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: searchFlights
      description: Search available Israir flights with prices, times, and booking links.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
    - type: mcp
      value: searchVacationPackages
      description: Search Israir packages bundling a roundtrip flight with a hotel stay.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
    - type: mcp
      value: searchOrganizedTrips
      description: Search guided group tours for a named city or country.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
    - type: mcp
      value: getAvailableOrganizedTrips
      description: List organized group trip destinations grouped by country, with schedules.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
    - type: mcp
      value: getAvailableDates
      description: Find available departure dates across a date range for up to 3 destinations.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
    - type: mcp
      value: getWebsiteDeepLinks
      description: Retrieve Israir website deep links for passenger info, policies, and services by category.
      transport: streamable_http
      url: https://israir.bazak.ai/mcp?platform=mcpapp
