<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    uListen Logo - Primary Variant
    Gold background (#fbbf24) with black symbols (#111111)
    Headphones + sparkles representing AI-enhanced listening
    Based on h2-v16: centered headphones, larger sparkles, vertically balanced
  -->

  <!-- Full-bleed gold square. The rx="24" rounded corners that used
       to be here left transparent triangles outside the rounded
       shape; at 16x16 in a Google SERP row the auto-applied UI ring
       fell across that transparency and read as a white halo around
       the favicon. Square fills every pixel of the bounding box, so
       Google's clip and ring blend with the gold instead. -->
  <rect width="128" height="128" fill="#fbbf24"/>

  <!-- Headphone band (centered) -->
  <path
    d="M32 89
       C32 55, 48 39, 64 39
       C80 39, 96 55, 96 89"
    fill="none"
    stroke="#111111"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Left ear cup -->
  <rect x="22" y="81" width="20" height="34" rx="8" fill="#111111"/>

  <!-- Right ear cup -->
  <rect x="86" y="81" width="20" height="34" rx="8" fill="#111111"/>

  <!-- Primary sparkle top-right -->
  <path
    d="M99 13
       L103 27 L117 31 L103 35 L99 49
       L95 35 L81 31 L95 27 Z"
    fill="#111111"
  />

  <!-- Secondary sparkle -->
  <path
    d="M76 11
       L79 19 L87 22 L79 25 L76 33
       L73 25 L65 22 L73 19 Z"
    fill="#111111"
  />
</svg>
