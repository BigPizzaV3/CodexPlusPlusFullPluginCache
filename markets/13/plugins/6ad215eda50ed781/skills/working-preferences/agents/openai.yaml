interface:
  display_name: "Remember how I work"
  short_description: "Keep your preferred style for future conversations."
  default_prompt: "Use $working-preferences to remember how I like to work."

dependencies:
  tools:
    - type: "mcp"
      value: "mnemoverse"
      description: "Save and retrieve explicit working preferences in personal Mnemoverse memory."
      transport: "streamable_http"
      url: "https://mcp.mnemoverse.com/mcp"
