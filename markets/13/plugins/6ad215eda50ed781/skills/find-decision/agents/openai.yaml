interface:
  display_name: "Find a past decision"
  short_description: "Trace a choice back to the notes that explain it."
  default_prompt: "Use $find-decision to find why we made this choice and show the notes behind it."

dependencies:
  tools:
    - type: "mcp"
      value: "mnemoverse"
      description: "Look up recorded decisions and their reasons in Mnemoverse."
      transport: "streamable_http"
      url: "https://mcp.mnemoverse.com/mcp"
