interface:
  display_name: "Resume a project"
  short_description: "Find where you left off and the next useful step."
  default_prompt: "Use $resume-project to pick up where I left off on this project."

dependencies:
  tools:
    - type: "mcp"
      value: "mnemoverse"
      description: "Recall saved project context from the selected Mnemoverse domain or room."
      transport: "streamable_http"
      url: "https://mcp.mnemoverse.com/mcp"
