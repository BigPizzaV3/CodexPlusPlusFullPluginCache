<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Tiana &amp; Co.">
  <!--
    SQUARE brand mark (2026-08-23) — the square variant of public/logo.svg, for favicon /
    apple-touch-icon / OG-card / social-avatar use where the wide wordmark lockup doesn't fit.
    It is the wordmark's two-squares MARK alone (the text is dropped, since it can't fit a square),
    centered on white with even padding, using the exact brand tokens: ink #16233B over teal
    #0A8FA8, teal overlapping the ink's bottom-right exactly as in the lockup. White ground is
    chosen for favicon/avatar legibility; change the first <rect> to fill="none" for a transparent
    version.

    Used by (2026-10-14): src/app/favicon.ico, src/app/icon.svg and src/app/apple-icon.png, which
    scripts/build-brand-icons.ts draws from this file (npm run build:icons after any change; a test
    fails if they drift), and the MCP server's icon (src/lib/mcp/server.ts). The ChatGPT package's
    assets/logo.svg is a copy. This file must stay well-formed XML: an ampersand is written &amp;
    and a comment never contains two hyphens in a row, or browsers refuse to draw it at all.
  -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="106" y="106" width="188" height="188" fill="#16233B"/>
  <rect x="200" y="200" width="206" height="206" fill="#0A8FA8"/>
</svg>
