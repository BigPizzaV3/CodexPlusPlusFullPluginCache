interface:
  display_name: "TourMind Hotel Booking"
  short_description: "Compare hotel rates, book and manage reservations"
  default_prompt: "Use $tourmind-hotel-booking to find suitable hotels for my dates and verify the selected room before booking."
dependencies:
  tools:
    - type: "mcp"
      value: "tourmind-hotel"
      description: "TourMind hotel service with host-managed OAuth"
      transport: "streamable_http"
      url: "https://mcp-booking.tourmind.com/mcp/oauth/toc"
policy:
  allow_implicit_invocation: true
