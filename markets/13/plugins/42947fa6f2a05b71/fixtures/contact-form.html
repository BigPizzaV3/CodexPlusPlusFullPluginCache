<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Form Backend Review Contact</title>
<body><h1>Contact us</h1>
<form id="review-contact">
<label>Name <input name="full_name" type="text" required></label><br>
<label>Email <input name="email" type="email" required></label><br>
<label>Topic <select name="topic" required><option value="General">General</option><option value="Support">Support</option></select></label><br>
<label>Message <textarea name="message" required></textarea></label><br>
<button type="submit">Send</button><p id="status" role="status"></p>
</form>
<script>document.querySelector('form').addEventListener('submit', function(event) { event.preventDefault(); document.querySelector('#status').textContent='Review fixture only: connect the returned Form Backend integration before submitting.'; });</script>
</body></html>
