[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixverse-runtime"
version = "1.6.0"
description = "Local workflow tooling for PixVerse agent plugins"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PixVerse" }]
dependencies = []

[project.optional-dependencies]
graphics = ["Pillow"]

[project.scripts]
pixverse-runtime = "pixverse_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["pixverse_runtime*"]

[tool.setuptools.package-data]
"pixverse_runtime" = ["cli-compatibility.json"]
"pixverse_runtime.core" = ["cli-compatibility.json"]
