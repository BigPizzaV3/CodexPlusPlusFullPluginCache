interface:
  display_name: "PixVerse Podcast Clip"
  short_description: "Two-host conversation clips"
  default_prompt: "First apply the execution-surface gate. This workflow requires a usable desktop CLI; in MCP-only mode stop and recommend ChatGPT desktop with this plugin and a supported local executor. Use $pixverse-podcast-clip to make an 18-second podcast clip where a fitness host convinces a skeptical co-host to try my product, with split-screen opening and speaker captions."
