interface:
  display_name: "Revisa tus finanzas"
  short_description: "Entiende tus gastos e ingresos del período"
  default_prompt: "Usa $financial-review. Revisa mis gastos e ingresos de este mes con Fina."
dependencies:
  tools:
    - type: "mcp"
      value: "fina"
      description: "Access the authenticated user's Fina records and permitted operations"
      transport: "streamable_http"
      url: "https://mcp.finamoney.co/mcp"
policy:
  allow_implicit_invocation: true
