interface:
  display_name: "Registra tus compras y pagos"
  short_description: "Importa información con una vista previa"
  default_prompt: "Usa $import-financial-data. Ayúdame a importar este estado de cuenta a Fina."
dependencies:
  tools:
    - type: "mcp"
      value: "fina"
      description: "Access the authenticated user's Fina records and permitted operations"
      transport: "streamable_http"
      url: "https://mcp.finamoney.co/mcp"
policy:
  allow_implicit_invocation: true
