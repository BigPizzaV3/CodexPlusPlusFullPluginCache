interface:
  display_name: "Suscripciones e ingresos"
  short_description: "Organiza renovaciones y próximos ingresos"
  default_prompt: "Usa $manage-recurring-finances. Revisa mis suscripciones y próximos ingresos en Fina."
dependencies:
  tools:
    - type: "mcp"
      value: "fina"
      description: "Access the authenticated user's Fina records and permitted operations"
      transport: "streamable_http"
      url: "https://mcp.finamoney.co/mcp"
policy:
  allow_implicit_invocation: true
