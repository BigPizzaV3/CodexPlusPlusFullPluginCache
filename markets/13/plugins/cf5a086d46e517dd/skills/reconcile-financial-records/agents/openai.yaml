interface:
  display_name: "Pon tus registros en orden"
  short_description: "Aclara faltantes y corrige tus registros"
  default_prompt: "Usa $reconcile-financial-records. Ayúdame a revisar y corregir esta compra en Fina."
dependencies:
  tools:
    - type: "mcp"
      value: "fina"
      description: "Access the authenticated user's Fina records and permitted operations"
      transport: "streamable_http"
