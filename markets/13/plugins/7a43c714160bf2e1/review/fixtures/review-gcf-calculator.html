<!doctype html><html lang="en"><meta charset="utf-8"><title>GCF calculator</title><body><h1>GCF calculator</h1><input id="a" type="number" value="84"> <input id="b" type="number" value="126"> <button onclick="c()">Calculate</button><p id="r"></p><script>function g(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}function c(){document.getElementById('r').textContent='GCF: '+g(+document.getElementById('a').value,+document.getElementById('b').value)}c()</script><p>Synthetic calculator for plugin review.</p></body></html>
