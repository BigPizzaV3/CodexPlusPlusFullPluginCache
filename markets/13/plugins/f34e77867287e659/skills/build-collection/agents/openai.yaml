interface:
  display_name: "Build a recipe collection"
  short_description: "Curate recipes into a private project collection"
  default_prompt: "Use $build-collection to assemble a private tasting collection from my saved Formul.io recipes."

dependencies:
  tools:
    - type: "mcp"
      value: "formulio"
      description: "Formul.io recipe and collection tools"
      transport: "streamable_http"
      url: "https://api.formul.io/mcp"
