interface:
  display_name: "Import a recipe"
  short_description: "Copy an existing recipe into Formul.io unchanged"
  default_prompt: "Use $import-recipe to import this recipe into Formul.io exactly as written."

dependencies:
  tools:
    - type: "mcp"
      value: "formulio"
      description: "Formul.io recipe import and ingredient tools"
      transport: "streamable_http"
      url: "https://api.formul.io/mcp"
