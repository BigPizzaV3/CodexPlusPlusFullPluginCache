interface:
  display_name: "Improve an existing recipe"
  short_description: "Inspect a recipe and compare calculated variations"
  default_prompt: "Use $improve-recipe to diagnose my saved recipe and compare practical improvements before changing it."

dependencies:
  tools:
    - type: "mcp"
      value: "formulio"
      description: "Formul.io recipes and deterministic confectionery calculators"
      transport: "streamable_http"
      url: "https://api.formul.io/mcp"
