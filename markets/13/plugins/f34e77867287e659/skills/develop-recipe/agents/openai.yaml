interface:
  display_name: "Develop a confectionery recipe"
  short_description: "Build and calculate a recipe from your brief"
  default_prompt: "Use $develop-recipe to develop and calculate a new confectionery recipe from my brief."

dependencies:
  tools:
    - type: "mcp"
      value: "formulio"
      description: "Formul.io recipe and deterministic calculator tools"
      transport: "streamable_http"
      url: "https://api.formul.io/mcp"
