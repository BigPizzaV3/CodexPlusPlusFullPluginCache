interface:
  display_name: "Prototype a recipe line"
  short_description: "Design a set of recipes as one collection"
  default_prompt: "Use $prototype-collection to design a line of recipes against shared requirements and save it as a collection."

dependencies:
  tools:
    - type: "mcp"
      value: "formulio"
      description: "Formul.io recipe, collection and deterministic calculator tools"
      transport: "streamable_http"
      url: "https://api.formul.io/mcp"
