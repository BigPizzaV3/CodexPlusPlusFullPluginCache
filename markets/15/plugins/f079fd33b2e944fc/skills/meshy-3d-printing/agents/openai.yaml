interface:
  display_name: "Meshy 3D Printing"
  short_description: "Print-ready files, repair and slicer handoff"
  icon_small: "./assets/meshy-composer-icon.svg"
  default_prompt: "Use $meshy-3d-printing to prepare this model for 3D printing."
dependencies:
  tools:
    - type: "mcp"
      value: "meshy"
      description: "Generate, texture, browse and download Meshy 3D models"
      transport: "streamable_http"
      url: "https://mcp.meshy.ai/mcp"
