  short_description: "Pedigree charts from GEDCOM"
  brand_color: "#3D6B4F"
  default_prompt: "Pedigree chart for Jun Park: 0 A INDI 1 NAME Leo /Park/ 0 B INDI 1 NAME Jun /Park/ 1 FAMC F 0 F FAM 1 HUSB A 1 CHIL B"
dependencies:
