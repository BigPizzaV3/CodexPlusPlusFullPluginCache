interface:
  display_name: "Automate a task"
  short_description: "Run web, app, document, and agent tasks with Script.it"
  default_prompt: "Use $build-automation to complete this task once or make it run automatically."

dependencies:
  tools:
    - type: "mcp"
      value: "script-it"
      description: "Script.it cloud sessions, reusable workflows, and command output"
      transport: "streamable_http"
      url: "https://api.script.it/mcp"
