interface:
  display_name: "Get started with HYPD.AI Short Video Ads"
  short_description: "Connect TikTok Ads and review your campaigns"
  default_prompt: "Use $hypd-get-started to help me get started with HYPD.AI Short Video Ads."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hypd-tiktok-ads"
      description: "HYPD.AI Short Video Ads: TikTok campaign, ad group and ad performance, creatives and audiences"
      transport: "streamable_http"
      url: "https://tiktokads.hypd.ai/mcp"
