interface:
  display_name: "Create interactive story"
  short_description: "Write, continue or remix a Pominis story, chapter by chapter"
  default_prompt: "Use $create-interactive-story to turn my idea into a Pominis story; tell me the price before writing."
dependencies:
  tools:
    - type: "mcp"
      value: "pominis"
      description: "Write, continue, remix, check and preview Pominis interactive stories"
      transport: "streamable_http"
      url: "https://api.pominis.com/mcp"
