interface:
  display_name: "Zovo Flowchart"
  short_description: "Flowcharts with SVG and PDF"
  brand_color: "#1F6F8B"
  default_prompt: "Flowchart: Start -> Receive order -> In stock?; In stock? -> Ship: yes; In stock? -> Reorder: no; Reorder -> Ship; Ship -> End"
dependencies:
  tools:
