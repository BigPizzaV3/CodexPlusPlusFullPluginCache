interface:
  display_name: "Backtesting"
  short_description: "Backtest a trading idea on historical candles and read it honestly"
  default_prompt: "Backtest a 4h EMA 20/50 crossover on ETH over the last 12 months"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "cubrik"
      description: "cubrik MCP server — AI trading agents, backtests, portfolio and brokers"
      transport: "streamable_http"
      url: "https://mcp.cubrik.ai/chatgpt/mcp"
