interface:
  display_name: "Agent Builder"
  short_description: "Turn a trading idea into a cubrik agent, tested before it starts"
  default_prompt: "Build me an agent that buys BTC when the 4h RSI drops under 30"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "cubrik"
      description: "cubrik MCP server — AI trading agents, backtests, portfolio and brokers"
      transport: "streamable_http"
      url: "https://mcp.cubrik.ai/chatgpt/mcp"
