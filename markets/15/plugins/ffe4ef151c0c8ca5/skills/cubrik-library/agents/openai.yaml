interface:
  display_name: "Library"
  short_description: "Find, compare and copy cubrik's ready-made agents"
  default_prompt: "Show me Library agents that trade gold"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "cubrik"
      description: "cubrik MCP server — AI trading agents, backtests, portfolio and brokers"
      transport: "streamable_http"
      url: "https://mcp.cubrik.ai/chatgpt/mcp"
