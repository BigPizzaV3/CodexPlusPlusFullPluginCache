interface:
  display_name: "Portfolio Check"
  short_description: "Balances, open positions, agents and what is coming up"
  default_prompt: "Give me my morning portfolio check"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "cubrik"
      description: "cubrik MCP server — AI trading agents, backtests, portfolio and brokers"
      transport: "streamable_http"
      url: "https://mcp.cubrik.ai/chatgpt/mcp"
