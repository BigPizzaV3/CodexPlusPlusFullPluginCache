interface:
  display_name: "Zovo River Level Check"
  short_description: "USGS river flow and levels"
  brand_color: "#1D5F8C"
  default_prompt: "River levels for USGS gauges 01646500 and 01638500 over the last 7 days, with a PDF sheet"
dependencies:
  tools:
    - type: "mcp"
      value: "river-levels"
      description: "Current USGS streamflow and gage height, compared with past years."
      transport: "streamable_http"
      url: "https://river-levels.zovo.one/mcp"
