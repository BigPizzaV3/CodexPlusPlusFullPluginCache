interface:
  display_name: "Get started with HYPD.AI Social Ads"
  short_description: "Connect Meta Ads and review your campaigns"
  default_prompt: "Use $hypd-get-started to help me get started with HYPD.AI Social Ads."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hypd-meta-ads"
      description: "HYPD.AI Social Ads: Meta campaign, ad set and ad performance, creatives and audiences"
      transport: "streamable_http"
      url: "https://facebookads.hypd.ai/mcp"
