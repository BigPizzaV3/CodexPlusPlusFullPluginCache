interface:
  display_name: "Get started with HYPD.AI Competitor Ads"
  short_description: "Look up a competitor's ads"
  default_prompt: "Use $hypd-get-started to help me get started with HYPD.AI Competitor Ads."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hypd-ad-library"
      description: "HYPD.AI Competitor Ads: competitors' Meta and Google ads from public ad libraries"
      transport: "streamable_http"
      url: "https://adlibrary.hypd.ai/mcp"
