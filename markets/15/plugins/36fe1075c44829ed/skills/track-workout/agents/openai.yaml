interface:
  display_name: "Track workouts with GoodSet"
  short_description: "Track workouts and saved training locations"
  default_prompt: "Use $track-workout to continue my workout and log completed sets."

dependencies:
  tools:
    - type: "mcp"
      value: "goodset"
      description: "GoodSet MCP server"
      transport: "streamable_http"
      url: "https://mcp.goodset.app/mcp"

policy:
  allow_implicit_invocation: true
