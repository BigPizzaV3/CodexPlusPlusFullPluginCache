interface:
  display_name: "Work Capture"
  short_description: "Record completed work under the appropriate role"
  default_prompt: "Use $work-capture: We have finished this work. Turn what I actually contributed into accomplishment bullets. Confirm the role and wording with me, then save it to RaetOS."
dependencies:
  tools:
    - type: "mcp"
      value: "raetos"
      description: "Capture new work for review with separately approved permission"
      transport: "streamable_http"
      url: "https://raetos.com/api/mcp/rv1"
