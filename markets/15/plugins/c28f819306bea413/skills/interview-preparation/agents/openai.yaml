interface:
  display_name: "Interview Preparation"
  short_description: "Practice answers supported by your recorded experience"
  default_prompt: "Use $interview-preparation: I am interviewing for a job saved in My Queue. Find my strongest relevant examples in RaetOS and help me practice answers, including difficult follow-up questions. Do not invent experience."
dependencies:
  tools:
    - type: "mcp"
      value: "raetos"
      description: "Read approved accomplishments, projects and career stories"
      transport: "streamable_http"
      url: "https://raetos.com/api/mcp/rv1"
