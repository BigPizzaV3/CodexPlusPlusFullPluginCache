interface:
  display_name: "EULEX Point-in-Time Law"
  short_description: "Check wording and versions for a specified date"

dependencies:
  tools:
    - type: "mcp"
      value: "get_article"
      description: "Read the full wording of a specific legal article, section or supported EU recital, with source references and available version information."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_status"
      description: "Check a legal act's recorded in-force status and available version or event history."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_chapter"
      description: "Read a complete chapter or part of a Croatian law or bylaw, including its articles."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_structure"
      description: "Locate chapters, sections and article headings within an EU, Croatian, German, Slovenian or Dutch act."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_publication"
      description: "Open an original Croatian Narodne novine publication or list all items in a specified gazette issue."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_related"
      description: "Find recorded amendments, predecessor or successor acts, citations and other legal-document relationships for EU or Croatian law."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "search"
      description: "Find statutory provisions relevant to a legal question, including rights, duties, prohibitions, exceptions, deadlines, sanctions and applicability."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "resolve"
      description: "Identify a law from its title, common name, abbreviation, CELEX number or official act number, and return its canonical identifier."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "view_source"
      description: "Display a retrieved legal provision or Croatian court decision in an interactive source viewer when the user asks to open, inspect or read the source or its surrounding context."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
