interface:
  display_name: "EULEX Legal Research"
  short_description: "Research primary European law with source citations"

dependencies:
  tools:
    - type: "mcp"
      value: "list_scopes"
      description: "Check which jurisdictions and research capabilities are currently available, including historical text, court decisions and source viewing."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "about"
      description: "Describe EULEX legal-source coverage, server version and available corpus statistics."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "search"
      description: "Find statutory provisions relevant to a legal question, including rights, duties, prohibitions, exceptions, deadlines, sanctions and applicability."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "resolve"
      description: "Identify a law from its title, common name, abbreviation, CELEX number or official act number, and return its canonical identifier."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_regulation"
      description: "Retrieve the identity and available metadata of a named or retrieved legal act: title, identifiers, source references and recorded status/version information where supported."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_article"
      description: "Read the full wording of a specific legal article, section or supported EU recital, with source references and available version information."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_structure"
      description: "Locate chapters, sections and article headings within an EU, Croatian, German, Slovenian or Dutch act."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_chapter"
      description: "Read a complete chapter or part of a Croatian law or bylaw, including its articles."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "list_articles"
      description: "List and page through article headings in a Croatian act, French code, German act, Slovenian act or Dutch act."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_full_document"
      description: "Read or summarize the complete indexed consolidated wording of a Croatian, German, Slovenian or Dutch law."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "browse_taxonomy"
      description: "Browse Croatian legal subject areas and their classified regulations, or the catalogue of available French codes."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_status"
      description: "Check a legal act's recorded in-force status and available version or event history."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "get_related"
      description: "Find recorded amendments, predecessor or successor acts, citations and other legal-document relationships for EU or Croatian law."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "eurostat_query"
      description: "Retrieve official Eurostat statistics for a requested EU or member-state indicator, period and geography, such as inflation, employment, population or renewable-energy share."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
    - type: "mcp"
      value: "view_source"
      description: "Display a retrieved legal provision or Croatian court decision in an interactive source viewer when the user asks to open, inspect or read the source or its surrounding context."
      transport: "streamable_http"
      url: "https://mcp.eulex.ai/mcp"
