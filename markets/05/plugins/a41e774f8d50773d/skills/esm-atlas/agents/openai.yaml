interface:
  display_name: "ESM Atlas"
  short_description: "Search proteins, features, structures, and clusters"
  default_prompt: "Find proteins similar to GB1."
policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "biohub"
      description: "Public Biohub MCP with the ESM Atlas tools and Mol* structure viewer"
      transport: "streamable_http"
      url: "https://biohub.ai/mcp"
