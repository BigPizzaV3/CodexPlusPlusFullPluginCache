# MCP dependency declaration — binds this skill to the tools it
# orchestrates. Format per developers.openai.com/plugins/build/skills:
# "a dependency makes the required tool available; it does not replace
# clear workflow instructions."
dependencies:
  tools:
    - type: "mcp"
      value: "get_daily_sudoku"
      description: "Fetch today's numbered daily sudoku at a difficulty"
      transport: "streamable_http"
      url: "https://www.puzzlefuel.com/mcp/"
    - type: "mcp"
      value: "new_sudoku"
      description: "Generate a fresh sudoku at a chosen difficulty"
      transport: "streamable_http"
      url: "https://www.puzzlefuel.com/mcp/"
    - type: "mcp"
      value: "explain_next_move"
      description: "Find and explain the next logical move on a board"
      transport: "streamable_http"
      url: "https://www.puzzlefuel.com/mcp/"
    - type: "mcp"
      value: "check_sudoku"
      description: "Check a board for duplicates and wrong entries"
      transport: "streamable_http"
      url: "https://www.puzzlefuel.com/mcp/"
