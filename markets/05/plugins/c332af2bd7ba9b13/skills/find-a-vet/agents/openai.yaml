dependencies:
  tools:
    - type: "mcp"
      value: "find_vets"
      description: "Find US veterinary practices by place, animal, day and time"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "practice_details"
      description: "One practice's address, phone, hours and species treated"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "check_availability"
      description: "A practice's open appointment times"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "check_eligibility"
      description: "Whether a practice treats a species and takes new clients"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "price_lookup"
      description: "Published prices for veterinary services"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "ask_a_vet"
      description: "Send an owner's question to the veterinarians who answer on PawsRx"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "request_appointment"
      description: "Request an appointment at a listed practice"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "check_booking_status"
      description: "Status of an appointment request by reference"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
    - type: "mcp"
      value: "cancel_booking"
      description: "Cancel an appointment request by reference"
      transport: "streamable_http"
      url: "https://pawsrx.io/mcp"
