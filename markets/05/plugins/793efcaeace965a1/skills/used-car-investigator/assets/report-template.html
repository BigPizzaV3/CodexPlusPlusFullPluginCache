<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f2f6f5;
      --card: #ffffff;
      --ink: #152421;
      --mid: #475b57;
      --dim: #71827e;
      --line: #d8e1df;
      --line-soft: #e8eeec;
      --accent: #087f7a;
      --accent-strong: #05645f;
      --accent-soft: #e4f3f1;
      --hero: #142b28;
      --hero-ink: #f4fbf9;
      --green: #287a52;
      --green-soft: #e7f4ec;
      --amber: #9a6b08;
      --amber-soft: #fbf2d9;
      --red: #b43b37;
      --red-soft: #fbe9e8;
      --neutral-soft: #edf1f0;
      --stripe: #f8faf9;
      --shadow: 0 12px 34px rgba(20, 43, 40, .07);
    }

    html[data-theme="dark"] {
      --bg: #101816;
      --card: #18231f;
      --ink: #e8f0ed;
      --mid: #b6c4c0;
      --dim: #84948f;
      --line: #33423e;
      --line-soft: #283631;
      --accent: #52b9b0;
      --accent-strong: #83d6cf;
      --accent-soft: #173a36;
      --hero: #dcece8;
      --hero-ink: #10201d;
      --green: #70c793;
      --green-soft: #173527;
      --amber: #e4bd5c;
      --amber-soft: #352c15;
      --red: #ef7771;
      --red-soft: #3b201f;
      --neutral-soft: #27332f;
      --stripe: #151f1c;
      --shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #101816;
        --card: #18231f;
        --ink: #e8f0ed;
        --mid: #b6c4c0;
        --dim: #84948f;
        --line: #33423e;
        --line-soft: #283631;
        --accent: #52b9b0;
        --accent-strong: #83d6cf;
        --accent-soft: #173a36;
        --hero: #dcece8;
        --hero-ink: #10201d;
        --green: #70c793;
        --green-soft: #173527;
        --amber: #e4bd5c;
        --amber-soft: #352c15;
        --red: #ef7771;
        --red-soft: #3b201f;
        --neutral-soft: #27332f;
        --stripe: #151f1c;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    a { color: var(--accent-strong); text-underline-offset: 3px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .wrap { width: min(820px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 48px; }
    .topline { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .brand { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .actions { display: flex; gap: 8px; }
    .action {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--mid);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .action:hover { border-color: var(--accent); color: var(--accent-strong); }
    h1 { margin: 15px 0 6px; font-size: clamp(25px, 5vw, 34px); line-height: 1.16; letter-spacing: -.025em; }
    .meta { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .hero { margin-top: 25px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
    .hero-banner { background: var(--hero); color: var(--hero-ink); padding: 19px 22px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .verdict { font-size: 20px; font-weight: 800; letter-spacing: .02em; }
    .confidence { margin-top: 2px; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }
    .score-ring { width: 58px; height: 58px; position: relative; flex: 0 0 auto; }
    .score-ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
    .score-track, .score-fill { fill: none; stroke-width: 5; }
    .score-track { stroke: currentColor; opacity: .18; }
    .score-fill { stroke: var(--accent); stroke-linecap: round; }
    .score-number { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 700; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line-soft); }
    .metric { padding: 14px 16px; border-right: 1px solid var(--line-soft); min-width: 0; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .metric-value { margin-top: 4px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .hero-summary { padding: 16px 22px; color: var(--mid); font-size: 14px; }
    .dealer { margin-top: 13px; display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 17px; }
    .dealer-grade { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 23px; font-weight: 800; }
    .dealer-name { font-weight: 750; }
    .dealer-risk { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .dealer-note { margin-top: 4px; color: var(--mid); font-size: 13px; }
    .section { margin-top: 34px; }
    .section h2 { margin: 0 0 15px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; font-size: 17px; line-height: 1.3; }
    .lede, .note { color: var(--mid); font-size: 13px; }
    .lede { margin: -4px 0 14px; }
    .note { margin: 10px 0 0; }
    .bullet-list, .number-list { margin: 0; color: var(--mid); }
    .bullet-list { list-style: none; padding: 0; display: grid; gap: 8px; }
    .bullet-list li { position: relative; padding-left: 17px; }
    .bullet-list li::before { content: ""; position: absolute; left: 0; top: .68em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .number-list { padding-left: 22px; display: grid; gap: 8px; }
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--line-soft); background: var(--line-soft); border-radius: 10px; overflow: hidden; }
    .spec { background: var(--card); padding: 11px 14px; }
    .spec-label { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .spec-value { margin-top: 3px; font-size: 14px; font-weight: 650; }
    .tag { display: inline-block; margin-left: 6px; border-radius: 5px; padding: 2px 7px; font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; vertical-align: 1px; }
    .tag-verified { color: var(--green); background: var(--green-soft); }
    .tag-claim { color: var(--amber); background: var(--amber-soft); }
    .tag-unknown { color: var(--dim); background: var(--neutral-soft); }
    .tag-risk { color: var(--red); background: var(--red-soft); }
    .risk-card { padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--card); margin-bottom: 10px; }
    .risk-head { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .risk-title { font-weight: 750; }
    .severity { border-radius: 5px; padding: 2px 7px; background: var(--red-soft); color: var(--red); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .evidence { border-radius: 5px; padding: 2px 7px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .risk-body { margin-top: 7px; color: var(--mid); font-size: 13px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--card); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th { padding: 10px 12px; background: var(--neutral-soft); color: var(--dim); text-align: left; white-space: nowrap; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    td { padding: 10px 12px; border-top: 1px solid var(--line-soft); color: var(--mid); vertical-align: top; }
    tr:nth-child(even) td { background: var(--stripe); }
    td:first-child { color: var(--ink); font-weight: 650; }
    .score-bars { display: grid; gap: 9px; }
    .score-row { display: grid; grid-template-columns: minmax(125px, 190px) 1fr 46px; gap: 10px; align-items: center; font-size: 13px; }
    .score-label { color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: inherit; }
    .score-points { color: var(--dim); text-align: right; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .chip { padding: 8px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--mid); font-size: 13px; }
    .chip-penalty { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    .chip-final { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); font-weight: 750; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { padding: 13px 14px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--card); text-align: center; }
    .tile-label { color: var(--dim); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .tile-value { margin-top: 4px; font-size: 16px; font-weight: 750; }
    .callout { border-left: 3px solid var(--accent); border-radius: 8px; background: var(--accent-soft); color: var(--accent-strong); padding: 14px 16px; font-size: 13px; }
    .callout-warn { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
    .callout-danger { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .source-list { display: grid; gap: 9px; }
    .source { border-bottom: 1px solid var(--line-soft); padding-bottom: 9px; }
    .source:last-child { border-bottom: 0; }
    .source-note { color: var(--dim); font-size: 12px; }
    footer { margin-top: 40px; padding-top: 19px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 22px, 820px); padding-top: 20px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line-soft); }
      .spec-grid { grid-template-columns: 1fr; }
      .tiles { grid-template-columns: 1fr; }
      .score-row { grid-template-columns: 108px 1fr 40px; }
      .actions { display: none; }
    }

    @media print {
      :root { --bg: #fff; --card: #fff; --shadow: none; }
      body { color: #111; background: #fff; }
      .wrap { width: 100%; max-width: none; padding: 0; }
      .actions { display: none; }
      .section, .risk-card, .hero, .dealer { break-inside: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topline">
      <div class="brand">CarSleuth · Buyer Intelligence</div>
      <div class="actions">
        <button class="action" type="button" onclick="toggleTheme()">Theme</button>
        <button class="action" type="button" onclick="window.print()">Print</button>
      </div>
    </div>
    {{BODY}}
    <footer>Generated {{GENERATED}} · Research-based decision support; verify condition through an independent inspection and official ownership, title, lien, recall, and registration checks.</footer>
  </main>
  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const current = root.dataset.theme || "";
      const dark = current === "dark" || (!current && matchMedia("(prefers-color-scheme: dark)").matches);
      root.dataset.theme = dark ? "light" : "dark";
    }
  </script>
</body>
</html>
