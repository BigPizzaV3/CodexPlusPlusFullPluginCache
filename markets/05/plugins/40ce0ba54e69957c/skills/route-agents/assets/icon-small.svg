<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="TokenX skill icon">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2128"/>
      <stop offset="100%" stop-color="#0A0D10"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D6DC"/>
      <stop offset="100%" stop-color="#6A727A"/>
    </linearGradient>
    <linearGradient id="metalWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0BAB2"/>
      <stop offset="100%" stop-color="#5A544E"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3138"/>
      <stop offset="100%" stop-color="#14191E"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A929A"/>
      <stop offset="50%" stop-color="#D6DCE2"/>
      <stop offset="100%" stop-color="#8A929A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#board)"/>

  <!-- TOP 5-pin pitch 6, centers 16,22,28,34,40 -->
  <rect x="12" y="3" width="34" height="9" rx="1.5" fill="url(#housing)"/>
  <g fill="url(#pin)">
    <rect x="15" y="4.5" width="2" height="7" rx="0.3"/>
    <rect x="21" y="4.5" width="2" height="7" rx="0.3"/>
    <rect x="27" y="4.5" width="2" height="7" rx="0.3"/>
    <rect x="33" y="4.5" width="2" height="7" rx="0.3"/>
    <rect x="39" y="4.5" width="2" height="7" rx="0.3"/>
  </g>

  <!-- BOTTOM 3-pin pitch 7, centers 33,40,47 -->
  <rect x="28" y="52" width="26" height="9" rx="1.5" fill="url(#housing)"/>
  <g fill="url(#pin)">
    <rect x="32" y="53" width="2" height="7" rx="0.3"/>
    <rect x="39" y="53" width="2" height="7" rx="0.3"/>
    <rect x="46" y="53" width="2" height="7" rx="0.3"/>
  </g>

  <!-- LEFT 4-pin pitch 7, centers 28,35,42,49 -->
  <rect x="3" y="24" width="9" height="30" rx="1.5" fill="url(#housing)"/>
  <g fill="url(#pin)">
    <rect x="4.5" y="27" width="7" height="2" rx="0.3"/>
    <rect x="4.5" y="34" width="7" height="2" rx="0.3"/>
    <rect x="4.5" y="41" width="7" height="2" rx="0.3"/>
    <rect x="4.5" y="48" width="7" height="2" rx="0.3"/>
  </g>

  <!-- RIGHT 2-pin pitch 8, centers 22,30 -->
  <rect x="52" y="16" width="9" height="20" rx="1.5" fill="url(#housing)"/>
  <g fill="url(#pin)">
    <rect x="53" y="21" width="7" height="2" rx="0.3"/>
    <rect x="53" y="29" width="7" height="2" rx="0.3"/>
  </g>

  <g fill="none" stroke="url(#metal)" stroke-width="1.3" stroke-linecap="square">
    <path d="M16 12V18L12 24"/>
    <path d="M22 12V18L18 24"/>
    <path d="M28 12V18L28 24"/>
    <path d="M34 12V18L38 24"/>
    <path d="M40 12V18L46 26"/>
    <path d="M33 52V44L28 40"/>
    <path d="M40 52V44L40 38"/>
    <path d="M47 52V44L50 38"/>
  </g>
  <g fill="none" stroke="url(#metalWarm)" stroke-width="1.3" stroke-linecap="square">
    <path d="M12 28H18L24 24"/>
    <path d="M12 35H18L24 32"/>
    <path d="M12 42H18L24 42"/>
    <path d="M12 49H18L24 48"/>
    <path d="M52 22H44L40 20"/>
    <path d="M52 30H44L40 30"/>
  </g>

  <g stroke="url(#metal)" stroke-width="2" stroke-linecap="butt">
    <line x1="18" y1="22" x2="28" y2="30"/>
    <line x1="34" y1="36" x2="46" y2="48"/>
  </g>
  <g stroke="url(#metalWarm)" stroke-width="2" stroke-linecap="butt">
    <line x1="44" y1="20" x2="34" y2="30"/>
    <line x1="28" y1="36" x2="16" y2="48"/>
  </g>

  <rect x="28" y="28" width="10" height="9" rx="1.2" fill="url(#housing)" stroke="#5A646E" stroke-width="0.7"/>
  <g fill="url(#pin)">
    <rect x="30" y="30" width="2.5" height="2.5" rx="0.3"/>
    <rect x="34.5" y="30" width="2.5" height="2.5" rx="0.3"/>
    <rect x="30" y="34" width="2.5" height="2.5" rx="0.3"/>
    <rect x="34.5" y="34" width="2.5" height="2.5" rx="0.3"/>
  </g>
</svg>
