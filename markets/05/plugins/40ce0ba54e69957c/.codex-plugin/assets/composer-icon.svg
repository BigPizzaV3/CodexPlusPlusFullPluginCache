<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="TokenX routing mark">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2128"/>
      <stop offset="100%" stop-color="#0A0D10"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E6EA"/>
      <stop offset="40%" stop-color="#A8B0B8"/>
      <stop offset="100%" stop-color="#5C656E"/>
    </linearGradient>
    <linearGradient id="metalWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0CBC4"/>
      <stop offset="45%" stop-color="#8E8880"/>
      <stop offset="100%" stop-color="#4E4943"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3138"/>
      <stop offset="100%" stop-color="#14191E"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6A727A"/>
      <stop offset="35%" stop-color="#D6DCE2"/>
      <stop offset="100%" stop-color="#7A828A"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#board)"/>
  <rect x="6" y="6" width="116" height="116" rx="18" fill="none" stroke="#2C3640" stroke-width="1.5"/>

  <!-- TOP: 5-pin pitch 10, centers 36,46,56,66,76 -->
  <rect x="28" y="9" width="60" height="16" rx="2" fill="url(#housing)" stroke="#4A5560" stroke-width="1"/>
  <rect x="32" y="12" width="52" height="6" rx="1" fill="#0C1014"/>
  <g fill="url(#pin)">
    <rect x="34" y="11" width="4" height="13" rx="0.5"/>
    <rect x="44" y="11" width="4" height="13" rx="0.5"/>
    <rect x="54" y="11" width="4" height="13" rx="0.5"/>
    <rect x="64" y="11" width="4" height="13" rx="0.5"/>
    <rect x="74" y="11" width="4" height="13" rx="0.5"/>
  </g>

  <!-- BOTTOM: 3-pin pitch 12, centers 64,76,88 -->
  <rect x="52" y="103" width="48" height="16" rx="2" fill="url(#housing)" stroke="#4A5560" stroke-width="1"/>
  <rect x="56" y="112" width="40" height="5" rx="1" fill="#0C1014"/>
  <g fill="url(#pin)">
    <rect x="62" y="104" width="4" height="13" rx="0.5"/>
    <rect x="74" y="104" width="4" height="13" rx="0.5"/>
    <rect x="86" y="104" width="4" height="13" rx="0.5"/>
  </g>

  <!-- LEFT: 4-pin pitch 12, centers 56,68,80,92 -->
  <rect x="9" y="46" width="16" height="56" rx="2" fill="url(#housing)" stroke="#4A5560" stroke-width="1"/>
  <rect x="12" y="50" width="6" height="48" rx="1" fill="#0C1014"/>
  <g fill="url(#pin)">
    <rect x="11" y="54" width="13" height="4" rx="0.5"/>
    <rect x="11" y="66" width="13" height="4" rx="0.5"/>
    <rect x="11" y="78" width="13" height="4" rx="0.5"/>
    <rect x="11" y="90" width="13" height="4" rx="0.5"/>
  </g>

  <!-- RIGHT: 2-pin pitch 14, centers 42,56 -->
  <rect x="103" y="32" width="16" height="36" rx="2" fill="url(#housing)" stroke="#4A5560" stroke-width="1"/>
  <rect x="110" y="36" width="6" height="28" rx="1" fill="#0C1014"/>
  <g fill="url(#pin)">
    <rect x="104" y="40" width="13" height="4" rx="0.5"/>
    <rect x="104" y="54" width="13" height="4" rx="0.5"/>
  </g>

  <!-- traces aligned to centers -->
  <g fill="none" stroke="url(#metal)" stroke-width="1.8" stroke-linecap="square">
    <path d="M36 25V38L28 48"/>
    <path d="M46 25V36L38 46"/>
    <path d="M56 25V36L56 46"/>
    <path d="M66 25V36L70 46"/>
    <path d="M76 25V38L84 50"/>
    <path d="M64 103V90L54 80"/>
    <path d="M76 103V92L76 84"/>
    <path d="M88 103V90L96 80"/>
  </g>
  <g fill="none" stroke="url(#metalWarm)" stroke-width="1.8" stroke-linecap="square">
    <path d="M25 56H38L48 48"/>
    <path d="M25 68H36L48 62"/>
    <path d="M25 80H36L48 80"/>
    <path d="M25 92H40L52 94"/>
    <path d="M103 42H90L82 40"/>
    <path d="M103 56H88L80 56"/>
  </g>

  <g stroke="url(#metal)" stroke-width="2.8" stroke-linecap="butt">
    <line x1="38" y1="44" x2="56" y2="58"/>
    <line x1="42" y1="42" x2="58" y2="54"/>
    <line x1="70" y1="70" x2="90" y2="90"/>
    <line x1="68" y1="72" x2="88" y2="92"/>
    <line x1="72" y1="68" x2="92" y2="88"/>
  </g>
  <g stroke="url(#metalWarm)" stroke-width="2.8" stroke-linecap="butt">
    <line x1="84" y1="40" x2="70" y2="56"/>
    <line x1="86" y1="44" x2="72" y2="58"/>
    <line x1="56" y1="70" x2="38" y2="90"/>
    <line x1="54" y1="68" x2="36" y2="88"/>
    <line x1="58" y1="72" x2="40" y2="92"/>
  </g>

  <rect x="56" y="56" width="18" height="16" rx="2" fill="url(#housing)" stroke="#5A646E" stroke-width="1"/>
  <g fill="url(#pin)">
    <rect x="59" y="59" width="4" height="4" rx="0.5"/>
    <rect x="67" y="59" width="4" height="4" rx="0.5"/>
    <rect x="59" y="65" width="4" height="4" rx="0.5"/>
    <rect x="67" y="65" width="4" height="4" rx="0.5"/>
  </g>

  <g fill="#0C1014" stroke="#6A747E" stroke-width="1.2">
    <circle cx="16" cy="16" r="4"/>
    <circle cx="112" cy="16" r="4"/>
    <circle cx="16" cy="112" r="3.2"/>
    <circle cx="112" cy="112" r="4.6"/>
  </g>
</svg>
