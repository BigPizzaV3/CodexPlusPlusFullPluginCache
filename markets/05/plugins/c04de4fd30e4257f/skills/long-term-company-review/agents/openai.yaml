interface:
  display_name: "Long-Term Company Review"
  short_description: "Review a company for long horizon"
  brand_color: "#0B3A82"
  default_prompt: "Review this company from a long-term investor research perspective."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
