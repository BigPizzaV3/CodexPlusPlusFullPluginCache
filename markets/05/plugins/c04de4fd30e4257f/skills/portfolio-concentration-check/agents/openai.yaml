interface:
  display_name: "Portfolio Concentration Check"
  short_description: "Review supplied portfolio weights"
  brand_color: "#0B3A82"
  default_prompt: "Review these portfolio weights for concentration and market-risk context."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
