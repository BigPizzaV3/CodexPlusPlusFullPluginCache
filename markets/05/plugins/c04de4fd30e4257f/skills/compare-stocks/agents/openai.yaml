interface:
  display_name: "Compare Stocks"
  short_description: "Compare several stocks clearly"
  brand_color: "#0B3A82"
  default_prompt: "Compare these stocks side by side and explain the important differences."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
