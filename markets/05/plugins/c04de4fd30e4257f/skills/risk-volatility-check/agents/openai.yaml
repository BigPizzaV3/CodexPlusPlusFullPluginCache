interface:
  display_name: "Risk & Volatility Check"
  short_description: "Assess price risk and volatility"
  brand_color: "#0B3A82"
  default_prompt: "Assess the volatility and price-risk profile for this stock or list."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
