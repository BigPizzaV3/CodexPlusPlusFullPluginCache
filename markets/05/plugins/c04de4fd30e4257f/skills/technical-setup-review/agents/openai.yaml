interface:
  display_name: "Technical Setup Review"
  short_description: "Review multi-timeframe technicals"
  brand_color: "#0B3A82"
  default_prompt: "Review the technical setup for this ticker across hourly, daily, and weekly timeframes."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
