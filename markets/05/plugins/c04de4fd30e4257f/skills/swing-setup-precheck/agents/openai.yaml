interface:
  display_name: "Swing Setup Precheck"
  short_description: "Check a swing-trade setup"
  brand_color: "#0B3A82"
  default_prompt: "Precheck this possible swing setup using the available technical and risk data."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
