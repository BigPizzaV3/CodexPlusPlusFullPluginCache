interface:
  display_name: "Quote & Session Check"
  short_description: "Check the latest quote/session"
  brand_color: "#0B3A82"
  default_prompt: "Get the latest available quote and explain exactly what session and timestamp it represents."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
