interface:
  display_name: "Momentum Scan"
  short_description: "Find momentum shifts in a list"
  brand_color: "#0B3A82"
  default_prompt: "Scan these stocks for momentum, volume, and trend changes."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
