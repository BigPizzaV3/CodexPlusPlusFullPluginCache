interface:
  display_name: "Valuation Check"
  short_description: "Check valuation metrics"
  brand_color: "#0B3A82"
  default_prompt: "Check this stock's valuation metrics and explain what they do and do not show."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
