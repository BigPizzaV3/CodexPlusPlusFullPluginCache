interface:
  display_name: "Stock Deep Dive"
  short_description: "Analyze one stock end to end"
  brand_color: "#0B3A82"
  default_prompt: "Give me a complete deep dive on this stock using Noweir Market Data."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
