interface:
  display_name: "Sector Basket Review"
  short_description: "Compare a group of sector peers"
  brand_color: "#0B3A82"
  default_prompt: "Review this sector basket and explain how the names differ on momentum, valuation, growth, margins, and risk."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
