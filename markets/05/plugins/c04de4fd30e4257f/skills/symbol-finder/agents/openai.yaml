interface:
  display_name: "Symbol Finder"
  short_description: "Find a company ticker"
  brand_color: "#0B3A82"
  default_prompt: "Find the ticker for this company and show the best matching listed symbols."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
