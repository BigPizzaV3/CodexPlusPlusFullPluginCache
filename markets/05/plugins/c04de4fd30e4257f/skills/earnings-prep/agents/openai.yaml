interface:
  display_name: "Earnings Prep"
  short_description: "Prepare for an earnings event"
  brand_color: "#0B3A82"
  default_prompt: "Prepare an earnings-event brief for this stock using the available market and fundamentals data."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
