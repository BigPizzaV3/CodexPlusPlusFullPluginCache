interface:
  display_name: "Watchlist Review"
  short_description: "Review a stock watchlist"
  brand_color: "#0B3A82"
  default_prompt: "Review my watchlist and surface the biggest changes, momentum shifts, and risk signals."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
