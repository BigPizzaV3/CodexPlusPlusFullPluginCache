interface:
  display_name: "Compliance Evidence Boundary"
  short_description: "Check what compliance data is missing"
  brand_color: "#0B3A82"
  default_prompt: "Tell me what this plugin can and cannot establish about the requested compliance status."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
