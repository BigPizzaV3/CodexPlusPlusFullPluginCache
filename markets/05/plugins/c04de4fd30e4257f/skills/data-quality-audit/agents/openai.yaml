interface:
  display_name: "Data Quality Audit"
  short_description: "Audit market-data reliability"
  brand_color: "#0B3A82"
  default_prompt: "Audit the data quality and tell me what is reliable, secondary, delayed, missing, or needs primary-source verification."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
