interface:
  display_name: "Fundamentals Review"
  short_description: "Review company fundamentals"
  brand_color: "#0B3A82"
  default_prompt: "Review the fundamentals and valuation for this company."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "noweirMarketData"
      description: "Noweir Market Data read-only stock market MCP server"
      transport: "streamable_http"
      url: "https://noweir-market-data.vercel.app/mcp/"
