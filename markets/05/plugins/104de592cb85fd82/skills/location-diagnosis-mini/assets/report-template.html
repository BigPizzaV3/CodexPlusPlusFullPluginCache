<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --paper: #FFFFFF;
      --ink: #1B1B22;
      --sub: #5C5C68;
      --rule: #D9D9E1;
      --panel: #F5F5F8;
      --violet: #6F3FE5;
      --wash: rgba(111, 63, 229, .07);
      --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic Medium", "Yu Gothic", Meiryo, system-ui, sans-serif;
      --serif: "Hiragino Mincho ProN", "BIZ UDPMincho", "Yu Mincho", "MS PMincho", serif;
      --body: 9.2pt;
      --small: 8pt;
      --caption: 7pt;
      --lead: 11.2pt;
      --title: 15pt;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      background: #26262C;
      color: var(--ink);
      font-family: var(--sans);
      line-break: strict;
    }

    p, li, td, th, strong, span {
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .sprite-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .report-stage { padding: 9mm 0 16mm; }

    .sheet {
      position: relative;
      width: 210mm;
      height: 297mm;
      margin: 0 auto 9mm;
      padding: 24mm 15mm 28mm;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 4px 22px rgba(0, 0, 0, .5);
      font-size: var(--body);
      line-height: 1.62;
      break-after: page;
      page-break-after: always;
    }

    .sheet:last-child {
      margin-bottom: 0;
      break-after: auto;
      page-break-after: auto;
    }

    @page { size: A4 portrait; margin: 0; }

    .tk {
      position: absolute;
      width: 3.6mm;
      height: 3.6mm;
      border: 0 solid #C3C3CC;
    }

    .tk-tl { top: 5.5mm; left: 5.5mm; border-top-width: .3mm; border-left-width: .3mm; }
    .tk-tr { top: 5.5mm; right: 5.5mm; border-top-width: .3mm; border-right-width: .3mm; }
    .tk-bl { bottom: 5.5mm; left: 5.5mm; border-bottom-width: .3mm; border-left-width: .3mm; }
    .tk-br { right: 5.5mm; bottom: 5.5mm; border-right-width: .3mm; border-bottom-width: .3mm; }

    .hd {
      position: absolute;
      top: 9mm;
      right: 15mm;
      left: 15mm;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 1.6mm;
      border-bottom: .35mm solid var(--ink);
      font-size: var(--caption);
    }

    .hd-l {
      display: flex;
      align-items: center;
      gap: 2.4mm;
      flex: 0 0 auto;
      font-weight: 600;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .header-wordmark {
      display: block;
      width: 20mm;
      height: 3.2mm;
      line-height: 0;
    }

    .header-wordmark svg,
    .footer-wordmark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hd-sep { color: var(--rule); }

    .hd-r {
      max-width: 122mm;
      overflow: hidden;
      color: var(--sub);
      letter-spacing: .02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hd-r b {
      margin-left: 2mm;
      color: var(--ink);
    }

    .ft {
      position: absolute;
      right: 15mm;
      bottom: 8mm;
      left: 15mm;
    }

    .disc {
      padding-top: 1.6mm;
      border-top: .2mm solid var(--rule);
      color: var(--sub);
      font-size: 6.8pt;
      line-height: 1.55;
      text-align: justify;
    }

    .ft .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5mm;
      color: var(--sub);
      font-size: var(--caption);
    }

    .ft .fl {
      display: flex;
      align-items: center;
      gap: 2mm;
      white-space: nowrap;
    }

    .footer-wordmark {
      display: block;
      width: 15mm;
      height: 2.4mm;
      line-height: 0;
    }

    .ft .pg {
      color: var(--ink);
      letter-spacing: .08em;
    }

    .kick {
      color: var(--sub);
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: .24em;
    }

    h1.pt {
      margin-top: 1.2mm;
      font-size: var(--title);
      font-weight: 700;
      font-feature-settings: "palt";
      letter-spacing: .03em;
      line-height: 1.3;
      text-wrap: balance;
    }

    .lead {
      margin-top: 2.8mm;
      font-family: var(--serif);
      font-size: var(--lead);
      font-feature-settings: "palt";
      line-height: 1.72;
      text-wrap: wrap;
    }

    .lead::before {
      display: block;
      width: 9mm;
      height: .7mm;
      margin-bottom: 2mm;
      background: var(--violet);
      content: "";
    }

    .page-content { min-height: 0; }

    .blk { margin-top: 5.5mm; }

    .blk-h {
      display: flex;
      align-items: baseline;
      gap: 2.6mm;
      margin-bottom: 2.2mm;
      padding-bottom: 1.2mm;
      border-bottom: .3mm solid var(--ink);
    }

    .blk-h .no {
      color: var(--sub);
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .blk-h .t {
      font-size: 10.5pt;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .blk-h .note {
      margin-left: auto;
      color: var(--sub);
      font-size: 6.8pt;
      font-weight: 400;
      text-align: right;
    }

    .icon,
    .sy {
      display: block;
      width: 2.5mm;
      height: 2.5mm;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .st {
      display: inline-flex;
      align-items: center;
      gap: .8mm;
      color: var(--ink);
      font-size: 6.8pt;
      font-weight: 600;
      white-space: nowrap;
    }

    .st.is-estimated,
    .st.is-reference { color: var(--sub); }

    .st.is-fieldcheck { color: var(--violet); }
    .st.is-notfound { color: var(--sub); text-decoration: underline dashed; }

    .src {
      display: block;
      margin-top: .5mm;
      color: var(--sub);
      font-size: 6.6pt;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .idg {
      display: grid;
      grid-template-columns: 24mm 1fr 22mm 44mm;
      margin-top: 5mm;
      border: .35mm solid var(--ink);
    }

    .idg .dt {
      display: flex;
      align-items: center;
      padding: 2mm 2.4mm;
      border-top: .2mm solid var(--rule);
      background: var(--panel);
      color: var(--sub);
      font-size: 7.2pt;
    }

    .idg .dd {
      display: flex;
      align-items: center;
      padding: 2mm 2.6mm;
      border-top: .2mm solid var(--rule);
      font-weight: 700;
    }

    .idg .r1 { border-top: none; }
    .idg .addr { font-size: 10pt; letter-spacing: .02em; }
    .idg .sm { font-size: 8pt; font-weight: 600; }
    .doc-type { display: block; line-height: 1.35; }
    .doc-type > span { display: block; overflow-wrap: normal; white-space: nowrap; }

    .vgrid {
      display: grid;
      grid-template-columns: 56mm 1fr;
      gap: 7mm;
      align-items: end;
      margin-top: 7mm;
    }

    .v-cap {
      color: var(--sub);
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: .14em;
    }

    .v-label {
      font-family: var(--serif);
      font-size: 21pt;
      font-feature-settings: "palt";
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
    }

    .v-sub {
      margin-top: 1mm;
      color: var(--sub);
      font-size: 8pt;
    }

    .v-sub b { color: var(--ink); font-size: 10.5pt; }

    .scale-wrap {
      position: relative;
      padding-top: 6.4mm;
    }

    .marker {
      position: absolute;
      top: 0;
      left: var(--marker-position);
      display: flex;
      transform: translateX(-50%);
      flex-direction: column;
      align-items: center;
      color: var(--violet);
      font-size: 6.8pt;
      font-weight: 700;
      letter-spacing: .2em;
      line-height: 1.2;
    }

    .marker i {
      width: 0;
      height: 0;
      margin-top: .4mm;
      border-top: 2mm solid var(--violet);
      border-right: 1.5mm solid transparent;
      border-left: 1.5mm solid transparent;
    }

    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: .35mm solid var(--ink);
    }

    .scale .cell {
      padding: 2mm 1mm 1.8mm;
      border-left: .2mm solid var(--rule);
      text-align: center;
    }

    .scale .cell:first-child { border-left: none; }
    .scale .n { display: block; font-size: 11pt; font-weight: 700; line-height: 1.2; }
    .scale .l { display: block; margin-top: .4mm; font-size: 7.2pt; white-space: nowrap; }
    .scale .sel { background: var(--violet); color: #FFF; }

    .scale-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 1mm;
      color: var(--sub);
      font-size: 6.6pt;
    }

    .conf {
      display: grid;
      grid-template-columns: 32mm 30mm 1fr;
      gap: 5mm;
      align-items: center;
      margin-top: 5.5mm;
      padding: 2.8mm 0;
      border-top: .2mm solid var(--rule);
      border-bottom: .2mm solid var(--rule);
    }

    .conf .cl {
      color: var(--sub);
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: .1em;
    }

    .conf .cl b {
      display: block;
      margin-top: .6mm;
      color: var(--ink);
      font-size: 13pt;
      letter-spacing: .06em;
    }

    .conf-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: .3mm solid var(--ink);
      font-size: 7.2pt;
      font-weight: 600;
      text-align: center;
    }

    .conf-steps span {
      padding: 1.4mm 0;
      border-left: .2mm solid var(--rule);
    }

    .conf-steps span:first-child { border-left: none; }
    .conf-steps .on { background: var(--ink); color: #FFF; }
    .conf .cd { color: var(--sub); font-size: 7.4pt; line-height: 1.58; }

    .concl {
      padding: 3.4mm 4mm;
      border-left: 1mm solid var(--violet);
      background: var(--panel);
      font-size: 9.7pt;
      line-height: 1.8;
      text-align: justify;
    }

    .assump { list-style: none; }

    .assump li {
      display: grid;
      grid-template-columns: 12mm 1fr;
      gap: 2.5mm;
      align-items: baseline;
      padding: 1.5mm 0;
      border-top: .2mm solid var(--rule);
      font-size: 8.5pt;
    }

    .assump li:first-child { border-top: none; }
    .assump .an { color: var(--sub); font-size: 7pt; font-weight: 700; letter-spacing: .1em; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 2mm 4.5mm;
      align-items: center;
      margin-top: 5mm;
      padding: 2mm 3mm;
      border: .2mm solid var(--rule);
      color: var(--sub);
      font-size: 6.8pt;
    }

    .toc {
      display: grid;
      grid-template-columns: repeat(var(--toc-count), 1fr);
      margin-top: 4.5mm;
      border-top: .35mm solid var(--ink);
    }

    .toc div {
      padding-top: 1.5mm;
      color: var(--sub);
      font-size: 6.5pt;
      letter-spacing: .01em;
    }

    .toc b {
      display: block;
      color: var(--ink);
      font-size: 7.8pt;
      letter-spacing: .1em;
    }

    .toc .cur b { color: var(--violet); }

    .ev {
      display: grid;
      grid-template-columns: 42mm 1fr 28mm;
      gap: 3.5mm;
      align-items: start;
      padding: 2.4mm 0;
      border-top: .2mm solid var(--rule);
    }

    .ev:first-of-type { border-top: none; }
    .ev .et { font-size: 9.5pt; font-weight: 700; line-height: 1.48; }
    .ev .ed { font-size: 8.5pt; line-height: 1.64; text-align: justify; }
    .ev .em { display: flex; flex-direction: column; gap: .5mm; align-items: flex-end; }

    .plan {
      margin-top: 5mm;
      padding: 3mm 3.6mm;
      border: .3mm solid var(--ink);
      font-size: 8.3pt;
      line-height: 1.65;
    }

    .plan .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 2mm;
      margin: 1.5mm 0;
    }

    .plan .chip {
      padding: .5mm 2mm;
      border: .25mm solid var(--ink);
      font-size: 7.2pt;
      font-weight: 700;
    }

    .note-line {
      margin-top: 3mm;
      color: var(--sub);
      font-size: 7.4pt;
      line-height: 1.55;
    }

    .audit-zero {
      padding: 2mm 2.5mm;
      border: .2mm solid var(--rule);
      background: var(--panel);
    }

    .dstrip {
      display: grid;
      grid-template-columns: 27mm 1fr 64mm;
      gap: 4.5mm;
      align-items: start;
      padding: 2.8mm 0 3.4mm;
      border-top: .45mm solid var(--ink);
    }

    .dstrip:first-child { margin-top: 4.5mm; }
    .dstrip .did { font-size: 14pt; font-weight: 700; letter-spacing: .04em; line-height: 1.1; }
    .dstrip .dtt { margin-top: .6mm; font-size: 9.2pt; font-weight: 700; }

    .acq {
      display: inline-block;
      margin-top: 1.6mm;
      padding: .45mm 1.5mm;
      border: .25mm solid var(--ink);
      font-size: 6.4pt;
      font-weight: 600;
      white-space: nowrap;
    }

    .acq.is-proxy,
    .acq.is-partial,
    .acq.is-notfound { border-style: dashed; }

    .acq.is-fieldcheck {
      border-color: var(--violet);
      border-style: dashed;
      color: var(--violet);
    }

    .dsum { font-size: 8.1pt; line-height: 1.58; text-align: justify; }
    .dwarn { margin-top: 1.4mm; color: var(--sub); font-size: 7pt; }

    .mrow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(24mm, 1fr));
      gap: 3mm;
      margin-top: 2mm;
    }

    .metric .mv {
      font-size: 11.5pt;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.22;
    }

    .metric .mn { font-size: 7pt; font-weight: 600; }
    .metric .mm { margin-top: .4mm; color: var(--sub); font-size: 6.3pt; line-height: 1.35; }

    .baseline-page-dense .dstrip {
      gap: 4mm;
      padding: 2.2mm 0 2.7mm;
    }

    .baseline-page-dense .dstrip:first-child { margin-top: 3.2mm; }
    .baseline-page-dense .acq { margin-top: 1.1mm; }
    .baseline-page-dense .dsum { line-height: 1.48; }
    .baseline-page-dense .mrow { gap: 2.2mm; margin-top: 1.4mm; }
    .baseline-page-dense .metric .mv { font-size: 10.8pt; }
    .baseline-page-dense .fig-cap { margin-bottom: .7mm; }
    .baseline-page-dense .fig-meta { margin-top: .7mm; line-height: 1.32; }
    .baseline-page-dense .bar-row { margin-top: .8mm; }
    .baseline-page-dense .bar-track { height: 5mm; }
    .fig-cap { margin-bottom: 1mm; font-size: 7.5pt; font-weight: 700; }
    .fig-meta { margin-top: 1mm; color: var(--sub); font-size: 6.3pt; line-height: 1.4; }

    .bar-row {
      display: grid;
      grid-template-columns: 16mm 1fr 17mm;
      gap: 1.5mm;
      align-items: center;
      margin-top: 1.2mm;
      font-size: 6.8pt;
    }

    .bar-track { height: 6mm; border-left: .25mm solid var(--ink); background: var(--panel); }
    .bar-fill { display: block; width: var(--bar-width); height: 100%; background: #C3C3CC; }
    .bar-fill.accent { background: var(--violet); }
    .bar-value { font-size: 7.4pt; font-variant-numeric: tabular-nums; }

    .stacked-bar {
      display: flex;
      width: 100%;
      height: 6.5mm;
      overflow: hidden;
      border: .25mm solid var(--ink);
    }

    .stack-segment { display: block; width: var(--seg-width); height: 100%; }
    .stack-segment.ink, .legend-item i.ink { background: var(--ink); }
    .stack-segment.violet, .legend-item i.violet { background: var(--violet); }
    .stack-segment.soft, .legend-item i.soft { background: #AFA9BA; }
    .stack-segment.muted, .legend-item i.muted { background: #E2E0E7; }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1mm 2.5mm;
      margin-top: 1.2mm;
      font-size: 6.2pt;
    }

    .legend-item { display: inline-flex; align-items: center; gap: .8mm; }
    .legend-item i { display: inline-block; width: 2.2mm; height: 2.2mm; }

    .nochart {
      padding: 2.4mm 2.8mm;
      border: .25mm dashed var(--rule);
      color: var(--sub);
      font-size: 7pt;
      line-height: 1.52;
    }

    .nochart b { color: var(--ink); }

    table { width: 100%; border-collapse: collapse; }

    .rt { margin-top: 4.5mm; }
    .rt th, .ct th, .at th {
      padding: 0 1.8mm 1mm;
      border-bottom: .35mm solid var(--ink);
      color: var(--sub);
      font-size: 7pt;
      font-weight: 600;
      letter-spacing: .06em;
      text-align: left;
    }

    .rt td {
      padding: 2mm 1.8mm;
      border-bottom: .2mm solid var(--rule);
      font-size: 8pt;
      line-height: 1.52;
      text-align: justify;
      vertical-align: top;
    }

    .rt td.ax { font-size: 8.2pt; }
    .rt td.ax b { display: block; margin-bottom: .7mm; font-size: 8.7pt; }
    .rt tr.hl td { background: var(--wash); }

    .lens {
      display: grid;
      grid-template-columns: 30mm 1fr;
      margin-top: 4.5mm;
      border: .3mm solid var(--ink);
    }

    .lens .lt {
      display: flex;
      align-items: center;
      padding: 1.7mm 2.4mm;
      border-top: .2mm solid var(--rule);
      background: var(--panel);
      color: var(--sub);
      font-size: 7.2pt;
    }

    .lens .lv {
      padding: 1.7mm 2.6mm;
      border-top: .2mm solid var(--rule);
      font-size: 8.2pt;
      line-height: 1.52;
    }

    .lens .r1 { border-top: none; }

    .fig-h {
      display: flex;
      align-items: baseline;
      gap: 3mm;
      margin-top: 5mm;
      padding-bottom: 1.2mm;
      border-bottom: .3mm solid var(--ink);
    }

    .fig-h .t { font-size: 10.2pt; font-weight: 700; }
    .fig-h .note { margin-left: auto; color: var(--sub); font-size: 6.6pt; }

    .demand-diagram {
      position: relative;
      height: 61mm;
      margin-top: 2.5mm;
    }

    .diagram-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .diagram-lines path {
      fill: none;
      stroke: #A9A6B1;
      stroke-width: 1.4;
    }

    .diagram-lines path.accent {
      stroke: var(--violet);
      stroke-dasharray: 5 4;
      stroke-width: 1.6;
    }

    .dnode {
      position: absolute;
      display: flex;
      width: 47mm;
      min-height: 17mm;
      padding: 2.2mm 2.6mm;
      border: .3mm solid var(--ink);
      background: var(--paper);
      flex-direction: column;
      justify-content: center;
    }

    .dnode span {
      color: var(--sub);
      font-size: 6.6pt;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .dnode strong { margin-top: .8mm; font-size: 7.8pt; line-height: 1.45; }
    .dnode.demand-periods strong { font-size: 7.1pt; line-height: 1.35; }
    .dnode.left { left: 0; }
    .dnode.right { right: 0; }
    .dnode.top { top: 2mm; }
    .dnode.bottom { bottom: 2mm; }

    .dnode.center {
      top: 50%;
      left: 50%;
      width: 42mm;
      transform: translate(-50%, -50%);
      border-color: var(--violet);
      background: var(--wash);
      text-align: center;
    }

    .obs {
      display: grid;
      grid-template-columns: 40mm 1fr 22mm;
      gap: 3.5mm;
      align-items: start;
      padding: 1.8mm 0;
      border-top: .2mm solid var(--rule);
      font-size: 8pt;
      line-height: 1.55;
    }

    .obs:first-of-type { border-top: none; }
    .obs .ot { font-size: 8.5pt; font-weight: 700; }
    .obs .om { text-align: right; }

    .ct td {
      padding: 1.7mm 1.8mm;
      border-bottom: .2mm solid var(--rule);
      font-size: 7.8pt;
      line-height: 1.52;
      vertical-align: top;
    }

    .ct td.cn b { display: block; font-size: 8.3pt; }
    .ct .kind { font-size: 7pt; font-weight: 700; white-space: nowrap; }

    .missing-state {
      padding: 3mm;
      color: var(--sub);
      font-size: 7.5pt;
      text-align: left;
    }

    .risk-list { list-style: none; }

    .risk-item {
      display: grid;
      grid-template-columns: 18mm 1fr;
      gap: 3mm;
      align-items: start;
      padding: 2.2mm 0;

    .cond {

      gap: 4mm;

    .fc { list-style: none; }

    .fc li {
      display: grid;

      align-items: baseline;
      padding: 1.6mm 0;

      line-height: 1.5;

    /* The verification page carries three dense decision blocks. Keep its

    .closing-qr { display: block; width: 20mm; height: 20mm; margin: 0 auto; }

    .source-page-dense .cov { margin-top: 3.2mm; }
    .source-page-dense .audit-note { margin-top: 1.8mm; line-height: 1.42; }
    .source-page-dense .source-block { margin-top: 3.2mm; }

    .print-action {
      position: fixed;

    @media screen and (max-width: 808px) { .report-stage { zoom: .95; } }

      .cov .cl2 { font-size: 10px; }
      .cov .cv2 { margin-top: 4px; font-size: 20px; }
      .cov .cv2 small { font-size: 11px; }
      .audit-note,
      .source-page-dense .audit-note { margin-top: 15px; font-size: 12px; line-height: 1.65; }

      .source-block,
      .source-page-dense .source-block { margin-top: 28px; }
      .sreg-key,
      .source-page-dense .sreg-key { margin-bottom: 10px; font-size: 11px; line-height: 1.5; }
      .sreg { grid-template-columns: 1fr; gap: 0; }
      .sreg ul + ul { padding-left: 0; border-left: none; }
      .sr,
      .source-page-dense .sr {
        grid-template-columns: 34px 1fr;
        gap: 8px;
        padding: 12px 0;
      }
      .sr .sid2 { font-size: 12px; }
      .sr .t2 { font-size: 13px; line-height: 1.5; }
      .sr .u2 { margin-top: 3px; font-size: 10px; line-height: 1.45; word-break: break-all; }
      .sr .m2 { margin-top: 4px; font-size: 11px; line-height: 1.5; }

      .method-note,
      .source-page-dense .method-note {
        margin-top: 24px;
        padding-top: 12px;
        font-size: 12px;
        line-height: 1.65;
      }
      .method-note strong { margin-bottom: 6px; font-size: 11px; }

      .handoff,
      .source-page-dense .handoff {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 24px;
        padding: 18px;
      }
      .handoff h3 { font-size: 20px; line-height: 1.45; }
      .handoff .hb,
      .source-page-dense .handoff .hb { margin-top: 8px; font-size: 14px; line-height: 1.7; text-align: left; }
      .handoff .url,
      .source-page-dense .handoff .url { margin-top: 8px; font-size: 14px; overflow-wrap: anywhere; }
      .closing-qr { width: 86px; height: 86px; }
      .qrc > span:last-child { margin-top: 5px; font-size: 10px; }

      .print-action {
        position: static;
        width: calc(100% - 40px);
        max-width: 360px;
        min-height: 48px;
        margin: 12px auto;
        padding: 10px 14px;
        justify-content: center;
      }
      .print-action-copy { display: flex; }
      .print-action-label { font-size: 14px; }
      .print-action-note { font-size: 11px; }
    }

    @media screen and (max-width: 360px) {
      .sheet,
      .sheet:last-child { padding-right: 16px; padding-left: 16px; }
      .hd { right: 16px; left: 16px; }
      .mrow,
      .baseline-page-dense .mrow { grid-template-columns: 1fr; }
      .scale .l { font-size: 8px; }
      .assump li { grid-template-columns: 1fr; gap: 4px; }
    }


    @media print {
      html, body { background: #FFF; }
      .report-stage { padding: 0; zoom: 1; }
      .print-action { display: none !important; }
      .sheet {
        width: 210mm;
        height: 296.5mm;
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  {{SVG_SPRITE}}
  <button type="button" class="print-action" onclick="window.print()" title="ブラウザの印刷画面からPDFに保存できます" aria-label="PDFとして保存（ブラウザの印刷画面を開く）">
    <svg class="print-action-icon" aria-hidden="true" focusable="false"><use href="#i-print"/></svg>
    <span class="print-action-copy">
      <span class="print-action-label">PDFとして保存</span>
      <span class="print-action-note">印刷画面を開く</span>
    </span>
  </button>
  <div class="report-stage">
    {{REPORT_PAGES}}
  </div>
</body>
</html>
