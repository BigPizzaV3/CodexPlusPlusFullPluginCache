interface:
  display_name: "Guardio protection"
  short_description: "Link checks for the tasks you ask for"
  default_prompt: "Use $guardio-protection to check the links this task depends on before you open them."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "guardio"
      description: "Check links with the connected Guardio account."
      transport: "streamable_http"
      url: "https://mcp.guard.io/mcp"
