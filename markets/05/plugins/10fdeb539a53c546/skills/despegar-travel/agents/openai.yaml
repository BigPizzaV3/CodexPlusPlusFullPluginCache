interface:
  display_name: "Despegar Travel"
  short_description: "Search Despegar flights, hotels, activities, and insurance via Vivi MCP — without date scanning."
  brand_color: "#5400C8"
  default_prompt: "Help me find flights or hotels on Despegar with specific dates."

policy:
  allow_implicit_invocation: true

# Align `value` with the MCP server name registered in the ChatGPT plugin portal.
# Update `url` to the partner MCP endpoint you submitted (assistant id included).
dependencies:
  tools:
    - type: "mcp"
      value: "vivi"
      description: "Despegar Vivi MCP tools (flight-search, hotels, activities, insurance, checkout)"
      transport: "streamable_http"
      url: "https://ai.despegar.io/vivi/despegar-openai/mcp"
