interface:
  display_name: "MECE → OpenCode"
  short_description: "MECE multi-cell waves — you conduct, OpenCode executes."
  brand_color: "#B87333"
  icon_small: "./assets/mece-opencode.svg"
  icon_large: "./assets/mece-opencode.svg"
  default_prompt: >
    Set up a portable .mece/ fleet for this project and EXECUTE pending cells
    with OpenCode (user-owned auth only). No FN8 credentials. Write REPORT.md
    per cell and SYNTHESIS.md when the wave finishes.

policy:
  allow_implicit_invocation: true
