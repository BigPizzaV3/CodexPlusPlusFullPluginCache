interface:
  display_name: "Readdy MCP"
  short_description: "通过 Readdy 创建、修改并查询 AI 网站"
  default_prompt: "Use $readdy-mcp to create or update a Readdy website from our conversation."

dependencies:
  tools:
    - type: "mcp"
      value: "readdy"
      description: "创建、修改和查询 Readdy 项目，跟踪生成进度并继续问答"
      transport: "streamable_http"
      url: "https://mcp.readdy.ai/mcp"

policy:
  allow_implicit_invocation: true
