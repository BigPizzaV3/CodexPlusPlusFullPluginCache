schema_version: '1.0'
policy_id: SMC-TRUSTED-WORKING-TRUTH-RC4
default_treatment: trusted_working_truth
visible_evidence_by_default: false
conflict_only_escalation: true
trusted_sources:
- source_type: owner_locked_fact
  priority: 120
  treatment: hard_fact
  examples:
  - explicit_user_fact
  - owner_correction
  - owner_best_judgment
- source_type: smc_internal_fact
  priority: 110
  treatment: hard_fact
  examples:
  - approved_product_record
  - approved_price_list
  - approved_service_rule
- source_type: smc_website
  priority: 100
  treatment: hard_fact
  domains:
  - scootmobielcentrum.com
  - www.scootmobielcentrum.com
- source_type: official_brand_or_manufacturer
  priority: 90
  treatment: hard_fact
- source_type: official_supplier
  priority: 85
  treatment: hard_fact
- source_type: official_insurer_or_finance_partner
  priority: 85
  treatment: hard_fact
- source_type: official_government_or_regulator
  priority: 90
  treatment: hard_fact_when_supplied_or_explicitly_selected
covered_claim_domains:
- product_specs
- prices
- availability
- service
- law_and_rules
- helmet_and_license
- medical_suitability
- safety
- insurance
- finance
- wmo_pgb
- best_claims
- market_comparisons
conflict_policy:
  smc_value_is_temporary_working_value: true
  show_exact_locations: true
  continue_non_conflicting_work: true
  owner_decision_required: true
  never_average_conflicting_values: true
standard_evidence_engine_only_for:
- seo_platform_claims
- patents
- scientific_research
- framework_terms
- unknown_external_sources
- explicit_strict_verification
