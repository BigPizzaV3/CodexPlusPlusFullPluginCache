interface:
  display_name: "Manage resources"
  short_description: "List or remove source documents in Revensi"
  default_prompt: "Use $revensi-resource-library to list the source documents in my Revensi workspace."
dependencies:
  tools:
    - type: "mcp"
      value: "revensi"
      description: "Revensi workspace resource library"
      transport: "streamable_http"
      url: "https://app.revensi.com/mcp"
