interface:
  display_name: "Hoteler Log 登録リンク"
  short_description: "予約資料から確認用のHoteler Log登録リンクをすぐ作成します"
  icon_small: "./assets/app-icon.png"
  icon_large: "./assets/app-icon.png"
  brand_color: "#0A84FF"
  default_prompt: "Use $hoteler-log-import-stays to create review-only Hoteler Log links immediately for catalogued reservations with complete, valid, unambiguous required fields. Treat JPY as the plugin registration currency: preserve explicit JPY amounts, and convert a clear foreign amount for a past or same-day local check-in only with same-date official ECB daily reference observations for the local check-in date or the nearest prior common publication within 10 calendar days, using decimal arithmetic and half-up rounding to whole yen. If official conversion is unavailable, omit both money fields without delaying the link. State that price-bearing links assume Hoteler Log main currency JPY because the plugin cannot read app settings. Hold only unlisted names, missing or invalid required fields, duplicates, or required-field ambiguity."

policy:
  allow_implicit_invocation: true
