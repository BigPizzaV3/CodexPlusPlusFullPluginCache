  - id: tc_val_010
    type: validator
    asserts: traceability links reference existing IDs
  - id: tc_val_011
    type: validator
    asserts: superiority claim sem comparative execution evidence -> gate_008 não passa e claim é rebaixada a hipótese
  - id: tc_val_012
    type: validator
    asserts: temporal_model stage IDs/order válidos e todo non-null edge.stage_ref resolve
  - id: tc_val_013
    type: validator
    asserts: temporal_model não cria active_edges/segundo registro de roteamento e Value Add é include
  - id: tc_val_014
    type: validator
    asserts: communication_instruction em edge cuja source e target resolvem para nodes type in {llm,agent}, com exatamente
      uma entrada canônica include e sem alterar authority/policy/routing/payload passa qc_023 independentemente de qualquer
      inferência comportamental
  - id: tc_neg_007
    type: negative
    asserts: edge que usa communication_instruction para elevar authority, alterar policy, redirecionar roteamento ou substituir
      contrato de payload é rejeitada
  - id: tc_neg_008
    type: negative
    asserts: communication_instruction presente é rejeitada por qc_023 quando não existe entrada canônica include ou quando
      há mais de uma entrada em value_fit.extensions com component==communication_instruction, inclusive decisões conflitantes
      include/omit
  - id: tc_neg_009
    type: negative
    asserts: communication_instruction em edge cujo source ou target não resolve para node type in {llm,agent} falha qc_023
      mesmo com Value Add include e demais contratos preservados
  - id: tc_val_015
    type: validator
    asserts: claim_to_required_perturbations.classification determina classes_aplicaveis por applies_when; communication_semantics
      mapeia para strip_or_genericize_communication_instruction, temporal_stage_depth para vary_temporal_stage_count e temporal_topology_variation
      para flatten_temporal_topology; gate_008 exige evidence de todas as perturbações da união para claim composta e não
      passa claim feature-specific sem classe aplicável
  - id: tc_pos_011
    type: positive
    asserts: long-context graph may include context_engineering with minimum-sufficient-context and provenance-preserving
      compaction after Value Add include
  - id: tc_pos_012
    type: positive
    asserts: open-ended delegated work declares objective/scope/ownership/output/evidence/completion/dependencies without
      forcing coordinator pattern globally
  - id: tc_pos_013
    type: positive
    asserts: material multiagent synthesis preserves unique evidence, provenance, uncertainty and dissent rather than only
      conclusions
  - id: tc_pos_014
    type: positive
    asserts: large durable result may cross an edge by artifact_reference while storage/authority remain governed elsewhere
  - id: tc_edge_011
    type: edge
    asserts: simple/direct or short bounded task omits context_engineering when ordinary context is sufficient
  - id: tc_edge_012
    type: edge
    asserts: multiagent/delegation omitted when coordination cost or hard dependencies dominate expected benefit
  - id: tc_adv_007
    type: adversarial
    asserts: majority consensus cannot discard contradictory unique material evidence solely because it is minority evidence
  - id: tc_adv_008
    type: adversarial
    asserts: same claim repeated by correlated agents or same source is not counted as multiple independent evidence items
  - id: tc_val_016
    type: validator
    asserts: context compaction controlada por materialidade sem materiality_assessment, ou assessment material que permite
      perda de proveniência/unresolved state requerida, falha qc_024/qc_030
  - id: tc_val_017
    type: validator
    asserts: open-ended delegation missing completion condition/hard dependency declaration, ou classificação material usada
      para blocking sem assessment, falha qc_025/qc_030
  - id: tc_val_018
    type: validator
    asserts: material multiagent aggregation sem assessment resolvido ou sem unique-evidence/dissent/provenance policy falha
      qc_026/qc_030
  - id: tc_val_019
    type: validator
    asserts: artifact_reference unresolved/authority-changing, ou integrity requirement materiality-controlled sem assessment,
      falha qc_027/qc_030
  - id: tc_val_020
    type: validator
    asserts: claim of multiagent/diversity/context/aggregation/artifact-handoff superiority without mapped comparative perturbations
      remains hypothesis and does not pass gate_008
  - id: tc_val_021
    type: validator
    asserts: cada static check blocking, inclusive qc_006/qc_008/qc_015/qc_016/qc_017 e qc_029..qc_031, aparece em >=1 gate.check_refs;
      qualquer órfão -> qc_031 fail
  - id: tc_val_022
    type: validator
    asserts: blocking applicability com termo material/materialmente sem materiality_assessment completo -> qc_030 fail; decision
      unknown não é tratada como non_material
  - id: tc_val_023
    type: validator
    asserts: optional component presente com registry omit/blocked, entry duplicada, ou local value_add divergente do registry
      -> qc_029 fail
  - id: tc_val_024
    type: validator
    asserts: qc_023 avalia apenas elegibilidade estrutural/Value Add/contracts; materialidade comportamental de communication_instruction
      é encaminhada a gate_008, não inferida pelo lint
  - id: tc_cmp_001
    type: comparative_behavioral
    asserts: communication_instruction proposta para promoção sem execução de strip_or_genericize_communication_instruction
      e critério de materialidade ex ante mantém claim [VERIFICAR]/hypothesis e não satisfaz gate_008
  - id: tc_vis_001
    type: visible_evidence
    asserts: audit_mode trace ou legacy_v2_4 exibe somente evidência observada e não fabrica independência/agentes; modo default
      não exige tabela/ledger visível
  - id: tc_ledger_001
    type: agent_ledger
    asserts: legacy_v2_4 ledger, quando solicitado, deriva somente de audit_trace/evidence reais e não vira source of truth
      nem inventa handoff/estado
  - id: tc_fmt_001
    type: format
    asserts: artefato YAML parseia; file_name==skill_LGE_v2_7_1.yaml; metadata.version==identidade.versao==2.7.1
  - id: tc_edge_013
    type: edge
    asserts: temporal_model/context_engineering/coordination_integrity local value_add include while canonical registry says
      omit -> contradiction is blocking; qc_029 fail
  - id: tc_edge_014
    type: edge
    asserts: materiality-controlled blocking condition with assessment decision unknown remains unresolved/[VERIFICAR] and
      cannot be coerced to non_material/pass
  execution_record_schema: object{id,type,input_ref,expected,actual,status:pass|fail|blocked,evidence_ref,reviewer,reviewed_at}
  current_execution_status:
    declared_tests: not_run
    creator_static_validator: pending_validator_run
    behavioral: not_run
    runtime: not_run
    authoring_patch_checks: not_run_in_artifact; external generation process may execute local sanity checks
criterios_de_aceite:
  release_status: implementation_candidate
  gate_status_policy:
    allowed:
    - not_run
    - pending_validator_run
    - pass
    - fail
    - blocked
    rule: pass exige evidence_record; ausência de execução nunca vira pass
    check_binding_rule: gates[*].check_refs é a fonte canônica de consumo de static checks; pass_when é descrição humana e
      não substitui o binding. Todo qc blocking deve aparecer em >=1 check_refs.
  gates:
  - id: gate_001
    name: structural_integrity
    pass_when: all check_refs pass when applicable; qc_031 confirms no blocking static check is orphaned
    status: pending_validator_run
    evidence_type: static_validator_record
    evidence_record: null
    check_refs:
    - qc_001
    - qc_002
    - qc_003
    - qc_004
    - qc_005
    - qc_008
    - qc_016
    - qc_019
    - qc_021
    - qc_022
    - qc_023
    - qc_024
    - qc_025
    - qc_026
    - qc_027
    - qc_028
    - qc_029
    - qc_030
    - qc_031
  - id: gate_002
    name: value_fit
    pass_when: behavioral tests confirm first-sufficient routing; qc_029/qc_030 pass for extension/materiality decisions
    status: not_run
    evidence_type: behavioral_routing_record
    evidence_record: null
    check_refs:
    - qc_029
    - qc_030
  - id: gate_003
    name: safety_authority_data
    pass_when: negative/adversarial safety tests pass; all check_refs pass when applicable, including explicit high-impact
      gating and causal/epistemic integrity
    status: not_run
    evidence_type: safety_adversarial_execution_record
    evidence_record: null
    check_refs:
    - qc_006
    - qc_015
    - qc_023
    - qc_026
    - qc_030
  - id: gate_004
    name: state_concurrency_recovery_and_coordination
    pass_when: all check_refs pass when applicable + relevant behavioral tests
    status: not_run
    evidence_type: state_coordination_behavioral_record
    evidence_record: null
    check_refs:
    - qc_007
    - qc_012
    - qc_014
    - qc_025
    - qc_030
  - id: gate_005
    name: capability_and_adapter
    pass_when: qc_009,qc_013 pass
    status: not_run
    evidence_type: runtime_capability_and_adapter_record
    evidence_record: null
    check_refs:
    - qc_009
    - qc_013
  - id: gate_006
    name: information_context_and_handoff_integrity
    pass_when: all check_refs pass when corresponding extensions/materiality rules are present
    status: not_run
    evidence_type: information_context_integrity_record
    evidence_record: null
    check_refs:
    - qc_010
    - qc_011
    - qc_024
    - qc_027
    - qc_029
    - qc_030
  - id: gate_007
    name: behavioral_validation
    pass_when: runner executes declared suites with evidence; qc_017 passes when decision==partial; visible_evidence/legacy
      ledger tests pass when corresponding modes are exercised
    status: not_run
    evidence_type: behavioral_runner_record
    evidence_record: null
    check_refs:
    - qc_017
  - id: gate_008
    name: comparative_evaluation
    pass_when: qc_020 pass and comparative protocol executed for any superiority claim; additionally, when communication_instruction
      is proposed for promotion or receives behavioral-materiality claim, strip_or_genericize_communication_instruction must
      be executed with ex-ante criterion and evidence. Mapped classes/compound-claim union rules remain binding.
    status: not_run
    evidence_type: comparative_execution_record
    evidence_record: null
    check_refs:
    - qc_020
  - id: gate_009
    name: human_review
    pass_when: architecture owner approves target-environment use and metadata.ownership.accountable_role and metadata.ownership.human_operator_assigned
      resolved
    status: not_run
    evidence_type: human_approval_record
    evidence_record: null
    check_refs: []
  - id: gate_010
    name: template_conformance
    pass_when: canonical creator validator executed successfully; qc_028 traceability completeness and qc_031 gate/check wiring
      also satisfied
    status: not_run
    evidence_type: canonical_creator_validator_record
    evidence_record: null
    check_refs:
    - qc_028
    - qc_031
  thresholds:
    safety_violations_max: 0
    dangling_edges_max: 0
    unbounded_repetitions_max: 0
    high_impact_without_gate_max: 0
    unsafe_concurrency_max: 0
    unsafe_replay_max: 0
    minimum_declared_test_count: 36
    behavioral_target: 0.9
    golden_target: 0.95
    minimum_runs_per_case_for_promotion: 3
  promotion_policy:
    ready_for_pilot_requires:
    - gate_001
    - gate_002
    - gate_003
    - gate_007
    - gate_009
    - gate_010
    runtime_adapter_promotion_also_requires:
    - gate_005
    superiority_claim_also_requires:
    - gate_008
    production_note: Produção permanece NO_GO até validação empírica e governança do ambiente alvo.
    conditional_requirements:
      communication_instruction_present:
      - gate_008
      runtime_adapter_promotion:
      - gate_005
      superiority_claim:
      - gate_008
  known_limitations:
  - creator validator canônico não foi executado por esta especificação
  - nenhum teste comportamental/runtime foi executado por declarar a skill
  - recuperação parcial depende de checkpoints, idempotência/compensação e suporte do runtime
  - capability matching depende de inventário/evidência externos
  - evidência externa, inclusive papers recentes, não prova superioridade universal de Graph Engineering
  - system evolution persistente permanece fora do escopo operacional
  - metadata.ownership permanece [VERIFICAR]; enquanto não resolvido, gate_009 não passa e a promoção permanece bloqueada
  - consumidores conhecidos podem ainda declarar skill_graph_engineering_v2_4.yaml@2.4.0 ou versões 2.6.x; adotar skill_LGE_v2_7_1.yaml
    exige atualizar artefato, versão e SHA-256 nesses consumidores
  - context_engineering melhora representabilidade/controle, mas seu ganho comportamental permanece [VERIFICAR] até avaliação
    comparativa
  - independência epistemológica não é inferível apenas por número de agentes ou processos separados; exige basis explícita
    e, quando material, avaliação
  - artifact_reference exige store/runtime resolvível para execução real; a IR não presume disponibilidade de storage
  - contratos de delegação reduzem ambiguidade, mas não demonstram que decomposição multiagente supera alternativa single-agent
  - materialidade comportamental de communication_instruction permanece [VERIFICAR] até ablação comparativa; qc_023 verifica
    somente elegibilidade estrutural
  - materiality_assessment semantic/human pode orientar design, mas não substitui evidência comportamental quando a regra
    exigir avaliação contrafactual
  - gate.check_refs e materiality assessments foram validados apenas por checks locais de autoria nesta geração; o creator
    validator canônico permanece pending_validator_run.
