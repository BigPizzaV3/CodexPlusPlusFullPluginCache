  completeness_rule: Todo requisito normativo referencia ao menos um mecanismo, efeito esperado, critério de aceite, teste
    e gate; todo teste normativo aparece em ao menos um requisito. Campos legados invariants/tests/gates permanecem para compatibilidade.
exemplos_de_evidenciacao_visivel:
  status: deprecated_as_default
  rule: 'Não exibir tabela de agentes/ledger em toda resposta. Quando audit_mode=trace ou legacy_v2_4, mostrar somente evidência
    realmente observada; nunca fabricar independência. Cobertura mínima: tc_vis_001/tc_ledger_001; ausência de execução desses
    testes não vira pass.'
  removal_target: 3.0.0
response_policy:
  default_structure:
  - decisão/arquitetura escolhida
  - justificativa Value Fit
  - artefato solicitado
  - riscos/limitações materiais
  - próximo passo se necessário
  simple_case: Resposta direta; não expor Graph IR, trace ou framework interno sem utilidade.
  complex_case: Mostrar contratos, IR e checks necessários para implementação/auditoria, sem cadeia privada de pensamento.
  audit_case: Relatar critérios, evidências, failed_checks e gaps; trace somente se solicitado/necessário.
  partial_case: Distinguir completed_scope, failed_checks, assumptions e known_limitations.
  prohibited:
  - chain-of-thought privado
  - falsa execução/validação
  - ledger ornamental
  - vendor specifics no núcleo da IR
  - score numérico sem evidência
  - claim causal baseado apenas em topologia
measurement_model:
  policy: Preferir gates binários para release; métricas não executadas são targets/definitions, não resultados.
  metrics:
  - id: m_001
    name: overengineering_rate
    definition: casos em que nível > primeiro suficiente / casos avaliados
  - id: m_002
    name: graph_integrity_failure_rate
    definition: IRs com falha estrutural / IRs avaliadas
  - id: m_003
    name: unsafe_architecture_rate
    definition: arquiteturas que preservam finalidade insegura / casos unsafe
  - id: m_004
    name: high_impact_ungated_rate
    definition: ações high-impact sem gate / ações high-impact
  - id: m_005
    name: unsafe_concurrency_rate
    definition: grupos paralelos violando dependência/state/side-effect safety / grupos
  - id: m_006
    name: unsafe_replay_rate
    definition: replays sem boundary/consistência/idempotência-compensação / replays
  - id: m_007
    name: capability_overclaim_rate
    definition: bindings/applied mappings sem evidence / claims de capability
  - id: m_008
    name: optional_extension_without_value_rate
    definition: extensões presentes sem Value Add include / extensões
  - id: m_009
    name: cost_per_success
    definition: custo observado / execuções bem-sucedidas
  - id: m_010
    name: latency_p95
    definition: p95 de latência observada em protocolo definido
  - id: m_011
    name: instruction_bytes
    definition: bytes UTF-8 do artefato versionado
  - id: m_012
    name: semantic_duplication_candidates
    definition: pares de instruções quase equivalentes detectados por auditoria textual; indicador, não prova
human_review:
  required_for:
  - release promotion
  - high-impact execution approval
  - persistência sensível/derivada quando policy exigir
  - mudança de authority ou data governance
  - uso de adapter em ambiente material não testado
  - qualquer proposta futura de persistent architecture evolution
  roles:
  - architecture_owner
  - security_or_compliance_when_material
  - process_or_product_owner_when_material
  approval_record_schema: object{reviewer_id,role,date,decision:approve|reject|conditions,conditions,evidence_ref}
  current_records: []
lifecycle:
  versioning_policy: 'SemVer documental: breaking schema/guarantee -> major; extensão opcional compatível -> minor; correção
    não-breaking -> patch.'
  backward_compatibility:
    legacy_v2_4_agent_execution_ledger: optional compatibility mode until 3.0.0
    v2_4_optional_extensions: preserved conceptually; schemas compacted without vendor coupling
    v2_5_5_graph_ir: compatible; communication_instruction, stage_ref e temporal_model são opcionais e sua ausência preserva
      a semântica anterior
    v2_6_0_graph_ir: compatible; 2.6.1 não altera schema de Graph IR, não adiciona campo e não torna nenhuma extensão obrigatória;
      acrescenta apenas verificação do que 2.6.0 já declarava
    v2_6_1_graph_ir: compatible; 2.6.2 preserva integralmente o schema funcional da Graph IR de 2.6.1 e altera somente bindings
      de validação, teste e rastreabilidade
    note: Consumidores que dependem da presença obrigatória do ledger devem usar audit_mode=legacy_v2_4 durante migração.
    v2_6_2_graph_ir: compatible; 2.6.3 preserva integralmente o schema funcional da Graph IR de 2.6.2 e altera somente classificação/bindings
      de validação e referência documental de adoção
    v2_6_3_graph_ir: compatible; 2.6.4 preserva integralmente o schema funcional da Graph IR de 2.6.3 e altera somente o enforcement
      da condição de elegibilidade já declarada para communication_instruction
    v2_6_4_graph_ir: compatible; 2.7 preserva os architecture_levels e o core da Graph IR de 2.6.4; context_engineering e
      coordination_integrity são optional_extensions default-null
    v2_7_graph_ir: 'Graph IR core estruturalmente compatível; 2.7.1 não altera architecture_levels nem semântica funcional
      de node/edge. Validação fica mais estrita: artefatos 2.7 que usam extensões opcionais podem precisar normalizar value_fit.extensions
      e declarar materiality_assessments quando materialidade controlar regra blocking.'
  deprecations:
  - item: mandatory visible agent table/ledger
    replacement: audit_trace on demand
    removal_target: 3.0.0
  - item: duplicate output error catalogs/mirrors
    replacement: decisao_e_excecoes.errors as canonical source
    removal_target: 2.5.0
  deferred_candidates:
  - item: persistent self-evolving architecture
    status: deferred
    reason: alto custo de governança e evidência insuficiente antes de validar núcleo v2.5; qualquer adoção futura exige versioning,
      validation, human approval e rollback
  migration_notes:
  - 34 microestados da v2.4 consolidados em 15 estados sem remover decisões materiais.
  - 7 pseudo-agentes obrigatórios substituídos por 4 papéis lógicos; multi-agent só com execução independente verificada.
  - ledger visível obrigatório deixou de ser default; compatibilidade legacy disponível.
  - dependency_type/hard_dependency e concurrency_groups tornam paralelismo verificável.
  - required_capabilities/executor_binding separam requisito de capacidade de identidade do executor.
  - recovery_policy adiciona checkpoints, failure localization, recovery boundary e replay safety bounded.
  - avaliação comparativa adiciona matched-budget e perturbações estruturais quando há claim de melhoria.
  - system evolution persistente foi explicitamente adiada, não empilhada no núcleo.
  - regras, errors, gates, testes e rastreabilidade foram consolidados para uma única fonte canônica por conceito.
  - v2.5.1 restaura contratos terminais canônicos, default de route_level, enum de gate e rastreabilidade integral; comparative_evaluation
    passa de declarativa a mecanismo testável.
  - v2.6.0 adiciona semântica comunicacional opcional por edge e temporal_model opcional sem duplicar roteamento; acrescenta
    ablações comparativas e checks/testes correspondentes, sem tornar multi-agent, controller, aggregator, número de rounds
    ou replanning obrigatórios.
  - v2.6.1 não exige migração de Graph IR. Grafos válidos em 2.6.0 permanecem válidos; o que muda é que communication_instruction
    passa a ser verificada por qc_023 (blocking) nos mesmos termos já declarados como constraint em 2.6.0.
  - v2.6.2 não exige migração de Graph IR. Grafos válidos em 2.6.1 permanecem válidos; o patch torna explícitos o binding
    de Value Add de communication_instruction e o mapping de claims para perturbações em gate_008.
  - v2.6.3 não exige migração de Graph IR. Grafos válidos em 2.6.2 permanecem válidos; o patch torna operacional a classificação
    de claims de gate_008, exige cardinalidade exatamente 1 para o binding de communication_instruction em value_fit.extensions
    e sincroniza a referência documental de adoção.
  - 'v2.6.4 não exige migração de Graph IR. Grafos válidos em 2.6.3 permanecem estruturalmente compatíveis; o patch torna
    blocking, via inv_023/qc_023 já existentes, a condição de elegibilidade de communication_instruction já declarada como
    constraint: comunicação cognitiva agente-a-agente e materialidade para o comportamento esperado do receptor.'
  - Consumidores que referenciam skill_graph_engineering_v2_4.yaml, versões 2.6.x ou skill_LGE_v2_7.yaml devem atualizar artefato/version/hash
    para skill_LGE_v2_7_1.yaml; sem isso a lineage declarada permanece desatualizada.
  - '2.6.4 -> 2.7: rename de produto para Loop and Graph Engineering; architecture_level e Graph IR core permanecem compatíveis.'
  - Novas extensões context_engineering e coordination_integrity são opcionais e default-null; consumidores que ignoram optional_extensions
    permanecem compatíveis.
  - Matriz de rastreabilidade ganha mechanisms/expected_effect/acceptance_criteria; campos legados invariants/tests/gates
    são preservados.
  - '2.7 -> 2.7.1: patch de verificabilidade. Static checks blocking passam a ter wiring canônico por gate.check_refs; qc_023
    torna-se puramente estrutural e a materialidade comportamental de communication_instruction migra para gate_008; value_fit.extensions
    torna-se registry canônico; materialidade normativa recebe assessment explícito.'
  - metadata.ownership permanece [VERIFICAR] intencionalmente; sem designação humana verificável, gate_009 continua bloqueando
    promoção e nenhum owner é inventado.
