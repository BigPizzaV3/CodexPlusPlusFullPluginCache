# ============================================================
# EXIT CODES PARA CI/CD
# ============================================================

exit_codes:
  descricao: "Códigos de saída para integração com pipelines CI/CD"
  
  codigos:
    0:
      nome: "SUCCESS"
      condicao: "score_global >= threshold_aprovacao"
      mensagem: "✅ Todos os testes passaram. Build aprovado."
    
    1:
      nome: "QUALITY_THRESHOLD_NOT_MET"
      condicao: "score_global < threshold_aprovacao"
      mensagem: "❌ Score global abaixo do threshold. Build reprovado."
    
    2:
      nome: "CRITICAL_METRIC_FAILED"
      condicao: "any(metrica.criticidade == 'CRÍTICA' and not metrica.passou)"
      mensagem: "❌ Métrica crítica falhou. Build bloqueado."
    
    3:
      nome: "SECURITY_VIOLATION"
      condicao: "seguranca_quality.score < 1.0"
      mensagem: "🔒 Violação de segurança detectada. Build bloqueado."
    
    4:
      nome: "SYNTAX_ERROR"
      condicao: "met_mermaid_01.passou == False"
      mensagem: "⚠️ Erro de sintaxe Mermaid. Corrija e reenvie."
    
    10:
      nome: "WARNING_ONLY"
      condicao: "85 <= score_global < 95"
      mensagem: "⚠️ Build aprovado com ressalvas. Considere melhorias."

  uso_em_ci_cd: |
    # GitHub Actions exemplo
    - name: Validar Artefatos
      run: |
        python engine.py validate --coverage
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Build aprovado"
        elif [ $EXIT_CODE -eq 10 ]; then
          echo "⚠️ Build aprovado com ressalvas"
        else
          echo "❌ Build reprovado - Exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi

