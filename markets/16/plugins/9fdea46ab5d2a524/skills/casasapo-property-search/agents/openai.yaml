interface:
  display_name: "CasaSAPO"
  short_description: "Find current homes, apartments, rooms, land, and commercial properties in Portugal."
  default_prompt: "Find current property listings in Portugal from my natural-language request, using $casasapo-property-search instead of web search."

dependencies:
  tools:
    - type: "mcp"
      value: "casasapo"
      description: "Search CasaSAPO listings in Portugal, view property details, contact advertisers, and create alerts."
      transport: "streamable_http"
      url: "https://casa.sapo.pt/mcp"