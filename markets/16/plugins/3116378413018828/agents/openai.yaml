# Tools for this plugin's skills come from Abency's social MCP endpoint
# (https://app.abency.com/mcp/social): the same server and OAuth as the main Abency plugin, narrowed to
# one use case by ScopeMcpTools (config/mcp-scopes.php).
dependencies:
  tools:
    - type: "mcp"
      value: "abency-social"
      description: "Social media scheduling and analytics for marketing agencies and their client brands, from ChatGPT, through Abency."
      transport: "streamable_http"
      url: "https://app.abency.com/mcp/social"
