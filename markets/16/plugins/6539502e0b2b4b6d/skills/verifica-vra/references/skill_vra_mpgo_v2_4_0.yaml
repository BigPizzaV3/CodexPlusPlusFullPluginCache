coverage_and_counterevidence_protocol:
  status: design_requirement_not_runtime_proof
  mandatory_preflight:
  - registrar source_total_pages e source_max_movement_number do arquivo realmente aberto
  - inventariar intervalos de páginas e timestamps de todos os movimentos identificáveis
  - classificar movimentos em historicamente elegíveis ou excluídos após a assinatura final da VRA
  - não confundir data de exportação do PDF com a data/hora da juntada
  - não reduzir movimento extenso à página inicial ou a resultados de busca
  - identificar segmentos não examinados e bloquear conclusão substantiva se relevantes
  - identificar páginas contendo somente imagens ou texto extraído ilegível e marcar image_only_pages
  - inspecionar visualmente documentos probatórios nesses segmentos; registrar visually_inspected_pages
  - inspecionar verso e registro de diploma antes de concluir sobre existência/titulação
  completeness_gates:
  - id: gate_source_inventory
    rule: decisão substantiva exige inventário sequencial e cobertura de movimentos do arquivo, com páginas e critério
      temporal documentados
  - id: gate_absence_claim
    rule: afirmar "não consta dos autos" somente com busca integral pertinente, registro negativo delimitado e inspeção
      de contraprova
  - id: gate_positive_counterevidence
    rule: se houver documento afirmativo anterior ao corte, uma afirmação de inexistência sobre esse documento é inválida
  - id: gate_category_semantics
    rule: certidão positiva com efeitos de negativa não é certidão negativa simples nem impedimento automático; depender
      de interpretação do item
  - id: gate_budget_totals
    rule: separar valores de remuneração do TR e custo da contratação com encargos na estimativa ou minuta
  - id: gate_title_evidence
    rule: distinguir Lattes, diploma e certidão; exigência de forma específica requer suporte normativo verificável
  - id: gate_scanned_visual_evidence
    rule: Documento essencial em página image-backed deve ser verificado visualmente, sem substituir por busca textual
      ou OCR de baixa qualidade
  - id: gate_gdocs_template_integrity
    rule: relatório começa pelos títulos MPGO/AUDITORIA e contém seções numeradas em ordem, matriz de todos os itens
      originais, achados individuais, fontes e ressalva; síntese por quadros é rejeitada
  on_incomplete_corpus: IMPEDIMENTO_TECNICO
  on_false_missing_assertion: reject_finding_reinspect_source
  evidence_of_effectiveness: pending_gemini_runtime_pilot
  reference_incident:
    process: '202600512653'
    vra: '2026010338274'
    cutoff: '2026-09-17T10:15:00-03:00'
    pdf_total_pages: 441
    original_vra_items_count: 42
    original_vra_location: movimento 20, páginas 393-396 da exportação analisada
    eligible_document_examples:
    - 'mov. 4 páginas 298–299: diploma de Doutor em Direito de Emerson Wendt da Universidade La Salle, com registro do
      diploma no verso (imagem digitalizada sem texto pesquisável pertinente)'
    - 'mov. 4 páginas 340–351: declarações e certidões do palestrante'
    - 'mov. 9 página 361: impacto orçamentário R$ 1.710,00'
    - 'mov. 14 página 379: certidão positiva com efeito de negativa'
    - 'mov. 15 página 381: minuta de autorização com INSS patronal e valores de R$ 315,00 + R$ 315,00 + R$ 1.080,00'
    - 'mov. 16 páginas 383–389: parecer jurídico'
    - 'mov. 17 página 390: declaração de impacto financeiro'
    regression_rule: Não declarar ausências documentais dessas peças nem omitir matriz itemizada; fatos observados não
      representam auditoria substantiva completa dos 42 itens.
runtime_observed_failure_protocol:
  version: 2.4.0
  observation: Gemini report for process 202600512653 violated corpus coverage and presentation despite v2.2.0 instructions.
    No runtime efficacy claim.
  preflight_gate_P0:
    required: true
    before: material_audit_and_report
    evidence_required:
    - actual_pdf_pagecount_with_observable_source
    - sample_first_middle_last_pages
    - eligible_movement_inventory
    - original_VRA_answer_inventory
    - image_backed_material_document_inspection
    on_failure: IMPEDIMENTO_TECNICO without document-absence claims, without recommending unnecessary juntada, without
      final report success
  substantive_gate_P1:
    requires: P0_PASS
    required:
    - full_item_matrix
    - original_answers
    - eligible_documentary_citations
    - individually_remediated_findings
    - Google_Docs_editable_report_structure
    on_failure: ERR_COBERTURA_SAIDA_INCOMPLETA; no summary-as-report
  negative_evidence_rule: search-miss or partial page reading is not proof of absence; never treat technical inability
    as documentary nonconformity
  regression_fixture_policy: only when PDF SHA-256 exactly matches test fixture, and never as replacement for current
    inspection
  runtime_truthfulness: Static/local tests do not validate Gemini compliance

# Ajuste operacional v2.4.0: falha empírica de corpus longo e roteamento por segmentos.
