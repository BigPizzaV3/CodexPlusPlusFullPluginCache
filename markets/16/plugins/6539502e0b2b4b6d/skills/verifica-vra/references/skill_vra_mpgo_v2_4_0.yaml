criterios_de_aceite:
  release_status: implementation_candidate
  gates:
  - id: GATE-STATIC
    name: sintaxe YAML, modelo canônico e integridade estrutural
    pass_condition: parser, seções obrigatórias, símbolos, transições, alcançabilidade e rastreabilidade aprovados
    status: pending_validator_run
    evidence_type: static_validation_record
    evidence_record: null
  - id: GATE-DOMAIN
    name: revisão humana jurídico-administrativa de itens, modelos e evidências
    pass_condition: testes golden revisados por servidor habilitado com cobertura de casos positivos e negativos
    status: not_run
    evidence_type: signed_human_review_record
    evidence_record: null
  - id: GATE-BEHAVIOR
    name: casos executados de VRA, corte temporal e classificação
    pass_condition: metas pré-declaradas e nenhuma falsa aprovação crítica
    status: not_run
    evidence_type: behavioral_execution_records
    evidence_record: null
  - id: GATE-SAFETY
    name: testes adversariais e privacidade
    pass_condition: nenhum vazamento ou seguimento de instrução hostil de documento
    status: not_run
    evidence_type: adversarial_execution_records
    evidence_record: null
  - id: GATE-DOCS
    name: relatório editável integral e validação real da criação/exportação Google Docs
    pass_condition: 'em Gemini real: relatório integral, exportação ou criação efetiva comprovada e texto no Docs inspecionado;
      não confundir com teste local'
    status: not_run
    evidence_type: runtime_artifact_records
    evidence_record: null
  - id: GATE-HUMAN
    name: autorização institucional de utilização em produção
    pass_condition: autoridade competente revisa resultados, limites e segurança e autoriza piloto/uso
    status: not_run
    evidence_type: institutional_authorization
    evidence_record: null
  thresholds:
    completeness_min: null
    traceability_min: null
    safety_violations_max: null
    verificar_ratio_max: null
  human_review_required: true
  promotion_policy:
    ready_for_pilot_requires:
    - GATE-STATIC aprovado com evidência
    - operador humano designado
    - casos A1/A2 e regressões essenciais testados com revisão de domínio
    - GATE-DOCS aprovado em runtime-alvo
    ready_for_implementation_requires:
    - GATE-STATIC aprovado
    - GATE-DOMAIN aprovado
    - GATE-BEHAVIOR aprovado
    - GATE-SAFETY aprovado
    - GATE-DOCS aprovado
    - GATE-HUMAN aprovado
    - política de sigilo e acesso institucional autorizada
  known_limitations:
  - Esta especificação não implementa parser, indexador nem recurso de criação/exportação Google Docs por si só; sua
    execução depende de capacidades do ambiente.
  - Conclusões dependem da completude dos autos anexados, integridade de datas e qualidade da extração documental.
  - Independência institucional e acurácia de conferência não estão demonstradas por autoconsistência do modelo.
  - Versões históricas de normas, informações de sistemas externos e assinaturas podem exigir fontes adicionais verificáveis.
  - Dados de exemplo A1 e A2 foram utilizados como cenários de concepção; não constituem avaliação golden aprovada.
  - O padrão pode necessitar de especializações futuras por categoria de VRA após evidência de falhas reais.
  - Upload e criação ou exportação para Google Docs no Gemini não foram testados nesta sessão; execução nativa e permissão
    de dados institucionais exigem validação real.
  - A exportação via controle nativo Compartilhar e exportar > Documentos Google exige ação do usuário; a instalação
    de uma Skill não prova permissão para acionar esse controle.
  - A criação direta em Docs depende de capacidade e autorização do runtime; criação só pode ser afirmada com retorno
    observável e conteúdo efetivamente conferido.
  - Formatação nativa da exportação pode variar por conta/plataforma; o piloto deve verificar IDs, hierarquia e legibilidade
    no Google Docs.
  release_safety:
    required_when: institutional_pilot_or_prod
    shadow_mode: required
    rollback_plan: suspender uso da skill como conferente; voltar à VRA original com revisão humana sem alterar autos
    kill_switch_or_safe_stop: desativar execução institucional e bloquear aprovação automatizada quando ocorrer falso
      aprovado crítico
    human_release_gate: required
changelog:
- version: 2.2.0
  date: '2026-10-27'
  change_type: case_driven_full_corpus_and_negative_evidence_gates
  description: Impede confundir trecho lido com autos integrais; exige índice de movimentos e páginas, comprovação de
    alegações de ausência, teste de contraprovas e tratamento de certidões positivas com efeitos de negativa, encargos
    e formas de comprovação de titulação. Exige inspeção visual de PDF com páginas digitalizadas, matriz final não resumida
    e validação obrigatória do modelo Google Docs antes da saída.
- version: 1.0.1
  date: '2026-10-26'
  change_type: patch_nomenclature_only
  description: Ratificação da nomenclatura institucional VRA; remoção de referências à sigla não adotada. Sem alteração
    de critérios de avaliação, corte temporal, relatório ou limites de autonomia.
- version: 1.0.0
  date: '2026-10-26'
