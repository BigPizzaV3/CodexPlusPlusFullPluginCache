    saída exclusiva como relatório Google Docs e corte histórico.
- version: 2.4.0
  date: '2026-10-27'
  changes:
  - Gate P0 verificabilidade de páginas/amostras/inspeção; falha fechada
  - Gate P1 contrato integral de relatório Google Docs
  - Pós-v2.2.0 falha observada; teste de regressão com hash
