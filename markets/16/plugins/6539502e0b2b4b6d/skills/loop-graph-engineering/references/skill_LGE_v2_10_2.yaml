    selection_rule: Usar critérios pré-registrados; não ajustar pesos/acceptance após observar vencedor.
    regression_policy: Qualquer regressão crítica bloqueia promoção. Observed failure pode gerar regression_candidate, mas promoção para regression/golden/adversarial
      eval permanente exige curadoria explícita, provenance/evidence e caso reproduzível/discriminador; candidato de regressão não é regra causal.
    shadow_mode: not_applicable
    evidence_package:
      observed_results: []
      failed_cases: []
      regressions: []
      limitations:
      - 2.10.1 cr_005 patch behavioral/runtime/comparative execution not run at specification time
