    behavioral_target: 0.9
    golden_target: 0.95
    minimum_runs_per_case_for_promotion: 3
  promotion_policy:
    ready_for_pilot_requires:
    - gate_001
    - gate_002
    - gate_003
    - gate_007
    - gate_009
    - gate_010
    runtime_adapter_promotion_also_requires:
    - gate_005
    superiority_claim_also_requires:
    - gate_008
    production_note: Produção permanece NO_GO até validação empírica e governança do ambiente alvo.
    conditional_requirements:
      communication_instruction_present:
      - gate_008
      runtime_adapter_promotion:
      - gate_005
      superiority_claim:
      - gate_008
      deterministic_coordination_promotion:
      - verified target executor
      - runtime test
      - evidence that Graph IR/source version and human-gate/side-effect boundaries are preserved
      recursive_delegation_promotion:
      - runtime enforcement evidence for depth/spawn authority where claimed
      revocation_quiescence_promotion:
      - runtime-observed stop propagation and quiescence evidence
      - configuration disable alone is insufficient
      v2_9_improvement_claim:
      - tc_cmp_005 or equivalent matched-capability/budget comparative evidence
      v2_10_improvement_claim:
      - tc_cmp_006 or equivalent matched-capability/budget comparative evidence
      adaptive_assurance_promotion:
      - observable target-runtime degradation signals
      - authorized human-gate/validation controls
      - evidence-gated de-escalation test
      failure_to_regression_promotion:
      - curation policy
      - reproduction/discriminator evidence
      - provenance and contamination review when used in evaluation
  known_limitations:
  - nenhum teste comportamental/runtime foi executado por declarar a skill
  - recuperação parcial depende de checkpoints, idempotência/compensação e suporte do runtime
  - capability matching depende de inventário/evidência externos
  - evidência externa, inclusive papers recentes, não prova superioridade universal de Graph Engineering
  - system evolution persistente permanece fora do escopo operacional
  - metadata.ownership permanece [VERIFICAR]; enquanto não resolvido, gate_009 não passa e a promoção permanece bloqueada
  - consumidores conhecidos podem ainda declarar skill_graph_engineering_v2_4.yaml@2.4.0 ou versões 2.6.x; eventual adoção de skill_LGE_v2_10_1.yaml exige
    gate de promoção, atualização de artefato, versão e SHA-256 nesses consumidores
  - context_engineering melhora representabilidade/controle, mas seu ganho comportamental permanece [VERIFICAR] até avaliação comparativa
  - independência epistemológica não é inferível apenas por número de agentes ou processos separados; exige basis explícita e, quando material,
    avaliação
  - artifact_reference exige store/runtime resolvível para execução real; a IR não presume disponibilidade de storage
  - contratos de delegação reduzem ambiguidade, mas não demonstram que decomposição multiagente supera alternativa single-agent
  - materialidade comportamental de communication_instruction permanece [VERIFICAR] até ablação comparativa; qc_023 verifica somente elegibilidade
    estrutural
  - materiality_assessment semantic/human pode orientar design, mas não substitui evidência comportamental quando a regra exigir avaliação contrafactual
  - gate.check_refs/materiality/retrieval policies exigem validação estática sobre os bytes finais; behavioral/runtime permanecem separados.
  - A 2.8.1 incorpora retrieval adaptativo/admission por patch documental; ganho comportamental sobre 2.8.0 permanece [VERIFICAR] até comparative
    evaluation executada.
  - Exemplos observacionais anteriores não constituem suíte controlada/reprodutível da 2.8.1.
  - Skill Creator v3.0.2 static validator demonstra somente consistência documental; não substitui behavioral/runtime/human validation.
  - Skill Creator v3.0.2 validator deve ser executado sobre os bytes finais de cada candidato; o evidence report externo deve vincular o SHA-256
    exato validado.
  - Slow-loop/Dream Cycle é especificação opcional de consolidação candidata; scheduler, storage canônico, permissões e triggers externos dependem
    do runtime e não são implementados pela LGE.
  - Validação estática não demonstra ganho comportamental, redução real de contexto, qualidade de resumption ou segurança de promoção em produção.
  - Capability contribution trace registra contribuição sustentada por refs; não demonstra causalidade sem desenho controlado apropriado.
  - Retrieval admission é especificação de integridade; efetividade real depende da qualidade/cobertura dos retrievers disponíveis e permanece
    [VERIFICAR] até execução.
  - 2.9.0 possui uso piloto recorrente reportado e probes locais vinculados ao artefato corrente; isso não equivale a behavioral/comparative independente
    nem valida automaticamente o delta 2.10.0.
  - Deterministic coordination, fresh worker context, recursive spawn controls and in-flight cancellation/quiescence depend on target-runtime
    capabilities; schema support does not prove runtime availability.
  - Anthropic Claude Code documentation is product evidence/design input, not proof that the same mechanisms improve LGE in other runtimes.
  - Skill Creator v3.0.2 static validator PASS é evidência documental; não substitui behavioral/runtime/comparative/human validation nem prova
    superioridade sobre 2.8.1.
  - BL-LGE-020/021/024..027 na 2.10.0 são especificação candidata; efetividade comportamental e runtime permanecem [VERIFICAR] até evidência do
    delta.
  - Bottleneck reassessment identifica candidato a novo limitante; não demonstra causalidade ou capacity headroom sem mensuração adequada.
  - Query-before-materialize depende das operações realmente expostas pela fonte/capability; query direta não substitui bytes/original quando
    semântica local ou auditoria exigir materialização.
  - Failure contract melhora falsificabilidade, mas não garante competência do validator nem independência epistemológica.
  - Adaptive assurance requer telemetry/sinais observáveis e authority para apertar gates; schema support não cria essas capabilities no runtime.
  - O refinamento cr_005 da candidata 2.10.1 foi avaliado estruturalmente; efetividade comportamental comparativa não foi demonstrada.
