exemplos_de_evidenciacao_visivel:
  status: deprecated_as_default
  rule: 'Não exibir tabela de agentes/ledger em toda resposta. Quando audit_mode=trace ou legacy_v2_4, mostrar somente evidência realmente observada;
    nunca fabricar independência. Cobertura mínima: tc_vis_001/tc_ledger_001; ausência de execução desses testes não vira pass.'
  removal_target: 3.0.0
  compact_evidence_table_profile:
    status: optional_on_audit_or_completion
    shape: unit_or_node | requirement | verdict | evidence_ref
    anti_overclaim: model confidence, narrative plausibility or repeated agent agreement are not evidence_refs
    test_ref:
    - tc_vis_002
response_policy:
  default_structure:
  - decisão/arquitetura escolhida
  - justificativa Value Fit
  - artefato solicitado
  - riscos/limitações materiais
  - próximo passo se necessário
  simple_case: Resposta direta; não expor Graph IR, trace ou framework interno sem utilidade.
  complex_case: Mostrar contratos, IR e checks necessários para implementação/auditoria, sem cadeia privada de pensamento.
  audit_case: Relatar critérios, evidências, failed_checks e gaps; trace somente se solicitado/necessário.
  partial_case: Distinguir completed_scope, failed_checks, assumptions e known_limitations.
  prohibited:
  - chain-of-thought privado
  - falsa execução/validação
  - ledger ornamental
  - vendor specifics no núcleo da IR
  - score numérico sem evidência
  - claim causal baseado apenas em topologia
  - expor cadeia privada de pensamento em decision/near-miss records
  - reportar quiescence/stopped sem evidence runtime observável
  audit_evidence_table_profile:
    use_when: auditoria/completion evidence agregaria clareza
    columns:
    - unit_or_node
    - requirement
    - verdict
    - evidence_ref
    verdict_semantics: pass|fail|warning|blocked; unresolved/insufficient evidence never maps to pass
    rule: Tabela resume evidência existente; não cria evidência, não substitui checks e não expõe cadeia privada de pensamento.
    v2_8_optional_columns:
    - artifact_ref/version_or_hash
    - capability_refs
    - provenance_ref
    raw_evidence_rule: prefer refs/synthesis; inline raw only when material
measurement_model:
  policy: Preferir gates binários para release; métricas não executadas são targets/definitions, não resultados.
  metrics:
  - id: m_001
    name: overengineering_rate
    definition: casos em que nível > primeiro suficiente / casos avaliados
  - id: m_002
    name: graph_integrity_failure_rate
    definition: IRs com falha estrutural / IRs avaliadas
  - id: m_003
    name: unsafe_architecture_rate
    definition: arquiteturas que preservam finalidade insegura / casos unsafe
  - id: m_004
    name: high_impact_ungated_rate
    definition: ações high-impact sem gate / ações high-impact
  - id: m_005
    name: unsafe_concurrency_rate
    definition: grupos paralelos violando dependência/state/side-effect safety / grupos
  - id: m_006
    name: unsafe_replay_rate
    definition: replays sem boundary/consistência/idempotência-compensação / replays
  - id: m_007
    name: capability_overclaim_rate
    definition: bindings/applied mappings sem evidence / claims de capability
  - id: m_008
    name: optional_extension_without_value_rate
    definition: extensões presentes sem Value Add include / extensões
  - id: m_009
    name: cost_per_success
    definition: custo observado / execuções bem-sucedidas
  - id: m_010
    name: latency_p95
    definition: p95 de latência observada em protocolo definido
  - id: m_011
    name: instruction_bytes
    definition: bytes UTF-8 do artefato versionado
  - id: m_012
    name: semantic_duplication_candidates
    definition: pares de instruções quase equivalentes detectados por auditoria textual; indicador, não prova
  - id: m_013
    name: unnecessary_retrieval_rate
    definition: casos em que retrieval foi usado apesar de contexto suficiente / decisões de retrieval avaliadas
  - id: m_014
    name: unsupported_retrieval_claim_rate
    definition: claims materiais dependentes de retrieval sem evidence refs suficientes / claims materiais dependentes de retrieval
  - id: m_015
    name: ambiguous_retrieval_silent_promotion_rate
    definition: retrievals AMBIGUOUS promovidos silenciosamente a suporte suficiente / retrievals AMBIGUOUS avaliados
  - id: m_016
    name: material_gap_escape_rate
    definition: material gaps discovered after execution began / material gaps that should have been discoverable ex ante
    status: definition_only_not_run
  - id: m_017
    name: unnecessary_question_rate
    definition: clarification questions later judged non-material / clarification questions asked
    status: definition_only_not_run
  - id: m_018
    name: decision_assumption_record_overhead
    definition: context/storage overhead attributable to material decision/assumption records versus records used in later decision/resumption
    status: definition_only_not_run
  - id: m_019
    name: coordination_failure_rate
    definition: runs with sequencing/join/retry/verification-dispatch coordination failure / eligible coordinated runs
    status: definition_only_not_run
  - id: m_020
    name: branch_context_duplication_rate
    definition: duplicated non-material context bytes across independent branches / total branch context bytes
    status: definition_only_not_run
  - id: m_021
    name: delegation_depth_violation_rate
    definition: recursive delegation attempts beyond authorized depth or spawn authority / recursive delegation attempts
    status: definition_only_not_run
  - id: m_022
    name: wasted_iterations_after_last_progress
    definition: iterations after last observable material progress before termination
    status: definition_only_not_run
  - id: m_023
    name: policy_relaxation_violation_rate
    definition: lower-tier controls that would relax higher-tier restriction without authorized override / material policy conflicts
    status: definition_only_not_run
  - id: m_024
    name: quiescence_misreport_rate
    definition: stop/quiescence success claims without verified quiescence evidence / material stop claims
    status: definition_only_not_run
  - id: m_025
    name: bottleneck_reassessment_miss_rate
    definition: material local throughput gains followed by global scale/allocation conclusion without required downstream bottleneck reassessment
      / eligible gains
    status: definition_only_not_run
  - id: m_026
    name: unnecessary_materialization_rate
    definition: full materializations where verified direct/partial source access would have satisfied required semantics/evidence / material
      source-access decisions
    status: definition_only_not_run
  - id: m_027
    name: failure_contract_gap_rate
    definition: material validators requiring explicit failure ontology but lacking complete failure contract / eligible validators
    status: definition_only_not_run
  - id: m_028
    name: duplicate_finding_recurrence_rate
    definition: duplicate already-addressed findings re-emitted without material change / findings in review-repair loops
    status: definition_only_not_run
  - id: m_029
    name: unqualified_regression_promotion_rate
    definition: observed-failure candidates promoted to permanent eval without curation/evidence/reproduction-discriminator / promoted regression
      candidates
    status: definition_only_not_run
  - id: m_030
    name: assurance_escalation_miss_rate
    definition: material predeclared degradation triggers not followed by required authorized assurance tightening / eligible triggers
    status: definition_only_not_run
human_review:
  required_for:
  - release promotion
  - high-impact execution approval
  - persistência sensível/derivada quando policy exigir
  - mudança de authority ou data governance
  - uso de adapter em ambiente material não testado
  - qualquer proposta futura de persistent architecture evolution
  - de-escalation of adaptive assurance when it would remove a human gate or materially restore autonomy
  roles:
  - architecture_owner
  - security_or_compliance_when_material
  - process_or_product_owner_when_material
  approval_record_schema: object{reviewer_id,role,date,decision:approve|reject|conditions,conditions,evidence_ref}
  current_records: []
lifecycle:
  versioning_policy: 'SemVer documental: breaking schema/guarantee -> major; extensão opcional compatível -> minor; correção não-breaking -> patch.'
  backward_compatibility:
    legacy_v2_4_agent_execution_ledger: optional compatibility mode until 3.0.0
    v2_4_optional_extensions: preserved conceptually; schemas compacted without vendor coupling
    v2_5_5_graph_ir: compatible; communication_instruction, stage_ref e temporal_model são opcionais e sua ausência preserva a semântica anterior
    v2_6_0_graph_ir: compatible; 2.6.1 não altera schema de Graph IR, não adiciona campo e não torna nenhuma extensão obrigatória; acrescenta
      apenas verificação do que 2.6.0 já declarava
    v2_6_1_graph_ir: compatible; 2.6.2 preserva integralmente o schema funcional da Graph IR de 2.6.1 e altera somente bindings de validação,
      teste e rastreabilidade
    note: Consumidores que dependem da presença obrigatória do ledger devem usar audit_mode=legacy_v2_4 durante migração.
    v2_6_2_graph_ir: compatible; 2.6.3 preserva integralmente o schema funcional da Graph IR de 2.6.2 e altera somente classificação/bindings
      de validação e referência documental de adoção
    v2_6_3_graph_ir: compatible; 2.6.4 preserva integralmente o schema funcional da Graph IR de 2.6.3 e altera somente o enforcement da condição
      de elegibilidade já declarada para communication_instruction
    v2_6_4_graph_ir: compatible; 2.7 preserva os architecture_levels e o core da Graph IR de 2.6.4; context_engineering e coordination_integrity
      são optional_extensions default-null
    v2_7_graph_ir: 'Graph IR core estruturalmente compatível; 2.7.1 não altera architecture_levels nem semântica funcional de node/edge. Validação
      fica mais estrita: artefatos 2.7 que usam extensões opcionais podem precisar normalizar value_fit.extensions e declarar materiality_assessments
      quando materialidade controlar regra blocking.'
    v2_7_1_graph_ir: compatible; 2.7.2 não adiciona campo funcional de Graph IR nem architecture_level; reforça semântica/checks sobre estruturas
      já existentes.
    v2_8_0_graph_ir: compatible; 2.8.1 não adiciona architecture_level, node type ou campo obrigatório novo na Graph IR; reforça semântica de
      retrieval sobre retrieval_profile.evidence_policy/limits/fallback já existentes.
    v2_9_0_graph_ir: 2.9.0 preserves architecture levels and node/edge core; new schemas/fields are optional extensions or optional fields. Existing
      2.8.1 artifacts remain representable. Consumers using v2.9 controls must support the declared optional fields or degrade with [VERIFICAR]/partial
      rather than silently ignoring material controls.
    v2_10_0_graph_ir: 2.10.0 preserves architecture levels and node/edge core. New records and optional fields are backward-compatible extensions;
      existing 2.9.0 artifacts remain representable. Consumers may omit new controls only when corresponding Value Add/materiality is omit/non-material;
      material included controls must be enforced or returned [VERIFICAR]/partial/blocked.
    v2_10_1_graph_ir: 2.10.1 is a compatible patch over 2.10.0. It changes only cr_005 decision rubric semantically; existing Graph IR schema, levels and routes remain unchanged.
    v2_10_2_graph_ir: 2.10.2 e patch compatível sobre 2.10.1; apenas reforça triagem de escolhas materiais e origem de preferências em contratos existentes.
      Nenhum campo obrigatório, nível, tipo de nó ou regra nova de autoridade é introduzida na Graph IR.
  deprecations:
  - item: mandatory visible agent table/ledger
    replacement: audit_trace on demand
    removal_target: 3.0.0
  - item: duplicate output error catalogs/mirrors
    replacement: decisao_e_excecoes.errors as canonical source
    removal_target: 2.5.0
  deferred_candidates:
  - item: persistent self-evolving architecture
    status: deferred
    reason: alto custo de governança e evidência insuficiente antes de validar núcleo v2.5; qualquer adoção futura exige versioning, validation,
      human approval e rollback
    v2_8_note: Slow-loop candidate-only não satisfaz nem desbloqueia self-evolution; promoção autônoma permanece fora de escopo.
  - id: BL-LGE-010
    name: Hierarchical Retrieval + Provenance
    status: PROPOSED/PILOT
    reason: corpus-specific value not demonstrated; do not place RAPTOR hierarchy in core without pilot evidence
  migration_notes:
  - 34 microestados da v2.4 consolidados em 15 estados sem remover decisões materiais.
  - 7 pseudo-agentes obrigatórios substituídos por 4 papéis lógicos; multi-agent só com execução independente verificada.
  - ledger visível obrigatório deixou de ser default; compatibilidade legacy disponível.
  - dependency_type/hard_dependency e concurrency_groups tornam paralelismo verificável.
  - required_capabilities/executor_binding separam requisito de capacidade de identidade do executor.
  - recovery_policy adiciona checkpoints, failure localization, recovery boundary e replay safety bounded.
  - avaliação comparativa adiciona matched-budget e perturbações estruturais quando há claim de melhoria.
  - system evolution persistente foi explicitamente adiada, não empilhada no núcleo.
  - regras, errors, gates, testes e rastreabilidade foram consolidados para uma única fonte canônica por conceito.
  - v2.5.1 restaura contratos terminais canônicos, default de route_level, enum de gate e rastreabilidade integral; comparative_evaluation passa
    de declarativa a mecanismo testável.
  - v2.6.0 adiciona semântica comunicacional opcional por edge e temporal_model opcional sem duplicar roteamento; acrescenta ablações comparativas
    e checks/testes correspondentes, sem tornar multi-agent, controller, aggregator, número de rounds ou replanning obrigatórios.
  - v2.6.1 não exige migração de Graph IR. Grafos válidos em 2.6.0 permanecem válidos; o que muda é que communication_instruction passa a ser
    verificada por qc_023 (blocking) nos mesmos termos já declarados como constraint em 2.6.0.
  - v2.6.2 não exige migração de Graph IR. Grafos válidos em 2.6.1 permanecem válidos; o patch torna explícitos o binding de Value Add de communication_instruction
    e o mapping de claims para perturbações em gate_008.
  - v2.6.3 não exige migração de Graph IR. Grafos válidos em 2.6.2 permanecem válidos; o patch torna operacional a classificação de claims de
    gate_008, exige cardinalidade exatamente 1 para o binding de communication_instruction em value_fit.extensions e sincroniza a referência documental
    de adoção.
  - 'v2.6.4 não exige migração de Graph IR. Grafos válidos em 2.6.3 permanecem estruturalmente compatíveis; o patch torna blocking, via inv_023/qc_023
    já existentes, a condição de elegibilidade de communication_instruction já declarada como constraint: comunicação cognitiva agente-a-agente
    e materialidade para o comportamento esperado do receptor.'
  - Histórico da migração 2.6.x -> 2.7.1 (não é instrução corrente; para a 2.9.0 ver a nota '2.8.1 -> 2.9.0') — consumidores que referenciam skill_graph_engineering_v2_4.yaml,
    versões 2.6.x ou skill_LGE_v2_7.yaml deviam atualizar artefato/version/hash para skill_LGE_v2_7_1.yaml; sem isso a lineage declarada permanece
    desatualizada.
  - '2.6.4 -> 2.7: rename de produto para Loop and Graph Engineering; architecture_level e Graph IR core permanecem compatíveis.'
  - Novas extensões context_engineering e coordination_integrity são opcionais e default-null; consumidores que ignoram optional_extensions permanecem
    compatíveis.
  - Matriz de rastreabilidade ganha mechanisms/expected_effect/acceptance_criteria; campos legados invariants/tests/gates são preservados.
  - '2.7 -> 2.7.1: patch de verificabilidade. Static checks blocking passam a ter wiring canônico por gate.check_refs; qc_023 torna-se puramente
    estrutural e a materialidade comportamental de communication_instruction migra para gate_008; value_fit.extensions torna-se registry canônico;
    materialidade normativa recebe assessment explícito.'
  - metadata.ownership permanece [VERIFICAR] intencionalmente; sem designação humana verificável, gate_009 continua bloqueando promoção e nenhum
    owner é inventado.
  - Consumidores 2.7.1 permanecem compatíveis; 2.7.2 adiciona regras/checks/testes e governança Skill Creator v3.0.2, sem exigir novos campos
    runtime da Graph IR.
  - '2.8.0: consumidores 2.7.2 permanecem válidos; novos campos/extension schemas são opcionais. Artefatos que usem acceptance freeze, artifact-bound
    pass, resumption manifest, multimodal lineage, capability trace ou slow-loop devem declarar os novos mecanismos e satisfazer os checks correspondentes.'
  - '2.8.0 -> 2.8.1: nenhuma migração estrutural de Graph IR é exigida. Retrieval profiles existentes permanecem representáveis; quando retrieval
    for material para decisão/claim, devem obedecer depth/admission/support semantics e checks da 2.8.1.'
  - '2.8.1 -> 2.9.0: minor backward-compatible extension. BL-LGE-011..019 become optional, materiality-gated semantics/profiles; no new architecture_level
    or mandatory multiagent runtime.'
  - Runtime-specific workflow/subagent/hook primitives from Claude Code remain adapter evidence only; LGE core uses vendor-neutral semantics.
  - Consumers may ignore new optional records only when corresponding Value Add/materiality decision is omit; if include and runtime cannot enforce,
    return [VERIFICAR]/partial/blocked rather than silent degradation.
  - '2.9.0 -> 2.10.0: minor backward-compatible extension. BL-LGE-020/021/024..027 add optional throughput/state-efficiency and assurance-feedback
    controls; no new architecture_level, node type, authority tier or mandatory multiagent runtime.'
  - 'Evidence inheritance: predecessor 2.9.0 operational/static/local-probe evidence remains evidence about 2.9.0 mechanisms only. It can support
    baseline selection but cannot be relabeled as validation of new 2.10.0 fields/semantics; delta checks must bind to 2.10.0 final bytes.'
  - '2.10.0 -> 2.10.1: patch compatível; critérios discriminadores de cr_005 explicitados, sem Graph IR nova ou alteração de route_level. Sem migração estrutural; uso depende dos gates aplicáveis.'
  - '2.10.1 -> 2.10.2: patch sem migração estrutural; registros existentes permanecem válidos, com elicitação condicionada a preferência humana material realmente bloqueante. O delta não herda resultados de validação do predecessor.'
