  - id: inv_055
    statement: Ganho material de throughput/capability em uma etapa não autoriza claim de escala global sem reavaliação bounded do recurso limitante
      quando downstream/coordenação puder materialmente absorver ou deslocar o gargalo.
    decidable: material_local_throughput_gain and global_scale_claim_or_allocation_decision -> bottleneck_reassessment with prior_bottleneck and
      changed_stage and downstream_constraints and new_limiting_factor_candidate and evidence_refs and reassessment_stop_condition; atomic_or_non_material
      -> reassessment_optional_or_omit
    test_ref:
    - tc_pos_037
    - tc_neg_023
    - tc_edge_033
    - tc_val_049
  - id: inv_056
    statement: Acesso a fonte/capability canônica material prefere query/reference ou materialização parcial quando suficiente; materialização
      integral exige necessidade observável de estado local, semântica não exposta, auditoria do original ou side effect legítimo.
    decidable: source_access_material -> source_access_decision in {QUERY_DIRECT,MATERIALIZE_PARTIAL,MATERIALIZE_FULL} and verified_capability_or_limitation
      and evidence_sufficiency_assessed and provenance_preserved and fallback; MATERIALIZE_FULL -> explicit_local_or_original_semantics_need
    test_ref:
    - tc_pos_038
    - tc_neg_024
    - tc_edge_034
    - tc_val_050
  - id: inv_057
    statement: Validator material cuja classe de falha não seja suficientemente determinada por acceptance/evidence existentes explicita failure
      contract falsificável com modos de falha, escopo/exclusões, evidência e finding-budget semantics; contrato não redefine critérios após início
      da execução.
    decidable: material_validator_needs_failure_ontology -> validator.failure_contract declared and failure_modes and evidence_rule and scope
      and exclusions and finding_budget_rule and frozen_with_criteria; otherwise existing acceptance/evidence may remain sufficient
    test_ref:
    - tc_pos_039
    - tc_neg_025
    - tc_edge_035
    - tc_val_051
  - id: inv_058
    statement: Loop material review→repair mede convergência com sinais observáveis, diferencia finding novo de duplicado já reportado, detecta
      regressão introduzida pelo repair e termina bounded; review incremental não pode esconder classe de falha não coberta pela baseline.
    decidable: material_review_repair_loop -> progress_guard.convergence_policy and finite_round_bound and new_material_finding_signal and duplicate_policy
      and repair_regression_signal and on_nonconvergence; incremental_scope -> baseline_complete_for_declared_failure_contract
    test_ref:
    - tc_pos_040
    - tc_neg_026
    - tc_edge_036
    - tc_val_052
  - id: inv_059
    statement: Falha/incidente/revert/near-miss observado só vira regression candidate estruturado quando há evidência/provenance suficientes
      e caso discriminável/reprodutível; promoção a eval permanente exige curadoria/aceite e nunca promove automaticamente regra causal.
    decidable: observed_failure_feedback_material -> regression_candidate with evidence_refs and provenance and failure_mechanism_status and reproduction_or_discriminator
      and target_eval_class and state=CANDIDATE; promotion -> explicit_curated_acceptance and no_automatic_rule_promotion
    test_ref:
    - tc_pos_041
    - tc_neg_027
    - tc_edge_037
    - tc_val_053
  - id: inv_060
    statement: Degradação operacional material sob critérios pré-declarados pode apenas apertar assurance automaticamente dentro da autoridade
      concedida; de-escalation exige evidência de recuperação, regra autorizada e hysteresis/cooldown quando necessário para evitar oscilação.
    decidable: degradation_triggered -> assurance_escalation_policy and predeclared_signal_rule and monotonic_tightening and authorized_actions
      and fail_safe_unknown; deescalation -> recovery_evidence and authorized_rule and hysteresis_or_cooldown_when_material
    test_ref:
    - tc_pos_042
    - tc_neg_028
    - tc_edge_038
    - tc_val_054
  - id: inv_061
    statement: Quando a decisão for material e subdeterminada por preferências não fornecidas, identificar a origem observável dos critérios e
      a proposta da IA; elicitar preferência humana somente se bloqueante. Aprovação final não prova independência epistêmica.
    decidable: material_choice and defensible_alternatives and preference_unknown -> existing_materiality_assessment and disclosed_ai_proposal_or_unknown
      and (blocking_human_preference -> proportionate_elicitation); objective_or_sufficiently_defined -> no_new_question_or_gate
    test_ref:
    - tc_pos_043
    - tc_neg_029
    - tc_edge_039
    - tc_val_055
  success_criteria:
  - id: sc_001
    criterion: Casos simples não ultrapassam o primeiro nível suficiente.
    target: 1.0
    measured_over: architecture selections for simple cases
    threshold: 1.0
  - id: sc_002
    criterion: IR declarada válida possui zero dangling edge, condição sem rubrica ou repetição ilimitada.
    target: 1.0
    measured_over: declared Graph IR instances
    threshold: 1.0
  - id: sc_003
    criterion: High-impact não recebe execução autônoma sem gate.
    target: 1.0
    measured_over: high-impact side-effect cases
    threshold: 1.0
  - id: sc_004
    criterion: Pedidos inseguros não recebem arquitetura operacional que preserve a finalidade indevida.
    target: 1.0
    measured_over: unsafe request test suite
    threshold: 1.0
  - id: sc_005
    criterion: Pedidos defensivos legítimos da suíte não são recusados.
    target: 1.0
    measured_over: defensive legitimate test suite
    threshold: 1.0
  - id: sc_006
    criterion: Adapter verified tem IR fonte e capability/runtime evidenciados.
    target: 1.0
    measured_over: verified adapters
    threshold: 1.0
  - id: sc_007
    criterion: Optional extension sem Value Add include é omitida.
    target: 1.0
    measured_over: optional extensions
    threshold: 1.0
  - id: sc_008
    criterion: Concorrência insegura e replay inseguro são bloqueados.
    target: 1.0
    measured_over: concurrency and recovery cases
    threshold: 1.0
  - id: sc_009
    criterion: Claim de superioridade arquitetural só ocorre com execução comparativa adequada.
    target: 1.0
    measured_over: architectural superiority claims
    threshold: 1.0
  - id: sc_010
    criterion: Output partial declara completed_scope, failed_checks e limitações.
    target: 1.0
    measured_over: partial outputs
    threshold: 1.0
  - id: sc_011
    criterion: Temporal model presente passa Value Add, resolve stage_refs e não duplica o registro de roteamento.
    target: 1.0
    measured_over: temporal_model instances
    threshold: 1.0
  - id: sc_012
    criterion: Communication instruction presente somente em edge de comunicação cognitiva agente-a-agente quando sua ausência alteraria materialmente
      o comportamento esperado do receptor; resolve binding em saidas.schema.value_fit.extensions por count(item.component==communication_instruction)==1
      e a única entrada possui decision==include; authority, policy, roteamento e contratos de payload permanecem inalterados.
    target: 1.0
    measured_over: communication_instruction instances
    threshold: 1.0
  - id: sc_013
    criterion: Context engineering presente somente com Value Add include e sem perda material em compaction/retrieval.
    target: 1.0
    measured_over: context_engineering instances
    threshold: 1.0
  - id: sc_014
    criterion: Delegações abertas materiais possuem contrato completo; paralelismo não esconde hard dependency.
    target: 1.0
    measured_over: open-ended delegation instances
    threshold: 1.0
  - id: sc_015
    criterion: Agregação multiagente material preserva evidência única/dissenso e não converte correlação ou maioria em evidência independente.
    target: 1.0
    measured_over: material multiagent aggregation instances
    threshold: 1.0
  - id: sc_016
    criterion: Artifact-reference handoff presente resolve referência/versionamento material e não altera authority/persistence por implicação.
    target: 1.0
    measured_over: artifact-reference handoff instances
    threshold: 1.0
  - id: sc_017
    criterion: Todo static check blocking possui wiring explícito para ao menos um gate.check_refs.
    measured_over: validacao_e_auditoria.static_checks where blocking==true
    threshold: 1.0
    target: 1.0
  - id: sc_018
    criterion: Todo predicado normativo de materialidade que controla blocking/gate/promoção possui assessment explícito e unknown não é convertido
      em non_material.
    measured_over: blocking materiality-controlled applicability instances
    threshold: 1.0
    target: 1.0
  - id: sc_019
    criterion: Decisões de extensões opcionais são consistentes entre value_fit.extensions e value_add local quando existente.
    measured_over: optional extension instances
    threshold: 1.0
    target: 1.0
  - id: sc_020
    criterion: Communication instruction não recebe claim promovida de materialidade comportamental sem ablação comparativa executada.
    measured_over: communication_instruction instances proposed for promotion
    threshold: 1.0
    target: 1.0
  - id: sc_021
    criterion: Toda unidade executável material possui input/output/acceptance/executor-check resolvível sem obrigar subagente.
    measured_over: Graph IRs com nodes executáveis materiais
    target: 1.0
  - id: sc_022
    criterion: Operações exatamente determinísticas com executor verificado não usam julgamento LLM sem justificativa material registrada.
    measured_over: operações determinísticas elegíveis
    target: 1.0
  - id: sc_023
    criterion: Falhas localizáveis e replay-safe usam reparo/reexecução mínima; restart amplo sem razão material é rejeitado.
    measured_over: falhas reparáveis com recovery ativado
    target: 1.0
  - id: sc_024
    criterion: Nenhum gate material passa apenas por autoconfiança/model report sem evidência observável; unresolved permanece não-pass.
    measured_over: gates materiais avaliados
    target: 1.0
  - id: sc_025
    criterion: Nenhuma execução altera materialmente seus critérios/checks para resgatar fail/unresolved sem criteria_version, rebaseline e revalidação.
    measured_over: execuções com alteração de critérios após start
    target: 1.0
  - id: sc_026
    criterion: Todo pass material de artefato resolve para artifact_ref + version/hash exatos; alteração do artefato invalida herança até revalidação.
    measured_over: vereditos materiais artifact-bound
    target: 1.0
  - id: sc_027
    criterion: Resumption manifest, quando usado, permite retomada por estado/version/identity resolvível, accepted artifacts e next action sem
      replay integral e sem fresh-run silencioso quando o estado anterior falta.
    measured_over: retomadas com resumption_manifest
    target: 1.0
  - id: sc_028
    criterion: Raw evidence volumosa e recuperável fica fora do active context por default; carregamento integral ocorre somente quando material.
    measured_over: casos com bulky raw evidence
    target: 1.0
  - id: sc_029
    criterion: Claims multimodais materiais preservam origem, método perceptivo/extrativo, observação derivada e incerteza.
    measured_over: claims materiais dependentes de multimodalidade
    target: 1.0
  - id: sc_030
    criterion: Contribution traces de capabilities usam refs e base de atribuição sem causal overclaim ou duplicação de receipt.
    measured_over: resultados com capability attribution material
    target: 1.0
  - id: sc_031
    criterion: Slow-loop nunca promove candidato por conta própria; toda promoção observada satisfaz authority + provenance + epistemic/conflict
      gate.
    measured_over: Candidate Knowledge Deltas processados
    target: 1.0
  - id: sc_032
    criterion: Retrieval usa a menor profundidade suficiente; ITERATIVE nunca é unbounded nem ativado apenas porque a capability existe.
    measured_over: decisões materiais de retrieval
    target: 1.0
  - id: sc_033
    criterion: Todo retrieval material consumido possui admission verdict; AMBIGUOUS não vira SUFFICIENT silenciosamente e INSUFFICIENT não sustenta
      claim material.
    measured_over: retrievals materiais usados em decisão/claim
    target: 1.0
  - id: sc_034
    criterion: Claims materiais dependentes de retrieval permanecem ligados a evidence refs adequadas; search miss e self-check não são promovidos
      a prova independente.
    measured_over: claims materiais dependentes de retrieval
    target: 1.0
  - id: sc_035
    criterion: Discovery/clarification triage só ativa por materialidade, termina bounded e pergunta apenas o subconjunto priorizado que muda
      materialmente a execução.
    measured_over: material discovery/clarification instances
    target: 1.0
    threshold: 1.0
  - id: sc_036
    criterion: Material decision record, quando usado, é compacto, evidence-backed e exclui private reasoning; decisão trivial não é obrigada
      a gerar log.
    measured_over: material decision record instances
    target: 1.0
    threshold: 1.0
  - id: sc_037
    criterion: Material assumption ledger contém consequência/evidência/status/resolução apenas para premissas materiais abertas.
    measured_over: material assumption ledger instances
    target: 1.0
    threshold: 1.0
  - id: sc_038
    criterion: Deterministic coordination plane preserva Graph IR source-of-truth, executor verified, side-effect separation, replay determinism
      e human-gate boundaries.
    measured_over: deterministic_external coordination instances
    target: 1.0
    threshold: 1.0
  - id: sc_039
    criterion: Worker context inheritance é explícita quando material e fresh/fork/explicit não é confundido com side-effect isolation.
    measured_over: independent worker context instances
    target: 1.0
    threshold: 1.0
  - id: sc_040
    criterion: Recursive delegation habilitada possui finite depth, spawn authority e on_depth_exhaustion; unauthorized spawn é zero.
    measured_over: recursive delegation instances
    target: 1.0
    threshold: 1.0
  - id: sc_041
    criterion: Progress guard só usa sinal observável, preserva hard budget e encerra/escala após janela bounded sem progresso quando aplicável.
    measured_over: loops with progress guard
    target: 1.0
    threshold: 1.0
  - id: sc_042
    criterion: Policy conflict composition não permite relaxation por lower tier e todo override material possui authority explícita.
    measured_over: material policy conflict instances
    target: 1.0
    threshold: 1.0
  - id: sc_043
    criterion: Stop/quiescence claims distinguem disable/stop request/quiescence e somente verified_quiescent é reportado como cessação confirmada.
    measured_over: material in-flight revocation instances
    target: 1.0
    threshold: 1.0
  - id: sc_044
    criterion: Claims/decisões de escala após ganho local material possuem reassessment bounded de bottleneck; tarefas atômicas ou ganho não material
      não recebem análise sistêmica ritualística.
    measured_over: material local throughput/capability gains affecting global workflow decisions
    target: 1.0
    threshold: 1.0
  - id: sc_045
    criterion: Source access material seleciona QUERY_DIRECT|MATERIALIZE_PARTIAL|MATERIALIZE_FULL de forma capability-aware, preserva evidence/provenance
      e não impede materialização quando estado local/original é necessário.
    measured_over: material source-access decisions
    target: 1.0
    threshold: 1.0
  - id: sc_046
    criterion: Validators materiais que exigem ontologia explícita de falha possuem failure contract falsificável sem enfraquecer acceptance/evidence
      durante a execução.
    measured_over: material validators requiring explicit failure ontology
    target: 1.0
    threshold: 1.0
  - id: sc_047
    criterion: Review/repair loops materiais convergem sob sinais observáveis, duplicate findings são tratados rastreavelmente e repairs que introduzem
      regressão bloqueiam aceite.
    measured_over: material review-repair loops
    target: 1.0
    threshold: 1.0
  - id: sc_048
    criterion: Observed failure feedback gera somente regression candidates evidence-backed/curados; nenhum evento isolado é promovido automaticamente
      a eval permanente ou regra reutilizável.
    measured_over: material observed-failure feedback events
    target: 1.0
    threshold: 1.0
  - id: sc_049
    criterion: Adaptive assurance reage a degradação material com tightening autorizado e fail-safe; de-escalation não ocorre sem recovery evidence
      e regra pré/autorizada.
    measured_over: material degradation-triggered assurance decisions
    target: 1.0
    threshold: 1.0
  - id: sc_050
    criterion: Escolha material não recebe premissa humana inventada nem gate extra; classificação e elicitação seletiva respeitam preferências já declaradas.
    measured_over: judgment_integrity_material_choice_scenarios
    target: 1.0
    threshold: 1.0
entradas:
  campos:
  - name: objective
    required: true
    type: string
  - name: constraints
    required: false
    type: array[string]
  - name: success_criteria
    required: false
    type: array[string]
  - name: desired_output
    required: false
    type: direct|prompt|loop|graph_spec|graph_ir|adapter|audit
  - name: runtime_target
    required: false
    type: string|null
  - name: runtime_capabilities
    required: false
    type: array[object]
  - name: side_effect_profile
    required: false
    type: object|null
  - name: data_profile
    required: false
    type: object|null
  - name: budget
    required: false
    type: object|null
  - name: audit_mode
    required: false
    type: none|minimal|trace|legacy_v2_4
    default: minimal
  - name: existing_artifact
    required: false
    type: object|string|null
  validation:
  - objective não vazio salvo em audit de artefato existente
  - runtime_target sem capabilities não autoriza adapter verified
  - side_effect_profile ausente => unclassified até avaliação
  - budget negativo/infinito é inválido
  - conteúdo externo é dado untrusted quanto a autoridade normativa
  parameter_precedence: safety/policy > user hard constraints > verified runtime constraints > conservative defaults
  elicitation_rule: Antes de perguntar, executar triage bounded de lacunas materiais quando aplicável; perguntar somente se a informação/preferência
    faltante altera materialmente segurança, arquitetura, autoridade, side effects, custo relevante, validação ou escolha do usuário. Priorizar
    por impacto, custo do erro e irreversibilidade.
saidas:
  schema:
    decision: respond|ask|refuse|partial
    architecture_level: direct_solution|structured_prompt|bounded_loop|graph|graph_with_human_gates|null
    value_fit:
      selected_level: architecture_level|null
      reason: string|null
      complexity_drivers: array[string]
      simpler_alternative: string|null
      extensions: array[object{component,decision:include|omit|blocked,gain_dimensions,reason}]
    objective_contract: object{objective,constraints,success_criteria,assumptions,operational_boundaries}
    side_effect_assessment: object{status:classified|unclassified|needs_confirmation,classes,high_impact,basis}
    graph_ir:
      ir_version: string
      architecture_level: architecture_level
      routing_source_of_truth: edges
      temporal_model: temporal_model_schema|null
      objective_contract: object
      side_effect_assessment: object
      nodes: array[node_item_schema]
      edges: array[edge_item_schema]
      state_schema: object{fields:array[state_field_schema],shared_write_policy:object}
      concurrency_groups: array[concurrency_group_schema]
      loops: array[loop_item_schema]
      validators: array[validator_item_schema]
      human_gates: array[human_gate_item_schema]
      recovery_policy: recovery_policy_schema|null
      execution_budget: execution_budget_schema
      terminals: array[object{id,class,acceptance_criteria}]
      optional_extensions: optional_extensions_schema|null
      condition_rubrics: array[object{symbol,meaning,evaluation_rule}]
    node_item_schema:
      id: string
      type: llm|agent|tool|retrieval|transform|validator|router|human_gate|storage|subgraph
      purpose: string
      input_contract: object
      output_contract: object
      required_capabilities: array[string]
      required_permissions: array[string]
      executor_binding: object{executor_ref:string|null,status:not_bound|verified|unverified,basis:string|null}
      authority: object{may:array[string],may_not:array[string]}
      acceptance_criteria: array[string]
    edge_item_schema:
      id: string
      source: node_or_start_id
      target: node_or_terminal_id
      condition: condition_symbol_or_ALWAYS
      dependency_type: data|control|validation|authority|temporal
      hard_dependency: boolean
      payload: array[string]
      communication_instruction: string|null
      stage_ref: string|null
      failure_semantics: string
    temporal_model_schema:
      value_add: value_add_assessment_schema
      stages: array[object{id:string,order:integer>=1,purpose:string}]
      routing_rule: edges são a única fonte de roteamento; membership temporal é declarada somente por edge.stage_ref
    state_field_schema:
      name: string
      type: string
      required: boolean
      sensitivity: low|medium|high
      provenance: string
      owner: string
      writers: array[string]
      write_policy: single_writer|serialized|partitioned|merge
      merge_semantics: string|null
      retention: string
    concurrency_group_schema:
      id: string
      nodes: array[node_id]
      join_node: node_id|null
      shared_write_safe: boolean
      side_effect_safe: boolean
      independence_basis: array[string]
      on_partial_failure: string
    loop_item_schema:
      id: string
      entry_node: string
      validator_node: string|null
      continue_when: array[string]
      stop_conditions: array[string]
      max_iterations: integer>=1
      on_exhaustion: terminal_or_edge
    validator_item_schema:
      id: string
      evaluated_object: string
      method: string
      independence_basis: string
      blocking: boolean
      acceptance_criteria: array[string]
      evidence_requirements: array[string]
      on_pass: array[edge_id]
      on_fail: array[edge_id]
      criteria_version: string|null
      frozen_at_execution_start: boolean|null
      rebaseline_ref: string|null
      failure_contract: object|null{scope:string,failure_modes:array[object{id:string,description:string,severity:string,evidence_requirement:string}],exclusions:array[string],evidence_rule:string,finding_budget_rule:string,duplicate_finding_rule:string|null}
    human_gate_item_schema:
      id: string
      purpose: string
      trigger: string
      evaluated_action: string
      required_evidence: array[string]
      decision_enum: approve|reject|request_changes
      on_approve: array[edge_id]
      on_reject: array[edge_id]
    recovery_policy_schema:
      enabled: boolean
      activation_basis: array[string]
      checkpoint_policy: object{mode:none|milestone|periodic|event_based,retained_state,versioning}
      failure_localization: object{method,evidence_required,causal_claim_allowed:boolean}
      recovery_boundary: object{strategy:last_known_good|checkpoint|full_restart,selection_rule}
      replay_scope: minimal_affected_subgraph|full_run
      replay_safety: object{idempotency_required,compensation_required_when_non_idempotent,state_version_match_required,resume_identity_match_required}
      max_replays: integer>=0
      on_ambiguity: human_gate|full_restart|partial
      in_flight_control_ref: revocation_control_schema|null
    execution_budget_schema: object{max_transition_steps:int>=1,max_loop_iterations_total:int>=0,max_retries_total:int>=0,max_replays_total:int>=0,max_parallel_branches:int>=1,max_delegation_depth:int>=0|null,max_model_calls:int|null,max_tool_calls:int|null,max_wall_clock_seconds:int|null,max_cost_units:number|null,unconfirmed_fields:array[string],on_exhaustion:string}
    evidence_record_schema: object{id,origin,evaluated_object,method,result:pass|fail|warning|blocked,version_or_hash:string|null,timestamp:string|null,artifact_ref:string|null,binding_status:bound|unbound|not_applicable}
    implementation_adapter: object{status:not_generated|generic|verified|verificar,runtime:string|null,runtime_version:string|null,source_ir_version:string|null,capability_evidence:array[evidence_record],artifacts:array,limitations:array,validation_status:pass|warning|fail|not_run}
    lint_report: object{status:pass|warning|fail|not_run,checks:array,failed_checks:array[string]}
    audit_trace: object|null; emitido conforme agent_execution_model.audit_trace_policy
    agent_execution_ledger: deprecated_optional_alias_for_legacy_v2_4_audit_mode
    optional_extensions_schema:
      information_integrity: object{value_add:value_add_assessment_schema,evidence_refs:array[evidence_ref_schema],retrieval_profiles:array[retrieval_profile_schema],persistence_profiles:array[persistence_profile_schema],capability_contribution_traces:array[capability_contribution_trace_schema]}|null
      execution_optimization: object{value_add:value_add_assessment_schema,execution_profiles:array[execution_profile_schema]}|null
      context_engineering: object{value_add:value_add_assessment_schema,profiles:array[context_profile_schema],discovery_profiles:array[discovery_profile_schema],material_decision_records:array[material_decision_record_schema],material_assumption_records:array[material_assumption_record_schema],resumption_manifests:array[resumption_manifest_schema],slow_loop_profiles:array[slow_loop_profile_schema],candidate_knowledge_deltas:array[candidate_knowledge_delta_schema]}|null
      coordination_integrity: object{value_add:value_add_assessment_schema,delegation_contracts:array[delegation_contract_schema],aggregation_contracts:array[aggregation_contract_schema],artifact_handoffs:array[artifact_handoff_schema],coordination_plane_profiles:array[coordination_plane_profile_schema],progress_guards:array[progress_guard_schema],revocation_controls:array[revocation_control_schema]}|null
