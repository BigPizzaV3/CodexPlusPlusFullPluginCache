kind: ai_skill
language: pt-BR
metadata:
  name: Loop and Graph Engineering
  slug: loop-and-graph-engineering
  version: 2.10.2
  status: implementation_candidate
  created_at: '2026-08-29'
  updated_at: '2026-10-27'
  conforms_to_template: skill_skill_creator_v302.yaml#canonical_skill_spec_template@3.0.0
  template_conformance_status: '[VERIFICAR]'
  domain: Arquitetura de loops e grafos com LLMs, agentes, tools, contexto, estado, validação e orquestração
  description: Projetar a menor arquitetura verificável e runtime-agnostic para objetivos com LLMs, tools, loops, estado e orquestração; controlar
    autoridade, contexto, evidência, recuperação e coordenação bounded; e, quando material, governar migração de gargalos, query-before-materialize,
    contratos explícitos de falha de validators, convergência review→repair, feedback de falhas observadas para regressions e escalada adaptativa
    de assurance sem criar arquitetura paralela nem elevar autoridade.
  authoring_basis:
    evolved_from: skill_LGE_v2_10_1.yaml@2.10.1
    predecessor_sha256: 5efee8e381bced5c69daa0e8d6cc79c4390c5ce4b84be189c839ec4bfc5b3f27
    method: judgment_integrity_material_choice_compatible_patch_over_v2_10_1
    external_evidence:
    - id: ext_ge_2026
      source: Feng et al., Graph Engineering in the Era of LLM Agents, arXiv:2608.21156v2
      authority: evidence_not_normative
      incorporated:
      - capability-aware assignment
      - explicit concurrency semantics
      - runtime state recovery
      - matched-budget/structural evaluation
      not_incorporated:
      - mandatory multi-agent architecture
      - unrestricted persistent self-evolution
    - id: ext_reactnet_2026
      source: Tieu et al., Inference-Time Graph Engineering for Multi-Agent LLM Workflows, arXiv:2609.05774v1
      authority: evidence_not_normative
      incorporated:
      - optional edge-level communication semantics
      - optional temporal workflow stages without duplicate routing registry
      - comparative perturbations for communication semantics and temporal depth/topology
      not_incorporated:
      - mandatory multi-agent architecture
      - mandatory controller or final aggregator
      - fixed reasoning-round count
      - mandatory online graph replanning
    - id: ext_anthropic_multiagent_research_2025
      source: Anthropic, How we built our multi-agent research system, 2025-06-13
      authority: evidence_not_normative
      incorporated:
      - multi-agent only when parallelization/context/tool breadth materially justify coordination cost
      - delegation contracts with clear scope and expected outputs
      - matched-budget caution for claims of multi-agent improvement
      not_incorporated:
      - mandatory multi-agent architecture
      - fixed number of subagents
      - vendor-specific orchestration
    - id: ext_anthropic_context_engineering
      source: Anthropic, Effective context engineering for AI agents
      authority: evidence_not_normative
      incorporated:
      - minimum sufficient active context
      - just-in-time retrieval and progressive disclosure
      - compaction/structured notes with preservation of material provenance
      not_incorporated:
      - mandatory persistent memory
      - vendor-specific context implementation
    - id: ext_anthropic_multiagent_patterns_2026
      source: Anthropic, Patterns and problems in emerging multiagent systems, 2026-08-13
      authority: evidence_not_normative
      incorporated:
      - correlated-agent error risk
      - consensus is not evidence
      - preservation of unique evidence and dissent during aggregation
      - epistemic independence as distinct from execution independence
      not_incorporated:
      - majority voting as default validator
      - agent count as proxy for epistemic diversity
    - id: ext_anthropic_projects_2026
      source: 'Claude by Anthropic, Projects redesigned: from folder to conversation, 2026-09-17'
      authority: product_evidence_not_normative
      incorporated:
      - artifact-reference handoff and durable project artifacts as optional coordination pattern
      - coordinator/worker pattern only when Value Add justifies
      not_incorporated:
      - Claude-specific project/thread semantics
      - mandatory coordinator
      - mandatory shared project memory
    - id: ext_bounded_graph_prompt_2026
      source: 'User-provided research-note image: Karpathy-inspired bounded graph prompt / agent graphs (2026-10-09)'
      authority: design_input_not_normative
      incorporated:
      - execution-unit contract over existing node input/output/acceptance/executor structures
      - deterministic-first executor selection when an exact operation has a verified deterministic implementation
      - localized repair using existing recovery boundary and minimal affected subgraph
      - compact evidence table for audit-facing completion evidence
      - 'learning-promotion discipline: accepted result is observation, not automatically a reusable verified rule'
      not_incorporated:
      - mandatory graph for every task
      - node equals subagent as an invariant
      - fixed retry count of three for every workflow
      - absolute prohibition on multiple nodes touching the same file regardless of ownership/merge semantics
      - model self-confidence as sufficient gate evidence
      - accepted result automatically proves a reusable rule
    - id: project_notion_dream_cycle_2026_10_11
      source: DIGGIA Knowledge System / Notion — rotina canônica e backlog LGE; atualização autorizada em 2026-10-11
      authority: project_design_input_not_normative
      incorporated:
      - acceptance integrity / check freeze
      - evidence-artifact binding
      - resumption manifest
      - raw evidence off active context
      - multimodal evidence provenance
      - capability contribution trace
      - slow-loop consolidation / Candidate Knowledge Delta
      not_incorporated:
      - automatic canonical-memory rewrite
      - autonomous self-modification of executable skills
      - automatic promotion of recurrent observations to verified rules
      - mandatory scheduled dreaming inside LGE runtime
    - id: ext_adaptive_rag_2024
      source: 'Jeong et al., Adaptive-RAG: Learning to Adapt Retrieval-Augmented Large Language Models through Question Complexity, NAACL 2024'
      authority: evidence_not_normative
      incorporated:
      - proportional choice among no retrieval, single-step retrieval and iterative retrieval
      - retrieval depth selected by task need rather than capability availability alone
      not_incorporated:
      - mandatory learned complexity classifier
      - dataset-specific routing labels
    - id: ext_crag_2024
      source: Yan et al., Corrective Retrieval Augmented Generation, arXiv:2401.15884, 2024
      authority: evidence_not_normative
      incorporated:
      - explicit assessment of retrieved evidence quality before use in generation/decision
      - corrective action when retrieved evidence is ambiguous or insufficient
      not_incorporated:
      - mandatory web search fallback
      - fixed confidence estimator architecture
    - id: ext_self_rag_2024
      source: 'Asai et al., Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection, ICLR 2024'
      authority: evidence_not_normative
      incorporated:
      - retrieval only when needed
      - explicit relevance/support check for retrieved evidence and generated claims
      not_incorporated:
      - reflection-token training/runtime mechanism
      - self-critique treated as independent validation evidence
    - id: ext_raptor_2024
      source: 'Sarthi et al., RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval, ICLR 2024'
      authority: evidence_not_normative
      incorporated:
      - none in core 2.8.1; retained as pilot candidate for long-corpus hierarchical retrieval
      not_incorporated:
      - mandatory hierarchical retrieval tree in LGE core
      - summary nodes replacing canonical source evidence
    - id: ext_least_to_most_2023
      source: Zhou et al., Least-to-Most Prompting Enables Complex Reasoning in Large Language Models, ICLR 2023
      authority: evidence_not_normative
      incorporated:
      - none as a new mechanism; proportional decomposition is already covered by first-sufficient architecture and dependency modeling
      not_incorporated:
      - mandatory least-to-most prompt decomposition for every task
    - id: ext_claude_dynamic_workflows_2026_10_11
      source: Anthropic Claude Code Docs — Orchestrate subagents at scale with dynamic workflows, https://code.claude.com/docs/en/workflows (reviewed
        2026-10-11)
      authority: product_evidence_not_normative
      incorporated:
      - separate semantic/reasoning plan from deterministic coordination plane when Value Add and verified runtime justify
      - 'control-plane/side-effect-plane separation: orchestration coordinates while execution units own filesystem/shell/external side effects'
      - 'replay determinism: material nondeterminism is explicit input rather than hidden orchestration state'
      - human-gate boundaries across workflow stages
      - progress/stagnation stop conditions in addition to hard budgets when progress is observable
      - representative-slice preflight before large fan-out when cost/quality are materially uncertain
      - fail-closed resume when prior execution state cannot be resolved
      - distinguish disabling future launches from stopping/quiescing in-flight execution
      not_incorporated:
      - JavaScript as required orchestration language
      - Workflow tool or ultracode as LGE core primitive
      - Claude-specific numeric agent/token limits, prompt-cache staggering or retry counts
      - Claude-specific replay ordering as superior to LGE minimal-affected-subgraph recovery
    - id: ext_claude_subagents_2026_10_11
      source: Anthropic Claude Code Docs — Create custom subagents, https://code.claude.com/docs/en/sub-agents (reviewed 2026-10-11)
      authority: product_evidence_not_normative
      incorporated:
      - fresh isolated worker context as a supported execution pattern; fork/inherited context is explicit exception
      - recursive delegation depth is distinct from concurrency breadth
      - spawn authority/capability can be withheld from selected workers
      - per-worker capability/permission scoping supports least privilege
      not_incorporated:
      - fixed nesting depth
      - Claude-specific subagent file/frontmatter conventions
      - mandatory subagent per graph node
    - id: ext_claude_hooks_2026_10_11
      source: Anthropic Claude Code Docs — Hooks reference, https://code.claude.com/docs/en/hooks (reviewed 2026-10-11)
      authority: product_evidence_not_normative
      incorporated:
      - 'monotonic policy composition: lower-authority allow cannot silently relax a stronger deny/ask/gate'
      - explicit composition precedence when multiple controls return conflicting decisions
      not_incorporated:
      - Claude-specific allow|deny|ask|defer enum as universal LGE decision domain
      - hook-specific runtime/configuration surface
    - id: ext_claude_agent_coordination_2026_10_11
      source: Anthropic Claude Code Docs — Agent Teams, Cross-session messaging, Worktrees (reviewed 2026-10-11)
      authority: product_evidence_not_normative
      incorporated:
      - atomic claim/lease retained as conditional adapter/runtime pattern for shared work pools
      - message admission/backpressure retained as conditional adapter/runtime pattern for mailbox systems
      - context isolation does not imply side-effect isolation
      not_incorporated:
      - shared task list as mandatory LGE coordination model
      - worktree as mandatory isolation mechanism
      - mailbox runtime in LGE core
    - id: project_notion_backlog_lge_2026_10_11_round3
      source: DIGGIA Knowledge System / Notion — Backlog de evolução — LGE / Problem Solver, BL-LGE-011..019
      authority: project_design_input_not_normative
      incorporated:
      - BL-LGE-011 Discovery & Clarification Triage
      - BL-LGE-012 Material Decision Record & Near-Miss
      - BL-LGE-013 Material Assumption Ledger
      - BL-LGE-014 Deterministic Coordination Plane
      - BL-LGE-015 Branch-Local Context Isolation
      - BL-LGE-016 Recursive Delegation Budget & Spawn Authority
      - BL-LGE-017 Progress / Stagnation Guard
      - BL-LGE-018 Monotonic Policy Decision Composition
      - BL-LGE-019 In-Flight Revocation & Quiescence Semantics
      not_incorporated:
      - BL-LGE-010 Hierarchical Retrieval + Provenance remains pilot/deferred
      - mandatory dashboard/kanban runtime
      - fixed question count, mandatory quiz or no-code-until-all-questions rule
    - id: ext_anthropic_source_control_2026_10_13
      source: Anthropic Engineering — Redesigning source control at Anthropic, 2026-10-13 (registered in project backlog)
      authority: engineering_case_study_not_normative
      incorporated:
      - reassess downstream bottlenecks after material throughput/capability gains
      - prefer direct canonical-source query/reference when full state materialization adds no material value
      not_incorporated:
      - vendor-specific source-control architecture as LGE core
      - claim that local throughput gain proves global workflow scaling
    - id: ext_anthropic_code_review_2026_10_15
      source: Addy Osmani, Morgan Westlee Lunt, Qing Wang — How the Claude Code team does code review, 2026-10-15
      authority: engineering_case_study_not_normative
      incorporated:
      - explicit domain-specific validator failure contracts and evidence requirements
      - review-repair convergence as observable system property rather than reviewer recall alone
      - observed failure/incident to curated regression-eval feedback loop
      - adaptive assurance escalation when predeclared operational degradation signals trigger
      not_incorporated:
      - agent voting as independent epistemic evidence
      - zero-human approval as generic LGE objective
      - automatic risk classifier authority without false-negative evaluation and safe fallback
      - vendor-specific merge/release implementation as universal capability
    - id: project_notion_backlog_lge_2026_10_17_round4
      source: DIGGIA Knowledge System / Notion — Backlog de evolução — LGE / Problem Solver, BL-LGE-020/021/024..027
      authority: project_design_input_not_normative
      incorporated:
      - BL-LGE-020 Bottleneck Migration Assessment
      - BL-LGE-021 Query-before-Materialize
      - BL-LGE-024 Validator Failure Contract
      - BL-LGE-025 Review/Repair Convergence Policy
      - BL-LGE-026 Observed Failure → Regression Eval Loop
      - BL-LGE-027 Adaptive Assurance Escalation / Circuit Breaker
      not_incorporated:
      - BL-LGE-010 Hierarchical Retrieval + Provenance remains pilot/deferred
      - BL-LGE-022/023 as separate functional mechanisms because they were merged into existing controls
    v2_5_design_rule: 'Refatorar antes de adicionar: cada regra deve ter fonte canônica única; extensões só entram após Value Add Gate.'
    v2_6_delta_rule: Aumentar expressividade somente onde houver gap representacional material; semântica comunicacional e temporalidade permanecem
      opcionais, subordinadas a authority/policy e empiricamente falsificáveis antes de qualquer promoção normativa.
    v2_6_1_delta_rule: 'Fechar assimetria de enforcement introduzida pelo delta 2.6.0: nenhuma capability nova, nenhum campo novo em Graph IR;
      apenas invariante, critério, check estático, regra condicional e wiring de gate para mecanismo já declarado em 2.6.0.'
    refactor_review:
      executed_for: 2.7.1
      rule_applied: v2_5_design_rule + skill_skill_creator_v210 traceability/validator discipline
      accepted_repairs:
      - gate.check_refs como wiring canônico e verificável entre static checks e gates
      - materiality_policy canônica com assessment explícito quando materialidade controla regra blocking
      - communication_instruction separada em elegibilidade estrutural estática e materialidade comportamental comparativa
      - value_fit.extensions como registro canônico de decisão de extensões, com local value_add apenas como espelho detalhado
      - cobertura explícita de visible evidence, legacy ledger e formato YAML/version mirror
      reused_instead_of_duplicated:
      - gate_008 comparative_evaluation para ablação de communication_instruction
      - value_add_policy e value_fit.extensions como governança de extensão
      - qc_028/matriz_rastreabilidade para cobertura requisito->mecanismo->aceite->teste->gate
      - audit_trace e legacy_v2_4 compatibility mode existentes
      rejected_changes:
      - novo architecture_level ou novo gate conceitual apenas para communication_instruction
      - transformar predicados estruturais auto-resolvíveis em condition_rubrics desnecessárias
      - tratar ausência de evidência comportamental como pass ou fail de lint
      - atribuir ownership sem designação humana verificável
      - reintroduzir tipos históricos de teste quando não houver requisito vivo correspondente
      result: 2.7.1 corrige verificabilidade/wiring mantendo Graph IR core e capacidades da 2.7; campos novos são metadados/assessments opcionais
        de validação, não semântica nova de runtime.
    v2_7_delta_rule: 'Adicionar somente controles que cubram nova classe de falha ou melhorem falsificabilidade/rastreabilidade: contexto ativo
      mínimo suficiente, contratos de delegação, agregação epistemicamente íntegra e handoff por referência de artefato. Manter tudo opcional
      sob Value Add Gate e sem promover arquitetura multiagente como padrão.'
    v2_7_refactor_review:
      executed_for: '2.7'
      rule_applied: v2_5_design_rule + skill_skill_creator_v210 traceability discipline
      included:
      - context engineering opcional com minimum-sufficient-context, retrieval just-in-time/progressive disclosure e compaction com preservação
      - delegation contracts para trabalho aberto quando coordenação multiagente é material
      - epistemic aggregation policy que preserva evidência única, proveniência, incerteza e dissenso
      - artifact-reference handoff como semântica opcional sem duplicar storage/persistence governance
      - comparative perturbations para claims de multiagente, diversidade, contexto e agregação sob budget comparável
      - rastreabilidade requisito -> mecanismo -> efeito -> aceite -> teste -> gate
      rejected:
      - coordinator obrigatório
      - shared memory obrigatória
      - multiagente como arquitetura superior por default
      - número fixo de agentes ou rounds
      - novo artifact node obrigatório no Graph IR
      - consenso/maioria como substituto de evidência
      - persistência indiscriminada do contexto
      result: Delta restrito a extensões opcionais, invariantes, checks, testes, perturbações comparativas e rastreabilidade; nenhum novo architecture_level,
        nenhum runtime/vendor binding e nenhuma elevação automática de autoridade.
    v2_7_1_delta_rule: 'Patch corretivo não-breaking: separar validação estática de validação comportamental, tornar materialidade e bindings
      de Value Add verificáveis, conectar todo static check blocking a gate explícito e restaurar cobertura dos requisitos vivos de audit/format,
      sem novo architecture_level, runtime binding ou elevação de autoridade.'
