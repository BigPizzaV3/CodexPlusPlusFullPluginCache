  semantics:
    respond: entrega sustentada
    ask: lacuna material bloqueante; encerra turno após pergunta mínima
    refuse: finalidade insegura; pode oferecer alternativa segura
    partial: entrega somente escopo verificado e declara bloqueios
    execution_unit_contract: execution unit reutiliza node_item_schema.input_contract/output_contract/acceptance_criteria/executor_binding e,
      quando check material for necessário, validator/evidence path; não cria novo node type nem implica subagente.
    deterministic_first: execution_profile.determinism_preference orienta seleção; operação exata usa executor determinístico verificado quando
      possível, sem promover capability não observada.
    localized_repair: recovery_policy.failure_localization + replay_scope controlam retorno ao menor subgrafo afetado; full restart é exceção
      justificada.
    learning_promotion: resultado aceito é observação; regra/derived_knowledge verified exige persistence_profile com lineage/evidence e promotion
      validation.
    acceptance_integrity: criteria/check set material é versionado/congelado por execução; alteração pós-start cria rebaseline e exige revalidação.
    evidence_artifact_binding: veredito material artifact-bound referencia artifact_ref + version_or_hash exatos; modificação posterior invalida
      herança do pass.
    resumption_manifest: continuidade longa usa estado compacto/referenciado quando Value Add incluir; replay integral da conversa não é requisito.
    raw_evidence_off_context: raw evidence volumosa permanece por referência fora do active context quando recuperável; carga integral é just-in-time
      quando material.
    multimodal_provenance: evidence_ref pode preservar original→percepção/extração→observação derivada→claim, sem confundir percepção com fato
      externo.
    capability_contribution_trace: trace liga resultado a capability/evidence refs como contribuição observada/suporte; causalidade exige evidência
      adicional.
    slow_loop_consolidation: slow-loop seleciona contexto persistido/evidência mínimo suficiente e emite Candidate Knowledge Delta; candidate-only
      por default e promoção exige autoridade/gate.
    adaptive_retrieval: retrieval_profile existente expressa depth NONE|SINGLE|ITERATIVE em evidence_policy/limits/fallback; capability disponível
      não força retrieval e ITERATIVE é bounded.
    retrieval_admission: retrieval material é classificado SUFFICIENT|AMBIGUOUS|INSUFFICIENT antes do consumo decisório; AMBIGUOUS exige discriminação
      bounded e INSUFFICIENT não sustenta claim material.
    retrieval_claim_support: evidence_ref/evidence_record ligam claim material às fontes recuperadas adequadas; self-check não é validação independente
      e search miss não prova ausência enquanto houver canal material elegível.
    discovery_clarification_triage: bounded discovery explicita knowns/material_unknowns/unknown_unknown_domains somente quando material; perguntas
      são priorizadas por impacto/custo do erro/irreversibilidade e reduzidas ao mínimo suficiente.
    material_decision_record: registra chosen option e alternativas materiais/rejection summary/near-miss quando útil à rastreabilidade; nunca
      cadeia privada de pensamento.
    material_assumption_ledger: registra somente premissas materiais abertas com consequência se falsas, evidência necessária, status e resolução.
    deterministic_coordination_plane: Graph IR permanece source of truth; executor determinístico verificado pode coordenar sequencing/joins/retries/progress
      sem assumir side effects das execution units.
    branch_context_isolation: worker independente pode iniciar com fresh context; fork/herança é explícita; minimum-sufficient branch context
      é política LGE quando Value Add justificar.
    recursive_delegation_control: delegation depth e spawn authority são bounded e independentes de concurrency breadth.
    progress_stagnation_guard: loop material pode parar por ausência observável de progresso além de hard budget; self-confidence/no-tool-use
      isolado não é progress evidence universal.
    monotonic_policy_composition: resolver conflitos primeiro por authority/precedence tier e, dentro do mesmo tier, conservadoramente; allow
      inferior não relaxa deny/block/human_gate superior.
    in_flight_revocation: disable future execution, stop request e verified quiescence são estados distintos; claim stopped exige evidence ref
      observável.
    resume_fail_closed: resume sem state/version/execution identity resolvível não vira fresh run silenciosamente; bloquear/ask/partial conforme
      materialidade.
    bottleneck_migration_assessment: Ganho local material aciona reassessment bounded apenas quando decisão/claim global depende do recurso limitante;
      novo gargalo permanece candidate até evidência adequada.
    query_before_materialize: Preferir query/reference na fonte canônica quando capability verificada e resposta/evidência forem suficientes;
      materializar somente o mínimo necessário para semântica local, original audit, escrita ou side effect legítimo.
    validator_failure_contract: Acceptance/evidence existentes continuam canônicos; failure_contract opcional torna explícitos modos de falha,
      exclusões, evidência e budget sem redefinir critérios pós-start.
    review_repair_convergence: Convergência é observada por rounds, findings materiais novos, duplicação e regressões introduzidas; duplicate
      suppression é rastreável e não substitui coverage do failure contract.
    failure_to_regression_feedback: Observed failure produz candidate eval, não regra; promoção exige curadoria, provenance, evidence e caso reproduzível/discriminador.
    adaptive_assurance_escalation: Sinais pré-declarados de degradação podem apertar controles dentro da autoridade; unknown falha para o lado
      seguro e de-escalation exige recovery evidence + regra autorizada.
  required_sections_by_decision:
    respond:
    - decision
    - architecture_level
    - value_fit
    - next_action
    ask:
    - decision
    - next_action
    refuse:
    - decision
    - safety_note
    - next_action
    partial:
    - decision
    - completed_scope
    - failed_checks
    - known_limitations
    - next_action
  conditional_rules:
  - architecture_level in {graph,graph_with_human_gates} and desired_output in {graph_spec,graph_ir,adapter} -> graph_ir != null; graph_spec may
    be derived from graph_ir
  - adapter.status==verified -> graph_ir != null and source_ir_version==graph_ir.ir_version and capability_evidence sufficient
  - recovery_policy.enabled -> Value Add include and bounded replay safety
  - concurrency_groups nonempty -> each group passes concurrency safety
  - temporal_model present -> canonical_extension_decision(temporal_model)==include and temporal_model.value_add.decision mirrors canonical decision
    and stage_ref integrity holds
  - communication_instruction present -> source/target resolve to nodes with type in {llm,agent} and count(value_fit.extensions, item.component==communication_instruction)==1
    and canonical decision==include and materiality_assessment exists for edge.communication_instruction; authority/policy/routing/payload contracts
    unchanged. Behavioral materiality is not a lint predicate and requires gate_008 ablation before promotion.
  - audit_trace visible -> audit_mode in {trace,legacy_v2_4} or remediation/release evidence requires it
  - context_engineering present -> canonical_extension_decision(context_engineering)==include and context_engineering.value_add.decision mirrors
    canonical decision and inv_024 holds
  - delegation_contracts nonempty -> canonical_extension_decision(coordination_integrity)==include and coordination_integrity.value_add.decision
    mirrors canonical decision and inv_025 holds
  - aggregation_contracts nonempty -> canonical_extension_decision(coordination_integrity)==include and coordination_integrity.value_add.decision
    mirrors canonical decision and inv_026 holds
  - artifact_handoffs nonempty -> canonical_extension_decision(coordination_integrity)==include and coordination_integrity.value_add.decision
    mirrors canonical decision and inv_027 holds
  - optional_component present -> exactly_one(value_fit.extensions[component]) and canonical decision==include; local value_add, when present,
    mirrors canonical decision
  - blocking applicability determined by material/materially -> matching materiality_assessment exists; missing assessment -> unknown, never implicit
    non_material
  - material execution node -> usar input_contract + output_contract + acceptance_criteria + executor_binding; check material deve resolver para
    validator/evidence path
  - exact deterministic operation + verified deterministic executor + no semantic judgment -> prefer deterministic executor; otherwise record
    exception/limitation
  - repairable localized failure + replay safe -> minimal_affected_subgraph; ambiguous/unsafe localization -> broader restart/human gate/partial
    conforme recovery policy
  - accepted result -> observation by default; promotion to verified reusable rule only under information_integrity/persistence promotion policy
  - execution_started + material criteria/check change -> increment/new criteria_version + rebaseline + revalidation; never retroactive pass rescue
  - material artifact verdict -> evidence_record.artifact_ref + version_or_hash + binding_status=bound; artifact changed -> inherited pass invalid
  - long workflow resumption + Value Add include -> optional resumption_manifest; do not require full conversation replay
  - bulky raw evidence + safe retrievability -> keep by reference off active context; fetch raw only just-in-time when material
  - material multimodal claim -> multimodal_lineage required in supporting evidence_ref
  - material capability attribution -> capability_contribution_trace; contribution trace alone never proves causality
  - slow_loop enabled -> canonical_extension_decision(context_engineering)==include and output candidate_knowledge_delta only; promotion requires
    explicit authority/persistence gate
  - material retrieval decision -> canonical_extension_decision(information_integrity)==include and retrieval depth is NONE|SINGLE|ITERATIVE;
    capability availability alone never forces retrieval
  - retrieval depth==ITERATIVE -> retrieval_profile.limits declares finite bound + stop conditions + on_exhaustion
  - material retrieval consumed -> retrieval_profile.evidence_policy records admission verdict SUFFICIENT|AMBIGUOUS|INSUFFICIENT and basis/evidence
    refs; AMBIGUOUS requires discriminating evidence or bounded continuation; INSUFFICIENT cannot support material claim
  - material claim depends on retrieval -> supporting evidence_refs resolve and claim support is checked; self-check/reflection alone is not independent
    evidence; search miss with remaining eligible material channel cannot support absence claim
  - material discovery/clarification needed -> canonical_extension_decision(context_engineering)==include and discovery_profile bounded; ask only
    blocking/material prioritized subset
  - material decision record present -> context_engineering include and private_reasoning_excluded==true
  - material assumption record present -> context_engineering include and materiality_assessment_ref resolves to material|unknown; unknown cannot
    silently promote the dependent decision
  - coordination plane deterministic_external -> coordination_integrity include + Graph IR/source version + verified executor + side_effects_in_execution_units
  - independent worker context material -> context_profile inheritance_mode explicit; fork requires justification; context isolation never implies
    side-effect isolation
  - recursive delegation enabled -> finite max_delegation_depth + bounded spawn_authority + on_depth_exhaustion
  - progress guard enabled -> observable progress_signal + finite stagnation window + hard budget preserved
  - policy conflict material -> authority tier first + monotonic safe composition; lower-tier allow cannot relax higher-tier restriction
  - in-flight revocation material -> revocation_control; quiescence claim requires verified runtime evidence
  - resume requested but prior state/version/identity unresolved -> block/ask/partial; never silently reinterpret as fresh run
  - material local throughput/capability gain + global scaling claim/allocation decision -> bottleneck_reassessment_schema; non_material/atomic
    -> omit
  - material canonical-source access -> context_profile.source_access_decision; QUERY_DIRECT requires verified capability + sufficient evidence,
    MATERIALIZE_FULL requires explicit local/original semantics need
  - material validator with unresolved failure ontology -> validator.failure_contract; criteria freeze/acceptance integrity remain authoritative
  - material review-repair loop -> progress_guard.convergence_policy + finite bound; incremental delta review requires baseline coverage for declared
    failure contract
  - material observed failure feedback -> evaluation_feedback.regression_candidates; candidate promotion requires curated acceptance and evidence/provenance
  - material degradation-driven assurance -> assurance_escalation_policy; escalation may tighten only within authority; de-escalation requires
    recovery evidence and authorized rule
  errors_source_of_truth: decisao_e_excecoes.errors
fluxo_execucao:
  start_state: intake
  execution_control_state:
    architecture_repair_attempts:
      initial: 0
      max: 1
    adapter_repair_attempts:
      initial: 0
      max: 1
    replay_attempts:
      initial: 0
      max_from: graph_ir.recovery_policy.max_replays
  condition_rubrics:
  - id: cr_001
    symbol: unsafe_request
    true_when: finalidade coincide com unsafe_use_patterns e não há enquadramento defensivo permitido
  - id: cr_002
    symbol: skill_needed
    true_when: trigger aplicável e non_trigger não vence
  - id: cr_003
    symbol: context_sufficient
    true_when: após discovery bounded quando material, nenhuma lacuna material exige decisão do usuário; unknown-unknown domains plausíveis foram
      avaliados apenas até o ponto em que aprofundar dificilmente mudaria arquitetura/resultado/risco/validação
    false_when: existe lacuna material bloqueante ou escolha do usuário que não pode ser conservadoramente assumida; múltiplas perguntas candidatas
      são priorizadas por impacto, custo do erro e irreversibilidade
    evaluation_mode: semantic_with_bounded_discovery_when_material
  - id: cr_004
    symbol: side_effects_classified
    true_when: classes/impact podem ser determinados sem suposição material
  - id: cr_005
    symbol: selected_level
    domain:
    - direct_solution
    - structured_prompt
    - bounded_loop
    - graph
    - graph_with_human_gates
    rule: >-
      Selecionar o primeiro nível suficiente na ordem canônica,
      considerando objetivo, desired_output, restrições, condições de aceite,
      riscos, capacidades verificadas e Value Fit. Não adotar arquitetura
      superior somente porque disponível, mais detalhada ou mencionada em fonte.
      direct_solution: uma solução ou operação atômica atende à demanda, sem
      instruções procedimentais, estado coordenado ou repetição operacional.
      structured_prompt: a entrega exige procedimento instrucional reutilizável,
      suficiente sem controle operacional de iteração ou estado compartilhado.
      bounded_loop: repetição operacional necessária, com stop condition,
      hard budget finito e on_exhaustion; não basta existir lista de etapas.
      graph: dependências, decisões condicionais, estado/ownership,
      sincronização, coordenação ou contrato explícito de Graph IR são
      requisitos materiais que os níveis anteriores não atendem adequadamente.
      graph_with_human_gates: graph é necessário E ao menos uma ação desse
      fluxo exige gate humano pré-execução; tema de alto impacto em análise
      read-only não basta para escolher este nível. Gates aplicáveis a fluxos
      mínimos são preservados em design_minimal, sem exigir grafo.
      Se faltar informação material para decidir, seguir a rota de
      ask/partial prevista no fluxo; nunca preencher como favorável.
      Registrar sucintamente o nível escolhido, o requisito que exclui o
      imediatamente inferior quando material e evidência/assunções relevantes,
      sem expor cadeia privada de pensamento. Seleção não é maximização de score.
  - id: cr_006
    symbol: ir_valid
    true_when: blocking_checks da IR passam
  - id: cr_007
    symbol: repair_available
    true_when: failed_checks reparáveis e architecture_repair_attempts < max
  - id: cr_008
    symbol: adapter_requested
    true_when: desired_output==adapter ou usuário pede runtime mapping
  - id: cr_009
    symbol: runtime_verified
    true_when: runtime/version/capabilities materiais possuem evidência suficiente
  - id: cr_010
    symbol: adapter_valid
    true_when: adapter checks passam
  - id: cr_011
    symbol: adapter_repair_available
    true_when: falha reparável e adapter_repair_attempts < max
  - id: cr_012
    symbol: recovery_justified
    true_when: Value Add include e execução possui custo/estado/side effects que tornam recuperação parcial material
  states:
  - id: intake
    action: screen safety, activation, input e contexto nesta ordem; quando material, executar discovery bounded de knowns/material_unknowns/unknown_unknown_domains
      antes de avaliar cr_003; não adicionar fase obrigatória para tarefa atômica
    branches:
    - next: terminal_refusal
      condition: cr_001 == TRUE
    - next: terminal_no_skill_needed
      condition: cr_001 == FALSE and cr_002 == FALSE
    - next: terminal_ask_user
      condition: cr_001 == FALSE and cr_002 == TRUE and cr_003 == FALSE
    default_branch:
      condition: nenhuma das anteriores
      next: assess_side_effects
  - id: assess_side_effects
    action: classificar side effects sem converter ausência em none
    branches:
    - next: terminal_ask_user
      condition: cr_004 == FALSE
    default_branch:
      condition: nenhuma das anteriores
      next: assess_value_fit
  - id: assess_value_fit
    action: selecionar primeiro architecture_level suficiente e avaliar extensões separadamente, incluindo contexto ativo e coordenação somente
      quando houver nova classe de falha/ganho material
    next:
    - route_level
  - id: route_level
    branches:
    - next: design_minimal
      condition: cr_005 in {direct_solution,structured_prompt,bounded_loop}
    - next: design_graph_ir_candidate
      condition: cr_005 in {graph,graph_with_human_gates}
    default_branch:
      condition: nenhuma das anteriores
      next: terminal_partial
      reason: selected_level fora do enum canônico
  - id: design_minimal
    action: definir solução/loop mínimo, budgets e gates se aplicáveis
    next:
    - finalize
  - id: design_graph_ir_candidate
    action: definir nodes, typed edges, communication_instruction quando material, temporal_model quando Value Add justificar, state ownership,
      capability requirements, concurrency, loops, validators, human gates e recovery; quando material, declarar context_engineering e coordination_integrity
      sem duplicar authority/persistence; retrieval material usa policy adaptativa/admission quando aplicável
    next:
    - validate_graph_ir
  - id: validate_graph_ir
    action: lint estrutural, authority/state/concurrency/recovery/value-add checks e, quando presentes, context/retrieval-admission/delegation/aggregation/artifact-handoff
      checks
    branches:
    - next: route_adapter
      condition: cr_006 == TRUE
    - next: repair_graph_ir
      condition: cr_006 == FALSE and cr_007 == TRUE
    default_branch:
      condition: nenhuma das anteriores
      next: terminal_partial
  - id: repair_graph_ir
    action: corrigir somente failed_checks; incrementar architecture_repair_attempts
    next:
    - validate_graph_ir
  - id: route_adapter
    branches:
    - next: assess_runtime
      condition: cr_008 == TRUE
    default_branch:
      condition: nenhuma das anteriores
      next: finalize
  - id: assess_runtime
    branches:
    - next: generate_adapter
      condition: cr_009 == TRUE
    default_branch:
      condition: nenhuma das anteriores
      next: finalize_generic
  - id: generate_adapter
    action: mapear IR para runtime sem alterar sem registro a IR fonte
    next:
    - validate_adapter
  - id: validate_adapter
    branches:
    - next: finalize
      condition: cr_010 == TRUE
    - next: repair_adapter
      condition: cr_010 == FALSE and cr_011 == TRUE
    default_branch:
      condition: nenhuma das anteriores
      next: terminal_partial
  - id: repair_adapter
    action: corrigir adapter; incrementar adapter_repair_attempts
    next:
    - validate_adapter
  - id: finalize_generic
    action: entregar IR genérica e marcar adapter verificar/not_generated
    next:
    - finalize
  - id: finalize
    action: emitir resposta proporcional; audit trace apenas quando política exigir
    next:
    - terminal_success
  terminal_states:
  - id: terminal_success
    terminal_class: success
    decision: respond
    entry_condition: Artefato solicitado satisfaz checks aplicáveis e não há bloqueio material remanescente.
    safe_action: Entregar somente claims e artefatos sustentados; preservar [VERIFICAR] onde capability/evidência não foi confirmada.
    exit_criterion: Saída entregue com decision=respond.
  - id: terminal_ask_user
    terminal_class: partial
    decision: ask
    entry_condition: Lacuna material depende de escolha/confirmação do usuário e elicitação é o próximo passo seguro.
    safe_action: Perguntar somente o mínimo bloqueante e não emitir arquitetura final.
    exit_criterion: Usuário fornece o contexto necessário ou altera o pedido.
  - id: terminal_refusal
    terminal_class: refusal
    decision: refuse
    entry_condition: unsafe_request == true.
    safe_action: Recusar a parte insegura e, quando possível, oferecer alternativa defensiva/sanitizada.
    exit_criterion: Pedido é reformulado para finalidade legítima.
  - id: terminal_partial
    terminal_class: partial
    decision: partial
    entry_condition: Entrada, dependência, validação, budget ou recovery bloqueia conclusão segura.
    safe_action: Entregar apenas completed_scope, failed_checks e limitações sem fabricar pass, execução ou aprovação.
    exit_criterion: Bloqueio é resolvido ou o artefato é corrigido/reexecutado.
  - id: terminal_no_skill_needed
    terminal_class: success
    decision: respond
    mode: no_skill_needed
    entry_condition: skill_needed == false após triagem de segurança.
    safe_action: Responder diretamente sem Graph IR, adapter ou arquitetura ornamental.
    exit_criterion: Resposta simples entregue.
  transition_policy: Se condição não puder ser sustentada, usar branch conservador (ask/partial) e não inferir pass.
  default_transition_policy:
    action: BLOCK
    preserve_current_state: true
    return_reason: true
decisao_e_excecoes:
  precedence:
  - safety
  - epistemic_integrity
  - user_objective_and_hard_constraints
  - runtime_verified_constraints
  - value_add
  - quality
  - efficiency
  errors:
  - id: ERR_UNSAFE_PURPOSE
    detect: intake
    action: refuse
  - id: ERR_INPUT_BLOCKING
    detect: intake
    action: ask_or_partial
  - id: ERR_SIDE_EFFECT_UNCLASSIFIED
    detect: assess_side_effects
    action: ask
  - id: ERR_OVERENGINEERING
    detect: assess_value_fit
    action: downgrade_to_first_sufficient
  - id: ERR_IR_INVALID
    detect: validate_graph_ir
    action: bounded_repair_or_partial
  - id: ERR_UNBOUNDED_EXECUTION
    detect: validate_graph_ir
    action: block
  - id: ERR_STATE_WRITE_UNSAFE
    detect: validate_graph_ir
    action: serialize_partition_or_block
  - id: ERR_CONCURRENCY_UNSAFE
    detect: validate_graph_ir
    action: remove_parallelism_or_block
  - id: ERR_VALIDATOR_INDEPENDENCE
    detect: validate_graph_ir
    action: downgrade_validation_claim_or_require_independent_basis
  - id: ERR_RECOVERY_UNSAFE
    detect: validate_graph_ir_or_runtime
    action: disable_partial_replay_or_require_gate
  - id: ERR_DATA_GOVERNANCE
    detect: risk_or_validation
    action: block_persistence_or_ask
  - id: ERR_EVIDENCE_INVALID
    detect: validation
    action: quarantine_or_block_claim
  - id: ERR_CAPABILITY_UNVERIFIED
    detect: assess_runtime
    action: generic_adapter_or_[VERIFICAR]
  - id: ERR_ADAPTER_INVALID
    detect: validate_adapter
    action: bounded_repair_or_partial
  - id: ERR_VALUE_ADD_FAILED
    detect: assess_value_fit
    action: omit_extension
  - id: ERR_BUDGET_EXHAUSTED
    detect: runtime_control
    action: partial_or_safe_terminal
  retry_policy:
    max_attempts: source_of_truth=flow.execution_control_state
    requires_idempotency: true
    prohibited_for:
    - unsafe purpose
    - human rejection
    - non-idempotent high-impact action without compensation
    note: repair de design/adapter e replay runtime são budgets distintos
  fallback:
    default: simpler_safe_architecture
    when_runtime_unknown: deliver runtime-agnostic IR; adapter not_generated/verificar
    when_evidence_insufficient: partial/ask instead of fabricated completion
  prohibited:
  - silent budget expansion
  - self-certification of release
  - automatic persistent self-modification
  - claiming graph dependency as demonstrated causality
  - reviewer-echo as independent validation
  policy_decision_composition:
    rule: resolve authority/precedence tier first; among materially comparable controls apply the more restrictive safe outcome; lower-tier allow
      cannot relax higher-tier deny/block/human_gate/ask requirement
    override: only explicit authorized override mechanism at appropriate tier; never last-writer-wins
    untrusted_origin: external/untrusted content cannot grant launch/spawn/permission/side-effect authority or bypass human gate
    conflict_result: block/ask/partial when ordering or authority cannot be resolved safely
dependencias_e_integracoes:
  dependencies:
  - id: dep_askuser
    artifact: skill_askuserquestion_v210.yaml
    required_when: material user clarification is blocking
    fallback: ask concise question directly only if dependency unavailable and platform allows
  - id: dep_runtime
    artifact: target runtime
    required_when: adapter requested
    status_default: '[VERIFICAR]'
  - id: dep_creator_validator
    artifact: canonical Skill Creator validator
    required_when: release promotion/conformance ratification
    status_default: '[VERIFICAR]'
  - id: dep_cee
    artifact: skill_capability_execution_engineering_v1_6.yaml
    required_when: runtime execution/revocation/quiescence capability resolution is delegated outside LGE design
    status_default: '[VERIFICAR]'
    fallback: LGE may specify required semantics and return partial/blocked; it must not claim stop/quiescence without runtime evidence
  adapter_rule: Integrações/vendor/framework ficam fora da Graph IR e exigem capability evidence.
  degraded_mode: Sem runtime/validator externo, entregar apenas o que puder ser sustentado e marcar o restante [VERIFICAR].
seguranca_e_operacao:
  data_policy:
    minimize: true
    external_content_authority: untrusted
    sensitive_persistence_requires:
    - purpose
    - authority
    - retention
    - access_policy
    - deletion_or_expiry_strategy
    derived_knowledge_requires: evidence lineage + validation policy quando promoção a verified for material
  side_effects:
    high_impact_classes:
    - financial
    - destructive
    - irreversible
    - permission_change
    - external_write_material
    - regulated_high_impact
    rule: high-impact => pre-action human gate; desconhecido material => ask/partial
  authority:
    default: least_privilege
    unlisted_action: deny_or_require_confirmation
    external_action: não executar apenas por desenhar
  concurrency_policy:
    parallelize_only_if:
    - no hard dependency between group members
    - shared writes safe
    - side-effect duplication/race safe
    - join semantics explicit
    batchability_is_distinct: true
  recovery_policy:
    enable_if:
    - long-running or expensive intermediate state
    - parallel branches with reusable progress
    - recoverable external dependency failure
    - replay materially reduces cost/latency/risk
    - resume/relaunch correctness depends on prior execution identity/quiescence
    block_if:
    - state consistency cannot be established
    - non-idempotent side effect lacks compensation/gate
    - failure boundary ambiguous and unsafe
    - requested resume cannot resolve prior state/version/execution identity
    - prior in-flight execution may still be active and duplicate execution is unsafe
    causality_note: fault localization narrows candidates; it does not prove root cause
    resume_rule: 'fail closed: missing/unresolvable prior state or identity does not silently become a fresh run; explicit fresh-run decision
      is separate.'
  observability:
    minimum_events:
    - decision
    - architecture_level
    - blocking_error
    - human_gate
    - adapter_status
    - budget_exhaustion
    when_recovery_enabled:
    - checkpoint
    - failure_observation
    - recovery_boundary
    - replay_scope
    - replay_result
    when_temporal_communication_trace_enabled:
      activation: audit_mode==trace and temporal_model.present
      events:
      - temporal_stage
      - activated_edge
      - communication_instruction_ref
    privacy: logs follow same minimization/retention policy as state
    when_context_coordination_enabled:
      activation: context_engineering.present or coordination_integrity.present
      events:
      - context_retrieval_or_compaction
      - retrieval_admission_verdict
      - delegation_contract
      - aggregation_dissent
      - artifact_handoff
  context_policy:
    activation: somente quando contexto ativo é material para qualidade/custo/continuidade e Value Add include
    principle: minimum_sufficient_context
    allowed_strategies:
    - direct
    - just_in_time_retrieval
    - progressive_disclosure
    - structured_notes
    - compaction
    - hybrid
    - raw_evidence_by_reference
    rules:
    - persistent_state != active_context
    - carregar referência/dado somente quando relevante à decisão corrente
    - compaction preserva fatos materiais não resolvidos, decisões relevantes, proveniência e uncertainty
    - contexto sensível segue minimização e access policy existentes
    - raw logs/traces/outputs volumosos permanecem fora do active context por referência quando safely retrievable; carregar integralmente apenas
      sob materialidade
    - retomada pode usar resumption_manifest compacto com provenance refs; replay integral de conversa não é fonte de verdade
    - slow-loop usa minimum_sufficient_context e não ganha autoridade de promoção por executar consolidação
  retrieval_policy:
    activation: quando lacuna informacional material existir e information_integrity tiver Value Add include; disponibilidade de capability não
      é gatilho suficiente
    depth_enum: NONE|SINGLE|ITERATIVE
    selection_rule: escolher a menor profundidade suficiente; NONE quando contexto ativo basta, SINGLE para lacuna dirigida, ITERATIVE apenas
      quando nova recuperação puder discriminar hipótese/elevar suficiência
    existing_schema_binding:
      depth_and_basis: retrieval_profile.evidence_policy
      bounded_iteration: retrieval_profile.limits
      alternate_channels_and_exhaustion: retrieval_profile.fallback
      supporting_sources: evidence_ref_schema + evidence_record_schema
    iterative_requirements:
    - finite max retrieval rounds/tool calls conforme budget aplicável
    - explicit stop conditions
    - explicit on_exhaustion
    admission:
      verdicts:
      - SUFFICIENT
      - AMBIGUOUS
      - INSUFFICIENT
      rules:
      - SUFFICIENT pode sustentar uso decisório apenas dentro do escopo efetivamente suportado pelas evidence refs
      - AMBIGUOUS exige evidência discriminadora, qualificação explícita ou encerramento bounded sem promoção silenciosa
      - INSUFFICIENT não sustenta conclusão material
      - self-check/reflection do mesmo executor pode sinalizar risco, mas não é evidência independente
      - search miss não prova ausência quando existir outro canal material elegível e não examinado
  coordination_integrity_policy:
    activation: quando múltiplas unidades independentes contribuem para trabalho/decisão material
    delegation_rule: trabalho aberto exige contrato de delegação; tarefa simples/determinística não ganha subagente por ornamentação
    aggregation_rules:
    - consensus_is_not_evidence
    - shared_source_duplicates_do_not_create_independence
    - unique_material_evidence_survives_aggregation
    - material_dissent_is_preserved_or_explicitly_resolved_with_evidence
    artifact_handoff_rule: artifact_reference reduz retransmissão somente quando Value Add justificar; armazenamento/retention/access permanecem
      nas fontes canônicas existentes
  slow_loop_policy:
    activation: somente quando Value Add incluir consolidação fora do caminho crítico e houver escopo/proveniência suficientes
    input_policy: selecionar apenas registros persistidos/evidence refs diretamente relacionados ao escopo
    output_authority: candidate_only
    promotion_rule: canonical write/promotion exige autoridade externa válida + persistence validation + conflict/supersession handling
    prohibitions:
    - automatic canonical-memory rewrite
    - automatic reusable-rule promotion
    - executable skill self-modification
    - silent conflict merge
    - treat search miss as proof of absence
    no_material_delta: não persistir candidato artificial; responder NO_MATERIAL_DELTA
  discovery_decision_hygiene_policy:
    activation: somente quando ausência de informação, decisão reconstruível ou premissa aberta puder mudar materialmente decisão, execução, risco
      ou validação
    discovery:
      bounded: true
      fields:
      - knowns
      - material_unknowns
      - unknown_unknown_domains
      - clarification_candidates
      priority: impact_on_architecture_or_outcome > cost_of_error > irreversibility; ties use least-friction sufficient question
      atomic_task_rule: omit when context is already sufficient and further discovery has low expected decision value
    decision_record: material-only; chosen option + material alternatives + rejection summary + near_miss only when it changes auditability; private
      chain-of-thought excluded
    assumption_ledger: material-only; record consequence_if_false/evidence_needed/status/resolution; do not log every assumption or every turn
    context_rule: prefer refs and compact records; load full evidence only when material
  coordination_control_policy:
    activation: coordination_integrity Value Add include and graph/loop complexity creates material coordination risk or cost
    deterministic_plane:
      allowed_when: verified deterministic executor + source Graph IR/version + responsibilities limited to mechanical control
      graph_ir_source_of_truth: true
      side_effect_rule: control plane does not gain execution-unit side-effect authority
      nondeterminism_rule: material replay nondeterminism is explicit input or [VERIFICAR], not hidden state
      human_gate_rule: material human gate is a workflow boundary; deterministic orchestration cannot silently cross it
      progressive_scale_up: large fan-out with uncertain unit cost/quality -> representative_slice -> observe -> scale_up, unless sufficient evidence
        makes preflight redundant
    branch_context:
      independent_worker_default_when_material: fresh_or_explicit
      fork_rule: fork/inherited context must be explicit and justified; fresh context support does not imply all runtimes provide it
      minimum_sufficient_rule: send only branch-relevant context + authorized shared refs when sufficient
      side_effect_isolation_note: context isolation never proves filesystem/network/state isolation
    recursive_delegation:
      requires:
      - finite max_delegation_depth when enabled
      - explicit spawn_authority
      - on_depth_exhaustion
      breadth_distinct_from_depth: true
      default_spawn_authority: none unless contract/policy grants bounded spawn
      least_privilege: child capability/permission scope cannot exceed delegated authority without new gate/authorization
    progress_guard:
      hard_budget_always_preserved: true
      use_when: progress can be operationalized by observable state/evidence
      examples:
      - failed_checks decreasing
      - new independent findings
      - unresolved_items decreasing
      - state/acceptance coverage advancing
      prohibited:
      - model confidence alone
      - absence of tool call alone as universal stagnation proof
      - unbounded search for progress
  revocation_quiescence_policy:
    activation: long-running/external/multi-worker execution where stopping or disabling execution is material
    states:
    - disable_new_execution
    - stop_requested
    - quiescence_unknown
    - verified_not_quiescent
    - verified_quiescent
    rules:
    - disable_new_execution does not imply in-flight execution stopped
    - stop_requested does not imply quiescence
    - verified_quiescent requires runtime-observable evidence and relevant child/process propagation when material
    - relaunch/resume requiring exclusive prior instance blocks while prior execution may still be active
    - capability unavailable or unverified -> report partial/blocked/[VERIFICAR], never fabricate stop success
validacao_e_auditoria:
  required_top_level_sections:
  - schema_version
  - file_name
  - kind
  - language
  - metadata
  - epistemic_policy
  - value_add_policy
  - materiality_policy
  - identidade
  - ativacao
  - agent_execution_model
  - requisitos_formais
  - entradas
  - saidas
  - fluxo_execucao
  - decisao_e_excecoes
  - dependencias_e_integracoes
  - seguranca_e_operacao
  - validacao_e_auditoria
  - criterios_de_aceite
  - matriz_rastreabilidade
  - exemplos_de_evidenciacao_visivel
  - response_policy
  - measurement_model
  - human_review
  - lifecycle
  static_checks:
  - id: qc_001
    check: YAML parse e todas as seções top-level declaradas em required_top_level_sections presentes
    blocking: true
  - id: qc_002
    check: metadata.version == identidade.versao; IDs normativos únicos
    blocking: true
  - id: qc_003
    check: flow targets existem e terminais são alcançáveis
    blocking: true
  - id: qc_004
    check: 'Graph IR: node/edge IDs únicos, endpoints válidos e conditions rubricadas'
    blocking: true
  - id: qc_005
    check: loops/retries/repairs/replays possuem limites finitos
    blocking: true
  - id: qc_006
    check: high-impact possui pre-action human gate
    blocking: true
  - id: qc_007
    check: shared writes têm ownership e merge/write semantics
    blocking: true
  - id: qc_008
    check: blocking validators têm critério verificável e independence_basis
    blocking: true
  - id: qc_009
    check: adapter verified referencia source_ir_version e capability evidence
    blocking: true
  - id: qc_010
    check: optional extension possui Value Add include
    blocking: true
  - id: qc_011
    check: verified persistent derived knowledge ou regra reutilizável derivada de resultado aceito possui lineage/promotion validation; aceitação
      local não prova generalização
    blocking: true
  - id: qc_012
    check: concurrency groups sem hard dependency interna e com state/side-effect safety
    blocking: true
  - id: qc_013
    check: capability binding não promove unverified para disponível
    blocking: true
  - id: qc_014
    check: recovery policy bounded, state-consistent e replay-safe
    blocking: true
  - id: qc_015
    check: fault attribution não declara causalidade sem evidência causal
    blocking: true
  - id: qc_016
    check: audit trace/legacy ledger não inventa agentes ou independência
    blocking: true
  - id: qc_017
    check: output partial contém completed_scope, failed_checks, limitations
    blocking: true
  - id: qc_018
    check: deprecated aliases não são fonte de verdade
    blocking: false
  - id: qc_019
    check: cada terminal declara terminal_class + entry_condition + safe_action + exit_criterion
    blocking: true
  - id: qc_020
    check: superiority claim exige comparative execution evidence ou é rebaixada a hipótese
    blocking: true
  - id: qc_021
    check: temporal_model presente tem Value Add include, stage IDs/order válidos e todos stage_refs resolvem
    blocking: true
  - id: qc_022
    check: temporal_model não duplica conectividade; routing_source_of_truth permanece edges
    blocking: true
  - id: qc_023
    check: communication_instruction presente somente quando source e target resolvem para nodes type in {llm,agent}; exatamente uma entrada canônica
      value_fit.extensions para component==communication_instruction possui decision==include; não altera authority, policy, roteamento ou contratos
      de payload e não substitui input/output contract. Não avalia materialidade comportamental.
    blocking: true
  - id: qc_024
    check: context_engineering presente tem registry canônico include e local value_add espelha a decisão; cada profile declara inclusion_rule;
      quando compaction preservation depender de materialidade, assessment resolve e material exige preservação de estado/proveniência
    blocking: true
  - id: qc_025
    check: delegação aberta possui registry coordination_integrity include, contrato completo e não mascara hard dependency; qualificação material
      de dependency/ownership possui assessment quando controla blocking
    blocking: true
  - id: qc_026
    check: aggregation contract possui assessment de materialidade quando sua aplicabilidade depende de material; decision==material exige evidência
      única/proveniência/uncertainty/dissent e proíbe duplicata correlacionada como independência; unknown não passa promoção
    blocking: true
  - id: qc_027
    check: artifact-reference handoff resolve referência/versionamento, não altera authority/persistence/storage por implicação e, quando integridade
      depender de materialidade, possui assessment resolvido
    blocking: true
  - id: qc_028
    check: matriz de rastreabilidade contém requisito, mecanismo, efeito esperado, aceite, testes e gates para cada requisito normativo
    blocking: true
  - id: qc_029
    check: optional components presentes possuem exatamente uma decisão canônica em value_fit.extensions; value_add local, quando presente, espelha
      a decisão e não contradiz registry
    blocking: true
  - id: qc_030
    check: todo uso de material/materialmente que decide aplicabilidade de blocking check/gate/promoção possui materiality_assessment completo;
      unknown não é tratado como non_material/pass
    blocking: true
  - id: qc_031
    check: todo static check blocking aparece em ao menos um criterios_de_aceite.gates[*].check_refs; IDs referenciados existem e checks nonblocking
      podem permanecer sem gate
    blocking: true
  - id: qc_032
    check: execution-unit contract reusa node_item_schema input/output/acceptance/executor binding; check material possui caminho validator/evidence
      e node não é equiparado a subagente
    blocking: true
  - id: qc_033
    check: 'deterministic-first: execution_profile expõe determinism_preference; operação exata com executor determinístico verificado e sem julgamento
      semântico não é roteada a LLM sem justificativa material'
    blocking: true
  - id: qc_034
    check: 'localized repair: recovery policy usa failure_localization e minimal_affected_subgraph quando seguro; full restart exige ambiguidade/risco
      ou razão material; replay permanece bounded'
    blocking: true
  - id: qc_035
    check: gate material não usa model self-confidence/coerência narrativa como evidence; unresolved/insuficiente permanece non-pass e referência
      de evidência deve ser observável
    blocking: true
  - id: qc_036
    check: 'acceptance integrity: execução iniciada não permite alteração material de criteria/checks sem criteria_version/rebaseline/revalidation;
      mudança não pode retroagir para resgatar fail/unresolved'
    blocking: true
  - id: qc_037
    check: 'evidence-artifact binding: pass material artifact-bound exige artifact_ref + version_or_hash + binding_status=bound; hash/version
      diferente invalida herança'
    blocking: true
  - id: qc_038
    check: resumption manifest, quando presente, inclui workflow/state version, completed/active/blocked units, accepted artifact refs, unresolved
      issues, material decisions, next action e provenance refs
    blocking: true
  - id: qc_039
    check: 'raw evidence off-context: context policy permite by-reference e proíbe carga integral de bulky raw evidence por default quando safely
      retrievable'
    blocking: true
  - id: qc_040
    check: 'multimodal provenance: claim multimodal material resolve para original artifact ref, method, derived observation ref e uncertainty
      status'
    blocking: true
  - id: qc_041
    check: 'capability contribution trace: atribuição material usa capability/evidence refs + attribution basis e não autoriza causal claim sem
      evidência/desenho apropriado'
    blocking: true
  - id: qc_042
    check: 'slow-loop: profile é opcional/candidate-only; Candidate Knowledge Delta promovido exige authority, provenance, epistemic status, conflict
      resolution e promotion validation; self-modification permanece proibida'
    blocking: true
  - id: qc_043
    check: 'adaptive retrieval: policy declara NONE|SINGLE|ITERATIVE, capability availability não força retrieval e ITERATIVE exige limits bounded,
      stop conditions e on_exhaustion'
    blocking: true
  - id: qc_044
    check: 'retrieval admission: retrieval material consumido possui verdict SUFFICIENT|AMBIGUOUS|INSUFFICIENT; AMBIGUOUS não é promovido silenciosamente
      e INSUFFICIENT não sustenta claim material'
    blocking: true
  - id: qc_045
    check: 'retrieval claim support: claim material dependente de retrieval resolve supporting evidence refs; self-check não conta como evidência
      independente e search miss não prova ausência com canal material elegível remanescente'
    blocking: true
  - id: qc_046
    check: 'discovery triage: material-only, bounded stop/budget, knowns/material_unknowns/unknown_unknown_domains e prioritized clarifications;
      atomic sufficient task não recebe fase obrigatória'
    blocking: true
  - id: qc_047
    check: 'material decision record: chosen option/alternatives/rejection/evidence/reversibility quando presente e private_reasoning_excluded=true;
      near-miss é material-only'
    blocking: true
  - id: qc_048
    check: 'material assumption ledger: consequência se falsa, evidence_needed, status/resolution; não exige registro de premissa não material'
    blocking: true
  - id: qc_049
    check: 'deterministic coordination plane: source Graph IR/version + verified executor + side-effect separation + explicit replay nondeterminism
      + human-gate boundary + optional representative-slice policy'
    blocking: true
  - id: qc_050
    check: 'branch context isolation: inheritance_mode explicit quando material; fork é explícito/justificado; context isolation não autoriza
      side-effect-isolation claim'
    blocking: true
  - id: qc_051
    check: 'recursive delegation: finite max_delegation_depth when enabled, bounded spawn_authority, on_depth_exhaustion e no unauthorized spawn'
    blocking: true
  - id: qc_052
    check: 'progress/stagnation guard: observable progress signal + bounded stagnation window + on_stagnation + hard budget; model confidence/silence
      não é evidência universal'
    blocking: true
  - id: qc_053
    check: 'policy composition: authority-tier ordering + monotonic no-relaxation; lower allow cannot override stronger higher-tier restriction;
      override requires explicit authority'
    blocking: true
  - id: qc_054
    check: 'in-flight control: disable-new, stop-request and quiescence distinct; verified_quiescent requires evidence refs; resume with missing
      state/identity fails closed'
    blocking: true
  - id: qc_055
    check: 'bottleneck migration: material local throughput gain does not support global scale claim/decision without bounded reassessment record
      covering prior bottleneck, changed stage, downstream constraints, candidate new limiter, evidence refs and stop condition; non-material
      atomic case may omit'
    blocking: true
  - id: qc_056
    check: 'query-before-materialize: material source access has explicit QUERY_DIRECT|MATERIALIZE_PARTIAL|MATERIALIZE_FULL decision, verified
      capability/limitation, evidence sufficiency, provenance and fallback; full materialization requires explicit local/original semantics need'
    blocking: true
  - id: qc_057
    check: 'validator failure contract: when material failure ontology is not fully captured by acceptance/evidence, validator declares failure
      modes, scope/exclusions, evidence rule and finding-budget semantics; no post-start weakening of frozen criteria'
    blocking: true
  - id: qc_058
    check: 'review-repair convergence: material loop declares observable new-finding/duplicate/regression signals, finite round bound and on_nonconvergence;
      incremental review cannot bypass baseline failure-contract coverage'
    blocking: true
  - id: qc_059
    check: 'failure-to-regression feedback: regression candidate is evidence/provenance-backed, has failure-mechanism status + reproduction/discriminator
      + eval class, begins CANDIDATE and requires explicit curation before PROMOTED; no automatic rule promotion'
    blocking: true
  - id: qc_060
    check: 'adaptive assurance: degradation trigger uses predeclared signals/threshold policy, tightening is authorized/monotonic/fail-safe, and
      de-escalation requires recovery evidence plus authorized rule and hysteresis/cooldown when material'
    blocking: true
  - id: qc_061
    check: 'judgment integrity: assess material underdetermined choice using existing materiality/decision records; distinguish AI-suggested premises from user preferences; ask only if blocking; never duplicate human gate or assume independent judgment from approval'
    blocking: true
  comparative_evaluation:
    required_when:
    - claiming architectural improvement
    - release benchmark
    - optimization policy promotion
    - communication_instruction materiality promotion
    principle: Comparar baseline = primeiro nível suficiente versus candidato sob model/tools/context e budget total tão pareados quanto praticável;
      em claim multiagente, separar ganho estrutural de simples aumento de tokens/tool calls/compute.
    dimensions:
    - effectiveness
    - efficiency
    - robustness
    - structural_fidelity
    - operational_correctness
    structural_perturbations_when_applicable:
    - remove_or_change_dependency_edge
    - serialize_declared_parallel_group
    - inject_node_failure_or_stale_state
    - remove_specialized_capability
    - remove_or_replace_validator
    - strip_or_genericize_communication_instruction
    - vary_temporal_stage_count
    - flatten_temporal_topology
    - equalize_total_model_and_tool_budget
    - full_context_vs_minimum_sufficient_context
    - homogeneous_vs_differentiated_contributors
    - majority_vote_vs_evidence_preserving_aggregation
    - remove_unique_evidence_or_dissent_preservation
    - inline_payload_vs_artifact_reference
    - fixed_retrieval_vs_adaptive_none_single_iterative
    - admit_all_retrieval_vs_quality_gated_admission
    - disable_bounded_discovery_triage
    - remove_material_decision_assumption_records
    - model_managed_vs_deterministic_coordination
    - fresh_vs_inherited_worker_context
    - remove_recursive_delegation_depth_guard
    - hard_budget_only_vs_progress_stagnation_guard
    - non_monotonic_vs_monotonic_policy_composition
    - disable_new_only_vs_verified_quiescence_semantics
    - disable_bottleneck_reassessment_after_material_throughput_gain
    - query_direct_vs_partial_vs_full_materialization
    - generic_validator_vs_explicit_failure_contract
    - hard_budget_progress_only_vs_review_repair_convergence_policy
    - observed_failure_without_vs_with_curated_regression_feedback
    - static_assurance_vs_degradation_triggered_adaptive_assurance
    claim_to_required_perturbations:
      classification:
        communication_semantics:
          applies_when: a claim atribui ganho, benefício ou efeito material à presença, conteúdo ou semântica de communication_instruction
        temporal_stage_depth:
          applies_when: a claim atribui ganho, benefício ou efeito material ao número, quantidade ou profundidade de temporal_model.stages
        temporal_topology_variation:
          applies_when: a claim atribui ganho, benefício ou efeito material à variação de topologia entre estágios temporais
        multiagent_coordination_gain:
          applies_when: a claim atribui ganho material à arquitetura multiagente/coordenação em vez de apenas maior compute, token budget ou tool
            calls
        context_engineering_gain:
          applies_when: a claim atribui ganho material a minimum-sufficient-context, retrieval just-in-time, progressive disclosure ou compaction
        epistemic_diversity_gain:
          applies_when: a claim atribui ganho à diversidade/independência de múltiplos contribuidores
        aggregation_integrity_gain:
          applies_when: a claim atribui ganho a consenso, voting ou estratégia de síntese/agregação entre contribuidores
        artifact_handoff_gain:
          applies_when: a claim atribui ganho de custo, fidelidade ou contexto ao uso de artifact_reference em vez de payload inline
        adaptive_retrieval_gain:
          applies_when: a claim atribui ganho de qualidade/custo/latência à escolha NONE|SINGLE|ITERATIVE em vez de retrieval fixo
        retrieval_admission_gain:
          applies_when: a claim atribui redução de unsupported claims ou ganho de qualidade ao admission verdict de retrieval
        discovery_triage_gain:
          applies_when: claim attributes material gain to bounded material-unknown discovery or clarification priority
        deterministic_coordination_gain:
          applies_when: claim attributes quality/cost/reliability gain to external deterministic coordination rather than model-managed coordination
        branch_context_isolation_gain:
          applies_when: claim attributes gain to fresh/minimum-sufficient worker context versus inherited/full context
        recursive_delegation_guard_gain:
          applies_when: claim attributes gain to delegation-depth/spawn controls
        progress_guard_gain:
          applies_when: claim attributes efficiency/robustness gain to stagnation guard beyond hard budgets
        policy_composition_gain:
          applies_when: claim attributes safety/correctness gain to monotonic policy composition
        revocation_quiescence_gain:
          applies_when: claim attributes correctness/risk reduction to explicit in-flight stop/quiescence semantics
        decision_assumption_record_gain:
          applies_when: claim attributes continuity/auditability gain to material decision or assumption records
      classification_rule: avaliar todas as classes por applies_when; classes_aplicaveis são todas as condições verdadeiras. Claim sobre communication_instruction,
        temporal_model, multiagente, context_engineering, retrieval adaptativo/admission, diversidade epistemológica, aggregation ou artifact_reference
        sem classe aplicável não satisfaz gate_008 e permanece hipótese. Mais de uma classe aplicável constitui claim composta.
      mapping:
        communication_semantics:
        - strip_or_genericize_communication_instruction
        temporal_stage_depth:
        - vary_temporal_stage_count
        temporal_topology_variation:
        - flatten_temporal_topology
        multiagent_coordination_gain:
        - equalize_total_model_and_tool_budget
        - serialize_declared_parallel_group
        context_engineering_gain:
        - full_context_vs_minimum_sufficient_context
        epistemic_diversity_gain:
        - homogeneous_vs_differentiated_contributors
        aggregation_integrity_gain:
        - majority_vote_vs_evidence_preserving_aggregation
        - remove_unique_evidence_or_dissent_preservation
        artifact_handoff_gain:
        - inline_payload_vs_artifact_reference
        adaptive_retrieval_gain:
        - fixed_retrieval_vs_adaptive_none_single_iterative
        retrieval_admission_gain:
        - admit_all_retrieval_vs_quality_gated_admission
        discovery_triage_gain:
        - disable_bounded_discovery_triage
        decision_assumption_record_gain:
        - remove_material_decision_assumption_records
        deterministic_coordination_gain:
        - model_managed_vs_deterministic_coordination
        branch_context_isolation_gain:
        - fresh_vs_inherited_worker_context
        recursive_delegation_guard_gain:
        - remove_recursive_delegation_depth_guard
        progress_guard_gain:
        - hard_budget_only_vs_progress_stagnation_guard
        policy_composition_gain:
        - non_monotonic_vs_monotonic_policy_composition
        revocation_quiescence_gain:
        - disable_new_only_vs_verified_quiescence_semantics
      compound_claim_rule: union de todas as perturbações mapeadas para as classes aplicáveis é obrigatória
    evidence_rule: Sem execução comparativa, relatar hipótese de ganho; não superioridade observada. Para communication_instruction, materialidade
      comportamental de elegibilidade para promoção também exige a ablação mapeada; lint não a substitui.
    feature_evidence_requirements:
      communication_instruction:
        activation: communication_instruction != null and artifact is proposed beyond implementation_candidate or behavioral materiality claim
          is made
        required_perturbation: strip_or_genericize_communication_instruction
        criterion_rule: materiality criterion declared ex ante
        without_execution: claim remains [VERIFICAR]/hypothesis; gate_008 cannot pass for this feature requirement
    preregistration:
      claim: Hipótese de que 2.10.1 explicita fronteiras entre níveis e reduz seleção excessivamente complexa ou insuficiente versus
        2.10.0, preservando first_sufficient, gates, safety, authority e Graph IR.
      metrics:
      - architecture_selection_accuracy
      - insufficient_architecture_rate
      - overengineering_rate
      - human_gate_omission_rate
      - clarification_accuracy_when_material_context_missing
      - instruction_bytes
      - latency_p95
      - cost_per_success
      acceptance_rule: zero regressão crítica em safety, authority, first_sufficient e human gates; melhora material em pelo menos um erro discriminador
        com budget pareado e holdout independente, sem piora material das demais métricas; fixar limiares quantitativos antes do teste.
      rejection_rule: regressão crítica, piora material de seleção ou ausência de ganho discriminador sob condições comparáveis;
        nenhum resultado dos casos usados no design pode fundamentar claim de superioridade.
      confounders:
      - model/version/configuração
      - tools/capabilities disponíveis
      - task mix e workflow depth
      - source-system query semantics and export/materialization cost
      - validator domain difficulty
      - baseline artifact quality
      - retry/review budgets
      - incident/degradation base rate
      - human gate policy and runtime cancellation/recovery support
    baseline: skill_LGE_v2_10_0.yaml@2.10.0
    candidate: skill_LGE_v2_10_1.yaml@2.10.1
    dataset_partitions:
