<!doctype html>
<html lang="en">
  <head>
    <script>((storageKey, queryParameter, lightSchemeQuery) => {
  const isPreference = (value) => value === "light" || value === "dark" || value === "system";
  let preference = "system";
  try {
    const requested = new URLSearchParams(window.location.search).get(
      queryParameter
    );
    const stored = window.localStorage.getItem(storageKey);
    if (isPreference(requested)) preference = requested;
    else if (isPreference(stored)) preference = stored;
  } catch {
    preference = "system";
  }
  const isLight = preference === "light" || preference === "system" && typeof window.matchMedia === "function" && window.matchMedia(lightSchemeQuery).matches;
  document.documentElement.dataset.theme = isLight ? "light" : "dark";
})("rivet-theme", "theme", "(prefers-color-scheme: light)");</script>
