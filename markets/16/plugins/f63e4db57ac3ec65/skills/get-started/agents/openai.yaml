interface:
  display_name: "Get started with Recomaze"
  short_description: "Connect or open the account, then the guided setup in the chat."
  default_prompt: "Use $get-started. Set up Recomaze for my website with me: the website, the morning routine, my business profile and one first change to approve. If my account is set up already, tell me what Recomaze does for me and go on to one useful change."
policy:
  allow_implicit_invocation: true
