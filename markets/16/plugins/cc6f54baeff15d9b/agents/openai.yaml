# Tools for this plugin's skills come from Abency's seo MCP endpoint
# (https://app.abency.com/mcp/seo): the same server and OAuth as the main Abency plugin, narrowed to
# one use case by ScopeMcpTools (config/mcp-scopes.php).
dependencies:
  tools:
    - type: "mcp"
      value: "abency-seo"
      description: "SEO reporting, keyword research and rank tracking from Google Search Console and Google Analytics for marketing agencies and their client brands, from ChatGPT, through Abency."
      transport: "streamable_http"
      url: "https://app.abency.com/mcp/seo"
