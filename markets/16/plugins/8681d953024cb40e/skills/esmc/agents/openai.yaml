interface:
  display_name: "ESMC"
  short_description: "Score mutations and scan mutation tolerance"
  default_prompt: "What might W43F do to GB1?"
policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "biohub"
      description: "Biohub MCP with the ESMC, ESMFold2, and ESM Atlas tools and the Mol* structure viewer"
      transport: "streamable_http"
      url: "https://biohub.ai/mcp"
