interface:
  display_name: "ESMFold2"
  short_description: "Fold and show proteins and complexes"
  default_prompt: "Show me what GB1 looks like."
policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "biohub"
      description: "Biohub MCP with the ESMC, ESMFold2, and ESM Atlas tools and the Mol* structure viewer"
      transport: "streamable_http"
      url: "https://biohub.ai/mcp"
