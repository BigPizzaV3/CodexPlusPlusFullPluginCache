interface:
  display_name: "TikTok captions"
  short_description: "Captions with up to five hashtags"
  default_prompt: "Write 3 captions for my next TikTok video."
dependencies:
  tools:
    - type: "mcp"
      value: "inayaflow-tiktok"
      description: "Read a public TikTok account's recent videos and stored niche posts"
      transport: "streamable_http"
      url: "https://inayaflow.ai/api/mcp"
