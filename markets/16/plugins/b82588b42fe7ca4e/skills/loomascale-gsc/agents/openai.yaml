interface:
  display_name: "Search Console SEO analysis"
  short_description: "Analyze SEO traffic, keywords and indexing"
  default_prompt: "Use $loomascale-gsc to compare organic search clicks, find keyword opportunities and check indexing in my Search Console data."

dependencies:
  tools:
    - type: "mcp"
      value: "loomascale-gsc"
      description: "LoomaScale Google Search Console"
      transport: "streamable_http"
      url: "https://api.loomascale.com/mcp/gsc"

policy:
  allow_implicit_invocation: true
