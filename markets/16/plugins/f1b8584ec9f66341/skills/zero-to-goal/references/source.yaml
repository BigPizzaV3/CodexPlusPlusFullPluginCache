# Contrato aditivo de uso diário para coleta de evidências no piloto.
# O contrato não altera as condições de Finish nem confere capacidade de persistência ou validação externa.
observacao_operacional_piloto:
  uso_autorizado: apoio_advisory_com_revisao_humana_para_coletar_evidencias
  escopo: executar orientações de GFL ou 0TG em tarefas reais do usuário sem side effects autônomos
  status_de_release: pilot_observation_not_production
  observacao_nao_e_prova: respostas_do_modelo_nao_constituem_teste_independente_ou_recibo_autenticado
  rotulo_obrigatorio: PENDENTE_DE_VERIFICACAO quando nao_houver_evidencia_independente
  por_execucao:
    - identificar skill_id, skill_version e sha256 dos bytes do arquivo usado
    - identificar data/hora, objetivo/contrato, operação, entradas e modo da execução
    - registrar saída/decisão, evidências com referência resolvível, versões e verificadores quando disponíveis
    - separar resultado alegado, teste observado, pendências, limitações, divergências e próximos passos
    - preservar decisão humana e autorização, sem inferi-las do próprio texto
    - apresentar registro estruturado compatível com REGISTRO_EXECUCAO_MODELO.json
    - indicar expressamente se o registro foi apenas produzido na conversa ou gravado externamente
  proibicoes:
    - afirmar que a resposta foi automaticamente salva no Notion, GitHub ou outro sistema sem comprovante da ferramenta
    - promover implementation_candidate ou pilot_observation a produção sem gate próprio
    - autovalidar recibo FINISH ou atribuir independencia epistemologica a autoavaliacao
    - elevar tarefa opcional a criterio terminal apos Goal Lock
  dependencia_registro:
    arquivo: registrar_execucao.py
    armazenamento_padrao: historico_execucoes.jsonl
    nota: hash-chain local permite detectar alteracoes acidentais; nao substitui assinatura ou armazenamento imutavel
  on_missing_executor_or_recorder: emitir bloco de registro na resposta e sinalizar persistencia_nao_observada
  on_missing_trusted_evidence: manter claims materiais como PENDENTE_DE_VERIFICACAO
  on_missing_gfl_receipt: nao declarar GFL_FINISH_VERIFIED pela 0TG
