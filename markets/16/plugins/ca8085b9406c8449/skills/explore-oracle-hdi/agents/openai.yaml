interface:
  display_name: "Explore Oracle HDI"
  short_description: "Show HDI once, then answer with web sources"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#C74634"
  default_prompt: "Use $explore-oracle-hdi to show the Oracle HDI overview once, then answer my follow-up questions using web search."

dependencies:
  tools:
    - type: "mcp"
      value: "oracle-hdi-marketing"
      description: "Read the deployed Oracle Health Data Intelligence overview."
      transport: "streamable_http"
      url: "https://api.intelligence.us-ashburn-1.health.oraclecloud.com/v1/public-health/mcp"
