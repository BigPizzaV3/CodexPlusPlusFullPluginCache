# ============================================================
# METADADOS DE MANUTENÇÃO
# ============================================================

manutencao:
  
  ultima_atualizacao: "2026-01-21"
  responsavel: "DIGIA Engineering Team"
  proxima_revisao: "2026-07-21"
  periodicidade: "semestral"
  
  criterios_inclusao_novas_entradas:
    - "Publicação de nova legislação federal relevante (Leis, Decretos)"
    - "Acórdãos TCU paradigmáticos (Plenário com tese consolidada)"
    - "Súmulas TCU sobre licitações/contratos"
    - "Alterações legislativas da Lei 14.133/21"
    - "Decisões STF/STJ que impactem contratos administrativos"
  
  criterios_exclusao_entradas:
    - "Normas revogadas (verificar anualmente)"
    - "Acórdãos superados por nova jurisprudência"
    - "Cláusulas-modelo desatualizadas face à legislação"
  
  processo_atualizacao:
    - passo: 1
      acao: "Monitorar publicações TCU (Diário Eletrônico)"
      frequencia: "mensal"
    
    - passo: 2
      acao: "Revisar alterações Lei 14.133 (Decretos regulamentadores)"
      frequencia: "trimestral"
    
    - passo: 3
      acao: "Incorporar novas entradas em base_conhecimento.jsonl"
      responsavel: "Equipe jurídica + engenharia"
    
    - passo: 4
      acao: "Atualizar cobertura_esperada.yaml com novos subdomínios"
      responsavel: "Arquiteto do sistema"
    
    - passo: 5
      acao: "Executar coverage_analyzer e validar score >= 0.80"
      comando: "python engine.py coverage-check"
    
    - passo: 6
      acao: "Executar golden tests de regressão"
      comando: "python engine.py golden-test --all"
    
    - passo: 7
      acao: "Atualizar CHANGELOG.md com novas entradas"
      formato: "## [Versão] - YYYY-MM-DD\n### Added\n- KB entry [kbXXX]: [descrição]"

