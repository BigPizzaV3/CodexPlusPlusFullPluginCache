        - "{{historico_licitatorio}}"
        - "{{partes}}"
        - "{{documentos_listados}}"
        - "{{convergencias_divergencias}}"
    
    - numero: "III"
      nome: "ANÁLISE JURÍDICA"
      placeholders:
        - "{{questao_central}}"
    
    - numero: "IV"
