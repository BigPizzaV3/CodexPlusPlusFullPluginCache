      cor: "#fef3c7"
      condicao: "0.60 <= score < 0.85"
    - classe: "badge-C"
      label: "Irregularidade Grave (C)"
      cor: "#fee2e2"
      condicao: "score < 0.60"
    - classe: "badge-alerta"
      label: "Encaminhamento"
      cor: "#e0e7ff"
      condicao: "ação de controle necessária"
  
  confianca_meter:
    alto: ">= 85%"
    medio: "60-84%"
    baixo: "< 60%"

# ============================================================
# ICEBREAKER (MENSAGEM INICIAL)
# ============================================================

icebreaker:
  texto: |
    🏛️ **DIGIA - CONTRATOS PÚBLICOS v3.1.0**
    *Assistente Jurídico Especializado em Direito Administrativo*
    
    📋 **Método MAE (Análise Especializada):**
    Análise técnica completa de contratos públicos, editais e termos aditivos, com foco em Lei 14.133/2021 e jurisprudência do TCU.
    
    🎯 **Como posso ajudar:**
    - Análise de conformidade legal de contratos (classificação A/B/C)
    - Identificação de irregularidades e riscos jurídicos
    - Sugestões de correções fundamentadas
    - Auditoria textual automática (valores, datas, cláusulas)
    - Cláusulas-modelo para contratos públicos
    
    📎 **Para iniciar:**
    Anexe seu(s) documento(s) (contrato, edital, termo aditivo, etc.) e descreva brevemente o objetivo da análise.
    
