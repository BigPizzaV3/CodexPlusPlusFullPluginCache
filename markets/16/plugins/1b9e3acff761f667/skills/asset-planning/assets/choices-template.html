<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>素材を選ぶ | Dr.SHI-GYO</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #142c36; background: #f3f5f2; line-height: 1.7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1180px; margin: auto; padding: 42px 30px 180px; }
    h1, h2, h3, p, blockquote { margin: 0; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); line-height: 1.35; margin: 16px 0; }
    h2 { font-size: 1.35rem; line-height: 1.5; }
    h3 { font-size: 1.1rem; line-height: 1.5; }
    p, h1, h2, h3, blockquote, label, textarea, button, span, li { overflow-wrap: anywhere; }
    button, input, textarea { font: inherit; }
    button, .choice { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; border: 1px solid #b8c9c9; border-radius: 9px; color: #16383c; padding: 10px 16px; background: white; min-height: 44px; }
    button:hover { background: #ecf5f2; }
    button.primary { color: white; border-color: #145c55; background: #145c55; }
    button.primary:hover { background: #104b45; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #cf8600; outline-offset: 3px; }
    .eyebrow { font-weight: 700; font-size: .82rem; letter-spacing: .08em; color: #38675e; }
    .muted, .meta { color: #52656d; font-size: .9rem; }
    .intro { max-width: 780px; margin: 12px 0 20px; }
    .notice { padding: 14px 18px; border: 1px solid #d6dfd9; border-radius: 10px; background: #e8eee6; font-size: .92rem; }
    .scene { margin-top: 32px; padding: 26px; border: 1px solid #dce3dd; border-radius: 16px; background: #fff; min-width: 0; }
    .scene-number { display: block; color: #497368; font-size: .8rem; font-weight: 700; margin-bottom: 5px; }
    .quote { border-left: 3px solid #a8c6bb; margin: 16px 0 12px; padding: 9px 14px; background: #f5f7f4; white-space: pre-wrap; }
    .purpose { font-size: .95rem; margin-bottom: 20px; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 14px; min-width: 0; }
    .choice { position: relative; display: flex; flex-direction: column; padding: 17px; border: 2px solid #dce4df; border-radius: 12px; min-width: 0; background: #fff; }
    .choice.selected { border-color: #25766a; background: #f4faf6; }
    .choice-selector { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
    input[type=radio] { accent-color: #17685d; width: 19px; height: 19px; margin: 4px 0 0; flex: 0 0 19px; }
    .choice-heading { min-width: 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 14px; }
    .badge { font-size: .73rem; font-weight: 650; background: #eef1ed; color: #425b5c; padding: 2px 8px; border-radius: 5px; }
    .badge.recommended { background: #dceee2; color: #235944; }
    .badge.stage { background: #f4edda; color: #6e5520; }
    .concept { padding: 13px; border-radius: 7px; background: #eef2ee; white-space: pre-wrap; }
    .field-title { display: block; font-size: .77rem; color: #4b6267; font-weight: 700; margin: 13px 0 3px; }
    .concept .field-title { margin-top: 0; }
    .field-content { white-space: pre-wrap; font-size: .9rem; }
    .requirements { padding-left: 1.1em; margin: 3px 0 0; font-size: .88rem; }
    .preview { margin: 0 0 13px; }
    .preview img, .preview video { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 7px; background: #e9efea; }
    .preview figcaption { font-size: .75rem; margin-top: 4px; color: #52656d; }
    .skip { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; font-size: .9rem; margin: 20px 0 14px; }
    .note-label { display: block; font-size: .87rem; font-weight: 600; margin-bottom: 5px; }
    textarea { width: 100%; min-width: 0; border: 1px solid #b9c9c2; border-radius: 8px; padding: 12px; background: #fff; color: #17383b; resize: vertical; line-height: 1.65; }
    .note { min-height: 84px; font-size: .92rem; }
    .export { margin-top: 34px; padding: 24px; background: #fff; border: 1px solid #c9d9d1; border-radius: 14px; }
    .export p { margin: 10px 0; }
    #request-text { min-height: 320px; margin-top: 8px; font-size: .88rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .sticky { position: fixed; inset: auto 0 0; background: #ffffffed; border-top: 1px solid #d5dfd8; padding: 13px 24px; z-index: 2; }
    .sticky-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; max-width: 1120px; margin: auto; }
    .sticky .actions { margin: 0; }
    #status { min-height: 1.7em; margin-top: 10px; font-size: .9rem; color: #245c4f; }
    .privacy { font-size: .79rem; color: #62726b; margin-top: 6px; }
    .fatal { color: #8a2424; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      main { padding: 26px 12px 215px; }
      .scene { padding: 17px 13px; margin-top: 22px; }
      .choice { padding: 14px; }
      .sticky { padding: 10px 12px; }
      .sticky-inner { gap: 6px; }
      .sticky .actions { width: 100%; }
      .sticky button { flex: 1; padding: 9px 10px; font-size: .84rem; }
      .export { padding: 17px 13px; }
    }
    @media print { .sticky, .export, .note-label, .note, .skip { display: none !important; } main { padding: 0; } .scene { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Dr.SHI-GYO / 素材プラン</p>
      <h1>台本に合わせて、見せ方を選ぶ。</h1>
      <p id="script-title"></p>
      <p id="script-meta" class="meta"></p>
      <p class="intro">おすすめを選んであります。そのままでよければ変更不要です。気になる場面だけ別の種類を選ぶか、修正メモを残してください。</p>
      <p class="notice">これは ChatGPT が台本から作成した素材計画の選択画面です。すべて提案段階で、完成素材ではありません。選択結果を ChatGPT に返すと、採用案の制作に進めます。</p>
    </header>
    <noscript><p class="fatal">この選択画面を使うには JavaScript を有効にしてください。インターネット接続は不要です。</p></noscript>
    <div id="scenes"></div>
    <section id="export-panel" class="export" hidden aria-labelledby="export-title">
      <h2 id="export-title">この依頼文を ChatGPT に返す</h2>
      <p class="muted">元の素材計画があるチャットに貼り付けてください。別のチャットでは、元台本と素材計画も添付します。</p>
      <label for="request-text" class="note-label">選択結果と制作依頼</label>
      <textarea id="request-text" readonly spellcheck="false"></textarea>
      <div class="actions"><button id="copy-request" type="button">依頼文をコピー</button><button id="select-request" type="button">全文を選択</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <div class="sticky">
    <div class="sticky-inner">
      <div><p id="selection-count" aria-live="polite"></p><p class="privacy">外部送信・自動保存はしません。閉じる前に結果を保存してください。</p></div>
      <div class="actions"><button id="show-request" class="primary" type="button">依頼文を表示</button><button id="save-json" type="button">選択結果 JSON を保存</button></div>
    </div>
  </div>
  <script id="asset-plan" type="application/json">__ASSET_PLAN_JSON__</script>
  <script>
  (() => {
    "use strict";
    const plan = JSON.parse(document.getElementById("asset-plan").textContent);
    const state = plan.scenes.map(scene => ({option_id: scene.recommended, note: ""}));
    const cards = [];
    const create = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const byId = id => document.getElementById(id);
    byId("script-title").textContent = plan.source.title;
    byId("script-meta").textContent = `台本 ${plan.source.version} / ${plan.scenes.length} 場面`;
    document.title = `${plan.source.title}｜素材を選ぶ`;
    const exportResult = () => ({plan_id: plan.plan_id, source: {...plan.source}, choices: plan.scenes.map((scene, index) => ({scene_id: scene.id, quote: scene.quote, option_id: state[index].option_id, note: state[index].note}))});
    const requestText = () => {
      const lines = [
        "次の選択結果に沿って、採用した素材案を制作してください。",
        `素材計画 ID: ${plan.plan_id}`,
        `台本: ${plan.source.title}`,
        `台本の版: ${plan.source.version}`,
        `台本 SHA-256: ${plan.source.sha256}`,
        "",
        "元台本の内容・医学的主張を保ち、修正メモを反映してください。必要な本人素材や制作環境が不足する場合は、その項目を示してください。生成できない素材を完成済みとして扱わず、画像・動画の実ファイルと、差し込み位置・見せ方の指示をセットで返してください。スキップした場面は制作不要です。外部サービスへの投稿・公開は、この依頼には含みません。",
        ""
      ];
      plan.scenes.forEach((scene, index) => {
        const current = state[index];
        const option = scene.options.find(item => item.id === current.option_id);
        lines.push(`【${index + 1}. ${scene.label} / ${scene.id}】`, `差し込み位置（台本の原文）: ${scene.quote}`);
        if (option) {
          lines.push(`選択: ${option.title}（${option.type} / 候補 ID: ${option.id}）`, `構成案: ${option.concept}`, `形式: ${option.format}`, `必要な入力: ${option.requirements.length ? option.requirements.join(" / ") : "追加指定なし"}`);
        } else {
          lines.push("選択: スキップ（素材を作らない）");
        }
        lines.push(`修正メモ: ${current.note.trim() || "なし"}`, "");
      });
      return lines.join("\n");
    };
    const update = () => {
      const selected = state.filter(item => item.option_id !== null).length;
      byId("selection-count").textContent = `${selected} 場面を採用 / ${state.length - selected} 場面をスキップ`;
      cards.forEach((sceneCards, index) => sceneCards.forEach(card => card.node.classList.toggle("selected", state[index].option_id === card.id)));
      byId("request-text").value = requestText();
    };
    plan.scenes.forEach((scene, index) => {
      const section = create("section", undefined, "scene");
      const headingId = `scene-${index}-heading`;
      section.setAttribute("aria-labelledby", headingId);
      section.append(create("span", `SCENE ${String(index + 1).padStart(2, "0")}`, "scene-number"));
      const heading = create("h2", scene.label); heading.id = headingId; section.append(heading);
      section.append(create("blockquote", scene.quote, "quote"));
      section.append(create("p", `伝えたいこと：${scene.message}`, "purpose"));
      const optionsContainer = create("div", undefined, "options");
      optionsContainer.setAttribute("role", "radiogroup");
      optionsContainer.setAttribute("aria-labelledby", headingId);
      const sceneCards = []; cards.push(sceneCards);
      scene.options.forEach((option, optionIndex) => {
        const card = create("div", undefined, "choice");
        const label = create("label", undefined, "choice-selector");
        const radio = create("input"); radio.type = "radio"; radio.name = `scene-${index}`; radio.id = `option-${index}-${optionIndex}`; radio.value = option.id; radio.checked = option.id === scene.recommended;
        radio.addEventListener("change", () => {state[index].option_id = option.id; update();});
        const labelText = create("span", option.title, "choice-heading");
        label.append(radio, labelText); card.append(label);
        const badges = create("div", undefined, "badges");
        if (option.id === scene.recommended) badges.append(create("span", "おすすめ", "badge recommended"));
        badges.append(create("span", option.type, "badge"), create("span", "提案段階", "badge stage")); card.append(badges);
        if (option.preview) {
          const figure = create("figure", undefined, "preview");
          const media = create(option.preview.kind === "image" ? "img" : "video");
          media.src = option.preview.data_url;
          if (option.preview.kind === "image") {media.alt = `${option.title}の参考プレビュー`; media.loading = "lazy";}
          else {media.controls = true; media.preload = "metadata"; media.playsInline = true; media.setAttribute("aria-label", `${option.title}の参考プレビュー`);}
          figure.append(media, create("figcaption", "参考プレビュー。完成素材としての採用・納品は未確定です。")); card.append(figure);
        }
        const concept = create("div", undefined, "concept");
        concept.append(create("span", "構成案", "field-title"), create("p", option.concept, "field-content")); card.append(concept);
        card.append(create("span", option.id === scene.recommended ? "この案をおすすめする理由" : "この案が向く理由", "field-title"), create("p", option.reason, "field-content"));
        card.append(create("span", "比率・形式", "field-title"), create("p", option.format, "field-content"));
        card.append(create("span", "必要な入力・素材", "field-title"));
        if (option.requirements.length) {const list = create("ul", undefined, "requirements"); option.requirements.forEach(item => list.append(create("li", item))); card.append(list);}
        else card.append(create("p", "追加指定なし", "field-content"));
        optionsContainer.append(card); sceneCards.push({node: card, id: option.id});
      });
      section.append(optionsContainer);
      const skip = create("label", undefined, "skip");
      const skipRadio = create("input"); skipRadio.type = "radio"; skipRadio.name = `scene-${index}`; skipRadio.id = `skip-${index}`; skipRadio.value = "";
      skipRadio.addEventListener("change", () => {state[index].option_id = null; update();});
      skip.append(skipRadio, create("span", "この場面には素材を入れない（スキップ）")); section.append(skip);
      const noteLabel = create("label", "この場面の修正メモ（任意）", "note-label"); noteLabel.htmlFor = `note-${index}`;
      const note = create("textarea", undefined, "note"); note.id = `note-${index}`; note.rows = 2; note.placeholder = "例：この図解は少しゆっくり動かす。本人の写真は使わない。";
      note.addEventListener("input", () => {state[index].note = note.value; update();});
      section.append(noteLabel, note); byId("scenes").append(section);
    });
    const showRequest = () => {
      update(); byId("export-panel").hidden = false; byId("status").textContent = "";
      byId("export-panel").scrollIntoView({behavior: "smooth", block: "start"});
    };
    byId("show-request").addEventListener("click", showRequest);
    byId("select-request").addEventListener("click", () => {byId("request-text").focus(); byId("request-text").select(); byId("status").textContent = "全文を選択しました。コピーして ChatGPT に貼り付けてください。";});
    byId("copy-request").addEventListener("click", async () => {
      update();
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("Clipboard is unavailable");
        await navigator.clipboard.writeText(byId("request-text").value);
        byId("status").textContent = "依頼文をコピーしました。元の ChatGPT チャットに貼り付けてください。";
      } catch (_) {
        byId("request-text").focus(); byId("request-text").select();
        byId("status").textContent = "自動コピーが使えないため全文を選択しました。コピー操作（⌘C / Ctrl+C、または長押し）でコピーしてください。";
      }
    });
    byId("save-json").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(exportResult(), null, 2)], {type: "application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = create("a"); link.href = url; link.download = `asset-choices-${plan.plan_id.replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 80) || "plan"}.json`;
      document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    update();
  })();
  </script>
</body>
</html>
