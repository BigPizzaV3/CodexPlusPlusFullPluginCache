# Tools for this plugin's skills come from Abency's Ads MCP endpoint
# (/mcp/ads: Google Ads + Meta Ads tools plus brand lookup), the same server
# and OAuth as the main Abency plugin, narrowed to ads by ScopeMcpTools.
dependencies:
  tools:
    - type: "mcp"
      value: "abency-ads"
      description: "Abency Ads MCP endpoint: Google Ads and Meta Ads reporting for the brands of your organization."
      transport: "streamable_http"
      url: "https://app.abency.com/mcp/ads"
