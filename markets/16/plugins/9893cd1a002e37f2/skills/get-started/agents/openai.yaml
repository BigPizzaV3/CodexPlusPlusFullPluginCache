interface:
  display_name: "Get Started with Swoogo"
  short_description: "Connect Swoogo and verify event access"
  default_prompt: "Use $get-started to connect Swoogo and verify access with a small event lookup."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "swoogo"
      description: "Swoogo event management tools"
      transport: "streamable_http"
      url: "https://mcp.swoogo.com"
