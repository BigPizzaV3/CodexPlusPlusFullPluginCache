interface:
  display_name: "Agenda Management"
  short_description: "Review and manage sessions and speakers"
  default_prompt: "Use $agenda-management to help manage the agenda for my Swoogo event."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "swoogo"
      description: "Swoogo event management tools"
      transport: "streamable_http"
      url: "https://mcp.swoogo.com"
