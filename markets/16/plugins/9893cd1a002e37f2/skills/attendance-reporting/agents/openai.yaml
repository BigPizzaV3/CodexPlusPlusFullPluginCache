interface:
  display_name: "Attendance Reporting"
  short_description: "Compare session check-ins and attendance rates"
  default_prompt: "Use $attendance-reporting to compare attendance across sessions for my Swoogo event."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "swoogo"
      description: "Swoogo event management tools"
      transport: "streamable_http"
      url: "https://mcp.swoogo.com"
