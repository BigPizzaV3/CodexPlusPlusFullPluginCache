interface:
  display_name: "Event Briefing"
  short_description: "Summarize event readiness and registrations"
  default_prompt: "Use $event-briefing to prepare a briefing for my Swoogo event."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "swoogo"
      description: "Swoogo event management tools"
      transport: "streamable_http"
      url: "https://mcp.swoogo.com"
