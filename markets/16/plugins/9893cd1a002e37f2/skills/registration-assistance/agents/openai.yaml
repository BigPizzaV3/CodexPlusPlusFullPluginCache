interface:
  display_name: "Registration Assistance"
  short_description: "Register attendees and manage session choices"
  default_prompt: "Use $registration-assistance to help register an attendee for my Swoogo event."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "swoogo"
      description: "Swoogo event management tools"
      transport: "streamable_http"
      url: "https://mcp.swoogo.com"
