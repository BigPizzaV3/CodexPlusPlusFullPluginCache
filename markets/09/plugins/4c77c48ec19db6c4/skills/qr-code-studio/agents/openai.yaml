interface:
  display_name: "Zovo QR Code Maker"
  short_description: "QR codes for links & contacts"
  brand_color: "#2F5BD3"
  default_prompt: "Make a QR code for https://example.com/menu for a poster people scan from 2 meters away"
dependencies:
  tools:
    - type: "mcp"
      value: "qr-code-studio"
      description: "Make scannable QR codes for links, contacts, and events, then download PNG or SVG."
      transport: "streamable_http"
      url: "https://qr-code-studio.zovo.one/mcp"
