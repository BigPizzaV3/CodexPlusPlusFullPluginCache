<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8EAED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DADCE0;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="white" stroke="#F1F3F4" stroke-width="2" />
  <g filter="url(#dropShadow)">
    <rect x="140" y="220" width="60" height="120" rx="8" fill="#1A73E8" />
    <rect x="226" y="160" width="60" height="180" rx="8" fill="#EA4335" />
    <rect x="312" y="100" width="60" height="240" rx="8" fill="#34A853" />
    <path d="M140 360 L 372 100" stroke="#FBBC05" stroke-width="0" stroke-linecap="round" />
  </g>
  <text x="50%" y="420" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#3C4043" text-anchor="middle" letter-spacing="1">33 CRM</text>
  <text x="50%" y="460" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#5F6368" text-anchor="middle" letter-spacing="2">SMART SUITE</text>
</svg>
