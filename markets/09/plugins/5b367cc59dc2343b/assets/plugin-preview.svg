<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#041B25" flood-opacity="0.14"/>
    </filter>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #09374B; }
      .subtitle { font-size: 20px; fill: #435359; }
      .cardTitle { font-size: 20px; font-weight: 700; fill: #09374B; }
      .cardText { font-size: 15px; fill: #435359; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#FFF5EB"/>
  <circle cx="1130" cy="76" r="160" fill="#FFE6CB" opacity="0.75"/>
  <circle cx="70" cy="1140" r="190" fill="#F4AF89" opacity="0.18"/>

  <rect x="64" y="48" width="1072" height="1090" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>

  <image href="logo-principal.svg" x="102" y="78" width="276" height="98" preserveAspectRatio="xMinYMid meet"/>
  <rect x="904" y="94" width="184" height="42" rx="21" fill="#09374B"/>
  <text x="996" y="121" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">PLUGIN CHATGPT</text>

  <text x="102" y="225" class="serif title" font-size="42">Tes coachs IA, au même endroit.</text>
  <text x="102" y="263" class="sans subtitle">Choisis une expertise. Le coach applique la méthode Biz Yourself™</text>
  <text x="102" y="291" class="sans subtitle">et t’accompagne jusqu’à un livrable directement exploitable.</text>

  <g transform="translate(102 334)">
    <rect width="304" height="128" rx="20" fill="#F5F8FA" stroke="#E2E9EC"/>
    <circle cx="42" cy="40" r="18" fill="#F4AF89"/>
    <text x="72" y="46" class="sans cardTitle">Zone de génie</text>
    <text x="24" y="83" class="sans cardText">Révèle tes forces, tes talents</text>
    <text x="24" y="105" class="sans cardText">et ton territoire d’excellence.</text>
  </g>

  <g transform="translate(430 334)">
    <rect width="304" height="128" rx="20" fill="#FFF5EB" stroke="#FFE6CB"/>
    <circle cx="42" cy="40" r="18" fill="#116B92"/>
    <text x="72" y="46" class="sans cardTitle">Client idéal</text>
    <text x="24" y="83" class="sans cardText">Comprends ses besoins, ses mots</text>
    <text x="24" y="105" class="sans cardText">et ses vrais déclencheurs d’achat.</text>
  </g>

  <g transform="translate(758 334)">
    <rect width="304" height="128" rx="20" fill="#F5F8FA" stroke="#E2E9EC"/>
    <circle cx="42" cy="40" r="18" fill="#09374B"/>
    <text x="72" y="46" class="sans cardTitle">Écosystème d’offres</text>
    <text x="24" y="83" class="sans cardText">Structure une gamme cohérente,</text>
    <text x="24" y="105" class="sans cardText">lisible et rentable.</text>
  </g>

  <g transform="translate(102 486)">
    <rect width="304" height="128" rx="20" fill="#FFF5EB" stroke="#FFE6CB"/>
    <circle cx="42" cy="40" r="18" fill="#F4AF89"/>
    <text x="72" y="46" class="sans cardTitle">Promesse irrésistible</text>
    <text x="24" y="83" class="sans cardText">Formule une promesse précise,</text>
    <text x="24" y="105" class="sans cardText">désirable et crédible.</text>
  </g>

  <g transform="translate(430 486)">
    <rect width="304" height="128" rx="20" fill="#F5F8FA" stroke="#E2E9EC"/>
    <circle cx="42" cy="40" r="18" fill="#116B92"/>
    <text x="72" y="46" class="sans cardTitle">Studio graphique</text>
    <text x="24" y="83" class="sans cardText">Ouvre ton studio visuel sans</text>
    <text x="24" y="105" class="sans cardText">consommer de tokens IA.</text>
  </g>

  <g transform="translate(758 486)">
    <rect width="304" height="128" rx="20" fill="#09374B"/>
    <text x="28" y="45" class="sans" font-size="19" font-weight="700" fill="#FFFFFF">18 expertises intégrées</text>
    <text x="28" y="80" class="sans" font-size="15" fill="#FFE6CB">Vente, emails, tunnel, Instagram,</text>
    <text x="28" y="103" class="sans" font-size="15" fill="#FFE6CB">formation, décisions et création.</text>
  </g>

  <rect x="102" y="676" width="960" height="286" rx="24" fill="#FFF5EB"/>
  <text x="138" y="730" class="serif" font-size="30" font-weight="700" fill="#09374B">Une identité fidèle à Biz Yourself™</text>
  <text x="138" y="772" class="sans" font-size="17" fill="#435359">Logo officiel, palette de marque et expérience cohérente</text>
  <text x="138" y="798" class="sans" font-size="17" fill="#435359">sur la fiche du plugin comme dans les points de contact.</text>
  <circle cx="160" cy="866" r="28" fill="#09374B"/>
  <circle cx="234" cy="866" r="28" fill="#116B92"/>
  <circle cx="308" cy="866" r="28" fill="#F4AF89"/>
  <circle cx="382" cy="866" r="28" fill="#FFE6CB"/>
  <circle cx="456" cy="866" r="28" fill="#F5F8FA" stroke="#D8E0E3"/>
  <rect x="750" y="833" width="270" height="66" rx="33" fill="#09374B"/>
  <text x="885" y="874" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">DÉMARRER UN COACHING</text>
  <rect x="102" y="1048" width="246" height="8" rx="4" fill="#F4AF89"/>
  <text x="1080" y="1060" text-anchor="end" class="sans" font-size="14" fill="#435359">Biz Yourself™ · contact@bizyourself.fr</text>
</svg>
