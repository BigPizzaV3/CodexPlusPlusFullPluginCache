interface:
  display_name: "Zovo Spreadsheet Compare"
  short_description: "Compare two spreadsheets"
  brand_color: "#3550C8"
  default_prompt: "Compare old SKU,Price: A1 10, B2 5, C3 7 with new SKU,Price: A1 11, B2 5, D4 9. List what changed."
dependencies:
  tools:
    - type: "mcp"
      value: "sheet-compare"
      description: "Compare two versions of a spreadsheet and get the full change list as an Excel file."
      transport: "streamable_http"
      url: "https://sheet-compare.zovo.one/mcp"
