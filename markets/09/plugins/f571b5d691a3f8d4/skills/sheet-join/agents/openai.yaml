interface:
  display_name: "Zovo Spreadsheet Merge"
  short_description: "Merge sheets on messy IDs"
  brand_color: "#2F5BD3"
  default_prompt: "VLOOKUP these: orders SO-1 C123 $40, SO-2 c0045 $15, SO-3 C999 $9; customers C00123 Acme, C00045 Bolt"
dependencies:
  tools:
    - type: "mcp"
      value: "sheet-join"
      description: "Merge two spreadsheets on a messy ID column, or stack many exports with drifting columns, and see every match decision."
      transport: "streamable_http"
      url: "https://sheet-join.zovo.one/mcp"
