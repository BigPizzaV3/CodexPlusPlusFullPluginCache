interface:
  display_name: "Printable Calendar Maker"
  short_description: "Print-ready calendar PDFs"
  brand_color: "#4338CA"
  default_prompt: "Make a printable 2027 calendar for Texas with US holidays and Mom's birthday on March 4"
dependencies:
  tools:
    - type: "mcp"
      value: "printable-calendar"
      description: "Printable calendars with your country's holidays, your birthdays and events, ready as a print-quality PDF."
      transport: "streamable_http"
      url: "https://printable-calendar.zovo.one/mcp"
