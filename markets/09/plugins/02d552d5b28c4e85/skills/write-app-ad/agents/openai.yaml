interface:
  display_name: "Write an app ad"
  short_description: "An ad script built on an ad that kept running"
  default_prompt: "Find ads that fit my app and write a script on the best one. Here is its store link:"

dependencies:
  tools:
    - type: "mcp"
      value: "clonerrr"
      description: "Clonerrr's ad library: find_ad_templates_for_app and get_ad_template"
      transport: "streamable_http"
      url: "https://clonerrr.com/mcp"
