interface:
  display_name: "Find app ads"
  short_description: "Real app ads that kept running, and why they work"
  default_prompt: "Show me real ads from plant identifier apps and explain why they work."

dependencies:
  tools:
    - type: "mcp"
      value: "clonerrr"
      description: "Clonerrr's ad library: search_ad_templates and get_ad_template"
      transport: "streamable_http"
      url: "https://clonerrr.com/mcp"
