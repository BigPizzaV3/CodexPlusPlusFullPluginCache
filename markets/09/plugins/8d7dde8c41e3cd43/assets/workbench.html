<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大米工作台</title>
  <style>/* 总后台同款：Ant Design 默认字体、14px 正文、32px 控件、6px 圆角与品牌蓝。
   页面背景沿用 src/global.css 的 slate-100；不由宿主字体或色值覆盖后台主题。 */
:root {
  color-scheme: light;
  --canvas: #f1f5f9;
  --surface: #fff;
  --text: rgba(0, 0, 0, .88);
  --muted: rgba(0, 0, 0, .65);
  --subtle: rgba(0, 0, 0, .45);
  --line: #e5e7eb;
  --control-line: #d9d9d9;
  --soft: #fafafa;
  --accent: #1677ff;
  --accent-hover: #40a9ff;
  --accent-soft: #e6f4ff;
  --success: #52c41a;
  --danger: #ff4d4f;
  font: 14px/1.5715 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #141414;
  --surface: #1f1f1f;
  --text: rgba(255, 255, 255, .85);
  --muted: rgba(255, 255, 255, .65);
  --subtle: rgba(255, 255, 255, .45);
  --line: #303030;
  --control-line: #424242;
  --soft: #262626;
  --accent: #3c89e8;
  --accent-hover: #69b1ff;
  --accent-soft: #111d2c;
  --success: #49aa19;
  --danger: #ff7875;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--text); }
button, input, select, textarea { font: inherit; }
button, .button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 4px 12px; color: inherit; background: var(--surface);
  border: 1px solid var(--control-line); border-radius: 6px; font-weight: 400;
  text-decoration: none; cursor: pointer; transition: border-color .15s, color .15s, background-color .15s;
}
button:hover:not(:disabled), .button:hover { color: var(--accent); border-color: var(--accent); }
button:disabled { cursor: not-allowed; color: var(--subtle); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea {
  min-width: 0; min-height: 32px; padding: 4px 11px; border: 1px solid var(--control-line);
  border-radius: 6px; background: var(--surface); color: var(--text);
}
input:hover, select:hover, textarea:hover { border-color: var(--accent); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
input::placeholder, textarea::placeholder { color: var(--subtle); opacity: 1; }
select { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
h2, h3 { font-size: 14px; font-weight: 600; }
.icon { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.meta, .eyebrow { color: var(--muted); font-size: 12px; font-weight: 400; }
.eyebrow { display: block; margin-bottom: 8px; }
.text-button { min-height: 24px; padding: 0; border: 0; color: var(--accent); background: transparent; font-size: 14px; white-space: nowrap; }
.text-button:hover:not(:disabled) { color: var(--accent-hover); background: transparent; }
.primary { color: #fff; background: var(--accent); border-color: var(--accent); box-shadow: 0 2px 0 rgba(5, 145, 255, .1); }
.primary:hover:not(:disabled) { color: #fff; background: var(--accent-hover); border-color: var(--accent-hover); }
.primary:disabled { background: var(--soft); border-color: var(--line); box-shadow: none; }
.empty { padding: 32px 16px; text-align: center; color: var(--subtle); font-size: 14px; overflow-wrap: anywhere; }
.error { color: var(--danger); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* 统一工具栏；站点范围在所有视图保留。 */
#app { max-width: 1280px; margin: 0 auto; padding: 0 24px 32px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
.brand, .topbar-actions { display: flex; align-items: center; gap: 10px; }
.brand { min-width: 0; }
.brand img { flex: 0 0 24px; }
.brand strong { font-size: 16px; font-weight: 600; white-space: nowrap; }
.version { color: var(--subtle); font-size: 12px; white-space: nowrap; }
.connection { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.connection::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--control-line); }
.connection.ready::before { background: var(--success); }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 42px; padding: 10px 0; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted); }
.tabs button:hover:not(:disabled) { color: var(--accent); }
.tabs button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.workspace { padding-top: 20px; }
.workspace-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
.project-field { width: 220px; flex-shrink: 0; }
.project-field select { width: 100%; text-overflow: ellipsis; }
#notice { padding: 8px 12px; margin-bottom: 16px; border: 1px solid var(--danger); border-radius: 6px; color: var(--danger); background: var(--surface); overflow-wrap: anywhere; }
.view.loading { cursor: progress; }

/* 与后台相同的白色面板、细边框和紧凑行高。 */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.metric { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-width: 0; min-height: 88px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; }
.metric-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.metric strong { display: block; margin-top: 2px; font-size: 24px; line-height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
.metric:disabled { color: var(--text); }
.metric-arrow { margin-left: auto; color: var(--subtle); }
.overview-status { margin: -4px 0 12px; }
.dashboard { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.dashboard-main, .dashboard-side { min-width: 0; }
.dashboard-side { display: grid; gap: 16px; }
.panel { min-width: 0; overflow: hidden; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.panel-heading h2 { flex-shrink: 0; }
.panel-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 0; }
.panel-footer .text-button { font-size: 12px; }
.site-search { display: flex; align-items: center; gap: 6px; width: 200px; min-width: 0; padding: 0 10px; color: var(--subtle); border: 1px solid var(--control-line); border-radius: 6px; }
.site-search input { width: 100%; padding: 4px 0; border: 0; background: transparent; }
.site-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.site-search input:focus { box-shadow: none; }
.site-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; }
.site-row:hover:not(:disabled) { color: var(--text); background: var(--soft); }
.site-avatar { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px; color: var(--accent); background: var(--accent-soft); font-size: 14px; font-weight: 500; }
.site-copy { display: block; min-width: 0; flex: 1; }
.site-copy strong { display: block; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.site-copy .meta { display: block; margin-top: 2px; }
.row-action { display: inline-flex; color: var(--subtle); }
.preview-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; }
.preview-row:last-child { border-bottom: 0; }
.preview-row:hover:not(:disabled) { color: var(--text); background: var(--soft); }
.unread-dot { display: inline-block; flex: 0 0 6px; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.preview-copy { min-width: 0; flex: 1; }
.preview-copy strong { display: block; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.preview-copy .meta { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview-date { color: var(--subtle); font-size: 12px; white-space: nowrap; }
.ai-panel { padding-bottom: 16px; }
.ai-panel .panel-heading { border: 0; }
.ai-actions { display: grid; gap: 8px; }
.ai-actions button { justify-content: flex-start; width: 100%; min-height: 36px; }
.ai-actions .arrow { margin-left: auto; }
.ai-panel p { margin-top: 10px; }
.site-intro { padding: 14px 0; border-bottom: 1px solid var(--line); }
.health-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px 0; }
.health-item { min-width: 0; }
.health-item strong { display: block; margin: 4px 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 500; }
.health-item p { overflow-wrap: anywhere; }
#site-health > .actions { padding: 12px 0; margin: 0; border-top: 1px solid var(--line); }

/* 阅读、草稿与内容保持原有权限和工具边界。 */
.filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.filters label { min-width: 0; }
.filters label.search { flex: 1; }
.filters label.search input { width: 100%; }
#feedback-count { margin: 12px 0; }
.inbox { display: grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
.inbox-list { padding: 0; }
.feedback-item { display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; }
.feedback-item:hover:not(:disabled) { color: var(--text); background: var(--soft); }
.feedback-item:last-child { border-bottom: 0; }
.feedback-item.selected { background: var(--accent-soft); box-shadow: inset 2px 0 var(--accent); }
.feedback-item strong { display: block; margin: 6px 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 500; }
.feedback-item .meta { overflow-wrap: anywhere; }
.badge { display: inline-flex; margin-right: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--soft); color: var(--muted); font-size: 12px; line-height: 20px; }
.badge.unread { border-color: var(--accent-soft); color: var(--accent); background: var(--accent-soft); }
#load-more { width: calc(100% - 32px); margin: 12px 16px; }
.detail { min-height: 280px; padding: 16px; }
.detail h2 { margin-bottom: 8px; overflow-wrap: anywhere; font-size: 16px; }
.body-text { margin-top: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.draft { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); overflow-wrap: anywhere; }
.draft p { margin-top: 8px; white-space: pre-wrap; }
.draft h3:not(:first-child) { margin-top: 12px; }
.draft .meta { display: block; margin-top: 8px; }
.content-section { margin-bottom: 16px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { background: var(--soft); font-weight: 600; }
td:first-child { overflow-wrap: anywhere; }
td:last-child { width: 88px; }
tbody tr:last-child td { border-bottom: 0; }
td button { white-space: nowrap; }
.task-panel { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--accent-soft); }
.task-panel label { display: block; margin: 10px 0 6px; font-size: 12px; }
.task-panel textarea { width: 100%; resize: vertical; }

@media (max-width: 860px) {
  #app { padding-inline: 16px; }
  .dashboard, .inbox { grid-template-columns: minmax(0, 1fr); }
  .dashboard-side { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .metric-arrow { display: none; }
  .feedback-list { max-height: 300px; overflow-y: auto; }
}
@media (max-width: 560px) {
  #app { padding-inline: 12px; }
  .topbar { flex-wrap: wrap; gap: 10px; padding: 14px 0 10px; }
  .topbar-actions { width: 100%; justify-content: flex-end; gap: 8px; }
  .connection { margin-right: auto; }
  .workspace { padding-top: 16px; }
  .workspace-heading { gap: 12px; }
  .project-field { width: min(62%, 220px); }
  .metrics { gap: 8px; }
  .metric { min-height: 76px; padding: 12px; }
  .metric-icon { display: none; }
  .metric strong { font-size: 22px; line-height: 28px; }
  .dashboard-side { grid-template-columns: minmax(0, 1fr); }
  .panel-heading { min-height: 52px; }
  .site-search { width: min(65%, 210px); }
  .filters label:not(.search) { flex: 1 1 calc(50% - 4px); }
  .filters select { width: 100%; }
  .filters label.search { flex-basis: calc(100% - 70px); }
  .preview-date { display: none; }
  .health-grid { gap: 12px; }
  th, td { padding-inline: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  </main>
  <script type="module">// ---- 标准 MCP Apps 通信；只接受直接宿主消息，不持有认证信息 ----
function createDamiBridge(handlers) {
  const pending = new Map();
  let sequence = 0;
  let closed = false;
  let ready = false;
  let host = {};
  const send = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');

  function request(method, params, timeout = 45_000) {
    if (closed || window.parent === window) return Promise.reject(new Error('请从已连接的大米插件打开工作台。'));
    const id = `dami-${++sequence}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('请求未取得结果。写操作可能已生效，请先刷新核实，勿重复提交。'));
      }, timeout);
      pending.set(id, { resolve, reject, timer });
      send({ id, method, params });
    });
  }

  function close() {
    closed = true;
    for (const item of pending.values()) {
      clearTimeout(item.timer);
      item.reject(new Error('工作台已关闭。'));
    }
    pending.clear();
    window.removeEventListener('message', receive);
  }

  function receive(event) {
    if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    const item = pending.get(message.id);
    if (item && !message.method) {
      pending.delete(message.id);
      clearTimeout(item.timer);
      if (message.error) item.reject(new Error(message.error.message || '宿主拒绝请求。'));
      else item.resolve(message.result);
      return;
    }
    if (message.method === 'ui/resource-teardown') {
      send({ id: message.id, result: {} });
      close();
    } else if (message.method === 'ui/notifications/tool-result') handlers.onResult(message.params);
    else if (message.method === 'ui/notifications/host-context-changed') handlers.onContext(message.params || {});
    else if (message.method === 'ui/notifications/tool-cancelled') handlers.onError('打开工作台的请求已取消。');
    else if (message.method && message.id !== undefined) {
      send({ id: message.id, error: { code: -32601, message: 'Method not supported' } });
    }
  }

  window.addEventListener('message', receive);
  window.addEventListener('pagehide', close, { once: true });
  return {
    async connect() {
      host = await request('ui/initialize', {
        appInfo: { name: 'Dami Workbench', version: '2.4.1' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        protocolVersion: '2026-01-26',
      }, 12_000);
      if (host.protocolVersion !== '2026-01-26') throw new Error('宿主的 MCP Apps 协议版本不兼容。');
      handlers.onContext(host.hostContext || {});
      ready = true;
      send({ method: 'ui/notifications/initialized', params: {} });
      return host.hostCapabilities || {};
    },
    async callTool(name, args = {}) {
      if (!ready || !host.hostCapabilities?.serverTools) throw new Error('当前宿主未提供工作台工具调用能力，请在对话中继续。');
      const result = await request('tools/call', { name, arguments: args });
      let payload = result?.structuredContent;
      if (!payload) {
        try { payload = JSON.parse(result?.content?.find(item => item.type === 'text')?.text || '{}'); }
        catch { throw new Error('工具未返回可识别的数据。'); }
      }
      if (!payload || typeof payload !== 'object') throw new Error('工具未返回可识别的数据。');
      if (result?.isError || payload.error) throw new Error(payload.error?.message || '工具执行失败，请刷新连接或检查权限。');
      if (!Object.hasOwn(payload, 'data')) throw new Error('工具结果缺少数据，请刷新插件连接。');
      return payload.data;
    },
    async context(value) {
      if (!ready || !host.hostCapabilities?.updateModelContext) return;
      await request('ui/update-model-context', { structuredContent: value }, 10_000);
    },
    async message(text) {
      if (!ready || !host.hostCapabilities?.message) throw new Error('当前宿主不支持发送到对话，请复制下方任务文本。');
      const result = await request('ui/message', { role: 'user', content: [{ type: 'text', text }] });
      if (result?.isError) throw new Error('任务未送达对话，请复制下方任务文本。');
    },
    openLink(url) {
      if (!ready || !host.hostCapabilities?.openLinks) return null;
      return request('ui/open-link', { url }).then(result => {
        if (result?.isError) throw new Error('当前宿主未能打开总后台，请在浏览器访问该链接。');
      });
    },
    resize(height) {
      if (ready && !closed) send({ method: 'ui/notifications/size-changed', params: { height } });
    },
  };
}

// ---- 纯展示与宿主适配；业务读写全部使用已登记 MCP 工具 ----
const $ = id => document.getElementById(id);
const pendingControls = new Set();
const state = { projects: [], projectId: '', view: 'overview', feedback: [], detail: null,
  cursor: 0, more: false, feedbackTotal: 0, feedbackQuery: {}, siteLimit: 6, epoch: 0, detailEpoch: 0,
  taskEpoch: 0, bootstrapped: false, busy: 0, deepLink: null };
const statusLabels = { unread: '未读', read: '已读', new: '新反馈', processing: '处理中', replied: '已回复', closed: '已关闭',
  pending: '待处理', preparing: '准备中', waiting: '等待中', running: '进行中', translating: '翻译中',
  publishing: '发布中', pushing: '推送中', success: '成功', succeeded: '成功', failed: '失败',
  draft: '草稿', published: '已发布', archived: '已归档', sent: '已发送', cleared: '已清空' };

function element(tag, className = '', text = '') {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = String(text ?? '');
  return node;
}

function button(text, action, className = '') {
  const node = element('button', className, text);
  node.type = 'button';
  node.addEventListener('click', () => perform(action, node));
  return node;
}

function icon(name) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const use = document.createElementNS(node.namespaceURI, 'use');
  node.classList.add('icon');
  node.setAttribute('aria-hidden', 'true');
  use.setAttribute('href', `#icon-${name}`);
  node.append(use);
  return node;
}

function notice(message = '') {
  $('notice').textContent = message;
  $('notice').hidden = !message;
}

async function perform(action, control) {
  if (control) { pendingControls.add(control); control.disabled = true; }
  state.busy++;
  $('app').setAttribute('aria-busy', 'true');
  try { await action(); }
  catch (error) { notice(error.message || '操作失败，请刷新后核实。'); }
  finally {
    pendingControls.delete(control);
    if (control?.isConnected) control.disabled = false;
    state.busy--;
    $('app').setAttribute('aria-busy', String(state.busy > 0));
    updateAiControls();
  }
}

function list(data) {
  if (Array.isArray(data)) return data;
  if (Array.isArray(data?.list)) return data.list;
  throw new Error('后台列表格式已变化，请刷新插件连接。');
}

function date(value, compact = false) {
  if (!value) return '尚无记录';
  const time = new Date(typeof value === 'number' ? value * 1000 : value);
  if (Number.isNaN(time.getTime())) return '时间未知';
  return compact ? time.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })
    : time.toLocaleString('zh-CN', { hour12: false });
}

function projectName(id) {
  return state.projects.find(item => item.project_id === id)?.app_name || id;
}

function selectedContext() {
  return { project_id: state.projectId || null, view: state.view,
    feedback_id: state.detail?.feedback?.id || null,
    selection_only: true };
}

async function syncContext() {
  try { await bridge.context(selectedContext()); }
  catch { /* 选中项同步失败不阻止读取；任务消息仍携带明确 ID。 */ }
}

async function askAgent(instruction, projectId = state.projectId) {
  const taskEpoch = ++state.taskEpoch;
  const scope = projectId ? `目标 project_id=${JSON.stringify(projectId)}。` : '范围为当前账号可访问的全部站点。';
  const text = `使用大米 MCP。${scope}${instruction}`;
  $('task-panel').hidden = false;
  $('task-fallback').hidden = true;
  $('task-text').value = text;
  $('task-status').textContent = '正在交给对话…';
  try {
    await bridge.message(text);
    if (taskEpoch === state.taskEpoch) $('task-status').textContent = '任务已交给对话，请在对话中查看处理进展。';
  } catch (error) {
    if (taskEpoch !== state.taskEpoch) return;
    $('task-status').textContent = error.message;
    $('task-fallback').hidden = false;
  }
}

function heading(title) {
  const node = element('div', 'section-heading');
  const text = element('div');
  text.append(element('h2', '', title));
  node.append(text);
  return node;
}

function healthItem(label, value, description, failed = false) {
  const node = element('article', 'health-item');
  node.append(element('span', 'meta', label), element('strong', failed ? 'error' : '', value));
  if (description) node.append(element('p', 'meta', description));
  return node;
}

// ---- 站点目录仅搜索已授权列表；不逐站请求或生成虚假运行指标 ----
function projectRow(project) {
  const name = project.app_name || project.project_id;
  const row = button('', () => selectProject(project.project_id), 'site-row');
  const copy = element('span', 'site-copy');
  copy.append(element('strong', '', name), element('span', 'meta', project.now_lang || '—'));
  row.title = String(project.app_desc || name);
  const action = element('span', 'row-action');
  action.append(icon('arrow'));
  row.append(element('span', 'site-avatar', Array.from(name)[0]?.toUpperCase() || '站'), copy, action);
  row.setAttribute('aria-label', `查看站点：${name}`);
  return row;
}

function renderProjects() {
  const query = $('site-query').value.trim().toLocaleLowerCase();
  const matches = state.projects.filter(item => [item.app_name, item.app_desc, item.project_id]
    .some(value => String(value || '').toLocaleLowerCase().includes(query)));
  const visible = matches.slice(0, state.siteLimit);
  const message = state.projects.length ? '未找到站点' : '暂无站点，请联系管理员分配';
  $('site-list').replaceChildren(...(visible.length ? visible.map(projectRow) : [element('div', 'empty', message)]));
  $('site-list-count').textContent = `${visible.length} / ${matches.length}`;
  $('more-sites').hidden = visible.length >= matches.length;
}

function updateAiControls() {
  $('ai-feedback').disabled = pendingControls.has($('ai-feedback')) || !state.bootstrapped || !state.projects.length;
  for (const id of ['ai-publish', 'ai-content']) $(id).disabled = pendingControls.has($(id)) || !state.bootstrapped || !state.projectId;
  $('ai-hint').hidden = !!state.projectId;
}

function feedbackTotal(data) {
  const total = Number(data?.total);
  if (data?.total === null || data?.total === undefined || !Number.isSafeInteger(total) || total < 0) {
    throw new Error('反馈总数格式已变化，请刷新连接。');
  }
  return total;
}

function previewFeedback(item) {
  const row = button('', () => viewFeedback('unread', item.id), 'preview-row');
  const copy = element('span', 'preview-copy');
  copy.append(element('strong', '', item.subject || '无主题'), element('span', 'meta', projectName(item.project_id)));
  const timestamp = element('span', 'preview-date', date(item.created_at, true));
  timestamp.title = date(item.created_at);
  row.append(element('span', 'unread-dot'), copy, timestamp);
  return row;
}

function showFeedbackSummary(result, countId, preview) {
  if (result.status === 'fulfilled') {
    try {
      $(countId).textContent = String(feedbackTotal(result.value));
      if (preview) {
        const rows = list(result.value).map(previewFeedback);
        $('unread-list').replaceChildren(...(rows.length ? rows : [element('div', 'empty', '暂无未读反馈。')]));
      }
      return true;
    } catch (error) { result = { status: 'rejected', reason: error }; }
  }
  $(countId).textContent = '—';
  if (preview) $('unread-list').replaceChildren(element('div', 'empty error', `读取失败：${result.reason.message}`));
  return false;
}

async function loadFeedbackSummary(epoch, projectId) {
  const unreadArgs = { after_id: 0, size: 3, read_status: 'unread' };
  const draftArgs = { after_id: 0, size: 1, has_draft: '1' };
  if (projectId) { unreadArgs.project_id = projectId; draftArgs.project_id = projectId; }
  const [unread, drafts] = await Promise.allSettled([
    bridge.callTool('list_feedback', unreadArgs), bridge.callTool('list_feedback', draftArgs),
  ]);
  if (epoch !== state.epoch) return;
  const unreadOk = showFeedbackSummary(unread, 'unread-count', true);
  const draftsOk = showFeedbackSummary(drafts, 'draft-count', false);
  $('overview-status').hidden = unreadOk && draftsOk;
  $('overview-status').textContent = unreadOk && draftsOk ? '' : '部分数据未能加载，请刷新重试';
}

async function loadOverview(epoch) {
  const projectId = state.projectId;
  $('sites-panel').hidden = !!projectId;
  $('site-summary').hidden = !projectId;
  $('site-count-label').textContent = projectId ? '当前站点' : '站点';
  $('site-count').textContent = String(projectId ? 1 : state.projects.length);
  $('unread-count').textContent = $('draft-count').textContent = '—';
  $('overview-status').hidden = true;
  $('unread-list').replaceChildren(element('div', 'empty', '加载中…'));
  for (const id of ['unread-metric', 'draft-metric', 'all-feedback']) $(id).disabled = false;
  renderProjects();
  updateAiControls();
  await Promise.all([loadFeedbackSummary(epoch, projectId), projectId ? loadSiteHealth(epoch, projectId) : null]);
}

async function loadSiteHealth(epoch, projectId) {
  $('site-health').replaceChildren(element('div', 'empty', '加载中…'));
  const values = await Promise.allSettled([
    bridge.callTool('get_site', { project_id: projectId }),
    bridge.callTool('get_publish_status', { project_id: projectId }),
    bridge.callTool('get_publish_readiness', { project_id: projectId }),
  ]);
  if (epoch !== state.epoch) return;
  const grid = element('div', 'health-grid');
  const [site, publication, readiness] = values;
  if (site.status === 'fulfilled') {
    grid.append(healthItem('源语言', site.value.config_lang || '—', `默认语言：${site.value.now_lang || '—'}`));
    grid.append(healthItem('最近推送', date(site.value.pushed_at)));
  } else grid.append(healthItem('站点信息', '读取失败', site.reason.message, true));
  if (publication.status === 'fulfilled') {
    const task = publication.value.task;
    grid.append(healthItem('发布状态', task ? statusLabels[task.status] || task.status : '暂无任务',
      task ? task.error_message || date(task.updated_at) : '', task?.status === 'failed'));
  } else grid.append(healthItem('发布状态', '读取失败', publication.reason.message, true));
  if (readiness.status === 'fulfilled') {
    const value = readiness.value;
    grid.append(healthItem('发布准备', value.blocked ? '处理中' : value.ready ? '已就绪' : '未就绪',
      value.blocked ? '有任务正在执行' : value.ready ? '' : '请检查翻译与待完成项'));
  } else grid.append(healthItem('发布准备', '检查失败', readiness.reason.message, true));
  const intro = element('div', 'site-intro');
  intro.append(element('h3', '', projectName(projectId)));
  intro.title = state.projects.find(item => item.project_id === projectId)?.app_desc || '';
  const actions = element('div', 'actions');
  actions.append(button('查看反馈', () => viewFeedback('all')), button('查看内容', () => selectView('content')));
  $('site-health').replaceChildren(intro, grid, actions);
}

function renderFeedbackList() {
  const rows = state.feedback.map(item => {
    const node = button('', () => openFeedback(item.id), 'feedback-item');
    node.dataset.feedbackId = String(item.id);
    if (state.detail?.feedback?.id === item.id) node.classList.add('selected');
    node.append(element('span', item.read_status === 'unread' ? 'badge unread' : 'badge', statusLabels[item.read_status] || item.read_status),
      element('span', 'meta', projectName(item.project_id)), element('strong', '', item.subject || '无主题'),
      element('div', 'meta', `${item.user_email || '站内反馈'} · ${date(item.created_at)}`));
    return node;
  });
  $('feedback-list').replaceChildren(...(rows.length ? rows : [element('div', 'empty', '没有符合条件的反馈。')]));
  $('load-more').hidden = !state.more;
  $('feedback-count').textContent = `${state.feedback.length} / ${state.feedbackTotal} 条`;
}

function feedbackQuery() {
  const args = {};
  if (state.projectId) args.project_id = state.projectId;
  if ($('read-filter').value) args.read_status = $('read-filter').value;
  if ($('draft-filter').value) args.has_draft = $('draft-filter').value;
  if ($('feedback-query').value.trim()) args.keyword = $('feedback-query').value.trim();
  return args;
}

async function loadFeedback(epoch, append = false) {
  // 分页沿用已提交条件，编辑筛选但尚未查询时不能混入另一组结果。
  const args = { ...state.feedbackQuery, after_id: append ? state.cursor : 0, size: 30 };
  const data = await bridge.callTool('list_feedback', args);
  if (epoch !== state.epoch) return;
  const items = list(data);
  const next = Number(data.next_after_id || 0);
  if (!append) state.feedbackTotal = feedbackTotal(data);
  state.feedback = append ? [...state.feedback, ...items.filter(item => !state.feedback.some(old => old.id === item.id))] : items;
  state.more = state.feedback.length < state.feedbackTotal && items.length > 0 && next > args.after_id;
  state.cursor = next;
  renderFeedbackList();
}

async function viewFeedback(filter, id) {
  $('read-filter').value = filter === 'unread' ? 'unread' : '';
  $('draft-filter').value = filter === 'draft' ? '1' : '';
  $('feedback-query').value = '';
  const opening = selectView('feedback');
  const epoch = state.epoch;
  await opening;
  if (id && epoch === state.epoch) await openFeedback(id);
}

function renderFeedbackDetail() {
  const data = state.detail;
  const item = data.feedback;
  const root = $('feedback-detail');
  root.replaceChildren(element('span', 'eyebrow', projectName(item.project_id)), element('h2', '', item.subject || '无主题'),
    element('p', 'meta', `${item.user_email || '站内反馈'} · ${date(item.created_at)} · ${statusLabels[item.status] || item.status}`));
  if (item.content_truncated) root.append(element('p', 'meta', '正文较长，当前展示的是截断内容。'));
  root.append(element('div', 'body-text', item.content_text || '正文为空'));
  if (item.draft_reply_original) {
    const draft = element('section', 'draft');
    draft.append(element('h3', '', `回复草稿 · ${statusLabels[item.draft_status] || item.draft_status || '已保存'}`),
      element('p', '', item.draft_subject_original || ''), element('p', '', item.draft_reply_original));
    if (item.draft_reply_zh) draft.append(element('h3', '', '中文审核稿'), element('p', '', item.draft_reply_zh));
    root.append(draft);
  }
  const actions = element('div', 'actions');
  actions.append(button('AI 起草', () => askAgent(`读取 feedback_id=${item.id} 的正文、站点事实与草稿版本，起草并保存双语回复。本次不发送邮件、不改变阅读状态。`, item.project_id), 'primary'),
    button(item.read_status === 'read' ? '标为未读' : '标为已读', async () => {
      const epoch = state.epoch;
      await bridge.callTool('set_feedback_read_status', { feedback_id: item.id, read_status: item.read_status === 'read' ? 'unread' : 'read' });
      if (epoch !== state.epoch || state.detail?.feedback?.id !== item.id) return;
      await openFeedback(item.id);
      if (epoch === state.epoch) await loadFeedback(epoch);
    }));
  root.append(actions);
  for (const reply of data.replies || []) {
    const box = element('section', 'draft');
    box.append(element('h3', '', '历史回复'), element('p', '', reply.reply_content || reply.content || ''), element('span', 'meta', date(reply.created_at)));
    root.append(box);
  }
}

async function openFeedback(id) {
  const epoch = state.epoch;
  const detailEpoch = ++state.detailEpoch;
  state.detail = null;
  $('feedback-detail').replaceChildren(element('div', 'empty', '正在读取所选反馈…'));
  renderFeedbackList();
  let data;
  try { data = await bridge.callTool('get_feedback', { feedback_id: Number(id) }); }
  catch (error) {
    if (epoch !== state.epoch || detailEpoch !== state.detailEpoch) return;
    $('feedback-detail').replaceChildren(element('div', 'empty error', '反馈详情读取失败，请重新选择或刷新。'));
    throw error;
  }
  if (epoch !== state.epoch || detailEpoch !== state.detailEpoch) return;
  if (!data?.feedback || (state.projectId && data.feedback.project_id !== state.projectId)) throw new Error('反馈不属于当前站点，请重新选择。');
  state.detail = data;
  renderFeedbackDetail();
  renderFeedbackList();
  await syncContext();
}

function contentTable(rows, kind, projectId) {
  if (!rows.length) return element('div', 'empty', kind === 'page' ? '暂无页面' : '暂无博客');
  const wrap = element('div', 'table-wrap');
  const table = element('table');
  const head = element('tr');
  for (const label of ['名称', '状态', '操作']) head.append(element('th', '', label));
  const thead = element('thead'); thead.append(head); table.append(thead);
  const body = element('tbody');
  for (const item of rows) {
    const row = element('tr');
    row.append(element('td', '', item.title || item.slug || `#${item.id}`), element('td', '', statusLabels[item.status] || item.status || '—'));
    const action = element('td');
    action.append(button('AI 查看', () => askAgent(`读取${kind === 'page' ? '页面' : '博客文章'} id=${Number(item.id)} 的详情、合同和发布状态，说明当前情况与建议。本次先读取，不修改。`, projectId), 'text-button'));
    row.append(action); body.append(row);
  }
  table.append(body); wrap.append(table); return wrap;
}

async function loadContent(epoch) {
  if (!state.projectId) { $('content').replaceChildren(element('div', 'empty', '先选择站点')); return; }
  const projectId = state.projectId;
  const results = await Promise.allSettled([
    bridge.callTool('list_pages', { project_id: projectId }),
    bridge.callTool('list_blog_posts', { project_id: projectId, page: 1, size: 20 }),
  ]);
  if (epoch !== state.epoch) return;
  const nodes = [];
  for (const [index, result] of results.entries()) {
    const section = element('section', 'panel content-section');
    section.append(heading(index === 0 ? '页面' : '博客（最近 20 篇）'));
    section.append(result.status === 'fulfilled' ? contentTable(list(result.value), index === 0 ? 'page' : 'blog', projectId)
      : element('div', 'empty error', `读取失败：${result.reason.message}`));
    nodes.push(section);
  }
  const actions = element('div', 'actions');
  actions.append(button('AI 规划', () => askAgent('读取站点定位、现有页面和博客，给出内容规划建议。本次先规划，不创建或发布。', projectId), 'primary'));
  $('content').replaceChildren(...nodes, actions);
}

async function refreshView() {
  notice();
  const epoch = ++state.epoch;
  state.detailEpoch++;
  state.taskEpoch++;
  state.detail = null;
  $('task-panel').hidden = true;
  $('feedback-detail').replaceChildren(element('div', 'empty', '选择反馈'));
  const view = $(state.view);
  if (state.view === 'feedback') {
    state.feedbackQuery = feedbackQuery();
    state.feedback = [];
    state.more = false;
    $('feedback-count').textContent = '正在查询…';
    $('feedback-list').replaceChildren(element('div', 'empty', '正在读取反馈…'));
    $('load-more').hidden = true;
  } else if (state.view === 'content') view.replaceChildren(element('div', 'empty', '正在读取当前站点数据…'));
  view.classList.add('loading');
  try {
    const load = { overview: loadOverview, feedback: loadFeedback, content: loadContent }[state.view];
    await load(epoch);
    if (epoch === state.epoch) await syncContext();
  } catch (error) {
    if (epoch !== state.epoch) return;
    if (state.view === 'feedback') {
      $('feedback-count').textContent = '查询失败';
      $('feedback-list').replaceChildren(element('div', 'empty error', '未能读取反馈，请重试。'));
    } else if (state.view === 'content') view.replaceChildren(element('div', 'empty error', '未能读取内容，请重试。'));
    throw error;
  } finally { if (epoch === state.epoch) view.classList.remove('loading'); }
}

async function selectView(view) {
  if (!['overview', 'feedback', 'content'].includes(view)) return;
  setView(view);
  await refreshView();
}

function setView(view) {
  state.view = view;
  for (const node of document.querySelectorAll('[data-view]')) {
    node.setAttribute('aria-current', node.dataset.view === view ? 'page' : 'false');
    $(node.dataset.view).hidden = node.dataset.view !== view;
  }
  updateHeading();
}

function updateHeading() {
  const titles = { overview: '概览', feedback: '用户反馈', content: '页面与博客' };
  $('workspace-title').textContent = titles[state.view];
}

function setProject(id) {
  if (id && !state.projects.some(item => item.project_id === id)) throw new Error('当前连接不能访问此站点。');
  state.projectId = id;
  $('project').value = id;
  updateHeading();
  updateAiControls();
}

async function selectProject(id) {
  setProject(id);
  await refreshView();
}

async function bootstrap(data) {
  const initial = !state.bootstrapped;
  state.projects = data.projects;
  state.bootstrapped = true;
  const options = [element('option', '', '全部站点')]; options[0].value = '';
  for (const item of data.projects) {
    const option = element('option', '', item.app_name || item.project_id); option.value = item.project_id; options.push(option);
  }
  $('project').replaceChildren(...options);
  $('project').disabled = false;
  $('refresh').disabled = false;
  if (['overview', 'feedback', 'content'].includes(data.view)) setView(data.view);
  const accessible = data.projects.some(item => item.project_id === data.project_id);
  setProject(accessible ? data.project_id : '');
  if (initial && state.deepLink) applyDeepLink(state.deepLink);
  await refreshView();
}

function applyDeepLink(path) {
  const url = new URL(path, 'https://dami.invalid');
  if (url.origin !== 'https://dami.invalid') return;
  const project = url.searchParams.get('project_id');
  if (project !== null) setProject(project);
  const view = url.searchParams.get('view');
  if (['overview', 'feedback', 'content'].includes(view)) setView(view);
}

async function followDeepLink(path) {
  applyDeepLink(path);
  await refreshView();
}

const bridge = createDamiBridge({
  onResult(result) {
    const data = result?.structuredContent?.data;
    if (result?.isError) { notice(result?.structuredContent?.error?.message || '工作台打开失败，请检查连接。'); return; }
    if (Array.isArray(data?.projects)) perform(() => bootstrap(data));
  },
  onError: notice,
  onContext(context) {
    if (context.theme === 'light' || context.theme === 'dark') document.documentElement.dataset.theme = context.theme;
    const link = context['openai/deepLink'];
    const path = typeof link === 'string' ? link : link?.url;
    if (typeof path === 'string' && path.startsWith('/') && path !== state.deepLink) {
      state.deepLink = path;
      if (state.bootstrapped) perform(() => followDeepLink(path));
    }
  },
});

$('project').addEventListener('change', event => perform(() => selectProject(event.target.value)));
$('open-backend').addEventListener('click', event => {
  const opening = bridge.openLink($('open-backend').href);
  if (opening) { event.preventDefault(); perform(() => opening); }
});
$('site-query').addEventListener('input', () => { state.siteLimit = 6; renderProjects(); });
$('more-sites').addEventListener('click', () => { state.siteLimit += 6; renderProjects(); });
$('all-sites').addEventListener('click', () => perform(() => selectProject('')));
$('unread-metric').addEventListener('click', () => perform(() => viewFeedback('unread')));
$('draft-metric').addEventListener('click', () => perform(() => viewFeedback('draft')));
$('all-feedback').addEventListener('click', () => perform(() => viewFeedback('unread')));
$('ai-feedback').addEventListener('click', () => perform(() => askAgent('读取当前范围的未读反馈，按问题归类并列出优先处理建议。本次先整理，不标记已读、不保存草稿或发送邮件。'), $('ai-feedback')));
$('ai-publish').addEventListener('click', () => perform(() => askAgent('读取站点配置、发布准备与任务状态，说明问题和建议。本次先检查，不修改或发布。'), $('ai-publish')));
$('ai-content').addEventListener('click', () => perform(() => askAgent('读取站点定位、现有页面和博客，给出内容规划建议。本次先规划，不创建或发布。'), $('ai-content')));
$('refresh').addEventListener('click', () => perform(async () => {
  const data = await bridge.callTool('list_projects');
  await bootstrap({ projects: list(data), project_id: state.projectId, view: state.view });
}, $('refresh')));
for (const node of document.querySelectorAll('[data-view]')) node.addEventListener('click', () => {
  if (state.bootstrapped) perform(() => selectView(node.dataset.view));
});
$('feedback-filters').addEventListener('submit', event => { event.preventDefault(); perform(refreshView); });
$('load-more').addEventListener('click', () => perform(() => loadFeedback(state.epoch, true), $('load-more')));
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => bridge.resize(Math.ceil($('app').getBoundingClientRect().height))).observe($('app'));
perform(async () => {
  await bridge.connect();
  $('connection').textContent = '已连接';
  $('connection').classList.add('ready');
  // 入口结果优先；仅宿主未转发初始结果时读取项目，不重复调用渲染工具。
  setTimeout(() => {
    if (!state.bootstrapped) perform(async () => bootstrap({ projects: list(await bridge.callTool('list_projects')) }));
  }, 4000);
});
</script>
</body>
</html>
