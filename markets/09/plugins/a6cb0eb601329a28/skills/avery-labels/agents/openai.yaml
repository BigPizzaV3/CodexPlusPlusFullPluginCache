interface:
  display_name: "Sheetwise Label Maker"
  short_description: "Address labels from any list"
  brand_color: "#0F6E8C"
  default_prompt: "Make 5160 address labels: Jane Smith, 123 Main St Apt 4B, Springfield IL 62704; Raj Patel, 9 Elm Rd, Austin TX 78701"
dependencies:
  tools:
    - type: "mcp"
      value: "avery-labels"
      description: "Print address labels, name badges and place cards from a list or spreadsheet, lined up with standard label sheets."
      transport: "streamable_http"
      url: "https://avery-labels.zovo.one/mcp"
