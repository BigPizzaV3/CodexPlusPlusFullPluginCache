interface:
  display_name: "Review Voicelogs"
  short_description: "Review recordings, decisions, and action items"
  default_prompt: "Use $voicelogs-review to summarize what I recorded today, including decisions and open action items."
dependencies:
  tools:
    - type: "mcp"
      value: "voicelogs"
      description: "Voicelogs recordings and transcripts MCP server"
      transport: "streamable_http"
      url: "https://api.voicelogs.co/mcp"
policy:
  allow_implicit_invocation: true
