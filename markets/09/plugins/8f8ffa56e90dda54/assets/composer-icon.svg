<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Tripseki">
  <!-- public/favicon.svg drawn unchanged at 8x: the same 32-unit mark on a
       256-unit canvas, so width/height and viewBox both report 256 px
       (OpenAI's icon minimum is 48 px; the favicon's own viewBox is 32). -->
  <g transform="scale(8)">
    <rect width="32" height="32" rx="8" fill="#0a141c"/>
    <circle cx="16" cy="16" r="4" fill="#4fe3c1"/>
    <circle cx="16" cy="16" r="8.5" fill="none" stroke="#4fe3c1" stroke-width="1.5" opacity="0.55"/>
    <circle cx="16" cy="16" r="12.5" fill="none" stroke="#4fe3c1" stroke-width="1.5" opacity="0.25"/>
  </g>
</svg>
