interface:
  display_name: "DPDP Data Map"
  short_description: "Map where personal data sits and who receives it"
  default_prompt: "Use $dpdp-planner:dpdp-data-map to draw my company's personal data map."

dependencies:
  tools:
    - type: "mcp"
      value: "dpdp-planner"
      description: "DPDP Planner MCP server. Returns the plan structures and the screens."
      transport: "streamable_http"
      url: "https://planner.meridianbridgestrategy.com/mcp"
