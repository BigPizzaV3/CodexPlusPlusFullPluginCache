interface:
  display_name: "DPDP 30-Day Plan"
  short_description: "Four weeks of DPDP actions with owners"
  default_prompt: "Use $dpdp-planner:dpdp-30-day-plan to turn my DPDP gaps into a 30-day plan."

dependencies:
