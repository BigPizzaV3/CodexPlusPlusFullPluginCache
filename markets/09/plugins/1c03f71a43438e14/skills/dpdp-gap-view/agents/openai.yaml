interface:
  display_name: "DPDP Gap View"
  short_description: "List what is missing under India's DPDP law"
  default_prompt: "Use $dpdp-planner:dpdp-gap-view to list my company's DPDP gaps with evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "dpdp-planner"
      description: "DPDP Planner MCP server. Returns the plan structures and the screens."
      transport: "streamable_http"
      url: "https://planner.meridianbridgestrategy.com/mcp"
