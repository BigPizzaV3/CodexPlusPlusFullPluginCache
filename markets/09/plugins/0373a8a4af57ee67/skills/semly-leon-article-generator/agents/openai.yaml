  short_description: "Generate, review and refine an article in Semly"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-article-generator. Choose a topic from a visibility\
