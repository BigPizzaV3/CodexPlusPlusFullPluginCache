interface:
  display_name: "Leon: AI Model Comparison"
  short_description: "Compare AI answers and prepare supported improvements"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-ai-model-comparison. Compare how available AI models answer the same customer questions about my brand. Show evidence and prepare specific improvements."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
