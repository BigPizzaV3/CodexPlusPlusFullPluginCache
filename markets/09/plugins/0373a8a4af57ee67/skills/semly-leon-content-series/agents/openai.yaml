interface:
  display_name: "Leon: Content Series"
  short_description: "Generate a coordinated series of useful articles"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-content-series. Generate and refine a series of three distinct articles in Semly for my selected offer, with a linking plan and publication order."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
