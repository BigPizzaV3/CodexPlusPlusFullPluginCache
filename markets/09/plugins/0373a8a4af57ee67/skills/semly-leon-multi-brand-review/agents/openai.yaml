interface:
  display_name: "Leon: Multi-Brand Review"
  short_description: "Review a brand portfolio and prepare next actions"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-multi-brand-review. Review all brands accessible in my Semly account. Explain which need attention and prepare one concrete next action for each."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
