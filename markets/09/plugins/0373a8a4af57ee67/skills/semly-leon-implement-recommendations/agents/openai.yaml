interface:
  display_name: "Leon: Implement Recommendations"
  short_description: "Turn Semly recommendations into useful completed work"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-implement-recommendations. Review my outstanding Semly recommendations. Prepare exact fixes and carry out clearly requested actions with available tools."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
