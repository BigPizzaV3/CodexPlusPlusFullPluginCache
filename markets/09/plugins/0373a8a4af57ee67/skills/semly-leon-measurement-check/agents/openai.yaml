interface:
  display_name: "Leon: Measurement Check"
  short_description: "Check matching, coverage and fair comparisons"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-measurement-check. Check whether my Semly results are trustworthy. Review brand matching, question coverage, sample comparability, and prepare exact configuration fixes."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
