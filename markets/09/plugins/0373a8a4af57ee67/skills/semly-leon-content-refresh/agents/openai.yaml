interface:
  display_name: "Leon: Content Refresh"
  short_description: "Prioritize and refresh existing Semly articles"
  icon_small: "./assets/semly-icon.png"
  icon_large: "./assets/semly-logo.svg"
  brand_color: "#528BFF"
  default_prompt: "Use $semly-leon-content-refresh. Review my article library, identify the most useful updates, and prepare exact revisions. Save requested draft changes in Semly."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "semly"
      description: "Connected Semly MCP with access to the customer's brand"
