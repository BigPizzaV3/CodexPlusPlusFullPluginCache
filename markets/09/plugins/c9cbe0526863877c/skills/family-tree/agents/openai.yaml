interface:
  display_name: "Zovo Family Tree"
  short_description: "Genealogy charts and posters"
  brand_color: "#2E6B4F"
  default_prompt: "Family tree: Jan Kowalski (1920-1990) married Anna Nowak; kids Piotr (1950) and Ewa (1953); Piotr's kids Tomasz and Zofia"
dependencies:
  tools:
    - type: "mcp"
      value: "family-tree"
      description: "Turn a list of relatives into a correctly laid-out family tree poster (PDF, SVG, GEDCOM)."
      transport: "streamable_http"
      url: "https://family-tree.zovo.one/mcp"
