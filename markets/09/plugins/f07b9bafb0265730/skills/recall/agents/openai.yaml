dependencies:
  tools:
    - type: "mcp"
      value: "search_notes"
      description: "Full-text keyword search over the user's notes"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "semantic_search"
      description: "Meaning-based search over the user's notes"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "get_note"
      description: "Read one note in full"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "find_similar"
      description: "Find notes related to a given note"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_notes"
      description: "List notes filtered by tag or folder"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_tags"
      description: "List the user's tags"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_folders"
      description: "List the user's folders"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_bases"
      description: "List the user's saved database views"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "query_base"
      description: "Run a saved database view and return its rows, formulas and summaries"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
