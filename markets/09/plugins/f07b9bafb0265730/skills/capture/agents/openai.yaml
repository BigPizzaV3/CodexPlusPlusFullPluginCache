dependencies:
  tools:
    - type: "mcp"
      value: "create_note"
      description: "Create a Dexi note from a title and plain-text body"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_tags"
      description: "List the user's existing tags so new notes reuse them"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
    - type: "mcp"
      value: "list_bases"
      description: "List the user's saved database views and the property keys they use"
      transport: "streamable_http"
      url: "https://mcp.dexi.net/mcp"
