interface:
  display_name: "UnboundMark workspace"
  short_description: "Find and update notes, cards, events, and files"
  default_prompt: "Use $unboundmark-workspace to find my project notes and summarize the next steps."

dependencies:
  tools:
    - type: "mcp"
      value: "unboundmark"
      description: "Access the connected UnboundMark workspace"
      transport: "streamable_http"
      url: "https://app.unboundmark.com/mcp"

policy:
  allow_implicit_invocation: true
