interface:
  display_name: "Interval analysis"
  short_description: "Analyze measurements over a selected interval"
  default_prompt: "Use $drillsense-interval-analysis to analyze an accessible well over a selected depth interval."

dependencies:
  tools:
    - type: "mcp"
      value: "drillsense"
      description: "Authorized read-only DrillSense well and drilling data"
      transport: "streamable_http"
      url: "https://mcp.drillsense.com/mcp"

policy:
  allow_implicit_invocation: true
