interface:
  display_name: "Well briefing"
  short_description: "Summarize well evidence and source freshness"
  default_prompt: "Use $drillsense-well-briefing to brief an accessible well and its available evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "drillsense"
      description: "Authorized read-only DrillSense well and drilling data"
      transport: "streamable_http"
      url: "https://mcp.drillsense.com/mcp"

policy:
  allow_implicit_invocation: true
