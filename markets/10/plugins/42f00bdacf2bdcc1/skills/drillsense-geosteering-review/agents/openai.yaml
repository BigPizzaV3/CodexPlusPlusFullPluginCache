interface:
  display_name: "Geosteering review"
  short_description: "Compare trajectory, horizons and planned geometry"
  default_prompt: "Use $drillsense-geosteering-review to compare an accessible trajectory with its horizons and plan."

dependencies:
  tools:
    - type: "mcp"
      value: "drillsense"
      description: "Authorized read-only DrillSense well and drilling data"
      transport: "streamable_http"
      url: "https://mcp.drillsense.com/mcp"

policy:
  allow_implicit_invocation: true
