interface:
  display_name: "Report draft"
  short_description: "Draft source-supported well reports in chat"
  default_prompt: "Use $drillsense-report-draft to draft a factual report for an accessible well."

dependencies:
  tools:
    - type: "mcp"
      value: "drillsense"
      description: "Authorized read-only DrillSense well and drilling data"
      transport: "streamable_http"
      url: "https://mcp.drillsense.com/mcp"

policy:
  allow_implicit_invocation: true
