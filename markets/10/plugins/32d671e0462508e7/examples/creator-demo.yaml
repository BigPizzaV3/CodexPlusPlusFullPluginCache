carousel: 1
ratio: portrait-4-5
slides: 5
background: "F4F0E8"
requires: ["layer.shape"]
layers:
  - shape: {slide: 1, at: [0.5, 0.5], size: [1, 1], kind: rectangle, fill: "111319"}
  - text: {slide: 1, at: [0.5, 0.1], string: "CAROUSEL CREATOR", font: {design: mono, size: 0.025, weight: medium}, color: "C7FF6B"}
  - text: {slide: 1, at: [0.5, 0.38], string: "От идеи\nк карусели", font: {design: system, size: 0.12, weight: heavy}, color: "F4F0E8", leading: 0.012}
  - shape: {slide: 1, at: [0.5, 0.7], size: [0.19, 0.152], kind: star5, fill: "C7FF6B", rotate: 14}
  - text: {slide: 1, at: [0.5, 0.89], string: "Создай в чате.\nПродолжи в приложении.", font: {design: system, size: 0.032, weight: regular}, color: "F4F0E8", leading: 0.008}
  - text: {slide: 2, at: [0.5, 0.1], string: "01 / ТВОЯ ИДЕЯ", font: {design: mono, size: 0.025, weight: medium}, color: "58605C"}
  - text: {slide: 2, at: [0.5, 0.3], string: "Расскажи,\nчто важно", font: {design: system, size: 0.085, weight: bold}, color: "111319", leading: 0.012}
  - shape: {slide: 2, at: [0.5, 0.55], size: [0.16, 0.008], kind: rectangle, fill: "111319"}
  - text: {slide: 2, at: [0.5, 0.72], string: "Тема и главная мысль.\nКому ты хочешь помочь.\nКакое действие предложить.", font: {design: system, size: 0.033, weight: regular}, color: "111319", leading: 0.018}
  - text: {slide: 2, at: [0.5, 0.94], string: "2 / 5", font: {design: mono, size: 0.022}, color: "58605C"}
  - shape: {slide: 3, at: [0.5, 0.5], size: [1, 1], kind: rectangle, fill: "C7FF6B"}
  - text: {slide: 3, at: [0.5, 0.1], string: "02 / СТРУКТУРА", font: {design: mono, size: 0.025, weight: medium}, color: "111319"}
  - text: {slide: 3, at: [0.5, 0.32], string: "Одна мысль.\nОдин слайд.", font: {design: system, size: 0.085, weight: bold}, color: "111319", leading: 0.012}
  - text: {slide: 3, at: [0.5, 0.67], string: "Обложка привлекает.\nДетали раскрывают тему.\nФинал даёт следующий шаг.", font: {design: system, size: 0.032, weight: regular}, color: "111319", leading: 0.018}
  - text: {slide: 3, at: [0.5, 0.94], string: "3 / 5", font: {design: mono, size: 0.022}, color: "111319"}
  - text: {slide: 4, at: [0.5, 0.1], string: "03 / СВОБОДА ПРАВОК", font: {design: mono, size: 0.025, weight: medium}, color: "58605C"}
  - text: {slide: 4, at: [0.5, 0.32], string: "Каждый слой\nможно менять", font: {design: system, size: 0.08, weight: bold}, color: "111319", leading: 0.012}
  - shape: {slide: 4, at: [0.5, 0.6], size: [0.13, 0.104], kind: diamond, fill: "C7FF6B", stroke: {width: 0.005, color: "111319"}}
  - text: {slide: 4, at: [0.5, 0.8], string: "Перепиши текст.\nДобавь свои фотографии.\nПодбери цвета и шрифты.", font: {design: system, size: 0.033, weight: regular}, color: "111319", leading: 0.018}
  - text: {slide: 4, at: [0.5, 0.94], string: "4 / 5", font: {design: mono, size: 0.022}, color: "58605C"}
  - shape: {slide: 5, at: [0.5, 0.5], size: [1, 1], kind: rectangle, fill: "111319"}
  - text: {slide: 5, at: [0.5, 0.1], string: "ТВОЯ СЛЕДУЮЩАЯ КАРУСЕЛЬ", font: {design: mono, size: 0.022, weight: medium}, color: "C7FF6B"}
  - text: {slide: 5, at: [0.5, 0.4], string: "Придумай.\nСоздай.\nОткрой.", font: {design: system, size: 0.105, weight: heavy}, color: "F4F0E8", leading: 0.014}
  - text: {slide: 5, at: [0.5, 0.8], string: "Скачай файл .carousel\nи импортируй в приложение.", font: {design: system, size: 0.031, weight: regular}, color: "C7FF6B", leading: 0.008}
  - text: {slide: 5, at: [0.5, 0.94], string: "5 / 5", font: {design: mono, size: 0.022}, color: "F4F0E8"}
