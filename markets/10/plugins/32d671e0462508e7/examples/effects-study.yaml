carousel: 1
ratio: "portrait-4-5"
slides: 2
background: "F4F0E8"
requires:
  - "layer.mask"
  - "layer.shape"
  - "layer.shape.gradient"
  - "layer.blender"
layers:
  - text:
      slide: 1
      at:
        - 0.5
        - 0.5
      string: "COLOR"
      font:
        family: "Unbounded@1"
        size: 0.16
      color: "000000"
      align: "left"
  - mask:
      slide: 1
      at:
        - 0.5
        - 0.5
      size:
        - 1
        - 1
      color: "000000"
  - shape:
      slide: 1
      at:
        - 0.5
        - 0.5
      size:
        - 1
        - 1
      kind: "rectangle"
      fill: "FF4D6D"
      gradient:
        style: "linear"
        angle: 0
        stops:
          - at: 0
            color: "FF4D6D"
          - at: 1
            color: "705CFF"
  - shape:
      slide: 2
      at:
        - 0.36
        - 0.5
      size:
        - 0.43
        - 0.344
      kind: "ellipse"
      fill: "FFC04C"
  - blender:
      slide: 2
      at:
        - 0.5
        - 0.5
      size:
        - 1
        - 1
      mode: "multiply"
  - shape:
      slide: 2
      at:
        - 0.64
        - 0.5
      size:
        - 0.43
        - 0.344
      kind: "ellipse"
      fill: "4CA9DD"
