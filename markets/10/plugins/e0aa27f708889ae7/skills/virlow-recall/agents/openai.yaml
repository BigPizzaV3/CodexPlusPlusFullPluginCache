interface:
  display_name: "Virlow Recall"
  short_description: "Recall your projects, people and decisions from Virlow"
  brand_color: "#775825"
  default_prompt: "Use $virlow-recall to check what Virlow remembers about this before answering."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "virlow"
      description: "Virlow hosted connector for notes and memories"
      transport: "streamable_http"
      url: "https://api.virlow.com/api/connector/mcp"
