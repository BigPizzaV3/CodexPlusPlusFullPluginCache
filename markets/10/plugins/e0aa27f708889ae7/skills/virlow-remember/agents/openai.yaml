interface:
  display_name: "Virlow Remember"
  short_description: "Save lasting facts and preferences to Virlow"
  brand_color: "#775825"
  default_prompt: "Use $virlow-remember to save this to my Virlow memories."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "virlow"
      description: "Virlow hosted connector for notes and memories"
      transport: "streamable_http"
      url: "https://api.virlow.com/api/connector/mcp"
