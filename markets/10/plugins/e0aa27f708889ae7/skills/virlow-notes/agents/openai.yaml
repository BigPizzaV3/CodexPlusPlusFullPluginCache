interface:
  display_name: "Virlow Notes"
  short_description: "Find, read, create and update your Virlow notes"
  brand_color: "#775825"
  default_prompt: "Use $virlow-notes to find my notes about this topic."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "virlow"
      description: "Virlow hosted connector for notes and memories"
      transport: "streamable_http"
      url: "https://api.virlow.com/api/connector/mcp"
