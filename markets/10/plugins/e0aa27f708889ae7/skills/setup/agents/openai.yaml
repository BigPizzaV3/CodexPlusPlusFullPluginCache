interface:
  display_name: "Set up Virlow"
  short_description: "Connect Virlow, unlock it and turn on AI memories"
  brand_color: "#775825"
  default_prompt: "Use $setup to connect Virlow and get me started."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "virlow"
      description: "Virlow hosted connector for notes and memories"
      transport: "streamable_http"
      url: "https://api.virlow.com/api/connector/mcp"
