interface:
  display_name: "Messages"
  short_description: "Write, read and wait for email and texts"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  default_prompt: "Check your inbox and tell me who wrote to you."

dependencies:
  tools:
    - type: "mcp"
      value: "artil"
      description: "Artil MCP server for the agent account's email and texts"
      transport: "streamable_http"
      url: "https://mcp.artil.dev/mcp"
