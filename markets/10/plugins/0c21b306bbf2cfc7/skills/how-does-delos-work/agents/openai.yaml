interface:
  display_name: "How Does Delos Work?"
  short_description: "Understand Delos services and enquiry options"
  default_prompt: "Use $how-does-delos-work to explain which Delos service could fit my payment situation."

dependencies:
  tools:
    - type: "mcp"
      value: "delos"
      description: "Retrieve Delos product guidance when exposed by this connection"
      transport: "streamable_http"
      url: "https://api.delosintelligence.com/mcp"

policy:
  allow_implicit_invocation: true

