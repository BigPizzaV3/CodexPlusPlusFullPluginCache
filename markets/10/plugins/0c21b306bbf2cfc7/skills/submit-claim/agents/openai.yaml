interface:
  display_name: "Prepare and submit a Delos enquiry"
  short_description: "Prepare, review and send a Delos enquiry"
  default_prompt: "Use $submit-claim to prepare my Delos enquiry, review the details and files with me, and send it after I confirm."

dependencies:
  tools:
    - type: "mcp"
      value: "delos"
      description: "Prepare supported Delos enquiries and submit them after confirmation"
      transport: "streamable_http"
      url: "https://api.delosintelligence.com/mcp"

policy:
  allow_implicit_invocation: true

