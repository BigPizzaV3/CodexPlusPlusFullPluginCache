<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listin3D scene</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #eeeee8;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <!-- Libraries must come from absolute HTTPS URLs that allow CORS. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // Units are meters, +Y is up.
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xeeeee8);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
      camera.position.set(3, 2, 4);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.6, 0);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8d80, 1.2));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(4, 8, 3);
      sun.castShadow = true;
      scene.add(sun);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(6, 64),
        new THREE.MeshStandardMaterial({ color: 0xd9d9cf }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Replace this placeholder with the product or room geometry.
      const product = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.8, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x6b8f71, roughness: 0.6 }),
      );
      product.position.y = 0.4;
      product.castShadow = true;
      scene.add(product);

      function resize() {
        const { clientWidth: width, clientHeight: height } = document.body;
        renderer.setSize(width, height, false);
        camera.aspect = width / Math.max(height, 1);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      // Render only while visible; Listin3D pauses offscreen scenes.
      let visible = true;
      function frame() {
        if (!visible || document.hidden) return;
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      function setVisible(next) {
        const resume = next && !visible;
        visible = next;
        if (resume) requestAnimationFrame(frame);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && visible) requestAnimationFrame(frame);
      });

      // Listin3D lifecycle. Accept messages only from the embedding parent.
      addEventListener("message", (event) => {
        if (event.source !== parent) return;
        if (event.data?.type === "LISTIN3D_VISIBILITY")
          setVisible(event.data.visible !== false);
        // LISTIN3D_LANGUAGE carries "en", "tr" or "es" for scene labels.
      });
      requestAnimationFrame(frame);
      // Required: tells Listin3D the scene is ready to show.
      parent.postMessage({ type: "LISTIN3D_READY" }, "*");
    </script>
  </body>
</html>
