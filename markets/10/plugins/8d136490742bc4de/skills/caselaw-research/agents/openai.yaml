interface:
  display_name: "Caselaw research"
  short_description: "Search U.S. cases in LawDiver by jurisdiction and summarize with real citations."
  brand_color: "#0B3D2E"
  default_prompt: "Search LawDiver for cases on this issue in the jurisdiction I specify."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "lawdiver"
      description: "LawDiver caselaw MCP server"
      transport: "streamable_http"
      url: "https://lawdiver.com/mcp"
