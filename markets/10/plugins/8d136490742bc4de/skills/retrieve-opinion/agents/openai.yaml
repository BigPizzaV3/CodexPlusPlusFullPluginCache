interface:
  display_name: "Retrieve opinion"
  short_description: "Resolve a citation and load full LawDiver opinion text for quotes and pin cites."
  brand_color: "#0B3D2E"
  default_prompt: "Retrieve this case from LawDiver and load the full opinion text."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "lawdiver"
      description: "LawDiver caselaw MCP server"
      transport: "streamable_http"
      url: "https://lawdiver.com/mcp"
