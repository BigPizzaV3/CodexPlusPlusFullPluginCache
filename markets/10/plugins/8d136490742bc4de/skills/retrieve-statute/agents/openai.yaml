interface:
  display_name: "Retrieve statute"
  short_description: "Pull statute, regulation, or court-rule section text from LawDiver."
  brand_color: "#0B3D2E"
  default_prompt: "Retrieve the full text of this statute section from LawDiver."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "lawdiver"
      description: "LawDiver caselaw MCP server"
      transport: "streamable_http"
      url: "https://lawdiver.com/mcp"
