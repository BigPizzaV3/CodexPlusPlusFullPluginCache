interface:
  display_name: "Check citation / good law"
  short_description: "Verify cites in LawDiver and report match status and treatment signals."
  brand_color: "#0B3D2E"
  default_prompt: "Check this citation in LawDiver and tell me if it is still good law."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "lawdiver"
      description: "LawDiver caselaw MCP server"
      transport: "streamable_http"
      url: "https://lawdiver.com/mcp"
