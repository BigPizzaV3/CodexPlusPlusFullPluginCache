<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-gradient-logo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#3B82F6" />
        </linearGradient>

        <linearGradient id="glass-gradient-logo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="white" stop-opacity="0.95" />
            <stop offset="100%" stop-color="white" stop-opacity="0.5" />
        </linearGradient>

        <filter id="shadow-logo" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
            <feOffset dx="0" dy="6" result="offsetBlur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg-gradient-logo)" />

    <g filter="url(#shadow-logo)" transform="translate(256 256)">
        <path
            d="M40 0 H200 C222.091 0 240 17.9086 240 40 V150 C240 172.091 222.091 190 200 190 H100 L40 230 V190 H40 C17.9086 190 0 172.091 0 150 V40 C0 17.9086 17.9086 0 40 0 Z"
            transform="rotate(180) translate(-120, -95) translate(30, 30)" 
            fill="white"
            fill-opacity="0.25"
        />

        <path
            d="M40 0 H200 C222.091 0 240 17.9086 240 40 V150 C240 172.091 222.091 190 200 190 H100 L40 230 V190 H40 C17.9086 190 0 172.091 0 150 V40 C0 17.9086 17.9086 0 40 0 Z"
            transform="translate(-120, -95) translate(30, 30)" 
            fill="url(#glass-gradient-logo)"
        />

        <g transform="translate(30, 30)">
            <circle cx="-40" cy="0" r="14" fill="#6366F1" />
            <circle cx="0" cy="0" r="14" fill="#6366F1" />
            <circle cx="40" cy="0" r="14" fill="#6366F1" />
        </g>
    </g>
</svg>
