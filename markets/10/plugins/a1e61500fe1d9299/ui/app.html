<body>
  <div class="shell portal-shell">
    <header class="brandbar" id="nav" aria-label="Italic"><div class="brandbar-start" id="nav-devices"></div><button type="button" id="brand-home" class="brand" aria-label="Library"><!-- @italic-logo --></button><div class="brandbar-end" id="nav-end"></div></header>
    <div id="notice" class="notice" role="alert" hidden></div>
    <main id="main"><div class="loading" role="status">Opening your Italic library…</div></main>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>
  <script>
  (() => {
    'use strict';
    const languages = /* @italic-languages */ [];
    const symbolPaths = /* @italic-icons */ {};
    const deviceImages = /* @italic-device-images */ {};
    const main = document.getElementById('main'), nav = document.getElementById('nav');
    const state = {view:'library', data:{}, permissions:[], filters:{}, accountId:null, busy:false, draft:null, confirm:null};
    let generation=0, searchTimer, rpcId=0, hostOrigin=null, bridgeReady;
    /* @italic-tool-call */
    /* @italic-font-loader */
    const fonts = /* @italic-fonts */ [];
    loadItalicFonts(fonts).catch(()=>{});
    const pending=new Map();
    const can=scope=>state.permissions.includes(scope);
    const h=(tag,props={},...children)=>{
      const node=document.createElement(tag);
      for(const [key,value] of Object.entries(props)){
        if(value===undefined||value===null)continue;
        if(key.startsWith('on'))node.addEventListener(key.slice(2).toLowerCase(),value);
        else if(key==='className')node.className=value;
        else if(key==='value')node.value=value;
        else if(key==='disabled'||key==='checked'||key==='hidden')node[key]=Boolean(value);
        else node.setAttribute(key,String(value));
      }
      for(const child of children.flat(Infinity))if(child!==null&&child!==undefined)node.append(child instanceof Node?child:document.createTextNode(String(child)));
      return node;
    };
    function icon(name,size=16){
      const glyph=symbolPaths[name];if(!glyph)throw new Error('Unknown Italic symbol: '+name);
      const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),path=document.createElementNS(ns,'path');
      svg.setAttribute('width',size);svg.setAttribute('height',size);svg.setAttribute('viewBox',glyph.viewBox);svg.setAttribute('class','sf-symbol');svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');path.setAttribute('d',glyph.d);path.setAttribute('fill','currentColor');svg.append(path);return svg;
    }
    const deviceIcon=recordingSource=>({phone:'iphone','sudo':'ring',ring:'ring',glyph:'platter.filled.bottom.iphone',pocket:'platter.filled.bottom.iphone',caption:'platter.filled.bottom.iphone',dex:'iphone.rear.camera'})[recordingSource];
    const button=(text,fn,props={})=>h('button',{type:'button',className:'button',disabled:state.busy,onClick:fn,...props},text);
    const link=(text,path)=>h('a',{href:'https://app.italic.com'+path,target:'_blank',rel:'noopener noreferrer',className:'muted-link'},text.replace(/\s*↗$/,''),icon('arrow.up.right',12));
    function message(text,error=false){const node=document.getElementById('notice');node.textContent=text;node.hidden=!text;node.classList.toggle('error',error);}
    function status(text){document.getElementById('status').textContent=text;}
    function rpc(method,params){
      return new Promise((resolve,reject)=>{
        const id=++rpcId,timer=setTimeout(()=>{pending.delete(id);reject(new Error('Italic didn’t respond. Try again.'));},30000);
        pending.set(id,{resolve,reject,timer});
        window.parent.postMessage({jsonrpc:'2.0',id,method,params},hostOrigin||'*');
      });
    }
    function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},hostOrigin||'*');}
    function applyTheme(context){
      const dark=context?.theme==='dark'||(!context?.theme&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=dark?'dark':'light';
    }
    const call=(name,args={})=>callItalicTool({ready:bridgeReady,request:rpc,current:()=>({accountId:state.accountId,generation})},name,args);
    window.addEventListener('message',event=>{
      if(event.source!==window.parent||(hostOrigin&&event.origin!==hostOrigin))return;
      const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
      if(typeof m.id==='number'){
        const request=pending.get(m.id);if(!request)return;
        if(!hostOrigin&&event.origin!=='null')hostOrigin=event.origin;
        pending.delete(m.id);clearTimeout(request.timer);
        if(m.error)request.reject(new Error(m.error.message||'The host could not complete this request.'));else request.resolve(m.result);
        return;
      }
      if(m.method==='ui/notifications/host-context-changed'&&m.params?.theme)applyTheme(m.params);
      if(m.method==='ui/notifications/tool-result'){
        const response=m.params;
        if(response?.isError){message(response.structuredContent?.error?.message||'Italic could not open this view.',true);return;}
        const data=response?._meta?.initialData||response?.structuredContent;
        if(!data?.view)return;
        clearTimeout(searchTimer);
        const sameAccount=!response._meta?.accountId||state.accountId===response._meta.accountId;
        if(sameAccount&&state.draft&&data.view!==state.view){
          if(state.draft.mode!=='settings'||state.draft.dirty){message('Save or cancel your edit before opening another Italic view.');return;}
          state.draft=null;
        }
        // Switching connections clears drafts and data before displaying the new account.
        if(response._meta?.accountId&&state.accountId!==response._meta.accountId){
          generation++;state.draft=null;state.confirm=null;state.filters={};state.accountId=response._meta.accountId;
        }
        generation++;state.busy=false;state.view=data.view;state.data=data;state.permissions=data.permissions||state.permissions;
        if(m.params._meta?.filters)state.filters=m.params._meta.filters;
        message('');render();status('');
      }
    });
    bridgeReady=rpc('ui/initialize',{appInfo:{name:'italic',version:/* @italic-version */ "1.0.0"},appCapabilities:{availableDisplayModes:['fullscreen']},protocolVersion:'2026-01-26'})
      .then(host=>{
        applyTheme(host?.hostContext);notify('ui/notifications/initialized',{});
        if(host?.hostContext?.displayMode==='inline'&&host.hostContext.availableDisplayModes?.includes('fullscreen')){
          rpc('ui/request-display-mode',{mode:'fullscreen'}).catch(()=>{});
        }
        return host;
      })
      .catch(()=>{main.replaceChildren(h('div',{className:'empty'},h('h2',{},'Open Italic in ChatGPT'),h('p',{},'This interface connects to your Italic account through the ChatGPT plugin.'),link('Open Italic on the web','/app')));return null;});
    const date=ms=>new Date(ms||0).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    const clock=ms=>new Date(ms||0).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const content=r=>r.content||{kind:r.processing?.kind||'clip',title:'',transcript:'',summary:'',recordedAt:r.processing?.recordedAt||0};
    const name=r=>content(r).title||(content(r).kind==='clip'?'Untitled Clip':'Untitled Memo');
    const deviceName=d=>d.customName||d.defaultName;
    const recordingSourceLabels={phone:'iPhone','sudo':'Sudo',ring:'Sudo',glyph:'Glyph',dex:'Dex',pocket:'Caption',caption:'Caption'};
    const actionNames={send_webhook:'Send webhook',send_email:'Send email',create_event:'Create event',create_reminder:'Create reminder'};
    function heading(title,subtitle,actions=[]){return h('div',{className:'heading'},h('div',{},h('h1',{},title),subtitle?h('p',{className:'meta'},subtitle):null),h('div',{className:'actions'},actions));}
    function empty(title,description,action){return h('div',{className:'empty'},h('h2',{},title),h('p',{},description),action);}
    function render(){
      const searchFocused=document.activeElement?.id==='library-search';
      const selection=searchFocused?document.activeElement.selectionStart:null;

      const anchor=event.target.closest('a');if(!anchor)return;
      const url=new URL(anchor.href);if(url.origin!=='https://app.italic.com'){event.preventDefault();return;}
      if(typeof window.openai?.openExternal==='function'){event.preventDefault();window.openai.openExternal({href:url.href});}
    });
  })();
  </script>
</body>
</html>
