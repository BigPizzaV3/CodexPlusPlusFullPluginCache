<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="vial-reference-title vial-reference-desc">
  <title id="vial-reference-title">Stoppered vial equipment reference</title>
  <desc id="vial-reference-desc">A schematic of an upright, closed vial identifies the stopper and vial. The interior has no liquid level, amount, or preparation instructions. This is an equipment reference, not a procedure.</desc>
  <style>
    .vial-text { fill: var(--diagram-ink, #1c1c1e); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .vial-muted { fill: var(--diagram-muted, #645e54); }
    .vial-outline { stroke: var(--diagram-ink, #1c1c1e); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .vial-leader { fill: none; stroke: var(--diagram-muted, #645e54); stroke-width: 1.5; stroke-linecap: round; }
    .vial-gold { fill: var(--diagram-gold, #c9a96e); }
    .vial-paper { fill: var(--diagram-paper, #faf8f5); }
  </style>
  <text class="vial-text" x="20" y="28" font-size="22" font-weight="650">Stoppered vial</text>
  <text class="vial-text vial-muted" x="20" y="54" font-size="17">Equipment reference</text>

  <path class="vial-paper vial-outline" d="M141 102V118C141 126 118 130 118 145V214C118 222 124 228 132 228H228C236 228 242 222 242 214V145C242 130 219 126 219 118V102Z"/>
  <ellipse class="vial-gold" cx="180" cy="171" rx="44" ry="40" opacity=".08"/>
  <path d="M131 151V208" fill="none" stroke="var(--diagram-gold, #c9a96e)" stroke-width="3" stroke-linecap="round" opacity=".3"/>
  <rect class="vial-paper vial-outline" x="133" y="87" width="94" height="27" rx="5"/>
  <rect class="vial-gold vial-outline" x="151" y="81" width="58" height="15" rx="5"/>
  <path class="vial-leader" d="M212 86H258"/>
  <text class="vial-text" x="266" y="92" font-size="16">Stopper</text>
  <path class="vial-leader" d="M246 177H280"/>
  <text class="vial-text" x="288" y="183" font-size="16">Vial</text>
  <text class="vial-text vial-muted" x="22" y="263" font-size="16">Schematic only. Not to scale.</text>
</svg>
