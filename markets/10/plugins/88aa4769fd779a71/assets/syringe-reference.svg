<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="syringe-reference-title syringe-reference-desc">
  <title id="syringe-reference-title">Syringe equipment reference</title>
  <desc id="syringe-reference-desc">A schematic of an empty, covered syringe identifies its plunger, barrel, and covered needle. The barrel shows scale endpoints only. This is an equipment reference, not a preparation or administration procedure.</desc>
  <style>
    .syringe-text { fill: var(--diagram-ink, #1c1c1e); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .syringe-muted { fill: var(--diagram-muted, #645e54); }
    .syringe-outline { stroke: var(--diagram-ink, #1c1c1e); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .syringe-leader { fill: none; stroke: var(--diagram-muted, #645e54); stroke-width: 1.5; stroke-linecap: round; }
    .syringe-gold { fill: var(--diagram-gold, #c9a96e); }
    .syringe-paper { fill: var(--diagram-paper, #faf8f5); }
  </style>
  <text id="diagram-syringe-label" class="syringe-text" x="20" y="28" font-size="22" font-weight="650">U-100 syringe</text>
  <text id="diagram-capacity-label" class="syringe-text syringe-muted" x="20" y="54" font-size="17">1 mL example barrel</text>

  <text class="syringe-text" x="20" y="93" font-size="16">Plunger</text>
  <path class="syringe-leader" d="M52 100V121"/>
  <text class="syringe-text" x="159" y="93" font-size="16" text-anchor="middle">Barrel</text>
  <path class="syringe-leader" d="M159 100V120"/>

  <rect class="syringe-paper syringe-outline" x="87" y="124" width="153" height="42" rx="5"/>
  <rect class="syringe-gold" x="101" y="129" width="131" height="32" rx="2" opacity=".11"/>
  <path class="syringe-outline" d="M101 131V140M231 131V140" fill="none"/>
  <text id="diagram-scale-start" class="syringe-text" x="219" y="158" font-size="16" text-anchor="middle">0</text>
  <text id="diagram-scale-end" class="syringe-text" x="108" y="158" font-size="16" text-anchor="middle">100</text>
  <path class="syringe-paper syringe-outline" d="M36 139H88V151H36Z"/>
  <rect class="syringe-paper syringe-outline" x="28" y="127" width="12" height="36" rx="3"/>
  <path class="syringe-outline" d="M87 116V174" fill="none"/>
  <path class="syringe-paper syringe-outline" d="M240 134H253L262 140V150L253 156H240Z"/>
  <rect class="syringe-gold syringe-outline" x="258" y="134" width="66" height="22" rx="6"/>
  <path class="syringe-outline" d="M268 135V155" fill="none" opacity=".55"/>

  <path class="syringe-leader" d="M291 160V187H311"/>
  <text class="syringe-text" x="334" y="211" font-size="16" text-anchor="end">Covered needle</text>
  <text id="diagram-scale-unit" class="syringe-text syringe-muted" x="22" y="237" font-size="16">U-100 scale units</text>
  <text class="syringe-text syringe-muted" x="22" y="263" font-size="16">Schematic only. Not to scale.</text>
</svg>
