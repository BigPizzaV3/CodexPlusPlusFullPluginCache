interface:
  display_name: "Prism Project research"
  short_description: "Research private Projects with citations"
  default_prompt: "Use $prism-project-research to find the strongest evidence in my Prism Project and cite the saved sources."
dependencies:
  tools:
    - type: "mcp"
      value: "prism"
      description: "Authorized Prism Projects and knowledge tools"
      transport: "streamable_http"
      url: "https://app.tryprism.xyz/api/mcp"
policy:
  allow_implicit_invocation: true
