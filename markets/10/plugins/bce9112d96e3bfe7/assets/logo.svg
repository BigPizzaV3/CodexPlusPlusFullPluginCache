  <!-- W -->
  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="240" fill="url(#shieldGrad)" letter-spacing="-10">W</text>
  
  <!-- Padlock (Bottom Right) -->
  <circle cx="390" cy="390" r="70" fill="#1E293B" stroke="url(#shieldGrad)" stroke-width="8"/>
  <rect x="360" y="375" width="60" height="45" rx="6" fill="url(#lockGrad)"/>
  <path d="M370 375V360A20 20 0 0 1 410 360V375" stroke="url(#lockGrad)" stroke-width="6" stroke-linecap="round"/>
