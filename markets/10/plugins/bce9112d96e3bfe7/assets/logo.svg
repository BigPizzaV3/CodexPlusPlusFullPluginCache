<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  
  <!-- Shield -->
  <path d="M256 32C160 32 64 64 64 64V224C64 336 144 432 256 464C368 432 448 336 448 224V64C448 64 352 32 256 32Z" 
