interface:
  display_name: "Mention"
  short_description: "Choose and use the correct Mention MCP tools"
  default_prompt: "Use $mention to analyze my brand visibility and choose the correct Mention tools."

dependencies:
  tools:
    - type: "mcp"
      value: "mention"
      description: "Mention remote MCP for brand visibility and GEO workflows"
      transport: "streamable_http"
      url: "https://mcp.mention.ma/mcp"

policy:
  allow_implicit_invocation: true
