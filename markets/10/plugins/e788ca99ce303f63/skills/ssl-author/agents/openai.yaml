interface:
  display_name: "Short Story Lovers Author"
  short_description: "Write and manage your SSL author work"
  default_prompt: "Help me work on my Short Story Lovers author account."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "ssl"
      description: "Authenticated Short Story Lovers author data and actions"
      transport: "streamable_http"
      url: "https://mcp.shortstorylovers.com/mcp"
