# name is rewritten by scripts/new-plugin.sh to <slug>-stag. Deploys to https://<slug>-stag.upsurge.workers.dev
name = "lauki-emi-stag"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f96ba3d46faf40d3b7853d737b3755e7"
workers_dev = true
# Permanent MCP host submitted to OpenAI (wave 2, Oct 5 2026); the MCP URL cannot change after submission
# *.lauki.ai/* -> lauki-sites zone route beats the custom domain (404, Oct 5 2026): the explicit zone route below wins over the wildcard
routes = [{ pattern = "emi-mcp.lauki.ai", custom_domain = true }, { pattern = "emi-mcp.lauki.ai/*", zone_name = "lauki.ai" }]

[observability]
enabled = true
