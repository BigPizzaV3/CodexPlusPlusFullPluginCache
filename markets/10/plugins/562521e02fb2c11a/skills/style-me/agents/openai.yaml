interface:
  display_name: "Style me"
  short_description: "Style advice using your saved Cladwell context"
  default_prompt: "Use $style-me to help me plan outfits with my fall capsule."
dependencies:
  tools:
    - type: "mcp"
      value: "cladwell"
      description: "Read entitled closet, capsule, style, wear and preference context; share requested visualization references."
      transport: "streamable_http"
      url: "https://account.cladwell.com/chatgpt/mcp"
policy:
  allow_implicit_invocation: true
