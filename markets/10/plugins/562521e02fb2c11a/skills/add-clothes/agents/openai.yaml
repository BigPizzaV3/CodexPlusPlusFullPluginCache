interface:
  display_name: "Add clothes"
  short_description: "Add prepared clothing directly to your capsule"
  default_prompt: "Use $add-clothes to add this clothing photo to my Cladwell closet."
dependencies:
  tools:
    - type: "mcp"
      value: "cladwell"
      description: "Save requested clothing images and mapped facts to the selected capsule."
      transport: "streamable_http"
      url: "https://account.cladwell.com/chatgpt/mcp"
policy:
  allow_implicit_invocation: true
