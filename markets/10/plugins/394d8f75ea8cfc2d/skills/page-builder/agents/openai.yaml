interface:
  display_name: "Page builder"
  short_description: "Build, edit and publish funnel landing pages from a brief"
  default_prompt: "Use Captino to build a landing page with an opt-in form for my Spring Campaign funnel."

dependencies:
  tools:
    - type: "mcp"
      value: "captino"
      description: "Captino MCP server: funnels, contacts and leads, performance metrics, subscription"
      transport: "streamable_http"
      url: "https://api.captino.io/mcp"
