interface:
  display_name: "Funnel drop-off"
  short_description: "Find the step or form question where visitors leave a funnel"
  default_prompt: "Use Captino to find where visitors drop off in my Spring Campaign funnel."

dependencies:
  tools:
    - type: "mcp"
      value: "captino"
      description: "Captino MCP server: funnels, contacts and leads, performance metrics, subscription"
      transport: "streamable_http"
      url: "https://api.captino.io/mcp"
