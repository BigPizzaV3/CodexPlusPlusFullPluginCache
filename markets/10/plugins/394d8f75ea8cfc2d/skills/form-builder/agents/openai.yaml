interface:
  display_name: "Form builder"
  short_description: "Build, edit and publish lead forms and add them to a funnel"
  default_prompt: "Use Captino to build a lead qualification form and add it to my Spring Campaign funnel."

dependencies:
  tools:
    - type: "mcp"
      value: "captino"
      description: "Captino MCP server: funnels, contacts and leads, performance metrics, subscription"
      transport: "streamable_http"
      url: "https://api.captino.io/mcp"
