interface:
  display_name: "Lead follow-up"
  short_description: "Qualify a lead, move it through the pipeline, add a note or book a meeting"
  default_prompt: "Use Captino to mark the lead from yesterday as an opportunity and add a note about our call."

dependencies:
  tools:
    - type: "mcp"
      value: "captino"
      description: "Captino MCP server: funnels, contacts and leads, performance metrics, subscription"
      transport: "streamable_http"
      url: "https://api.captino.io/mcp"
