interface:
  display_name: "Funnel performance"
  short_description: "Visits, opt-ins and period-over-period change for your funnels"
  default_prompt: "Use Captino to show how my best funnel did last week compared to the week before."

dependencies:
  tools:
    - type: "mcp"
      value: "captino"
      description: "Captino MCP server: funnels, contacts and leads, performance metrics, subscription"
      transport: "streamable_http"
      url: "https://api.captino.io/mcp"
