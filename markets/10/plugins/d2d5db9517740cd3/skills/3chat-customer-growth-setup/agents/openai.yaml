interface:
  display_name: "Set up 3Chat Customer Growth"
  short_description: "Complete 3Chat startup milestones"
  default_prompt: "Check which 3Chat startup milestones I have completed and guide me through any missing steps."

dependencies:
  tools:
    - type: "mcp"
      value: "3chat-customer-growth"
      description: "Check whether the current 3Chat workspace has ever published an Agent and ever connected a messaging channel."
      transport: "streamable_http"
      url: "https://app.3chat.ai/mcp"

policy:
  allow_implicit_invocation: false
