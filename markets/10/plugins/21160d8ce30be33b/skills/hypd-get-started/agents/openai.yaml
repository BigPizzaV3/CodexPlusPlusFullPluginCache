interface:
  display_name: "Get started with Keyword Research by HYPD AI"
  short_description: "Run a first keyword search and get Google's own numbers"
  default_prompt: "Use $hypd-get-started to help me get started with Keyword Research by HYPD AI."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "keyword-research"
      description: "HYPD Keyword Research tools for ideas, volumes and advertising forecasts"
      transport: "streamable_http"
      url: "https://keywordresearch.hypd.ai/mcp"
