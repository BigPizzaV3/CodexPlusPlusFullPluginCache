interface:
  display_name: "Campaign pulse"
  short_description: "Sends, replies and opt-ins across your campaigns"
  brand_color: "#B04ADC"
  default_prompt: "Use $cheerful-campaign-pulse to show how my campaigns are doing and which one has the lowest reply rate, and why."
dependencies:
  tools:
    - type: "mcp"
      value: "cheerful"
      description: "Cheerful MCP server (campaigns, performance, inbox counts)"
      transport: "streamable_http"
      url: "https://mcp.cheerful.ai/mcp"
policy:
  allow_implicit_invocation: true
