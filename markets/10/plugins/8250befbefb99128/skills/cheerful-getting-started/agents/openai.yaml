interface:
  display_name: "Get started"
  short_description: "What Cheerful can do, plus your account, campaigns and credits"
  brand_color: "#B04ADC"
  default_prompt: "Use $cheerful-getting-started to tell me everything Cheerful can do here, then show which Cheerful account is connected, my mailboxes, connections, campaigns and credits, and what to try next."
dependencies:
  tools:
    - type: "mcp"
      value: "cheerful"
      description: "Cheerful MCP server (campaigns, replies, creator lists, credits)"
      transport: "streamable_http"
      url: "https://mcp.cheerful.ai/mcp"
policy:
  allow_implicit_invocation: true
