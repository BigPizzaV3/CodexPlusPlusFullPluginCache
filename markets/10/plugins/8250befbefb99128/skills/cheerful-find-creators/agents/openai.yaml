interface:
  display_name: "Find creators"
  short_description: "Turn a brief into a creator search and shortlist"
  brand_color: "#B04ADC"
  default_prompt: "Use $cheerful-find-creators to find 20 US skincare creators on TikTok with 10k-100k followers and shortlist the best three."
dependencies:
  tools:
    - type: "mcp"
      value: "cheerful"
      description: "Cheerful MCP server (creator search, profiles, creator lists)"
      transport: "streamable_http"
      url: "https://mcp.cheerful.ai/mcp"
policy:
  allow_implicit_invocation: true
