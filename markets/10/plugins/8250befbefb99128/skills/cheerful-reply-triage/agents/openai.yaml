interface:
  display_name: "Reply triage"
  short_description: "Who replied, who opted in, who needs an answer"
  brand_color: "#B04ADC"
  default_prompt: "Use $cheerful-reply-triage to show who replied or opted in to my campaigns and who still needs an answer."
dependencies:
  tools:
    - type: "mcp"
      value: "cheerful"
      description: "Cheerful MCP server (inbox, campaigns, sender mailboxes)"
      transport: "streamable_http"
      url: "https://mcp.cheerful.ai/mcp"
policy:
  allow_implicit_invocation: true
