interface:
  display_name: "Improve coverage with 9to5"
  short_description: "Use 9to5 MCP coverage context to target and verify tests."
  default_prompt: "Use $improve-coverage-with-9to5 to inspect this pull request, add targeted tests for uncovered changed lines, and verify the new coverage run."
  brand_color: "#059669"

dependencies:
  tools:
    - type: "mcp"
      value: "9to5_coverage"
      description: "Read-only 9to5 coverage context for coding agents"
      transport: "streamable_http"
      url: "https://coverage.9to5.software/mcp"

policy:
  allow_implicit_invocation: true
