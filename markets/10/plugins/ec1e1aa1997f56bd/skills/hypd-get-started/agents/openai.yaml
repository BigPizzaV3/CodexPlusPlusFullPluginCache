interface:
  display_name: "Get started with Google Merchant Center by HYPD"
  short_description: "Connect Merchant Center and check your feed"
  default_prompt: "Use $hypd-get-started to help me get started with Google Merchant Center by HYPD."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "merchant-center"
      description: "Google Merchant Center by HYPD: product feed health, disapprovals, pricing and visibility"
      transport: "streamable_http"
      url: "https://merchantcenter.hypd.ai/mcp"
