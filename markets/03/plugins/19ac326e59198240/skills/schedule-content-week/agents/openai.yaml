interface:
  display_name: "Schedule a week of content"
  short_description: "Draft, review and schedule a week of social posts with PostSyncer"
  brand_color: "#0A66C2"
  default_prompt: "Plan and schedule my social posts for next week with PostSyncer."

policy:
  # Publishing to real social accounts is consequential, so the skill should run when the
  # user's request is clearly about planning a week of content -- which the description
  # already scopes -- rather than being pulled in speculatively. Implicit invocation stays
  # on because the skill itself blocks on explicit approval before anything is scheduled.
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "postsyncer"
      description: "PostSyncer MCP server: workspaces, connected accounts, media, posts and analytics"
      transport: "streamable_http"
      url: "https://postsyncer.com/mcp"
