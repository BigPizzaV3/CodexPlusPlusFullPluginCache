interface:
  display_name: "Context.dev"
  short_description: "Search and extract the live web"
  default_prompt: "Use Context.dev to search, scrape, extract, parse, monitor, or batch public web data for this request."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "context-dev"
      description: "Search, scrape, extract, parse, monitor, and batch public web data with Context.dev"
      transport: "streamable_http"
      url: "https://mcp.context.dev/mcp"
