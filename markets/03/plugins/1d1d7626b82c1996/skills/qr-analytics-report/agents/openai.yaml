interface:
  display_name: "Scan and click reports"
  short_description: "Report how QR codes and short links are performing - counts, trend, cities, devices and top codes."
  brand_color: "#1B59F5"
  default_prompt: "How many scans did my QR code get in the last 30 days, and from which cities?"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "codeqr"
      description: "CodeQR MCP server - short links, dynamic QR codes, and scan/click analytics"
      transport: "streamable_http"
      url: "https://mcp.codeqr.io/mcp"
