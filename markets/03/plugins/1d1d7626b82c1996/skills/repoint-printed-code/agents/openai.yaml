interface:
  display_name: "Re-point a printed code"
  short_description: "Change where an already printed or shared QR code or short link leads, without reprinting it."
  brand_color: "#1B59F5"
  default_prompt: "The landing page moved. Re-point my QR code to the new URL without reprinting anything."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "codeqr"
      description: "CodeQR MCP server - short links, dynamic QR codes, and scan/click analytics"
      transport: "streamable_http"
      url: "https://mcp.codeqr.io/mcp"
