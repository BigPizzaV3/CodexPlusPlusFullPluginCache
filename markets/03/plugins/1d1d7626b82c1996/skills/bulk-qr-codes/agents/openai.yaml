interface:
  display_name: "Bulk QR codes and links"
  short_description: "Create one dynamic QR code or short link per row of a list, with keys you can re-point later."
  brand_color: "#1B59F5"
  default_prompt: "Create a dynamic QR code for each row in this list, so I can change where each one points later without reprinting."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "codeqr"
      description: "CodeQR MCP server - short links, dynamic QR codes, and scan/click analytics"
      transport: "streamable_http"
      url: "https://mcp.codeqr.io/mcp"
