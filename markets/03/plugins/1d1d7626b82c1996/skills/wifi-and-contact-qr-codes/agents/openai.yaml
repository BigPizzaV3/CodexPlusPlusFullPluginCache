interface:
  display_name: "Wi-Fi and contact QR codes"
  short_description: "Create a QR code that joins a Wi-Fi network, saves a contact, or opens a chat - not just a link."
  brand_color: "#1B59F5"
  default_prompt: "Create a QR code that connects guests to my shop Wi-Fi, so I can print it on the table cards."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "codeqr"
      description: "CodeQR MCP server - short links, dynamic QR codes, and scan/click analytics"
      transport: "streamable_http"
      url: "https://mcp.codeqr.io/mcp"
