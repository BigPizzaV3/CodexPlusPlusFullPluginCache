interface:
  display_name: "Restore & Upscale"
  short_description: "Repair and enlarge an image without inventing what was never there"
  brand_color: "#2563EB"

policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "upscale_image"
      description: "Enlarges the referenced image and recovers real detail"
    - type: "mcp"
      value: "upscale_video"
      description: "Enlarges a referenced video asset"
    - type: "mcp"
      value: "generate_image"
      description: "Reconstructs damaged regions, limited to those regions"
    - type: "mcp"
      value: "explore_models"
      description: "Lists available models and capabilities; called before any generation to choose one"
    - type: "mcp"
      value: "get_account"
      description: "Checks the user's plan and remaining credits before a paid generation"
    - type: "mcp"
      value: "show_upload_widget"
      description: "Shows the upload box so the user can add a reference image and returns its asset id"
    - type: "mcp"
      value: "get_assets"
      description: "Lists the user's library to reuse an image already uploaded or generated"
