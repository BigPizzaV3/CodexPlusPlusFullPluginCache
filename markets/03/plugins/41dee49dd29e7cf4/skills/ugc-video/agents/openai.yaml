interface:
  display_name: "UGC Video"
  short_description: "A creator-style product ad that does not look produced"
  brand_color: "#2563EB"

policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "generate_video"
      description: "Generates the creator-style clip from the product reference"
    - type: "mcp"
      value: "generate_audio"
      description: "Produces the voiceover track when no native-speech video model is available"
    - type: "mcp"
      value: "explore_models"
      description: "Lists available models and capabilities; called before any generation to choose one"
    - type: "mcp"
      value: "get_account"
      description: "Checks the user plan and remaining credits before a paid generation"
    - type: "mcp"
      value: "show_upload_widget"
      description: "Shows the upload box so the user can add a reference image and returns its asset id"
    - type: "mcp"
      value: "get_assets"
      description: "Lists the user library to reuse an image already uploaded or generated"
