interface:
  display_name: "Cinematic Shot"
  short_description: "A clip built from real camera, lens and lighting decisions"
  brand_color: "#2563EB"

policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "generate_video"
      description: "Generates the cinematic clip"
    - type: "mcp"
      value: "generate_image"
      description: "Builds a reference frame first when the user has no source image"
    - type: "mcp"
      value: "upscale_video"
      description: "Raises the delivered clip to a higher resolution"
    - type: "mcp"
      value: "explore_models"
      description: "Lists available models and capabilities; called before any generation to choose one"
    - type: "mcp"
      value: "get_account"
      description: "Checks the user's plan and remaining credits before a paid generation"
    - type: "mcp"
      value: "show_upload_widget"
      description: "Shows the upload box so the user can add a reference image and returns its asset id"
    - type: "mcp"
      value: "get_assets"
      description: "Lists the user's library to reuse an image already uploaded or generated"
