interface:
  display_name: "Supplement Stack Audit"
  short_description: "Find out which of your supplements actually work — clinical-evidence scores for every product, dose, and form."
  brand_color: "#0D9488"
  default_prompt: "Audit my supplement stack — tell me what's working, what's redundant, and what's a waste of money."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "biostacks"
      description: "BioStacks supplement intelligence MCP server — product search, clinical efficacy scores, label and stack analysis"
      transport: "streamable_http"
      url: "https://biostacks.co/mcp"
