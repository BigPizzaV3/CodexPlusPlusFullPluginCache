interface:
  display_name: "Pricewin Travel Search"
  short_description: "Compare live hotel and flight prices"
  default_prompt: "Use $pricewin-travel-search to compare live hotel or flight prices for my trip."

dependencies:
  tools:
    - type: "mcp"
      value: "pricewin"
      description: "Search live hotel and flight prices and retrieve OpenTravel hotel details and cancellation policies."
      transport: "streamable_http"
      url: "https://mcp.price.win/chatgpt/mcp"

policy:
  allow_implicit_invocation: true
