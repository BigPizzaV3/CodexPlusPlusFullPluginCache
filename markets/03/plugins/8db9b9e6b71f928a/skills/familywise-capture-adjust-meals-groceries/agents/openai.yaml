interface:
  display_name: "Capture or Adjust Meals and Groceries"
  short_description: "Save structured meals and review grocery steps"
  default_prompt: "Use $familywise-capture-adjust-meals-groceries to capture this meal in FamilyWise and preview every grocery change before asking me to confirm."
dependencies:
  tools:
    - type: "mcp"
      value: "familywise"
      description: "Read and update the signed-in customer's authorized FamilyWise Home"
      transport: "streamable_http"
      url: "https://five-line-integration-gateway.mjrobinson2.chatgpt.site/api/mcp/familywise/v2"
policy:
  allow_implicit_invocation: true
