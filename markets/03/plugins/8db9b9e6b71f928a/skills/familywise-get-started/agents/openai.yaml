interface:
  display_name: "Get Started"
  short_description: "Build a useful first FamilyWise week"
  default_prompt: "Use $familywise-get-started to show me the next safe FamilyWise setup step. Do not make changes until I confirm each one."
dependencies:
  tools:
    - type: "mcp"
      value: "familywise"
      description: "Read and update the signed-in customer's authorized FamilyWise Home"
      transport: "streamable_http"
      url: "https://five-line-integration-gateway.mjrobinson2.chatgpt.site/api/mcp/familywise/v2"
policy:
  allow_implicit_invocation: true
