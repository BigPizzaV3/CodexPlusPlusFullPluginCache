interface:
  display_name: "Family Briefing"
  short_description: "Summarize one FamilyWise date range"
  default_prompt: "Use $familywise-family-briefing to brief me on the next seven days in FamilyWise and state what data is missing or unavailable."
dependencies:
  tools:
    - type: "mcp"
      value: "familywise"
      description: "Read the signed-in customer's authorized FamilyWise Home"
      transport: "streamable_http"
      url: "https://five-line-integration-gateway.mjrobinson2.chatgpt.site/api/mcp/familywise/v2"
policy:
  allow_implicit_invocation: true
