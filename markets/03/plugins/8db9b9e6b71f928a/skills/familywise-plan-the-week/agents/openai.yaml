interface:
  display_name: "Plan the Week"
  short_description: "Review and plan one FamilyWise week"
  default_prompt: "Use $familywise-plan-the-week to review the next seven days in FamilyWise. Do not make changes until I confirm each one."
dependencies:
  tools:
    - type: "mcp"
      value: "familywise"
      description: "Read and update the signed-in customer's authorized FamilyWise Home"
      transport: "streamable_http"
      url: "https://five-line-integration-gateway.mjrobinson2.chatgpt.site/api/mcp/familywise/v2"
policy:
  allow_implicit_invocation: true
