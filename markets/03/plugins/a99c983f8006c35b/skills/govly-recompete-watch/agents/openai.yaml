interface:
  display_name: "Govly Recompete Watch"
  short_description: "Monitor awards and likely recompete opportunities"
  default_prompt: "Use $govly-recompete-watch to identify awards and new opportunities that may indicate upcoming recompetes."
dependencies:
  tools:
    - type: "mcp"
      value: "govly_agent"
      description: "Govly MCP server for authenticated award saved-search, award, and opportunity tools"
      transport: "streamable_http"
      url: "https://app.govly.com/api/mcp"
