interface:
  display_name: "Govly SLED Market Watch"
  short_description: "Track SLED meetings and opportunities by topic"
  default_prompt: "Use $govly-sled-market-watch to find recent SLED meetings and opportunities for my target topics and places."
dependencies:
  tools:
    - type: "mcp"
      value: "govly_agent"
      description: "Govly MCP server for authenticated SLED signal, place, and opportunity tools"
      transport: "streamable_http"
      url: "https://app.govly.com/api/mcp"
