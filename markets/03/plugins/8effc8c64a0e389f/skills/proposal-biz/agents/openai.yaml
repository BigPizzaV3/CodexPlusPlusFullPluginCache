interface:
  display_name: "Proposal.Biz Sales Documents"
  short_description: "Draft and create client-facing sales documents"
  default_prompt: "Use $proposal-biz to turn my notes into a client-ready proposal."

dependencies:
  tools:
    - type: mcp
      value: proposal-biz
      description: "Proposal.Biz proposal creation tools"
      transport: streamable_http
      url: "https://app.proposal.biz/api/mcp"

policy:
  allow_implicit_invocation: true
