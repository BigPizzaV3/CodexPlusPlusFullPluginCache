interface:
  display_name: "Ask Embat"
  short_description: "Query your treasury and finance data in Embat — cash, debt, forecasts, payments, accounting and reconciliation."
  icon_small: "./assets/embat_isotype_white.png"
  icon_large: "./assets/embat.png"
  brand_color: "#050B2C"
  default_prompt: "Answer using the user's own Embat data via the ask_tellme tool. Pass their question through verbatim and relay the agent's answer, including any clarifying question it asks, without recomputing figures."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "embatTellMe"
      description: "Embat TellMe MCP server — read-only access to the signed-in user's treasury and finance data"
      transport: "streamable_http"
      url: "https://tellme.embat.io/mcp"
