interface:
  display_name: "Create Training in Skillsail"
  short_description: "Build interactive training with Skillsail"
  default_prompt: "Use $create-skillsail-training to create an interactive training module for my audience."

dependencies:
  tools:
    - type: "mcp"
      value: "skillsail"
      description: "Skillsail eLearning authoring MCP server"
      transport: "streamable_http"
      url: "https://skillsail.com/mcp"

policy:
  allow_implicit_invocation: true
