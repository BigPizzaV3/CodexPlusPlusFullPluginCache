<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VaDa Genius icon</title>
  <desc id="desc">Minimal icon with sun, house, spark and genius trail.</desc>
  <defs>
    <linearGradient id="orange" x1="126" y1="58" x2="407" y2="221" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a45"/>
      <stop offset="1" stop-color="#f27f32"/>
    </linearGradient>
    <linearGradient id="green" x1="168" y1="166" x2="384" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cab80"/>
      <stop offset="1" stop-color="#7f9167"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <path d="M184 198a56 56 0 0 1 99-54" fill="none" stroke="url(#orange)" stroke-width="14" stroke-linecap="round"/>
  <path d="M232 64v22M160 93l16 16M126 164h24M153 216l13-9M304 93l-16 16" fill="none" stroke="url(#orange)" stroke-width="12" stroke-linecap="round"/>

  <!-- spark -->
  <path d="M376 143c3 17 8 22 25 25-17 3-22 8-25 25-3-17-8-22-25-25 17-3 22-8 25-25z" fill="url(#orange)"/>

  <!-- house + genius trail -->
  <path d="M180 333c-9-18-11-46-8-83l105-78 99 78v83" fill="none" stroke="url(#green)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M181 333c24 34 82 35 125 35 18 0 25 8 3 20l-38 20 9 18" fill="none" stroke="url(#green)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- window -->
  <g fill="#28483d">
    <rect x="253" y="249" width="18" height="18" rx="3"/>
    <rect x="280" y="249" width="18" height="18" rx="3"/>
    <rect x="253" y="277" width="18" height="18" rx="3"/>
    <rect x="280" y="277" width="18" height="18" rx="3"/>
  </g>
</svg>
