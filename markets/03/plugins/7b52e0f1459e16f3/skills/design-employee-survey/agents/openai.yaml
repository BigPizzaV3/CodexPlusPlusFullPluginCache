interface:
  display_name: "Design Employee Survey"
  short_description: "Design an employee survey with FeedbackPulse"
  default_prompt: "Use $design-employee-survey to design an employee survey for my current company needs."

dependencies:
  tools:
    - type: "mcp"
      value: "employee-surveys-feedbackpulse"
      description: "FeedbackPulse employee survey design service"
      transport: "streamable_http"
      url: "https://app.feedbackpulse.com/mcp/employee-surveys"

policy:
  allow_implicit_invocation: true
