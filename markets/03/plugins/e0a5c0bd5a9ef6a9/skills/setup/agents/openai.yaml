interface:
  display_name: "ClickHouse Setup"
  short_description: "Install, authenticate, and verify ClickHouse MCP access"
  default_prompt: "Help me authenticate ClickHouse MCP and list the tables I can access."

dependencies:
  tools:
    - type: "mcp"
      value: "clickhouse"
      description: "ClickHouse Cloud Remote MCP server"
      transport: "streamable_http"
      url: "https://mcp.clickhouse.cloud/mcp"
