interface:
  display_name: "Scribe"
  short_description: "Create and manage email signatures, campaigns, and signature analytics."
  default_prompt: "Help me manage my team's email signatures with Scribe."
  brand_color: "#FD5721"

dependencies:
  tools:
    - type: "mcp"
      value: "get_content_schema"
      description: "Returns the signature block-tree schema, enum values, and a worked example — required before authoring any signature or campaign content."
    - type: "mcp"
      value: "create_signature"
      description: "Create a signature template as a draft."
    - type: "mcp"
      value: "publish_signature"
      description: "Publish a draft signature so it goes live and installs."
