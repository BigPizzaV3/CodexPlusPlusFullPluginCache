# Métadonnée plugin OpenAI (optionnelle) — déclare la dépendance au serveur MCP.
# `value` = nom du serveur FastMCP ("Omny", cf. server/main.py). À reconfirmer au
# moment de la soumission dans le portail plugin.
interface:
  display_name: "Qualification du besoin"
  short_description: "Transforme une demande floue en critères de recherche."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "Omny"
