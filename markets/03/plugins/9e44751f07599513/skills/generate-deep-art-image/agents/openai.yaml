interface:
  display_name: "Deep Art AI Image Generator"
  short_description: "Generate original images with Deep Art AI"
  default_prompt: "Use $generate-deep-art-image to create a new image from my description."
dependencies:
  tools:
    - type: "mcp"
      value: "deep-art-ai"
      description: "Deep Art AI MCP server"
      transport: "streamable_http"
      url: "https://api.deepart.ai/mcp"
policy:
  allow_implicit_invocation: true
