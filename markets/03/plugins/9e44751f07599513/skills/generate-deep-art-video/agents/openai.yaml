interface:
  display_name: "Deep Art AI Video Generator"
  short_description: "Generate original videos with Deep Art AI"
  default_prompt: "Use $generate-deep-art-video to create a new videos from my description."
dependencies:
  tools:
    - type: "mcp"
      value: "deep-art-ai"
      description: "Deep Art AI MCP server"
      transport: "streamable_http"
      url: "https://api.deepart.ai/mcp"
policy:
  allow_implicit_invocation: true
