interface:
  display_name: "Create a Userflow Banner"
  short_description: "Draft, review, and publish in-app banners"
  default_prompt: "Use $userflow-banner-creator to create an in-app banner from my announcement."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for banner drafts, targeting, and publication"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
