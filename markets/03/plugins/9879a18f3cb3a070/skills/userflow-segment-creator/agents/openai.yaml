interface:
  display_name: "Create a Userflow Segment"
  short_description: "Build confirmed condition-based audiences"
  default_prompt: "Use $userflow-segment-creator to create a condition-based Userflow segment from my audience description."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for attribute discovery, previews, and segment creation"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
