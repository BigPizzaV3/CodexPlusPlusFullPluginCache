interface:
  display_name: "Compare Content by Segment"
  short_description: "Compare Userflow performance across audiences"
  default_prompt: "Use $userflow-flow-segment-compare to compare one Userflow flow across several audience segments."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for content, segment, and analytics data"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
