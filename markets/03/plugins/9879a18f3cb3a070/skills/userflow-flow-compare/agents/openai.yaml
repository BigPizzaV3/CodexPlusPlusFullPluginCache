interface:
  display_name: "Compare Two Userflow Flows"
  short_description: "Benchmark two flows in a traceable dashboard"
  default_prompt: "Use $userflow-flow-compare to compare two published Userflow flows over the last 30 days."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for flow discovery and analytics"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
