interface:
  display_name: "Summarise Userflow NPS Feedback"
  short_description: "Group positive and negative NPS comments"
  default_prompt: "Use $userflow-nps-summariser to summarise NPS comments from the last quarter."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for survey questions and response data"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
