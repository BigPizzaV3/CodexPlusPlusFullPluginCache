interface:
  display_name: "Adoption Agent Topic Report"
  short_description: "Find agent topics, gaps, and negative feedback"
  default_prompt: "Use $userflow-adoption-agent-topics to analyze our Adoption Agent conversations from the last 30 days."

dependencies:
  tools:
    - type: "mcp"
      value: "userflow"
      description: "Userflow MCP server for product-adoption and Adoption Agent data"
      transport: "streamable_http"
      url: "https://api.userflow.com/mcp"

policy:
  allow_implicit_invocation: true
