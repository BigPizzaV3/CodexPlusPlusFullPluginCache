interface:
  display_name: "PortfolioFit"
  short_description: "Check mandates and allocation constraints"
  default_prompt: "Use $validate-mandate to normalize the attached portfolio locally and check it against its mandate."

dependencies:
  tools:
    - type: "mcp"
      value: "portfoliofit"
      description: "PortfolioFit mandate-alignment tools"
      transport: "streamable_http"
      url: "https://portfolio.fit/mcp"

policy:
  allow_implicit_invocation: true
