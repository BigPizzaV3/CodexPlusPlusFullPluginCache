<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AgentRoam">
  <!-- 32px optical size: one globe ring, the thick S-route, two waypoints,
       a single signal arc. No lat/long grid, no dotted paths. -->
  <defs>
    <linearGradient id="arf32" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2ee6a8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b1424"/>
  <circle cx="14" cy="18" r="10" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.4"/>
  <path d="M 6 26 C 13 24, 12 18.5, 16 16 C 20 13.5, 19 8, 26 6" fill="none" stroke="url(#arf32)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="6" cy="26" r="2" fill="#a78bfa"/>
  <circle cx="26" cy="6" r="2.4" fill="#2ee6a8"/>
  <path d="M 28.2 8.4 a 5 5 0 0 0 -2.6 -2.6" fill="none" stroke="#2ee6a8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
</svg>
