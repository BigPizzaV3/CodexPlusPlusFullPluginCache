interface:
  display_name: "Use Buildory"
  short_description: "Review and maintain Buildory projects"
  default_prompt: "Use $use-buildory to review my Buildory project and recommend the next steps."
dependencies:
  tools:
    - type: "mcp"
      value: "buildory"
      description: "Read access plus explicitly authorized Pro/Creator project maintenance"
      transport: "streamable_http"
      url: "https://buildory.app/mcp"
policy:
  allow_implicit_invocation: true
