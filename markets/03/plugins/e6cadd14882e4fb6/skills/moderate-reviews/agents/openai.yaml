interface:
  display_name: "Moderate Reviews"
  short_description: "Safely approve, reject, and reply"
  default_prompt: "Use $moderate-reviews to inspect my pending reviews and help me take safe moderation actions."

dependencies:
  tools:
    - type: "mcp"
      value: "reviewbird"
      description: "Reviewbird product-review data and tools"
      transport: "streamable_http"
      url: "https://app.reviewbird.com/mcp/reviewbird"

policy:
  allow_implicit_invocation: true
