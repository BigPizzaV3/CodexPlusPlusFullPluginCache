interface:
  display_name: "Analyze Reviews"
  short_description: "Find trends in Reviewbird feedback"
  default_prompt: "Use $analyze-reviews to compare my stores' review performance and summarize the main customer themes."

dependencies:
  tools:
    - type: "mcp"
      value: "reviewbird"
      description: "Reviewbird product-review data and tools"
      transport: "streamable_http"
      url: "https://app.reviewbird.com/mcp/reviewbird"

policy:
  allow_implicit_invocation: true
