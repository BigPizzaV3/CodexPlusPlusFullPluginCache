interface:
  display_name: "Research a JUNE case"
  short_description: "Find and summarize JUNE case information"
  default_prompt: "Use $june-research-case to find and summarize the relevant JUNE case."
dependencies:
  tools:
    - type: "mcp"
      value: "june-agent"
      description: "JUNE legal case-management tools"
      transport: "streamable_http"
      url: "https://mcp.june.tech/mcp"
policy:
  allow_implicit_invocation: true
