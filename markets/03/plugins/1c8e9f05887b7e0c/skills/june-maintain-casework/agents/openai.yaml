interface:
  display_name: "Maintain JUNE casework"
  short_description: "Create and update JUNE case records safely"
  default_prompt: "Use $june-maintain-casework to update this JUNE case safely."
dependencies:
  tools:
    - type: "mcp"
      value: "june-agent"
      description: "JUNE legal case-management tools"
      transport: "streamable_http"
      url: "https://mcp.june.tech/mcp"
policy:
  allow_implicit_invocation: true
