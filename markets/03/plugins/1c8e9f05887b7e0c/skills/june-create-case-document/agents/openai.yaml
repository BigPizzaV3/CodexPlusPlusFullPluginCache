interface:
  display_name: "Create a JUNE document"
  short_description: "Create case documents from templates or text"
  default_prompt: "Use $june-create-case-document to create the requested document for this JUNE case."
dependencies:
  tools:
    - type: "mcp"
      value: "june-agent"
      description: "JUNE legal case-management tools"
      transport: "streamable_http"
      url: "https://mcp.june.tech/mcp"
policy:
  allow_implicit_invocation: true
