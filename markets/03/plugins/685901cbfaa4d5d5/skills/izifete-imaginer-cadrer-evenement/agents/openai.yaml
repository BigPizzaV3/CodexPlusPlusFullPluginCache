interface:
  display_name: "Izifete — Imaginer et cadrer son événement"
  short_description: "Clarifier un projet d'événement en France avant tout chiffrage : type, date, ville, invités, enveloppe, format de réception et métiers nécessaires."
  default_prompt: "$izifete-imaginer-cadrer-evenement Aide-moi à cadrer mon événement : pose-moi les bonnes questions (type d'événement, date, ville, nombre d'invités, enveloppe globale), aide-moi à choisir le format de réception et dis-moi quels prestataires prévoir."

dependencies:
  tools:
    - type: mcp
      value: "izifete"
      transport: streamable_http
      url: "https://izifete.fr/mcp/mcp"

policy:
  allow_implicit_invocation: true
