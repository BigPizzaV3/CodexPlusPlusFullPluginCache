interface:
  display_name: "GSC SEO & Content Planning"
  short_description: "Plan SEO content from live Search Console data"
  icon_small: "./assets/icon-512.png"
  icon_large: "./assets/icon-512.png"
  brand_color: "#3F51B5"
  default_prompt: "Use $gsc-seo-content-planning to find my best SEO content opportunities from Google Search Console."

dependencies:
  tools:
    - type: "mcp"
      value: "smepost-gsc-seo-planner"
      description: "Read authorized Google Search Console analytics for SEO planning"
      transport: "streamable_http"
      url: "https://smepost.io/api/mcp/gsc"

policy:
  allow_implicit_invocation: true
