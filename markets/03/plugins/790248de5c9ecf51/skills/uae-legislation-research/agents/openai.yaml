interface:
  display_name: "UAE Legislation Research"
  short_description: "Research UAE legislation with realLaw AI"
  default_prompt: "Use $uae-legislation-research to research and answer questions about published UAE legislation and legal updates using realLaw AI evidence and returned source links."

dependencies:
  tools:
    - type: "mcp"
      value: "reallaw-ai-legislation"
      description: "Search and retrieve published English UAE legislation, legal updates, and source links from realLaw AI"
      transport: "streamable_http"
      url: "https://api.reallaw.ai/mcp"

policy:
  allow_implicit_invocation: true
