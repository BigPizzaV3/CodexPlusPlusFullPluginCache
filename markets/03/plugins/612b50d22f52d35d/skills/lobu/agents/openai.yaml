interface:
  display_name: "Lobu"
  short_description: "Use durable workspace context safely"
  brand_color: "#F5333A"
  default_prompt: "Use $lobu to find the relevant workspace context and take the safest supported next step."

dependencies:
  tools:
    - type: "mcp"
      value: "lobu"
      description: "Lobu workspace memory, connected data, operations, and approvals"
      transport: "streamable_http"
      url: "https://lobu.ai/mcp"

policy:
  allow_implicit_invocation: true
