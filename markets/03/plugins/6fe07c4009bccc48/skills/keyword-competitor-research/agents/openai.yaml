# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool below except list_brands
# is scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "list_keywords"
      description: "SearchFit: list keywords"
    - type: "mcp"
      value: "add_keywords"
      description: "SearchFit: add keywords"
    - type: "mcp"
      value: "update_keyword"
      description: "SearchFit: update keyword"
    - type: "mcp"
      value: "delete_keyword"
      description: "SearchFit: delete keyword"
    - type: "mcp"
      value: "get_keyword_ranking_history"
      description: "SearchFit: get keyword ranking history"
    - type: "mcp"
      value: "discover_keywords"
      description: "SearchFit: discover keywords"
    - type: "mcp"
      value: "refresh_keyword_metrics"
      description: "SearchFit: refresh keyword metrics"
    - type: "mcp"
      value: "list_competitors"
      description: "SearchFit: list competitors"
    - type: "mcp"
      value: "add_competitor"
      description: "SearchFit: add competitor"
    - type: "mcp"
      value: "remove_competitor"
      description: "SearchFit: remove competitor"
    - type: "mcp"
      value: "sync_competitor_metrics"
      description: "SearchFit: sync competitor metrics"
    - type: "mcp"
      value: "get_backlinks"
      description: "SearchFit: get backlinks"
    - type: "mcp"
      value: "get_referring_domains"
      description: "SearchFit: get referring domains"
    - type: "mcp"
      value: "sync_backlinks"
      description: "SearchFit: sync backlinks"
