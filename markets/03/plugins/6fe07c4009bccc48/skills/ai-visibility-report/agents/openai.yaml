# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool below except list_brands
# is scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "get_workspace_details"
      description: "SearchFit: get workspace details"
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "list_tracked_prompts"
      description: "SearchFit: list tracked prompts"
    - type: "mcp"
      value: "suggest_tracking_prompts"
      description: "SearchFit: suggest tracking prompts"
    - type: "mcp"
      value: "create_tracked_prompts"
      description: "SearchFit: create tracked prompts"
    - type: "mcp"
      value: "update_tracked_prompt"
      description: "SearchFit: update tracked prompt"
    - type: "mcp"
      value: "delete_tracked_prompt"
      description: "SearchFit: delete tracked prompt"
    - type: "mcp"
      value: "run_prompt_scan"
      description: "SearchFit: run prompt scan"
    - type: "mcp"
      value: "get_scan_status"
      description: "SearchFit: get scan status"
    - type: "mcp"
      value: "cancel_prompt_scan"
      description: "SearchFit: cancel prompt scan"
    - type: "mcp"
      value: "list_scans"
      description: "SearchFit: list scans"
    - type: "mcp"
      value: "get_scan_results"
      description: "SearchFit: get scan results"
    - type: "mcp"
      value: "get_visibility_overview"
      description: "SearchFit: get visibility overview"
    - type: "mcp"
      value: "get_competitor_analysis"
      description: "SearchFit: get competitor analysis"
    - type: "mcp"
      value: "manage_tracked_competitors"
      description: "SearchFit: manage tracked competitors"
    - type: "mcp"
      value: "get_sentiment_analysis"
      description: "SearchFit: get sentiment analysis"
    - type: "mcp"
      value: "get_visibility_insights"
      description: "SearchFit: get visibility insights"
    - type: "mcp"
      value: "update_visibility_opportunity"
      description: "SearchFit: update visibility opportunity"
    - type: "mcp"
      value: "get_prompt_analytics"
      description: "SearchFit: get prompt analytics"
