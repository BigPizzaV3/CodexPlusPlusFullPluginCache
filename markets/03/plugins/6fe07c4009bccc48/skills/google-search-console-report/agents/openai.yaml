# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool except list_brands is
# scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_connectors"
      description: "SearchFit: list connectors"
    - type: "mcp"
      value: "get_search_performance"
      description: "SearchFit: get search performance"
    - type: "mcp"
      value: "get_top_queries"
      description: "SearchFit: get top queries"
    - type: "mcp"
      value: "get_top_pages"
      description: "SearchFit: get top pages"
    - type: "mcp"
      value: "get_audience_breakdown"
      description: "SearchFit: get audience breakdown"
    - type: "mcp"
      value: "sync_search_console"
      description: "SearchFit: sync search console"
    - type: "mcp"
      value: "get_published_content_urls"
      description: "SearchFit: get published content urls"
    - type: "mcp"
      value: "get_ai_visibility_metrics"
      description: "SearchFit: get ai visibility metrics"
