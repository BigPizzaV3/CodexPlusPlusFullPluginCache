# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool below except list_brands
# is scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "get_workspace_details"
      description: "SearchFit: get workspace details"
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "list_content"
      description: "SearchFit: list content"
    - type: "mcp"
      value: "get_content"
      description: "SearchFit: get content"
    - type: "mcp"
      value: "create_content"
      description: "SearchFit: create content"
    - type: "mcp"
      value: "bulk_create_content"
      description: "SearchFit: bulk create content"
    - type: "mcp"
      value: "update_content"
      description: "SearchFit: update content"
    - type: "mcp"
      value: "bulk_update_content"
      description: "SearchFit: bulk update content"
    - type: "mcp"
      value: "delete_content"
      description: "SearchFit: delete content"
    - type: "mcp"
      value: "generate_topic_suggestions"
      description: "SearchFit: generate topic suggestions"
    - type: "mcp"
      value: "regenerate_article"
      description: "SearchFit: regenerate article"
    - type: "mcp"
      value: "get_content_job_status"
      description: "SearchFit: get content job status"
    - type: "mcp"
      value: "list_ai_models"
      description: "SearchFit: list ai models"
    - type: "mcp"
      value: "generate_image"
      description: "SearchFit: generate image"
    - type: "mcp"
      value: "set_article_image"
      description: "SearchFit: set article image"
    - type: "mcp"
      value: "publish_content"
      description: "SearchFit: publish content"
    - type: "mcp"
      value: "list_publications"
      description: "SearchFit: list publications"
    - type: "mcp"
      value: "export_content"
      description: "SearchFit: export content"
    - type: "mcp"
      value: "import_content"
      description: "SearchFit: import content"
    - type: "mcp"
      value: "manage_translations"
      description: "SearchFit: manage translations"
    - type: "mcp"
      value: "list_connectors"
      description: "SearchFit: list connectors"
