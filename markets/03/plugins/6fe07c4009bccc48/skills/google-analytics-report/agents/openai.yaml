# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool except list_brands is
# scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_connectors"
      description: "SearchFit: list connectors"
    - type: "mcp"
      value: "list_ga4_properties"
      description: "SearchFit: list ga4 properties"
    - type: "mcp"
      value: "set_ga4_property"
      description: "SearchFit: set ga4 property"
    - type: "mcp"
      value: "sync_ga4"
      description: "SearchFit: sync ga4"
    - type: "mcp"
      value: "get_ga4_metrics"
      description: "SearchFit: get ga4 metrics"
    - type: "mcp"
      value: "get_ga4_traffic_breakdown"
      description: "SearchFit: get ga4 traffic breakdown"
    - type: "mcp"
      value: "get_ga4_events"
      description: "SearchFit: get ga4 events"
    - type: "mcp"
      value: "get_audience_breakdown"
      description: "SearchFit: get audience breakdown"
