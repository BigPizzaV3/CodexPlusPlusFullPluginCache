# Tools this skill needs from the SearchFit MCP server.
# Declaring them lets ChatGPT connect the server when the skill runs,
# instead of failing partway through. Every tool below except list_brands
# is scoped to one brand and takes a brand_id from it.
dependencies:
  tools:
    - type: "mcp"
      value: "get_brand"
      description: "SearchFit: get brand"
    - type: "mcp"
      value: "list_brands"
      description: "SearchFit: list brands"
    - type: "mcp"
      value: "list_pages"
      description: "SearchFit: list pages"
    - type: "mcp"
      value: "import_sitemap_urls"
      description: "SearchFit: import sitemap urls"
    - type: "mcp"
      value: "delete_pages"
      description: "SearchFit: delete pages"
    - type: "mcp"
      value: "check_page_frameable"
      description: "SearchFit: check page frameable"
    - type: "mcp"
      value: "get_page_suggestions"
      description: "SearchFit: get page suggestions"
    - type: "mcp"
      value: "update_page_suggestion"
      description: "SearchFit: update page suggestion"
    - type: "mcp"
      value: "page_refresh_jobs"
      description: "SearchFit: page refresh jobs"
    - type: "mcp"
      value: "start_audit"
      description: "SearchFit: start audit"
    - type: "mcp"
      value: "scan_urls"
      description: "SearchFit: scan urls"
    - type: "mcp"
      value: "get_audit"
      description: "SearchFit: get audit"
    - type: "mcp"
      value: "cancel_audit"
      description: "SearchFit: cancel audit"
    - type: "mcp"
      value: "get_audit_issues"
      description: "SearchFit: get audit issues"
    - type: "mcp"
      value: "get_audit_pages"
      description: "SearchFit: get audit pages"
    - type: "mcp"
      value: "get_audit_links"
      description: "SearchFit: get audit links"
    - type: "mcp"
      value: "get_audit_assets"
      description: "SearchFit: get audit assets"
    - type: "mcp"
      value: "list_media_assets"
      description: "SearchFit: list media assets"
    - type: "mcp"
      value: "update_media_asset"
      description: "SearchFit: update media asset"
    - type: "mcp"
      value: "delete_media_asset"
      description: "SearchFit: delete media asset"
    - type: "mcp"
      value: "generate_alt_text"
      description: "SearchFit: generate alt text"
    - type: "mcp"
