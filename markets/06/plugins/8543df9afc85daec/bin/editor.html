<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="pen-editor-url" content="__PEN_EDITOR_URL__" />
    <title>pen.dev</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --track: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --track: #3f3f46;
        }
      }
      [data-theme="dark"] {
        --bg: #18181b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --track: #3f3f46;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--font-sans, system-ui, sans-serif);
      }
      #app {
        position: relative;
        height: 640px;
      }
      body.fullscreen #app {
        height: 100vh;
      }
      #editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
        background: var(--color-background-primary, var(--bg));
        color: var(--color-text-primary, var(--fg));
      }
      #status[hidden] {
        display: none;
      }
      .logo {
        display: block;
        height: 28px;
        width: auto;
      }
      .logo-dark {
        display: none;
      }
      :root[data-theme="dark"] .logo-light {
        display: none;
      }
      :root[data-theme="dark"] .logo-dark {
        display: block;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .logo-light {
          display: none;
        }
        :root:not([data-theme="light"]) .logo-dark {
          display: block;
        }
      }
      #spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--track);
        border-top-color: var(--color-text-primary, var(--fg));
        animation: spin 0.8s linear infinite;
      }
      #status.message #spinner {
        display: none;
      }
      #status-text {
        margin: 0;
        max-width: 360px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--color-text-secondary, var(--muted));
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #spinner {
          animation-duration: 3s;
        }
      }
    </style>
