<!doctype html>
<html lang="en" data-theme="light" data-composed-shell>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LegalDesign composed artifact</title>
  <style id="ld-composed-shell-style">
    :root {
      color-scheme: light;
      --bg: #fbfbfb;
      --card: #ffffff;
      --ink: #111111;
      --muted: #565656;
      --faint: #6f6f6f;
      --line: rgba(17, 17, 17, .14);
      --line-strong: rgba(17, 17, 17, .32);
      --red: #c92014;
      --tint: #f3f3f3;
      --scrim: rgba(17, 17, 17, .52);
      --shadow-soft: 0 1px 3px rgba(17, 17, 17, .08), 0 6px 18px rgba(17, 17, 17, .05);
      --shadow: 0 22px 60px rgba(17, 17, 17, .18);
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --serif: Charter, "Iowan Old Style", Georgia, serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --card: #111111;
      --ink: #f2f2f0;
      --muted: #b4b4b0;
      --faint: #8d8d89;
      --line: rgba(242, 242, 240, .14);
      --line-strong: rgba(242, 242, 240, .32);
      --red: #ff5a4e;
      --tint: #161616;
      --scrim: rgba(0, 0, 0, .7);
      --shadow-soft: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
      --shadow: 0 22px 60px rgba(0, 0, 0, .62);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); }
    body { margin: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { color: inherit; font: inherit; }
    button, select { cursor: pointer; }
    a { color: var(--red); text-decoration: underline; text-underline-offset: .12em; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .ld-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      padding: 6px 12px;
    }
    .ld-matter {
      min-width: 0;
      flex: 1 1 auto;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ld-decision-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ld-composed-main {
      width: min(1280px, calc(100% - clamp(36px, 6vw, 84px)));
      margin: 0 auto;
      padding: clamp(22px, 3vw, 36px) 0 20px;
    }
    #ld-page-approach {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 2px;
      width: fit-content;
      max-width: 100%;
      margin: 0 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--card);
      padding: 2px;
    }
    .ld-approach-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    #ld-page-approach button {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
    }
    #ld-page-approach button span { color: var(--red); font-weight: 700; }
    #ld-page-approach button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    #ld-page-approach button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    #ld-page-approach button[aria-pressed="true"] span { color: inherit; }
    .ld-page-approach { width: 100%; }
    .ld-composed-section + .ld-composed-section { margin-top: clamp(12px, 1.5vw, 18px); }
    .ld-composed-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: clamp(12px, 1.25vw, 18px);
      align-items: start;
    }
    .ld-composed-unit {
      position: relative;
      grid-row: var(--ld-row);
      grid-column: var(--ld-column) / span var(--ld-span);
      min-width: 0;
      container-type: inline-size;
    }
    .ld-composed-unit[data-role="title"] {
      width: 100%;
      border: 0;
      background: transparent;
      box-shadow: none;
      padding: 0 0 2px;
    }
    .ld-composed-unit[data-role="title"] h1 {
      max-width: none;
      margin: 0;
      font-size: clamp(36px, 4.2vw, 58px);
      font-weight: 700;
      letter-spacing: -.022em;
      line-height: 1.03;
      text-wrap: balance;
    }
    [data-variant-body] { font-size: 15px; line-height: 1.55; }
    [data-variant-body] > :first-child { margin-top: 0; }
    [data-variant-body] > :last-child { margin-bottom: 0; }
    [data-variant-body] h2 { margin: 0 0 8px; font-size: clamp(19px, 2vw, 25px); letter-spacing: -.015em; line-height: 1.12; }
    [data-variant-body] p { margin: 0 0 10px; }
    [data-variant-body] ol,
    [data-variant-body] ul { margin: 10px 0 0; padding-left: 1.25em; }
    [data-variant-body] li + li { margin-top: 6px; }
    .ld-composed-unit[data-role="summary"] {
      max-width: 72ch;
      padding: 0;
      color: var(--muted);
      font-size: clamp(16px, 1.45vw, 20px);
      line-height: 1.48;
    }
    .ld-composed-unit[data-role="summary"] [data-variant-body] { font-size: inherit; }
    .ld-composed-unit[data-kind="figure"] {
      overflow: visible;
      border: 0;
      border-radius: 7px;
      background: var(--tint);
      padding: clamp(20px, 2.3vw, 30px);
    }
    .ld-figure-title { max-width: 64ch; margin: 0 110px 12px 0; font-size: clamp(17px, 1.55vw, 20px); letter-spacing: -.01em; line-height: 1.25; }
    .ld-diagram { display: grid; min-height: 220px; align-items: center; }
    .ld-diagram svg {
      display: block;
      width: min(100%, 800px);
      height: auto;
      margin-inline: auto;
    }
    .ld-composed-unit[data-kind="card"],
    .ld-composed-unit[data-kind="decision"] {
      border: 0;
      border-radius: 5px;
      background: var(--card);
      box-shadow: var(--shadow-soft);
      padding: clamp(18px, 2vw, 20px);
    }
    .ld-composed-unit[data-kind="table"] { overflow: hidden; border-block: 1px solid var(--line-strong); padding-block: 14px; }
    .ld-composed-unit[data-role="action"] { border-top: 1px solid var(--line-strong); padding: 16px 0 0; font-size: 16px; }
    .ld-composed-unit[data-kind="text"][data-role="scope"],
    .ld-composed-unit[data-kind="text"][data-role="expected"],
    .ld-composed-unit[data-kind="text"][data-role="matter"] { border-top: 1px solid var(--line); padding: 14px 0 0; color: var(--muted); font-size: 12.5px; }
    .ld-why { margin: 16px 0 0; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .ld-popup-trigger {
      cursor: pointer;
      transition: box-shadow 140ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .ld-popup-trigger[data-kind="card"]:hover {
      box-shadow: inset 0 0 0 1px var(--interaction), var(--shadow-soft);
    }
    .ld-decision { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
    .ld-decision h3 { margin: 0 0 14px; font-size: 20px; line-height: 1.25; }
    .ld-decision-options { display: grid; gap: 8px; }
    .ld-decision-option {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 3px 10px;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--card);
      padding: 12px;
      text-align: left;
    }
    .ld-decision-option[aria-pressed="true"] { border-color: var(--red); }
    .ld-decision-option strong { grid-row: 1 / span 2; color: var(--red); }
    .ld-decision-option small { color: var(--muted); line-height: 1.4; }
    .ld-decision-inputs { align-items: stretch; margin-top: 10px; }
    .ld-decision-input { display: grid; flex: 1 1 220px; gap: 5px; color: var(--muted); font-size: 12px; }
    .ld-decision-input input, .ld-decision-input textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--card);
      padding: 9px;
    }
    .ld-scrim {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: var(--scrim);
      padding: 22px;
    }
    .pop {
      position: relative;
      width: min(720px, 100%);
      max-height: calc(100dvh - 44px);
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 25px;
    }
    .ld-popup-close { position: absolute; top: 10px; right: 10px; width: 38px; font-size: 20px; }
    .pop h2 { max-width: 18ch; margin: 0 48px 12px 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.025em; line-height: 1.04; }
    .ld-popup-lede { max-width: 62ch; margin: 0 48px 22px 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .ld-popup-section { display: grid; grid-template-columns: minmax(120px, .72fr) minmax(0, 2fr); gap: 18px; border-top: 1px solid var(--line); padding: 16px 0; }
    .ld-popup-section h3 { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.35; }
    .ld-popup-section p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .ld-popup-source { margin-top: 4px; border-top: 1px solid var(--line-strong); padding-top: 16px; }
    .ld-popup-source .out { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    @media (min-width: 761px) and (max-height: 820px) {
      .ld-composed-main { padding-top: 20px; }
      #ld-page-approach { margin-bottom: 8px; }
      .ld-composed-section + .ld-composed-section { margin-top: 10px; }
      .ld-composed-unit[data-role="title"] h1 { font-size: clamp(42px, 4vw, 51px); }
      .ld-composed-unit[data-role="summary"] { font-size: 18px; line-height: 1.4; }
      .ld-composed-unit[data-kind="figure"] { padding: 16px 26px; }
      .ld-figure-title { margin-bottom: 8px; }
      .ld-diagram { min-height: 180px; }
      .ld-composed-unit[data-kind="card"],
      .ld-composed-unit[data-kind="decision"] { padding-block: 18px; }
    }
    @media (max-width: 760px) {
      .ld-bar { flex-wrap: wrap; }
      .ld-matter { flex: 1 1 160px; }
      .ld-controls { width: 100%; overflow-x: auto; }
      .ld-composed-main { width: min(100% - 24px, 640px); padding-top: 24px; }
      #ld-page-approach { width: fit-content; max-width: 100%; }
      #ld-page-approach button { min-height: 36px; justify-content: center; }
      .ld-composed-grid { grid-template-columns: minmax(0, 1fr); }
      .ld-composed-grid > .ld-composed-unit {
        grid-column: 1 !important;
        grid-row: auto !important;
      }
      .ld-decision-inputs { flex-direction: column; }
      .ld-composed-unit[data-role="title"] h1 { font-size: clamp(34px, 11vw, 52px); }
      .ld-composed-unit[data-role="summary"] { padding-right: 0; font-size: 16px; }
      .ld-composed-unit[data-kind="card"],
      .ld-composed-unit[data-kind="decision"] { padding-right: 20px; }
      .ld-composed-unit[data-kind="figure"] {
        margin-inline: -12px;
        border-radius: 0;
        padding-inline: 12px;
      }
      .ld-figure-title { margin-right: 0; }
      .ld-scrim { align-items: flex-end; padding: 0; }
      .pop { width: 100%; max-height: 88dvh; border-radius: 5px 5px 0 0; }
      .pop h2 { max-width: calc(100% - 48px); font-size: 30px; }
      .ld-popup-section { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    }
  </style>
  <style id="ld-design-authority"><!-- legaldesign:design-authority --><!-- /legaldesign:design-authority --></style>
<!-- legaldesign:runtime -->
<style id="ld-tokens">
:root,
[data-theme="light"] {
  color-scheme: light;
  --bg: #fbfbfb;
  --card: #ffffff;
  --card-strong: #ffffff;
  --ink: #111111;
  --muted: #565656;
  --faint: #6f6f6f;
  --line: rgba(17, 17, 17, 0.13);
  --line-strong: rgba(17, 17, 17, 0.3);
  --red: #c92014;
  --red-strong: #a01a10;
  --red-wash: rgba(201, 32, 20, 0.055);
  --insert: #2456d6;
  --interaction: #767676;
  --detail-feedback: var(--interaction);
  --tint: #f3f3f3;
  --scrim: rgba(17, 17, 17, 0.52);
  --shadow-soft:
    0 1px 3px rgba(17, 17, 17, 0.08), 0 6px 18px rgba(17, 17, 17, 0.05);
  --shadow: 0 22px 60px rgba(17, 17, 17, 0.18);
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: Charter, "Iowan Old Style", Georgia, serif;
  --label: var(--sans);
  /* One authored reading scale. Window resizing changes layout, not type. */
  --ld-type-title: 28px;
  --ld-type-section: 20px;
  --ld-type-body: 16px;
  --ld-type-caption: 12px;
  --ld-space: 8px;
  --ld-content-gap: 16px;
  --ld-content-padding: 24px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --card: #111111;
  --card-strong: #171717;
  --ink: #f2f2f0;
  --muted: #b4b4b0;
  --faint: #8d8d89;
  --line: rgba(242, 242, 240, 0.14);
  --line-strong: rgba(242, 242, 240, 0.32);
  --red: #ff5a4e;
  --red-strong: #ff7d73;
  --red-wash: rgba(255, 90, 78, 0.12);
  --insert: #6fa0ff;
  --interaction: #a0a09c;
  --tint: #161616;
  --scrim: rgba(0, 0, 0, 0.68);
  --shadow-soft: 0 1px 3px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.35);
  --shadow: 0 22px 60px rgba(0, 0, 0, 0.62);
}

* {
  box-sizing: border-box;
}
html,
body {
  background: var(--bg);
}
html {
  min-height: 100%;
  color: var(--ink);
  font-family: var(--sans);
}
body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}
button,
select {
  cursor: pointer;
}
button:disabled,
select:disabled {
  cursor: default;
  opacity: 0.42;
}
a {
  color: var(--red);
  text-decoration: underline;
  text-underline-offset: 0.12em;
}
a:hover {
  text-decoration-thickness: 2px;
}
html :focus-visible,
html #ld-page-approach button:focus-visible {
  outline: 2px solid var(--interaction);
  outline-offset: 2px;
}
[data-detail]:focus-visible,
[data-evidence]:focus-visible {
  outline: 2px solid var(--detail-feedback);
  outline-offset: 2px;
}
svg [data-detail]:focus-visible {
  outline: none;
}
/* Text-led chart rows and comparison headers have no leading card to stroke.
   Their keyboard focus belongs to the single group, never to each child. */
html:not([data-input-modality="pointer"])
  svg
  [data-detail]:focus-visible:not(
    :has(> :is(rect, path, circle, ellipse, polygon, polyline):first-child)
  ) {
  outline: 2px solid var(--detail-feedback);
  outline-offset: 3px;
}
html:not([data-input-modality="pointer"])
  svg
  [data-detail]:focus-visible
  > :is(rect, path, circle, ellipse, polygon, polyline):first-child {
  stroke: var(--detail-feedback);
  stroke-width: 2px;
}
.ld-control:focus:not(:focus-visible),
.ld-tool:focus:not(:focus-visible),
.ld-ab button:focus:not(:focus-visible),
.ld-why-toggle:focus:not(:focus-visible),
.ld-popup-close:focus:not(:focus-visible) {
  outline: none;
}
[hidden] {
  display: none !important;
}
.doc-text {
  font-family: var(--serif);
}

.ld-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  min-height: 44px;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.ld-matter {
  min-width: 0;
  flex: 1 1 auto;
  margin: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ld-controls,
.ld-editor-tools {
  display: flex;
  align-items: center;
  gap: 2px;
}
.ld-controls {
  max-width: calc(100vw - 220px);
  overflow-x: auto;
  border: 1px solid var(--line-strong);
  background: var(--card);
  padding: 2px;
  scrollbar-width: none;
}
.ld-controls::-webkit-scrollbar {
  display: none;
}
.ld-control,
.ld-ab button,
.ld-why-toggle,
.ld-popup-close {
  min-height: 27px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  padding: 5px 9px;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.ld-tool,
.ld-palette {
  min-width: 27px;
  min-height: 27px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--card);
  padding: 0 8px;
  color: var(--ink);
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.ld-control:hover,
.ld-tool:hover,
.ld-ab button:hover,
.ld-why-toggle:hover {
  background: var(--tint);
  color: var(--ink);
}
.ld-control[aria-pressed="true"],
.ld-ab button[aria-pressed="true"] {
  background: var(--tint);
  color: var(--ink);
}
#theme-toggle {
  display: inline-grid;
  width: 30px;
  min-width: 30px;
  place-items: center;
  padding: 0;
}
.ld-theme-icon {
  width: 15px;
  height: 15px;
}
.ld-theme-sun {
  display: none;
}
html[data-theme="dark"] .ld-theme-moon {
  display: none;
}
html[data-theme="dark"] .ld-theme-sun {
  display: block;
}
.ld-tool[aria-pressed="true"] {
  border-color: var(--interaction);
  color: var(--interaction);
}
.ld-editor-tools {
  display: none;
}
html[data-mode="edit"] .ld-editor-tools {
  display: flex;
}
.ld-overflow-wrap {
  position: relative;
  display: contents;
}
#editor-overflow-toggle {
  display: none;
}
.ld-overflow-menu {
  display: contents;
}
.ld-palette {
  max-width: 88px;
  appearance: auto;
}
.ld-form-nav {
  position: sticky;
  top: 56px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 24px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  padding: 8px;
}
.ld-form-nav [data-walkthrough-status] {
  min-width: 64px;
  flex: 1 1 auto;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.ld-form-nav [data-report-section] {
  overflow: hidden;
  text-overflow: ellipsis;
}
.ld-form-nav [aria-current="true"] {
  border-color: var(--interaction);
}

.ld-unit {
  position: relative;
}
.ld-unit-tools {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 70;
  display: none;
  width: max-content;
  align-items: center;
  gap: 3px;
  margin: 0;
  transform: translateY(calc(-100% - 4px));
  box-shadow: none;
}
html[data-mode="edit"]
  .ld-unit:is(:hover, :focus-within, .ld-selected)
  > .ld-unit-tools,
html[data-mode="edit"] .ld-unit:has(.ld-selected) > .ld-unit-tools {
  display: flex;
}
.ld-ab {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  padding: 2px;
}
.ld-ab::before {
  content: "‹";
  padding: 0 3px;
  color: var(--faint);
}
.ld-ab::after {
  content: "›";
  padding: 0 3px;
  color: var(--faint);
}
.ld-ab button {
  min-width: 27px;
  min-height: 25px;
  border: 0;
  padding: 3px 6px;
  font-size: 10px;
}
.ld-ab button + button::before {
  content: "·";
  margin-right: 8px;
  color: var(--faint);
}
.ld-unit-tools .ld-why-toggle {
  min-height: 27px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--card);
  padding: 3px 8px;
  font-size: 10px;
}
.ld-why {
  margin: 8px 0 0;
  border-top: 1px solid var(--line);
  padding: 9px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.ld-review,
.ld-sheet-open {
  display: none !important;
}

[data-editable][contenteditable="true"] {
  cursor: text;
}
#ld-editor-layer {

  function gearPath(cx, cy, r, teeth, phase = 0) {
    const inner = r - 3.4,
      outer = r + 3.4,
      per = (Math.PI * 2) / teeth,
      points = [];
    for (let i = 0; i < teeth; i++) {
      const a = phase + i * per;
      [
        [inner, -0.5],
        [inner, -0.28],
        [outer, -0.18],
        [outer, 0.18],
        [inner, 0.28],
        [inner, 0.5],
      ].forEach(([rad, f]) => {
        points.push([
          cx + rad * Math.cos(a + per * f),
          cy + rad * Math.sin(a + per * f),
        ]);
      });
    }
    return (
      points
        .map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`)
        .join("") + "Z"
    );
  }
  C.gears = (params, opts) => {
    var data = params;
    opts = opts || {};

    text(data.caption, "caption", true);

  /* Charts share a 360 × 200 viewBox and 12px outer padding. Quantitative
     plots use x=54…346 and y=24…144; labels, axis titles, and the required
     source-note line occupy the reserved margins rather than the plot. */
  const CHART = Object.freeze({ left: 54, right: 346, top: 24, base: 144 });

  function number(value, name, min = -Infinity, integer = false) {
    if (
      !Number.isFinite(value) ||
      value < min ||
      (integer && !Number.isInteger(value))
    )
      throw new TypeError(
        `${name} must be ${integer ? "an integer" : "a finite number"}${min !== -Infinity ? ` at least ${min}` : ""}`,
      );
    return value;
  }
  function boolean(value, name) {
    if (value != null && typeof value !== "boolean")
      throw new TypeError(`${name} must be boolean when supplied`);
  }
  function detail(value, name) {
    text(value, name, true);
  }
  function chartParams(data, allowed) {
    known(data, "params", ["title", ...allowed]);
    text(data.title, "title", true);
    text(data.sourceNote, "sourceNote");
    return data;
  }
  function chartItem(value, name, fields, required) {
    known(value, name, fields);
    required.forEach((key) => {
      if (key === "label") text(value[key], `${name}.${key}`);
      else number(value[key], `${name}.${key}`);
    });
    if (fields.includes("open")) boolean(value.open, `${name}.open`);
    if (fields.includes("detail")) detail(value.detail, `${name}.detail`);
    return value;
  }
  function fmt(value) {
    if (Number.isInteger(value)) return String(value);
    return String(Math.round(value * 100) / 100);
  }
  function scale(value, fromMin, fromMax, toMin, toMax) {
    return (
      toMin + ((value - fromMin) / (fromMax - fromMin || 1)) * (toMax - toMin)
    );
  }
  function path(points) {
    return points
      .map(
        (point, i) =>
          `${i ? "L" : "M"}${point[0].toFixed(2)} ${point[1].toFixed(2)}`,
      )
      .join("");
  }
  function openClass(value, line = false) {
    return value && value.open === true ? (line ? " open-line" : " open") : "";
  }
  function chartLabel(
    value,
    x,
    y,
    cls = "",
    anchor = "middle",
    baseline = "auto",
  ) {
    const classes = /(^|\s)value(\s|$)/.test(cls) ? `${cls} data-label` : cls;
    return `<text class="${classes}" x="${Number(x).toFixed(2)}" y="${Number(y).toFixed(2)}" text-anchor="${anchor}" dominant-baseline="${baseline}">${esc(value)}</text>`;
  }
  function categoryLabel(value, x, y, width, anchor = "middle") {
    return txt(value, x, y, width, "muted", 2, anchor);
  }
  function unitTitle(title, unit) {
    return unit == null ? title : `${title} (${unit})`;
  }
  function chartFrame(body, data, opts, baseline = "zero") {
    const heading = data.title
      ? chartLabel(data.title, 12, 13, "chart-title", "start")
      : "";
    const source = chartLabel(data.sourceNote, 12, 195, "source", "start");
    return svgMarkup(
      `${heading}${body}${source}`,
      opts,
      "0 0 360 200",
      "chart-viz",
      data,
    ).replace(
      " class=",
      ` data-kind="chart" data-baseline="${esc(baseline)}" class=`,
    );
  }
  function axisX(title, unit, y = 177) {
    return chartLabel(unitTitle(title, unit), 200, y, "axis-title");
  }
  function axisY(title, unit, x = 11, cy = 84) {
    return `<g transform="translate(${x} ${cy}) rotate(-90)">${chartLabel(unitTitle(title, unit), 0, 0, "axis-title")}</g>`;
  }
  function niceTicks(min, max, count = 5) {
    if (min === max) max = min + 1;
    const rough = Math.abs(max - min) / Math.max(1, count - 1);
    const magnitude = 10 ** Math.floor(Math.log10(rough || 1));
    const normalized = rough / magnitude;
    const step =
      (normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10) *
      magnitude;
    const first = Math.ceil(min / step) * step;
    const values = [];
    for (let value = first; value <= max + step * 1e-8; value += step) {
      values.push(Math.round(value * 1e10) / 1e10);
      if (values.length === 7) break;
    }
    if (!values.length || Math.abs(values[0] - min) > step * 0.1)
      values.unshift(min);
    if (values.length < 7 && Math.abs(values.at(-1) - max) > step * 0.1)
      values.push(max);
    return values.slice(0, 7);
  }
  function numericAxes(min, max, yTitle, unit, options = {}) {
    const left = options.left == null ? CHART.left : options.left,
      right = options.right == null ? CHART.right : options.right,
      top = options.top == null ? CHART.top : options.top,
      base = options.base == null ? CHART.base : options.base,
      horizontal = options.horizontal === true;
    let body = "";
    niceTicks(min, max, options.tickCount || 5).forEach((tick) => {
      if (horizontal) {
        const x = scale(tick, min, max, left, right);
        body += `<path class="faint" d="M${x.toFixed(2)} ${top}V${base}"/>${chartLabel(fmt(tick), x, base + 13, "muted")}`;
      } else {
        const y = scale(tick, min, max, base, top);
        body += `<path class="faint" d="M${left} ${y.toFixed(2)}H${right}"/>${chartLabel(fmt(tick), left - 6, y + 3.5, "muted", "end")}`;
      }
    });
    body += horizontal
      ? `<path class="hair" d="M${left} ${base}H${right}"/>`
      : `<path class="hair" d="M${left} ${top}V${base}H${right}"/>`;
    if (yTitle) body += axisY(yTitle, unit);
    return body;
  }
  function unitRungs(x, y, width, height, value, horizontal = false) {
    if (!Number.isInteger(value) || value <= 1) return "";
    let body = "";
    for (let i = 1; i < value; i++) {
      if (horizontal) {
        const xx = x + (width * i) / value;
        body += `<path class="hair" d="M${xx.toFixed(2)} ${y}V${(y + height).toFixed(2)}"/>`;
      } else {
        const yy = y + height - (height * i) / value;
        body += `<path class="hair" d="M${x} ${yy.toFixed(2)}H${(x + width).toFixed(2)}"/>`;
      }
    }
    return body;
  }
  function pointData(
    data,
    min,
    max,
    fields = ["x", "y", "label", "open", "detail"],
  ) {
    return list(data.points, "points", min, max).map((value, i) => {
      chartItem(value, `points[${i}]`, fields, ["x", "y"]);
      if (value.label != null) text(value.label, `points[${i}].label`, true);
      return value;
    });
  }
  function labeledData(data, key, min, max, numberKeys, fields) {
    return list(data[key], key, min, max).map((value, i) => {
      chartItem(value, `${key}[${i}]`, fields, ["label", ...numberKeys]);
      numberKeys.forEach((name) => {

  function labelBoxes(points) {
    const occupied = [];

      const value = point.label || fmt(point.y),
        width = Math.max(24, value.length * 6.2),
        height = 13,
        candidates = [
          [8, -8, "start"],
          [-8, -8, "end"],
          [8, 14, "start"],
          [-8, 14, "end"],
          [0, -13, "middle"],
          [0, 18, "middle"],
        ];
      let chosen = candidates[index % candidates.length];
      for (const candidate of candidates) {
        const left =
            point.px +
            candidate[0] -
            (candidate[2] === "end"
              ? width
              : candidate[2] === "middle"
                ? width / 2
                : 0),
          top = point.py + candidate[1] - height;
        const box = { left, top, right: left + width, bottom: top + height };
        if (
          left >= CHART.left &&
          box.right <= CHART.right &&
          top >= CHART.top - 10 &&
          box.bottom <= CHART.base &&
          !occupied.some(
            (other) =>
              box.left < other.right + 2 &&
              box.right + 2 > other.left &&
              box.top < other.bottom + 2 &&
              box.bottom + 2 > other.top,
          )
        ) {
          occupied.push(box);
          chosen = candidate;
          break;
        }
      }
      return chartLabel(
        value,
        point.px + chosen[0],
        point.py + chosen[1],
        "value",
        chosen[2],
      );
    });
  }

  C.rungBars = (params, opts) => {
    const data = chartParams(params, [
        "items",
        "unit",
        "yAxisTitle",
        "sourceNote",
      ]),
      items = labeledData(
        data,
        "items",
        2,
        8,
        ["value"],
        ["label", "value", "open", "detail"],
      );
    opts = opts || {};
    text(data.unit, "unit");
    text(data.yAxisTitle, "yAxisTitle");
    const max = Math.max(1, ...items.map((item) => item.value)),
      slot = (CHART.right - CHART.left) / items.length,
      width = Math.min(34, slot - 6);
    let body = numericAxes(0, max, data.yAxisTitle, data.unit);
    items.forEach((item, i) => {
      const height = scale(item.value, 0, max, 0, CHART.base - CHART.top),
        x = CHART.left + i * slot + (slot - width) / 2,
        y = CHART.base - height;
      body += wrapDetail(
        `<rect class="fill${openClass(item)}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${width.toFixed(2)}" height="${height.toFixed(2)}"/>${unitRungs(x, y, width, height, item.value)}${chartLabel(fmt(item.value), x + width / 2, Math.max(20, y - 5), "value")}${categoryLabel(item.label, x + width / 2, 158, slot - 2)}`,
        item,
      );
    });
    return chartFrame(body, data, opts, "zero");
  };

  C.hairlineLine = (params, opts) => {
    const data = chartParams(params, [
        "points",
        "xLabels",
        "xAxisTitle",
        "yAxisTitle",
        "unit",
        "baselineZero",
        "sourceNote",
      ]),
      points = pointData(data, 3, 30);
    opts = opts || {};
    strings(data.xLabels, "xLabels", points.length);
    ["xAxisTitle", "yAxisTitle", "unit"].forEach((key) => {
      text(data[key], key);
    });
    choice(data.baselineZero, "baselineZero", ["yes", "no"], true);
    const xmin = Math.min(...points.map((point) => point.x)),
      xmax = Math.max(...points.map((point) => point.x)),
      observedMin = Math.min(...points.map((point) => point.y)),
      ymin =
        data.baselineZero === "no" ? observedMin : Math.min(0, observedMin),
      ymax = Math.max(...points.map((point) => point.y), ymin + 1),
      xy = points.map((point) => ({
        ...point,
        px: scale(point.x, xmin, xmax, CHART.left, CHART.right),
        py: scale(point.y, ymin, ymax, CHART.base, CHART.top),
      }));
    let body = numericAxes(ymin, ymax, data.yAxisTitle, data.unit);
    body += `<path class="line" d="${path(xy.map((point) => [point.px, point.py]))}"/>`;
    xy.forEach((point) => {
      body += wrapDetail(
        `<circle class="tone-2${openClass(point)}" cx="${point.px.toFixed(2)}" cy="${point.py.toFixed(2)}" r="3"/>`,
        point,
      );

    if (points.length <= 12) body += labelBoxes(xy).join("");
    const stride = Math.max(1, Math.ceil(points.length / 7));
    data.xLabels.forEach((value, i) => {
      if (i % stride === 0 || i === points.length - 1)
        body += chartLabel(value, xy[i].px, 157, "muted");

    body += axisX(data.xAxisTitle);
    return chartFrame(
      body,
      data,
      opts,
      data.baselineZero === "no" ? "observed-min" : "zero",
    );
  };

  C.hairlineArea = (params, opts) => {
    const data = chartParams(params, [
        "points",
        "xLabels",
        "xAxisTitle",
        "yAxisTitle",
        "unit",
        "sourceNote",
      ]),
      points = pointData(data, 5, 60, ["x", "y", "label", "open"]);
    opts = opts || {};
    strings(data.xLabels, "xLabels", 2, 12);
    ["xAxisTitle", "yAxisTitle", "unit"].forEach((key) => {
      text(data[key], key);
    });
    const xmin = Math.min(...points.map((point) => point.x)),
      xmax = Math.max(...points.map((point) => point.x)),
      ymax = Math.max(1, ...points.map((point) => point.y)),
      xy = points.map((point) => ({
        ...point,
        px: scale(point.x, xmin, xmax, CHART.left, CHART.right),

  function treemapNodes(values, name, depth = 0) {
    return list(values, name, 2, depth ? 6 : 8).map((value, i) => {
      chartItem(
        value,
        `${name}[${i}]`,
        ["label", "value", "children", "open", "detail"],
        ["label", "value"],
      );
      number(value.value, `${name}[${i}].value`, 0);
      if (value.children != null) {
        if (depth)
          throw new TypeError(
            `${name}[${i}].children may only be one level deep`,
          );
        treemapNodes(value.children, `${name}[${i}].children`, depth + 1);
      }
      return value;
    });
  }
  function treemapRects(items, x, y, width, height, depth = 0) {
    const total = items.reduce((sum, item) => sum + item.value, 0);
    if (!total) throw new TypeError("treemap levels must total more than zero");
    let cursor = depth % 2 ? y : x,
      body = "";
    items.forEach((item, i) => {
      const ratio = item.value / total,
        w = depth % 2 ? width : width * ratio,
        h = depth % 2 ? height * ratio : height,
        rx = depth % 2 ? x : cursor,
        ry = depth % 2 ? cursor : y,
        header = item.children ? Math.min(20, h * 0.3) : 0;
      cursor += depth % 2 ? h : w;
      body += wrapDetail(
        `<rect class="tone-${(i % 4) + 1}${openClass(item)}" x="${rx.toFixed(2)}" y="${ry.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}"/>${categoryLabel(`${item.label} ${fmt(item.value)}`, rx + 5, ry + 14, Math.max(18, w - 10), "start")}`,
        item,
      );
      if (item.children)
        body += treemapRects(
          item.children,
          rx + 3,
          ry + header,
          Math.max(1, w - 6),
          Math.max(1, h - header - 3),
          depth + 1,
        );
    });
    return body;
  }

    function installSlideIndexToggle(nav) {

      const list = nav.querySelector("[data-index-list]");
      if (!toggle || !list || nav.__legalDesignIndexBound) return;

    function syncUnitEdit(section) {

      if (!item) return;
      all("[data-evidence-field]", pop).forEach((node) => {
        const field = node.getAttribute("data-evidence-field");
        const value = node.textContent.trim();
        if (!value) return;
        if (["cite", "locator", "detail"].includes(field)) item[field] = value;
        else if (field === "popup.title" && item.popup)
          item.popup.title = value;
        else if (field === "popup.lede" && item.popup) item.popup.lede = value;
        else {
          const match = /^popup\.sections\.(\d+)\.(heading|body)$/.exec(field);

    function renderDecisions() {
      all('[data-kind="decision"][data-unit]').forEach((unit) => {
        const id = unit.getAttribute("data-unit");
        const value =
          state.review && state.review.decisions
            ? state.review.decisions[id]
            : null;
        const choice =
          value && typeof value === "object" && !Array.isArray(value)
            ? value.choice
            : value;
        const choices =
          value && typeof value === "object" && !Array.isArray(value)
            ? value.choices
            : value;
        all("[data-decision-option]", unit).forEach((button) => {
          const selected = unit.hasAttribute("data-multi")

            : choice === button.value;

        });

          (input) => {

              ? "custom"
              : "note";

              value && typeof value === "object" && !Array.isArray(value)
                ? value[key] || ""
                : "";
            if (document.activeElement !== input) input.value = next;
          },
        );
        unit.toggleAttribute(
          "data-answered",
          Boolean(
            unit.hasAttribute("data-multi")
              ? (Array.isArray(choices) && choices.length) ||
                  (value && (value.custom || value.note))

    function bindDecisions() {

        const id = unit.getAttribute("data-unit");

          if (button.__legalDesignDecisionBound) return;
          button.__legalDesignDecisionBound = true;
          button.addEventListener("click", () => {
            change(() => {
              if (!state.review.decisions) state.review.decisions = {};
              if (unit.hasAttribute("data-multi")) {
                const current = state.review.decisions[id];
                const values = Array.isArray(current)
                  ? current
                  : current && Array.isArray(current.choices)
                    ? current.choices
                    : [];
                const at = values.indexOf(button.value);
                if (at >= 0) values.splice(at, 1);

                  current &&
                  typeof current === "object" &&
                  !Array.isArray(current)
                )
                  current.choices = values;
                else state.review.decisions[id] = values;
              } else {
                const current = state.review.decisions[id];
                if (
                  current &&
                  typeof current === "object" &&
                  !Array.isArray(current)
                )
                  current.choice = button.value;
                else state.review.decisions[id] = button.value;
              }
            });
          });
        });
        all("[data-decision-custom],[data-decision-note]", unit).forEach(
          (input) => {
            if (input.__legalDesignDecisionBound) return;
            input.__legalDesignDecisionBound = true;
            input.addEventListener("change", () => {
              change(() => {
                if (!state.review.decisions) state.review.decisions = {};
                let current = state.review.decisions[id];
                if (
                  !current ||
                  typeof current !== "object" ||
                  Array.isArray(current)
                ) {
                  current = unit.hasAttribute("data-multi")
                    ? {
                        choices: Array.isArray(current)
                          ? current.slice()

        "Open contents",
        "Previous page",
        "Next page",
        "Previous section",
        "Next section",
      ];
      all("[aria-label]", cloneRoot).forEach((node) => {
        const value = node.getAttribute("aria-label");
        if (value && !safeLabels.includes(value))
          node.setAttribute("aria-label", "[Accessible description.]");
      });
      all("a[href]", cloneRoot).forEach((link) => {
        link.setAttribute("href", "#");
        link.removeAttribute("target");
        link.removeAttribute("rel");
        if (link.closest("#popup-scrim")) return;
        const internal =
          link.hasAttribute("data-page") ||
          link.hasAttribute("data-frame-button") ||
          link.hasAttribute("data-evidence") ||
          link.hasAttribute("data-detail");
        if (internal && link.children.length) return;
        if (
          link.hasAttribute("data-evidence") ||
          link.hasAttribute("data-detail")
        )
          link.textContent = "[Open the source.]";
        else if (internal) link.textContent = "[Open the relevant section.]";
        else link.textContent = "[Link.]";
      });
      all("[data-decision-custom],[data-decision-note]", cloneRoot).forEach(
        (input) => {
          input.value = "";
          input.setAttribute(
            "aria-label",
            input.hasAttribute("data-decision-custom")
              ? "Custom position"
              : "Note",
          );
        },
      );
      all("[data-report-section]", cloneRoot).forEach((button, index) => {
        button.textContent = "[Section " + (index + 1) + ".]";
      });
      all("#ld-page-approach [data-select-approach]", cloneRoot).forEach(
        (button) => {
          const key =
            button.getAttribute("data-select-approach") === "b" ? "B" : "A";
          button.innerHTML = "<span>" + key + "</span>Page " + key;
        },
      );
      all("[data-zone-doc]", cloneRoot).forEach((node) => {
        node.removeAttribute("data-zone-doc");
      });
      scrubTemplateMatterAttributes(cloneRoot);
    }
    function download(text, name) {
      const blob = new Blob([text], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.className = "ld-download-link";
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = name;
      link.hidden = true;
      link.setAttribute("data-editor-chrome", "");
      document.body.appendChild(link);
      try {
        link.click();
      } catch (error) {
        link.remove();
        URL.revokeObjectURL(url);
        throw error;
      }
      // The browser consumes a Blob asynchronously. Do not revoke it in the
      // same task that requests the download, or assume the request reached disk.
      setTimeout(() => {
        link.remove();
        URL.revokeObjectURL(url);
      }, 60000);
    }
    let fileWriteInProgress = false;
    let clientPreviewURL = null;
    function clearSaveBanner() {
      const old = document.querySelector(".ld-save-banner");
      if (old) old.remove();
      if (clientPreviewURL) {
        URL.revokeObjectURL(clientPreviewURL);
        clientPreviewURL = null;
      }
    }
    async function persistHTML(
      html,
      name,
      reuseWorkingHandle = false,
      clientPreview = false,
    ) {
      if (fileWriteInProgress) {
        showSaveBanner(
          "A save is already in progress. Finish that save first.",
          8000,
        );
        return "busy";
      }
      fileWriteInProgress = true;
      clearSaveBanner();
      let writable;
      try {
        if (typeof window.showSaveFilePicker === "function") {
          try {
            // Invoke the picker before the first await, while the button's
            // user activation is still available. Exports never reuse the
            // working-copy handle or overwrite it without a fresh choice.
            const handle =
              reuseWorkingHandle && fileHandle
                ? fileHandle
                : await window.showSaveFilePicker({
                    suggestedName: name,
                    types: [
                      {
                        description: "HTML file",
                        accept: { "text/html": [".html"] },
                      },
                    ],
                  });
            writable = await handle.createWritable();
            await writable.write(html);
            await writable.close();
            writable = null;
            if (reuseWorkingHandle) fileHandle = handle;
            showSaveBanner(
              `Saved ${handle.name || name} to the location you chose.${clientPreview ? " Open a preview of this exact exported copy below." : ""}`,
              clientPreview ? 0 : 8000,
              clientPreview ? html : null,
            );
            return "saved";
          } catch (error) {
            if (writable && typeof writable.abort === "function") {
              try {
                await writable.abort();
              } catch {
                /* Preserve the original failure. */
              }
              writable = null;
            }
            if (error && error.name === "AbortError") {
              showSaveBanner(
                "Save canceled. Your open work is unchanged.",
                8000,
              );
              return "canceled";
            }
            if (reuseWorkingHandle) fileHandle = null;
          }
        }
        download(html, name);
        showSaveBanner(
          `Download requested: ${name}. Check your browser's download location; this page cannot confirm it reached disk. Your open work is unchanged.${clientPreview ? " The link opens a preview of this exact exported copy, not the saved disk file." : ""}`,
          clientPreview ? 0 : 16000,
          clientPreview ? html : null,
        );
        return "download-requested";
      } catch {
        showSaveBanner(
          "The file could not be saved. Your open work is unchanged. Try Save or Export again and choose a writable location.",
          16000,
        );
        return "failed";
      } finally {
        fileWriteInProgress = false;
      }
    }
    function stripAuthoringData(cloneRoot) {
      // data-variant-body is a presentation wrapper: shared copy spacing and
      // popup-text affordances depend on it even in a read-only client export.
      const names = [
        "data-card-title",
        "data-document-title-placeholder",
        "data-editable",
        "data-diagram-label",
        "data-evidence-field",
        "data-evidence-id",
        "data-editor-base-transform",
        "data-editor-scale-x",
        "data-editor-scale-y",
        "data-editor-node-key",
        "data-editor-origin-fill-token",
        "data-editor-origin-fill-token-present",
        "data-editor-origin-style",
        "data-editor-origin-style-present",
        "data-editor-origin-style-stamped",
        "data-editor-origin-text-token",
        "data-editor-origin-text-token-present",
        "data-editor-only",
        "data-editor-preserve-dom",
        "data-editor-unit",
        "data-editor-x",
        "data-editor-y",
        "data-export-chrome",
        "data-export-protect",
        "data-placeholder",
        "data-param-path",
        "data-single",
        "data-zone-doc",
      ];
      all("*", cloneRoot)
        .concat([cloneRoot])
        .forEach((node) => {
          names.forEach((name) => {
            node.removeAttribute(name);
          });
        });
    }
    function ensureClientResponseControl(scope) {
      if (
        scope.getAttribute("data-exported") !== "client" ||
        scope.querySelector("#ld-response-save")
      )
        return;
      const controls = scope.querySelector(".ld-controls");
      if (!controls) return;
      const button = document.createElement("button");
      button.className = "ld-control";
      button.id = "ld-response-save";
      button.type = "button";
      button.textContent = "Save responses";
      controls.appendChild(button);
    }
    LD.exportHTML = (shouldDownload) => {
      all('[contenteditable="true"]').forEach((node) => {
        node.blur();
      });
      // The previous transfer's notice is editor chrome, not part of the next
      // deliverable. Release its reserved space before checking page geometry.
      clearSaveBanner();
      fitFixedPages();
      if (!validateExportPageFit(false))
        throw new Error(
          "Page exceeds the available window. Move detail to a popup or another page before exporting.",
        );
      const cloneRoot = document.documentElement.cloneNode(true);
      scrubEditing(cloneRoot);
      cloneRoot.setAttribute("data-exported", "client");
      const clientBlueprintId =
        "legaldesign-client-" + stableLocationHash(state.artifactId);
      cloneRoot.setAttribute("data-client-blueprint-id", clientBlueprintId);
      all("#export-html,#export-template", cloneRoot).forEach((node) => {
        node.remove();
      });
      all("[data-placeholder],[data-placeholder-title]", cloneRoot).forEach(
        (node) => {
          node.removeAttribute("data-placeholder");
          node.removeAttribute("data-placeholder-title");
        },
      );
      if (state.approaches) {
        const selectedApproach = currentApproach();
        all("[data-approach]", cloneRoot).forEach((page) => {
          if (page.getAttribute("data-approach") !== selectedApproach)
            page.remove();
          else page.hidden = false;
        });
        const approachControl = cloneRoot.querySelector("#ld-page-approach");
        if (approachControl) approachControl.remove();
      }
      all("section.ld-unit[data-unit]", cloneRoot).forEach((section) => {
        const sourceUnit = unitState(section.getAttribute("data-unit"));
        if (!sourceUnit) {
          section.remove();
          return;
        }
        const selected = sourceUnit.selected;
        all(".ld-variant", section).forEach((variant) => {
          if (variant.getAttribute("data-variant") !== selected)
            variant.remove();
          else variant.hidden = false;
        });
        all(
          ".ld-ab,.ld-why,.ld-unit-tools,.ld-review,.ld-sheet-open",
          section,
        ).forEach((node) => {
          node.remove();
        });
      });
      all("[data-editor-only]", cloneRoot).forEach((node) => {
        node.remove();
      });
      const referenced = new Set(
        all("[data-evidence],[data-detail],[data-evidence-ids]", cloneRoot)
          .filter((node) => !node.closest("#popup-scrim"))
          .flatMap((node) => {
            const grouped = node.getAttribute("data-evidence-ids");
            if (grouped) return grouped.split(/\s+/).filter(Boolean);
            return [
              node.getAttribute("data-evidence") ||
                node.getAttribute("data-detail"),
            ].filter(Boolean);
          }),
      );
      // A purposeful detail popup can link onward to an original source popup.
      // Keep that whole reachable chain, not only the first surface hop.
      for (const id of referenced) {
        const pop = all("#popup-scrim .pop[id]", cloneRoot).find(
          (node) => node.id === id,
        );
        if (!pop) continue;
        all("[data-detail],[data-evidence],[data-evidence-ids]", pop).forEach(
          (node) => {
            const ids = node.getAttribute("data-evidence-ids");
            (ids
              ? ids.split(/\s+/)
              : [
                  node.getAttribute("data-detail") ||
                    node.getAttribute("data-evidence"),
                ]
            )
              .filter(Boolean)
              .forEach((target) => {
                referenced.add(target);
              });
          },
        );
      }
      all("#popup-scrim .pop[id]", cloneRoot).forEach((pop) => {
        if (!referenced.has(pop.id)) pop.remove();
      });
      const clientState = reducedClientState(cloneRoot, clientBlueprintId);
      stripAuthoringData(cloneRoot);
      ensureClientResponseControl(cloneRoot);
      setCloneState(cloneRoot, clientState);
      const html = serializeClone(cloneRoot);
      if (shouldDownload !== false)
        void persistHTML(html, state.artifactId + ".html", false, true);
      return html;
    };
    LD.exportTemplate = (shouldDownload, requestedId) => {
      all('[contenteditable="true"]').forEach((node) => {
        node.blur();
      });
      clearSaveBanner();
      fitFixedPages();
      if (!validateExportPageFit(true))
        throw new Error(
          "Page exceeds the available window. Move detail to a popup or another page before exporting.",
        );
      const templateId = templateExportId(requestedId);
      const cloneRoot = document.documentElement.cloneNode(true);
      cloneRoot.dataset.templateId = templateId;
      if (isPackagedTemplateId(requestedId)) {
        cloneRoot.dataset.templateKind = "packaged";
      } else {
        cloneRoot.dataset.templateKind = "exported";
      }
      cloneRoot.dataset.templateBlueprintId = templateId;
      scrubEditing(cloneRoot);
      cloneRoot.setAttribute("data-exported", "template");
      const maps = templateMappings();
      const nextState = templateState(maps, templateId);
      sanitizeTemplateDOM(cloneRoot, nextState, maps);
      setCloneState(cloneRoot, nextState);
      const html = serializeClone(cloneRoot);
      if (shouldDownload !== false)
        void persistHTML(html, templateId + ".html");
      return html;
    };

    async function saveFile() {
      all('[contenteditable="true"]').forEach((node) => {
        node.blur();
      });
      state.savedAt = new Date().toISOString();
      mirror();
      storeEditorDOM();
      const cloneRoot = document.documentElement.cloneNode(true);
      scrubTransientEditing(cloneRoot);
      setCloneState(cloneRoot, state);
      const html = serializeClone(cloneRoot);
      const saveName =
        root.getAttribute("data-exported") === "client"
          ? state.artifactId + "-responses.html"
          : state.artifactId + ".html";
      const result = await persistHTML(html, saveName, true);
      if (result === "saved") clearRestore();
      return result === "canceled" || result === "failed" || result === "busy"
        ? null
        : html;
    }
    function clearRestore() {
      const banner = document.getElementById("ld-restore-banner");
      if (banner) banner.remove();
    }
    function showSaveBanner(
      message,
      duration = 2400,
      clientPreviewHTML = null,
    ) {
      clearSaveBanner();
      const banner = document.createElement("div");
      banner.className = "ld-save-banner";
      banner.setAttribute("role", "status");
      banner.setAttribute("aria-live", "polite");
      banner.setAttribute("data-editor-chrome", "");
      banner.textContent = message;
      if (clientPreviewHTML !== null) {
        clientPreviewURL = URL.createObjectURL(
          new Blob([clientPreviewHTML], { type: "text/html;charset=utf-8" }),
        );
        const link = document.createElement("a");
        link.className = "ld-export-preview";
        link.href = clientPreviewURL;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open exported HTML";
        banner.appendChild(link);
      }
      const bar = document.querySelector(".ld-bar");
      (bar ? bar.parentNode : document.body).insertBefore(
        banner,
        bar ? bar.nextSibling : document.body.firstChild,
      );
      if (duration > 0)
        setTimeout(() => {
          if (banner.isConnected) clearSaveBanner();
        }, duration);
    }

    function bindChrome() {
      const theme = document.getElementById("theme-toggle");
      if (theme)
        theme.addEventListener("click", () => {
          scheduleReady(true);
          applyTheme(
            root.getAttribute("data-theme") === "dark" ? "light" : "dark",
            true,
          );
        });
      const save = document.getElementById("ld-save");
      if (save) save.addEventListener("click", saveFile);
      const responseSave = document.getElementById("ld-response-save");
      if (responseSave) responseSave.addEventListener("click", saveFile);
      const html = document.getElementById("export-html");
      if (html)
        html.addEventListener("click", () => {
          LD.exportHTML(true);
        });
      const template = document.getElementById("export-template");
      if (template)
        template.addEventListener("click", () => {
          LD.exportTemplate(true);
        });
    }

    LD.state = () => clone(state);
    LD.setState = (next) => {
      if (!next || next.schema !== "legaldesign.state.v1")
        throw new TypeError("state must use legaldesign.state.v1");
      checkpoint();
      state = clone(next);
      mirror();
      renderAll({ sync: false });
      storeEditorDOM();
    };
    LD.save = saveFile;
    LD.setMode = setMode;
    LD.setApproach = setApproach;
    LD.openPopup = openPopup;
    LD.closePopup = closePopup;
    LD.bindDecisions = bindDecisions;
    LD.placeholderDerivation = clone(PLACEHOLDERS);

    scrubTransientEditing(root);
    normalizeChrome();
    applyTheme(initialTheme(), false);
    removeLegacyReviewChrome();
    ensureClientResponseControl(root);
    installFixedPages();
    renderAll();
    bindApproaches();
    bindUnits();
    bindDecisions();
    bindPopups();
    installComposedForm();
    bindEditor();
    bindChrome();
    installRestoreBanner();
    updateEditorButtons();
    scheduleReady(false);
    // Phones land in the existing readable view, not an illegible miniature.
    // Run once at load; deliberately closing it keeps the canvas available.
    if (
      singleComposition() &&
      window.matchMedia("(max-width: 760px)").matches
    ) {
      requestAnimationFrame(() => {
        if (!editing && !activePopup())
          openPageReader(document.getElementById("ld-read-page"));
      });
    }
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  else boot();
})();
</script>
