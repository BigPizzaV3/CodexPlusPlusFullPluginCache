  - {id: REQ-008, requirement: não recusar defensivo legítimo, mechanism: defensive_non_refusal_scope, tests: [DF-001, DF-002, DF-003, DF-004], gate: GATE-SAFETY}
  - {id: REQ-009, requirement: high-impact human review, mechanism: CR-010+T_HUMAN_REVIEW, tests: [HR-001], gate: GATE-HUMAN}
  - {id: REQ-010, requirement: consistência canônica, mechanism: aliases+INV-007+INV-016, tests: [ST-002, ST-005, ST-010], gate: GATE-STATIC}
  - {id: REQ-011, requirement: evidence_review no mesmo Conselho, mechanism: modes+N_PREPARE, tests: [GT-011, GT-012], gate: GATE-EVIDENCE-REVIEW}
  - {id: REQ-012, requirement: evidence producer != reviewer claim, mechanism: package read-only+INV-010/011, tests: [ST-008, ST-009, AT-004, BT-010], gate: GATE-EVIDENCE-REVIEW}
  - {id: REQ-013, requirement: calibrar outcome, mechanism: CR-014..016+INV-012..015, tests: [BT-006, BT-007, BT-008, BT-009, BT-010, BT-011, BT-012, BT-013, GT-013], gate: GATE-EVIDENCE-REVIEW}
  - {id: REQ-014, requirement: preservar claims/gaps/regressions, mechanism: evidence_review_output, tests: [GT-011, BT-007, BT-012], gate: GATE-EVIDENCE-REVIEW}
