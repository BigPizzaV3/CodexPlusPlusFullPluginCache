  documental: v6_2_1_generated_static_checks_only
  kb: v6.2.1_generated
  derived_prompts: generated
  behavioral: not_run
  adversarial: not_run
  human_domain_review: not_run
  runtime: not_run
  independent_validator: not_run
  production: no_go
  frase_normativa: v6.2.1 incorpora PATCH-01..10 e pode registrar apenas checks estáticos efetivamente executados. Não declara
    robustez comportamental, segurança adversarial, adequação jurídica operacional ou produção sem evidence records correspondentes
    e revisão humana.
  static_execution_record_ref: exec_static_v6_2_1_001
  structural_taxonomy_occupancy_observed: 1.0
  structural_taxonomy_occupancy_scope: estrutura da taxonomia apenas; não qualidade/robustez
known_limitations:
- Golden tests, behavioral evals e adversarial suites da v6.2.1 não foram executados nesta geração.
- Revisão humana de domínio/arquitetura não foi executada.
- Static checks do build não constituem validator independente nem release authority.
- Preservação integral de linhagens anteriores à v6.2 não foi revalidada contra todos os artefatos-fonte.
- Norma vigente, prazos, competência e precedentes continuam dependentes de fonte adequada, atual e verificável.
- Capabilities de tools/RAG/MCP/runtime não são presumidas.
- Métricas de retrieval como precision/recall dependem de conjunto de avaliação e ground truth adequados.
- Automação juridicamente relevante depende de admissibilidade/reserva de humanidade e autoridade aplicáveis.
promotion_invariants:
- Nunca promover para release por parse/hash/static score isolado.
- Nunca converter threshold/meta/plano em resultado observado.
- Nunca declarar robustez de segurança sem evidence record de teste adversarial.
- Nunca fabricar lei, precedente, prazo, processo, citação, doutrina, capability, execução ou validação.
- Nunca usar [FATO VERIFICADO] além do escopo efetivamente sustentado pela evidência.
- Nunca usar [ASSUMIDO] para jurisdição ou outra lacuna material capaz de alterar a conclusão.
- Nunca aplicar hierarquia universal de fontes; usar claim-source fit e fonte oficial atual quando o claim for vigência/competência/precedente.
- Nunca reportar precision/recall sem ground truth/conjunto de avaliação adequado.
- Nunca discutir arquitetura de automação juridicamente relevante antes do gate de admissibilidade/reserva de humanidade.
- Nunca tratar HITL posterior como cura de automação proibida.
- Nunca repetir side effect não idempotente sob estado incerto sem verificar estado e satisfazer compensação/gate aplicável.
- Nunca tratar reviewer-echo ou papel lógico como validação independente sem independence_basis.
- Nunca afirmar acesso a ferramenta/base/MCP sem evidence.
- Nunca omitir origem_projeto nos itens da KB.
- Nunca promover v6.2.1 para produção sem golden/behavioral/adversarial/human review.
