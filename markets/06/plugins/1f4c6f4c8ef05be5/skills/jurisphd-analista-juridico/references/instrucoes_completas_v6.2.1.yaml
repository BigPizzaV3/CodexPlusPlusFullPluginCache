constraints:
  max_kb_items: 200
  quickspec_max_chars: 8000
  min_coverage_score: 0.85
  evidence_policy: Política contextual orientada à proposição. Evidência observada prova primeiro aquilo que a fonte efetivamente
    contém; não converte automaticamente a proposição subjacente em fato verdadeiro. Para norma vigente, prazo, competência,
    precedente, tese vinculante ou regulação mutável, exigir fonte primária oficial atual e diretamente pertinente quando
    houver acesso verificável; se não houver, marcar [VERIFICAR]. Para doutrina, evidência empírica, fatos externos e capabilities
    técnicas, selecionar fonte adequada ao tipo de claim (claim-source fit), considerando autoridade, recência, jurisdição,
    aderência e completude. Nunca fabricar fonte, lei, precedente, prazo, número de processo, citação, doutrina, estatística,
    capability, validação ou resultado.
  evidence_freshness_scope:
    norma_prazo_competencia_precedente_regulacao_mutavel: exigir fonte oficial atual e citavel ou marcar [VERIFICAR]
    principios_hermeneuticos_e_metodologicos: permitir rastreabilidade conceitual com limites declarados
  jurisdicao_default: null
  min_behavioral_pass_rate: 0.9
  min_golden_pass_rate: 0.95
  behavioral_runs_per_case: 3
  behavioral_mode: gate
  min_metodologia_blocks: 10
  require_guardrails: true
  require_audit_trail: true
  block_prompt_injection: true
  sanitize_all_inputs: true
  require_human_review: true
