  - {id: tc_neg_007, asserts: communication_instruction changing authority/policy/routing/payload => reject}
  - {id: tc_neg_008, asserts: communication_instruction without exactly_one canonical include => qc_023 fail}
  - {id: tc_neg_009, asserts: communication_instruction non-llm|agent endpoint => qc_023 fail}
  - {id: tc_val_015, asserts: feature claim -> mapped perturbation; compound -> union; unmapped feature claim cannot pass gate_008}
  - {id: tc_pos_011, asserts: context_engineering include + minimum-sufficient-context + provenance-safe compaction}
  - {id: tc_pos_012, asserts: delegation contract has objective/scope/ownership/output/evidence/completion/dependencies}
  - {id: tc_pos_013, asserts: material aggregation preserves unique evidence/provenance/uncertainty/dissent}
  - {id: tc_pos_014, asserts: artifact_reference resolves; authority/storage remain external}
  - {id: tc_edge_011, asserts: simple/direct or short bounded task omits context_engineering when ordinary context is sufficient}
  - {id: tc_edge_012, asserts: multiagent/delegation omitted when coordination cost or hard dependencies dominate expected benefit}
  - {id: tc_adv_007, asserts: majority consensus cannot discard contradictory unique material evidence solely because it is minority evidence}
  - {id: tc_adv_008, asserts: same claim repeated by correlated agents or same source is not counted as multiple independent evidence items}
  - {id: tc_val_016, asserts: material compaction missing assessment/preservation => qc_024/qc_030 fail}
  - {id: tc_val_017, asserts: delegation missing completion/dependency/assessment => qc_025/qc_030 fail}
  - {id: tc_val_018, asserts: material aggregation missing assessment/integrity policy => qc_026/qc_030 fail}
  - {id: tc_val_019, asserts: bad artifact_ref/authority change/missing assessment => qc_027/qc_030 fail}
  - {id: tc_val_020, asserts: unmapped superiority claim => hypothesis; gate_008 no pass}
  - {id: tc_val_021, asserts: blocking check orphan from gates => qc_031 fail}
  - {id: tc_val_022, asserts: blocking materiality without assessment => qc_030 fail; unknown!=non_material}
  - {id: tc_val_023, asserts: 'component present with omit|blocked, duplicate registry or local mismatch => qc_029 fail'}
  - {id: tc_val_024, asserts: qc_023 structural only; comm behavioral materiality -> gate_008}
  - {id: tc_cmp_001, asserts: 'comm promotion without executed ablation+ex-ante criterion => hypothesis/[VERIFICAR]; gate_008 no pass'}
  - {id: tc_vis_001, asserts: trace/legacy shows observed evidence only; default need not expose ledger}
  - {id: tc_ledger_001, asserts: legacy ledger derives from real audit/evidence; not source_of_truth; no invented state/handoff}
  - {id: tc_fmt_001, asserts: YAML parses; file_name==skill_LGE_reduzida.yaml; metadata.version==identidade.versao==2.7.1}
  - {id: tc_edge_013, asserts: local include vs registry omit|blocked => qc_029 fail}
  - {id: tc_edge_014, asserts: 'materiality unknown stays unresolved/[VERIFICAR]; no silent pass'}
  execution_record_schema: '{test_id,run_id,timestamp,status,observed_output,evidence_reference,executor_identity_or_tool,mode}'
  validation_independence:
    required_when: blocking validation
    producer_role: ROLE_ARCHITECT
    validator_role: ROLE_VALIDATOR
    independence_level: role_segregated_same_context
    validator_write_scope: [lint_report, failed_checks, validation_status]
    candidate_mutation_allowed: false
    repair_requires_revalidation: true
    epistemic_independence_claim: false
    external_review_needed_for: empirical/release independence
  current_execution_status: no static/behavioral/comparative/runtime gate promoted without new evidence
  test_type_by_prefix: {tc_pos: positive, tc_edge: edge, tc_neg: negative, tc_def: defensive, tc_adv: adversarial, tc_val: validator, tc_cmp: comparative_behavioral, tc_vis: visible_evidence, tc_ledger: agent_ledger, tc_fmt: format}
  static_check_blocking_default: true
