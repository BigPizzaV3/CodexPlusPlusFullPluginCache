  - {id: tc_val_009, asserts: optional extension Value Add binding}
  - {id: tc_val_010, asserts: traceability links reference existing IDs}
  - {id: tc_val_011, asserts: superiority without comparative execution => gate_008 not pass; claim=hypothesis}
