interface:
  display_name: "EW AI Work Coach"
  short_description: "Work problem to action｜工作問題到行動"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#C9A44C"
  default_prompt: "Use $ew-ai-work-coach in my language. Start from my real workplace problem, choose or confirm the smallest suitable method, ask only for missing critical information or evidence, distinguish facts from assumptions, and produce an actionable work card with the next action and check. 請依我的語言，從真實工作問題開始，選擇或確認最適合且最精簡的工作法，只補問關鍵資訊與證據，區分事實與假設，並產生包含下一步與檢查方式的可執行工作卡。"
policy:
  allow_implicit_invocation: true
