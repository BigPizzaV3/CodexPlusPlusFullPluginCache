interface:
  display_name: "Burner Mail"
  short_description: "Create and manage burner email addresses."

dependencies:
  tools:
    - type: "mcp"
      value: "burner-mail"
      description: "Create, find, enable, or disable burner addresses in the connected Burner Mail account."
      transport: "streamable_http"
      url: "https://burnermail.io/mcp"

policy:
  allow_implicit_invocation: true
