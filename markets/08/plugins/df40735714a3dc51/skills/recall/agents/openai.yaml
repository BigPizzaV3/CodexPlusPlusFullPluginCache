interface:
  display_name: "Recall Cleve context"
  short_description: "Bring relevant Cleve context into this chat"
  default_prompt: "Use $recall to find relevant context in my Cleve workspace and explain what you found with sources."

dependencies:
  tools:
    - type: "mcp"
      value: "cleve"
      description: "Search and read workspace notes and obtain citation sources"
      transport: "streamable_http"
      url: "https://app.cleve.ai/mcp"
