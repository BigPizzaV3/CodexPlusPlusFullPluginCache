interface:
  display_name: "Update an existing Cleve note"
  short_description: "Merge this discussion into an existing Cleve note"
  default_prompt: "Use $update to find the relevant existing Cleve note and merge the new context from this conversation without creating another note."

dependencies:
  tools:
    - type: "mcp"
      value: "cleve"
      description: "Find existing notes and apply and verify targeted updates"
      transport: "streamable_http"
      url: "https://app.cleve.ai/mcp"
