interface:
  display_name: "Share a public summary"
  short_description: "Create a public link to this chat summary"
  default_prompt: "Use $share to create a public, read-only link to a summary of this conversation. Anyone with the link can read it."

dependencies:
  tools:
    - type: "mcp"
      value: "cleve"
      description: "Create a summary note and enable public viewer link-sharing"
      transport: "streamable_http"
      url: "https://app.cleve.ai/mcp"
