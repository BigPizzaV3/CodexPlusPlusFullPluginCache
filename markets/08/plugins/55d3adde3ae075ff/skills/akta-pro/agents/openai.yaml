interface:
  display_name: "akta.pro"
  short_description: "Private company data, news, and signals for agents"
  default_prompt: "Use $akta-pro to research companies, build company lists, and monitor company, industry, and topic news."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "akta-pro"
      description: "akta.pro MCP server: company data, company lists, news signals, and alternative signals"
      transport: "streamable_http"
      url: "https://mcp.akta.pro/mcp"
