interface:
  display_name: "Share with Keep Browser"
  short_description: "Turn selected public links into a shareable tab tree"
  icon_small: "./assets/keep-browser.png"
  icon_large: "./assets/keep-browser.png"
  default_prompt: "Use $share-with-keep-browser to share the public links selected in this conversation."
dependencies:
  tools:
    - type: "mcp"
      value: "keep-browser"
      description: "Create a Keep Browser tab tree share from selected public links"
      transport: "streamable_http"
      url: "https://mcp.keepbrowser.com/mcp"
