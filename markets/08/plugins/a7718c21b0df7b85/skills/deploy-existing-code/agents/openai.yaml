# Cafe24 AI SPACE — ChatGPT plugin skill configuration
#
# Declares the MCP server that every skill in this package depends on.
# The skills provide workflow guidance; the MCP server provides live data,
# authentication, authorization and the controlled actions themselves.

dependencies:
  tools:
    - type: "mcp"
      value: "cafe24-ai-space"
      description: "Deploy and manage web applications on Cafe24 AI SPACE — deploy, update, inspect status and logs, manage environment variables, backups and access control."
      transport: "streamable_http"
      url: "https://aih-proxy.cafe24.com/mcp"
