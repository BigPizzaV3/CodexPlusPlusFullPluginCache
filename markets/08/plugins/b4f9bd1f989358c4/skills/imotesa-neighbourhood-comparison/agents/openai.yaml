interface:
  display_name: "imotesa.bg area comparison"
  short_description: "Compare Bulgarian neighbourhood prices"
  default_prompt: "Use $imotesa-neighbourhood-comparison to compare observed asking-price context across Bulgarian neighbourhoods."
dependencies:
  tools:
    - type: "mcp"
      value: "imotesa-property-agent"
      description: "Retrieve imotesa.bg Bulgarian property records and market statistics."
      transport: "streamable_http"
      url: "https://agent.imotesa.bg/mcp"
policy:
  allow_implicit_invocation: true
