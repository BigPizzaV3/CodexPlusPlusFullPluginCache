interface:
  display_name: "imotesa.bg property record"
  short_description: "Inspect a Bulgarian property record"
  default_prompt: "Use $imotesa-property-record to inspect a Bulgarian property and its observed asking-price history."
dependencies:
  tools:
    - type: "mcp"
      value: "imotesa-property-agent"
      description: "Retrieve imotesa.bg Bulgarian property records and market statistics."
      transport: "streamable_http"
      url: "https://agent.imotesa.bg/mcp"
policy:
  allow_implicit_invocation: true
