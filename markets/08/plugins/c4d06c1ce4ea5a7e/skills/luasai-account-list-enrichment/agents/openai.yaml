interface:
  display_name: "Luasai Account Intelligence"
  short_description: "Enrich account lists with Luasai intelligence"
  default_prompt: "Use $luasai-account-list-enrichment and the native spreadsheet workflow to populate this account spreadsheet with the complete governed Luasai partner information requested."

dependencies:
  tools:
    - type: "mcp"
      value: "luasai"
      description: "Authenticated Luasai account and partner intelligence"
      transport: "streamable_http"
      url: "https://mcp.luasai.app/mcp"

policy:
  allow_implicit_invocation: false
