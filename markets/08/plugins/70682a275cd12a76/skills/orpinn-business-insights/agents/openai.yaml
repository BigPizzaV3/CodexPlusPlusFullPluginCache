interface:
  display_name: "Orpinn Business Insights"
  short_description: "Analyze authorized Orpinn data"
  default_prompt: "Use $orpinn-business-insights to analyze my authorized Orpinn sales and branch performance."

dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      description: "Analyze authorized Orpinn data and preview explicitly permitted price or image changes with confirmed undo"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"

policy:
  allow_implicit_invocation: true
