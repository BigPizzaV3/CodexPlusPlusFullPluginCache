interface:
  display_name: "Orpinn Action History"
  short_description: "Read real action status and request undo"
  default_prompt: "Use $orpinn-action-history to show the real status of my changes and prepare any requested undo with fresh browser approval."
dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"
policy:
  allow_implicit_invocation: true
