interface:
  display_name: "Orpinn Images"
  short_description: "Actual images and controlled replacement"
  default_prompt: "Use $orpinn-media-workflows to read the actual product or menu image, or prepare my chosen new image with browser approval."
dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"
policy:
  allow_implicit_invocation: true
