interface:
  display_name: "Orpinn Paper Menu Import"
  short_description: "Compare a real menu before adding items"
  default_prompt: "Use $orpinn-menu-import to compare my real paper menu with the catalog and ask me to decide each add, update or skip before approval."
dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"
policy:
  allow_implicit_invocation: true
