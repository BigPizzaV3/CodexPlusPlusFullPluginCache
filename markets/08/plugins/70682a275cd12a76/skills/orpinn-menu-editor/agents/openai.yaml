interface:
  display_name: "Orpinn Menu Editor"
  short_description: "Preview authorized Orpinn edits"
  default_prompt: "Use $orpinn-menu-editor to preview my requested menu changes with separate browser approval."
dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      description: "Authorized Orpinn tools with independent browser approval"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"
policy:
  allow_implicit_invocation: true
