interface:
  display_name: "Orpinn Catalog Updates"
  short_description: "Preview authorized Orpinn edits"
  default_prompt: "Use $orpinn-catalog-updates to preview my explicitly requested product changes and wait for my browser approval."
dependencies:
  tools:
    - type: "mcp"
      value: "orpinn"
      description: "Authorized Orpinn tools with independent browser approval"
      transport: "streamable_http"
      url: "https://clients.orpinn.com/mcp"
policy:
  allow_implicit_invocation: true
