interface:
  display_name: Revise and re-check a script
  short_description: Fix flagged passages, then re-check
  icon_small: ./assets/icon-small.png
  brand_color: '#EF4444'
  default_prompt: Help me fix the flagged passages in my script and re-check it.
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
dependencies:
  tools:
  - type: mcp
    value: prepublish
    description: Prepublish YouTube script audit tools
    transport: streamable_http
    url: https://prepublish.ai/mcp
