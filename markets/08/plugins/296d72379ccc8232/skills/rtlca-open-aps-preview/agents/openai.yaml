interface:
  display_name: "RTLCA Open APS Preview"
  short_description: "Open a known Autodesk model in the 3D viewer"
  default_prompt: "Use $rtlca-open-aps-preview to open this Autodesk model in the 3D viewer with its RTLCA emissions."

dependencies:
  tools:
    - type: "mcp"
      value: "realtimelca"
      description: "APS tools to resolve and preview Autodesk designs, and RTLCA tools for the emissions overlay."

policy:
  allow_implicit_invocation: true
