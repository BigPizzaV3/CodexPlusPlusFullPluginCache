interface:
  display_name: "RTLCA Import Inventory Quantities"
  short_description: "Add material quantities from a file to an RTLCA project"
  default_prompt: "Use $rtlca-import-inventory-quantities to add the quantities from this file to my RTLCA project inventory."

dependencies:
  tools:
    - type: "mcp"
      value: "realtimelca"
      description: "RTLCA MCP tools for projects, declared units, inventory materials, and verification."

policy:
  allow_implicit_invocation: true
