# Skill interface + policy for ChatGPT/Codex (see plugins/build/skills).
# allow_implicit_invocation lets ChatGPT activate this workflow when a user
# expresses the intent ("expense this", "file my expenses") without naming
# ExpenseOS — the in-chat discovery lever.
interface:
  display_name: "File my expenses"
  short_description: "Expense reports from chat"
  default_prompt: "File my expenses from this trip"

policy:
  products: ["CHAT"]
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "purafi-expense-agent"
      description: "ExpenseOS expense tools: receipts, mileage, reports, submission, reimbursement status"
      transport: "streamable_http"
      url: "https://mcp.purafi.ai/mcp"
