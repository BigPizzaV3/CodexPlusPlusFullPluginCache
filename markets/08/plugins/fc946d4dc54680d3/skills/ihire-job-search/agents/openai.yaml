interface:
  display_name: "Job Search by iHire"
  short_description: "Find industry-specific jobs on iHire"
  default_prompt: "Use $ihire-job-search to find current iHire jobs that match my experience and preferences."

dependencies:
  tools:
    - type: "mcp"
      value: "ihire-authenticated-tools"
      description: "Search current iHire jobs, retrieve job details, render job cards, and provide iHire apply links"
      transport: "streamable_http"
      url: "https://www.ihire.com/mcp/v1/authenticated-tools"

policy:
  allow_implicit_invocation: true
