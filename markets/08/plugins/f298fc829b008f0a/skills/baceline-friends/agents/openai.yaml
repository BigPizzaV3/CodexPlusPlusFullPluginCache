interface:
  display_name: "Baceline Friends"
  short_description: "Find approved friends and view their public match results"
  default_prompt: "Use $baceline-friends to show my friends and their match results."
dependencies:
  tools:
    - type: "mcp"
      value: "baceline"
      description: "Baceline authenticated friend list and friend match records"
      transport: "streamable_http"
      url: "https://mcp.baceline.io/mcp"
