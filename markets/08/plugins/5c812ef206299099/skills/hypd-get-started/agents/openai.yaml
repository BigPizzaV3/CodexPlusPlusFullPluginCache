interface:
  display_name: "Get started with Google Tag Manager by HYPD"
  short_description: "Connect Tag Manager and audit your container"
  default_prompt: "Use $hypd-get-started to help me get started with Google Tag Manager by HYPD."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hypd-tag-manager"
      description: "Google Tag Manager by HYPD: containers, tags, triggers, variables and versions"
      transport: "streamable_http"
      url: "https://tagmanager.hypd.ai/mcp"
