interface:
  display_name: "Passo Etkinlik Keşfi"
  short_description: "Canlı Passo etkinliklerini bul ve karşılaştır"
  default_prompt: "$passo-event-discovery ile bu hafta sonu İstanbul'daki uygun fiyatlı etkinlikleri bul."
dependencies:
