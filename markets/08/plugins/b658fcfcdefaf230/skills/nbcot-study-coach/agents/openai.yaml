interface:
  display_name: "OT Bestie study coach"
  short_description: "Practice NBCOT questions and plan your next study step"
  brand_color: "#635BCE"
  default_prompt: "Use $nbcot-study-coach to help me practice one OT Bestie question and understand my answer."

dependencies:
  tools:
    - type: "mcp"
      value: "ot-bestie"
      description: "OT Bestie practice questions, tests, progress, and podcasts"
      transport: "streamable_http"
      url: "https://otbestie.com/plugins/ot-bestie-chatgpt/mcp.php"

policy:
  allow_implicit_invocation: true
