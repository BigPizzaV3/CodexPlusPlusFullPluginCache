interface:
  display_name: "SBH News 읽기"
  short_description: "SBH News 공개 기사를 찾고 읽고 브리핑하기"
  default_prompt: "Use $sbh-news-reader to find today's major SBH News stories and give me a concise Korean briefing with publication times and original links."

dependencies:
  tools:
    - type: "mcp"
      value: "sbh-news-reader"
      description: "Search and read published SBH News articles"
      transport: "streamable_http"
      url: "https://sbh-news-mcp-staging.lemonaatree.workers.dev/mcp"

policy:
  allow_implicit_invocation: true
