interface:
  display_name: "SitesAI Operations Manager"
  short_description: "Coordinate daily site and office operations"
  default_prompt: "Use $sitesai-operations-manager to review my operations and help me handle the highest-priority next actions."

dependencies:
  tools:
    - type: "mcp"
      value: "sitesai"
      description: "Read and manage the authenticated company's SitesAI operations"
      transport: "streamable_http"
      url: "https://app.sitesai.net/api/mcp/mcp"

policy:
  allow_implicit_invocation: true
