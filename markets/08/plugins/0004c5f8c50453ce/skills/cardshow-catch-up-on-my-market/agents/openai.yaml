interface:
  display_name: "Catch Up on My Card Market"
  short_description: "Review followed activity saved shows and shop alerts"
  default_prompt: "Use $cardshow-catch-up-on-my-market to tell me what changed and what needs my attention."
dependencies:
  tools:
    - type: "mcp"
      value: "cardshow"
      description: "Read CardShow activity and apply exact confirmed relationship choices"
      transport: "streamable_http"
      url: "https://connect.cardshow.net/api/mcp/cardshow"
policy:
  allow_implicit_invocation: true
