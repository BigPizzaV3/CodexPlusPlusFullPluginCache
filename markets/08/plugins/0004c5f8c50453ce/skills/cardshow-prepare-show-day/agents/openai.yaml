interface:
  display_name: "Prepare for Show Day"
  short_description: "Turn one event into a practical personal game plan"
  default_prompt: "Use $cardshow-prepare-show-day to build a practical brief and checklist for my exact CardShow event."
dependencies:
  tools:
    - type: "mcp"
      value: "cardshow"
      description: "Read and update the signed-in collector's exact CardShow plan"
      transport: "streamable_http"
      url: "https://connect.cardshow.net/api/mcp/cardshow"
policy:
  allow_implicit_invocation: true
