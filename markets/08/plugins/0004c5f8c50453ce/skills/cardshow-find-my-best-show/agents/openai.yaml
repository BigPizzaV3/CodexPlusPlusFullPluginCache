interface:
  display_name: "Find My Best Card Show"
  short_description: "Compare shows against your real collecting priorities"
  default_prompt: "Use $cardshow-find-my-best-show to compare upcoming shows and explain which ones fit me best."
dependencies:
  tools:
    - type: "mcp"
      value: "cardshow"
      description: "Find and compare CardShow events for the signed-in collector"
      transport: "streamable_http"
      url: "https://connect.cardshow.net/api/mcp/cardshow"
policy:
  allow_implicit_invocation: true
