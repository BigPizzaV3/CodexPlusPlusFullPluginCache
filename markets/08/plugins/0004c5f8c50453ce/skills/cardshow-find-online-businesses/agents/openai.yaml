interface:
  display_name: "Find Online Card Businesses"
  short_description: "Search reviewed stores and manage a Pro shortlist"
  default_prompt: "Use $cardshow-find-online-businesses to search Online businesses for my collecting interests."
dependencies:
  tools:
    - type: "mcp"
      value: "cardshow"
      description: "Search CardShow Online businesses and confirm Pro-only private shortlist changes"
      transport: "streamable_http"
      url: "https://connect.cardshow.net/api/mcp/cardshow"
policy:
  allow_implicit_invocation: true
