interface:
  display_name: "Juriv'IA"
  short_description: "Assistant juridique en droit français, pour les titulaires d'un compte Juriv'IA"
  default_prompt: "Réponds en appliquant la méthode Juriv'IA (droit français, sources vérifiées)."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "jurivia"
      description: "Serveur MCP Juriv'IA (vérification du compte et de l'abonnement)"
      transport: "streamable_http"
      url: "https://jurivia.fr/mcp"
