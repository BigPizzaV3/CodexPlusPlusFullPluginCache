interface:
  display_name: "Měsíční přehled energií"
  short_description: "Přehled spotřeby, nákladů, anomálií a smluv za minulý měsíc"
  icon_small: "./assets/icon.png"
  brand_color: "#0B1F3A"
  default_prompt: "Použij $mesicni-prehled a připrav měsíční přehled energií za minulý měsíc pro vedení."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "es-zone"
      description: "ES Zone MCP server"
      transport: "streamable_http"
      url: "https://portal.energy-saving.cz/api/mcp"
