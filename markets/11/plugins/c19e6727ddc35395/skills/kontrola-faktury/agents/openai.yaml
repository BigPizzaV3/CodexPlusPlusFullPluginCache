interface:
  display_name: "Kontrola faktury"
  short_description: "Kontrola faktury za energii proti měření a smlouvě"
  icon_small: "./assets/icon.png"
  brand_color: "#0B1F3A"
  default_prompt: "Použij $kontrola-faktury a zkontroluj fakturu za elektřinu za minulý měsíc."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "es-zone"
      description: "ES Zone MCP server"
      transport: "streamable_http"
      url: "https://portal.energy-saving.cz/api/mcp"
