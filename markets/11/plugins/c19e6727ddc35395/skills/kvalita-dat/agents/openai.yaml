interface:
  display_name: "Kvalita dat"
  short_description: "Semafor úplnosti a aktuálnosti energetických dat"
  icon_small: "./assets/icon.png"
  brand_color: "#0B1F3A"
  default_prompt: "Použij $kvalita-dat a zkontroluj, jestli můžu věřit datům o spotřebě za poslední tři měsíce."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "es-zone"
      description: "ES Zone MCP server"
      transport: "streamable_http"
      url: "https://portal.energy-saving.cz/api/mcp"
