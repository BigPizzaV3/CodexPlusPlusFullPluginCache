interface:
  display_name: "Rezervovaná kapacita a jistič"
  short_description: "Využití a překročení rezervované kapacity nebo jističe"
  icon_small: "./assets/icon.png"
  brand_color: "#0B1F3A"
  default_prompt: "Použij $rezervovana-kapacita a posuď, jestli máme správně nastavenou rezervovanou kapacitu."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "es-zone"
      description: "ES Zone MCP server"
      transport: "streamable_http"
      url: "https://portal.energy-saving.cz/api/mcp"
