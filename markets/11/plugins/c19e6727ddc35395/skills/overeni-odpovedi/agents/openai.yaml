interface:
  display_name: "Ověření odpovědi"
  short_description: "Ověření čísel z odpovědi AI, reportu nebo nabídky"
  icon_small: "./assets/icon.png"
  brand_color: "#0B1F3A"
  default_prompt: "Použij $overeni-odpovedi a ověř čísla v tomto textu proti portálu."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "es-zone"
      description: "ES Zone MCP server"
      transport: "streamable_http"
      url: "https://portal.energy-saving.cz/api/mcp"
