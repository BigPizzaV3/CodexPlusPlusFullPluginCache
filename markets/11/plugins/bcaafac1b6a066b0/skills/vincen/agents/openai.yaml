# Skill metadata (learn.chatgpt.com/docs/build-skills: lives at <skill>/agents/openai.yaml).
# The URL is the production MCP host, the same as openai-plugin/mcp.json (staging runs at
# https://mcp-dev.vincen.ai/mcp; scripts/install-local.sh drops this block for local tests).
interface:
  display_name: "Vincen"
  short_description: "AI agents on a cloud computer"
  default_prompt: "Use Vincen to build a one-page website for my coffee shop."

dependencies:
  tools:
    - type: "mcp"
      value: "vincen"
      description: "Vincen tasks: start, follow, answer, preview and publish"
      transport: "streamable_http"
      url: "https://mcp.vincen.ai/mcp"
