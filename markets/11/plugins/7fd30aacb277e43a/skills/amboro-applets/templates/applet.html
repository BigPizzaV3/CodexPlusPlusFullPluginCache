<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fxr-sdk" content="1">
<title>My applet</title>
<style>
  /* The Applet Design System is already in the frame: add only what is specific to this applet. */
</style>
</head>
<body class="fxr-app">
<div class="fxr-card">
  <p class="fxr-card__title">My applet</p>
  <p id="hello" class="fxr-caption">Loading…</p>
</div>
<script>
  const hello = document.getElementById('hello');

  function render(ctx) {
    hello.className = ctx.symbol ? 'fxr-heading' : 'fxr-caption';
    hello.textContent = ctx.symbol
      ? `Hello from ${ctx.symbol}${ctx.timeframe ? ` · ${ctx.timeframe}` : ''}`
      : 'Open this applet inside a chart to see the symbol.';
  }

  fxr.ready().then((ctx) => {
    render(ctx);
    fxr.context.onChange(render);
  });
</script>
</body>
</html>
