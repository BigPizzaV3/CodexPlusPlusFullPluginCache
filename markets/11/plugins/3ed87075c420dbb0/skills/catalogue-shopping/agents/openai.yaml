interface:
  display_name: "Tailored Deals shopping"
  short_description: "Find products and offers in Tailored Deals"
  default_prompt: "Use $catalogue-shopping to find suitable Tailored Deals products and offers for my country and budget."

dependencies:
  tools:
    - type: "mcp"
      value: "tailored-deals"
      description: "Search the Tailored Deals public catalogue"
      transport: "streamable_http"
      url: "https://www.tailoreddeals.info/api/chatgpt/mcp"

policy:
  allow_implicit_invocation: true
