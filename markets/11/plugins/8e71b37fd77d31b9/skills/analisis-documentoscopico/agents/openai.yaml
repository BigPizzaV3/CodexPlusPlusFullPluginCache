interface:
  display_name: "Análisis documentoscópico"
  short_description: "Analiza firmas y escritos con fuentes técnicas"
  icon_small: "./assets/logo.png"
  icon_large: "./assets/logo.png"
  brand_color: "#FF4D0A"
  default_prompt: "Analizá estas muestras con criterios documentoscópicos y fundamentá los hallazgos con fuentes de Grafos 360."
dependencies:
  tools:
    - type: mcp
      value: grafos360-documentoscopia
      description: Recupera fragmentos del corpus de Documentoscopía de Grafos 360 con referencias bibliográficas.
      transport: streamable_http
      url: https://mcp.grafos360.com/documentoscopia/mcp
