# The skills of this plugin call tools of a single MCP server: BrokerForBoat
# (company-scoped, OAuth 2.1 + PKCE). "Scan Tools" in the OpenAI portal is the
# authority on the tool catalogue; this file only declares the connection.
dependencies:
  tools:
    - type: "mcp"
      value: "brokerforboat"
      description: "BrokerForBoat MCP server: boat listings, photos, publishing to the website and portals, and buyer leads."
      transport: "streamable_http"
      url: "https://app.brokerforboat.com/mcp"
