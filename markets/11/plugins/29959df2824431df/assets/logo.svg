<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="AgentCron mark">
  <!-- Phase 1.15 Concept J — clock-hand A. Navy A apex points at
       12 o'clock; pivot dot anchors the teal clock hand which rests
       at BRAND_CLOCK_HAND_ANGLE_DEG = 50° (~1:40 on a real clock —
       slight forward lean suggests motion). The hand is drawn as an
       unrotated 15-unit line straight up from the pivot and rotated
       50° clockwise so the static tip lands at roughly (43.5, 28.4).
       Wave 48.3 — white shell rect removed; mark renders transparent
       so it inherits the page background (`#F6F5F3`). Inverse
       variant for dark surfaces lives in `logo-white.svg`. -->
  <path d="M14 53 L32 13 L50 53" stroke="#0E1430" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="32" cy="38" r="2.5" fill="#0E1430"/>
  <line x1="32" y1="38" x2="32" y2="23" stroke="#0F766E" stroke-width="4.5" stroke-linecap="round" transform="rotate(50 32 38)"/>
</svg>
