interface:
  display_name: "Saleslumen Workflows"
  short_description: "Design, publish, and run Saleslumen workflows"
  brand_color: "#2563EB"
  default_prompt: "Help me build or run a Saleslumen workflow."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "saleslumen"
      description: "Saleslumen MCP server"
      transport: "streamable_http"
      url: "https://mcp.saleslumenapis.com/"
