interface:
  display_name: "Saleslumen Emails"
  short_description: "Read, draft, send, and organize Saleslumen email"
  brand_color: "#0F766E"
  default_prompt: "Help me manage Saleslumen email."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "saleslumen"
      description: "Saleslumen MCP server"
      transport: "streamable_http"
      url: "https://mcp.saleslumenapis.com/"
