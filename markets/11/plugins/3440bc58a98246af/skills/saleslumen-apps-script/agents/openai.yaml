interface:
  display_name: "Saleslumen Apps Script"
  short_description: "Write, deploy, and run Saleslumen Apps Script"
  brand_color: "#7C3AED"
  default_prompt: "Help me write or run Saleslumen Apps Script."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "saleslumen"
      description: "Saleslumen MCP server"
      transport: "streamable_http"
      url: "https://mcp.saleslumenapis.com/"
