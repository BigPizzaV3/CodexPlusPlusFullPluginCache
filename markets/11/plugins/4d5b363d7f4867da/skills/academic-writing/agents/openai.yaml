interface:
  display_name: Academic Writing
  short_description: Draft and revise cited research writing
  default_prompt: Create a cited literature review in Paperguide AI Writer using papers
    in my saved reference library.
dependencies:
  tools:
  - type: mcp
    value: paperguide
    description: Paperguide research platform MCP server with scientific literature,
      saved references and AI Writer tools
    transport: streamable_http
    url: https://mcp.paperguide.ai/mcp
