interface:
  display_name: Critical Paper Appraisal
  short_description: Examine a study’s methods and results
  default_prompt: Critically appraise a saved Paperguide paper and explain whether
    its conclusions follow from the methods and results.
dependencies:
  tools:
  - type: mcp
    value: paperguide
    description: Paperguide research platform MCP server with scientific literature,
      saved references and AI Writer tools
    transport: streamable_http
    url: https://mcp.paperguide.ai/mcp
