interface:
  display_name: Compare Research Evidence
  short_description: Build a multi-study evidence matrix
  default_prompt: Compare the papers in my Paperguide reference folder and identify
    agreements, disagreements and evidence limitations.
dependencies:
  tools:
  - type: mcp
    value: paperguide
    description: Paperguide research platform MCP server with scientific literature,
      saved references and AI Writer tools
    transport: streamable_http
    url: https://mcp.paperguide.ai/mcp
