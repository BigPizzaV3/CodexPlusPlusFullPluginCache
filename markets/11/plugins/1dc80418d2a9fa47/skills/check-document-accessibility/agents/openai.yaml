interface:
  display_name: "Check accessibility"
  short_description: "Check PDF, Word, and PowerPoint accessibility"
  default_prompt: "Use $check-document-accessibility to check this attached file and explain its accessibility findings."

dependencies:
  tools:
    - type: "mcp"
      value: "inkable-docs"
      description: "Inkable accessibility checks and report retrieval"
      transport: "streamable_http"
      url: "https://inkabledocs.com/mcp"
