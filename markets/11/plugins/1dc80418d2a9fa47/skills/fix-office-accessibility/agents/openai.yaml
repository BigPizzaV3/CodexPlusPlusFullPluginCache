interface:
  display_name: "Fix Word & PowerPoint"
  short_description: "Fix accessibility issues and download updated files"
  default_prompt: "Use $fix-office-accessibility to fix supported issues in this Word document or PowerPoint and return the updated file."

dependencies:
  tools:
    - type: "mcp"
      value: "inkable-docs"
      description: "Inkable Word and PowerPoint remediation and file retrieval"
      transport: "streamable_http"
      url: "https://inkabledocs.com/mcp"
