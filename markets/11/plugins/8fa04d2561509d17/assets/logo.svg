<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scheduled Smiles logo icon: heart with smile (mark only).
  Heart outline in violet/blue; grey smile inside.
  Used in app header and card headers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Scheduled Smiles">
  <!-- Heart outline - medium violet/blue -->
  <path
    d="M32 53C22 46 14 39 14 29c0-7 5-13 13-13 4 0 7 2 9 5 2-3 5-5 9-5 8 0 13 6 13 13 0 10-8 17-18 24-3 2-5 2-8 0z"
    stroke="#6d28d9"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Smile curve - grey -->
  <path
    d="M22 31c3 7 17 7 20 0"
    stroke="#6b7280"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
