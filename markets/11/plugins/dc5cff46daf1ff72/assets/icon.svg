<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ProductByte">
	<title>ProductByte</title>

	<style>
		:root,
		svg {
			--cube-top: #303030;
			--cube: #1b1b1b;
			--cube-right: #0c0c0c;
			--letter: #f4f4f2;
			--letter-top: #fafaf8;
			--letter-right: #eaeae8;
			--edge: #ffffff;
			--edge-opacity: 0.18;
			--fold-ink: #1c1c1c;
			--fold-ink-opacity: 0.22;
		}
	</style>

	<defs>
		<mask id="cube-mask">
			<path
				d="M256 90 L400 173 L400 339 L256 422 L112 339 L112 173 Z"
				fill="#fff"
				stroke="#fff"
				stroke-width="56"
				stroke-linejoin="round"
			/>
		</mask>

		<mask id="letter-mask">
			<rect width="512" height="512" fill="#000" />
			<use href="#letter-p" />
		</mask>
	</defs>


	<g id="cube">
		<path
			d="M256 90 L400 173 L400 339 L256 422 L112 339 L112 173 Z"
			fill="var(--cube)"
			stroke="var(--cube)"
			stroke-width="56"
			stroke-linejoin="round"
		/>

		<g mask="url(#cube-mask)">
			<path d="M256 256 L-176 7 L688 7 Z" fill="var(--cube-top)" />
			<path d="M256 256 L688 7 L900 656 L256 656 Z" fill="var(--cube-right)" />
		</g>
	</g>


	<g id="letter-p" fill="var(--letter)" mask="url(#cube-mask)">
		<g id="p-left" transform="matrix(0.867 0.5 0 1 112 173)">
			<path d="M64 0 L102 0 L102 64 L166 64 L166 102 L102 102 L102 240 L64 240 Z" />
		</g>

		<g id="p-top" fill="var(--letter-top)" transform="matrix(0.867 -0.5 0.867 0.5 112 173)">
			<path d="M0 64 L94 64 A8 8 0 0 1 102 72 L102 166 L64 166 L64 102 L0 102 Z" />
		</g>

		<g id="p-right" fill="var(--letter-right)" transform="matrix(0.867 -0.5 0 1 256 256)">
			<path d="M102 0 L102 94 A8 8 0 0 1 94 102 L0 102 L0 64 L64 64 L64 0 Z" />
		</g>
	</g>

	<g id="edges" mask="url(#cube-mask)" fill="none" stroke="var(--edge)" stroke-opacity="var(--edge-opacity)" stroke-width="4" stroke-linecap="butt">
		<path d="M77 153 L256 256" />
		<path d="M435 153 L256 256" />
		<path d="M256 256 L256 462" />
	</g>

	<g id="edges-on-paint" mask="url(#letter-mask)" fill="none" stroke="var(--fold-ink)"
	   stroke-opacity="var(--fold-ink-opacity)" stroke-width="4" stroke-linecap="butt">
		<path d="M77 153 L256 256" />
		<path d="M435 153 L256 256" />
		<path d="M256 256 L256 462" />
	</g>
</svg>
