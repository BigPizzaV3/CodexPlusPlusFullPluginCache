interface:
  display_name: "Troubleshoot Remote Device"
  short_description: "Diagnose issues on paired computers and servers"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#607086"
  default_prompt: "Use $remote-device-troubleshooting to diagnose why an app or process is failing on my paired computer."
dependencies:
  tools:
    - type: "mcp"
      value: "relaydesk"
      description: "RelayDesk MCP server for explicitly paired computers, servers, and VMs."
      transport: "streamable_http"
      url: "https://relay-desk-mjq6.vercel.app/mcp"
policy:
  allow_implicit_invocation: true
