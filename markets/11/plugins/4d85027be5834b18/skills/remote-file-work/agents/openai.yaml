interface:
  display_name: "Work With Remote Files"
  short_description: "Find and edit files on paired machines"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#607086"
  default_prompt: "Use $remote-file-work to find and update a project file on my paired computer."
dependencies:
  tools:
    - type: "mcp"
      value: "relaydesk"
      description: "RelayDesk MCP server for explicitly paired computers, servers, and VMs."
      transport: "streamable_http"
      url: "https://relay-desk-mjq6.vercel.app/mcp"
policy:
  allow_implicit_invocation: true
