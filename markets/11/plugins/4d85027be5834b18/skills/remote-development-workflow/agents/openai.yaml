interface:
  display_name: "Remote Development Workflow"
  short_description: "Run builds, tests, and dev tasks remotely"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#607086"
  default_prompt: "Use $remote-development-workflow to run my project tests on a paired machine and investigate failures."
dependencies:
  tools:
    - type: "mcp"
      value: "relaydesk"
      description: "RelayDesk MCP server for explicitly paired computers, servers, and VMs."
      transport: "streamable_http"
      url: "https://relay-desk-mjq6.vercel.app/mcp"
policy:
  allow_implicit_invocation: true
