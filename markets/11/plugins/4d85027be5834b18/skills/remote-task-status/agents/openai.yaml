interface:
  display_name: "Remote Task Status"
  short_description: "Check an existing task without changing it"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#607086"
  default_prompt: "Use $remote-task-status to inspect the status and existing output of a task already running on my paired machine. Do not start, resume, repeat, or modify the task."
dependencies:
  tools:
    - type: "mcp"
      value: "relaydesk"
      description: "RelayDesk MCP server for explicitly paired computers, servers, and VMs."
      transport: "streamable_http"
      url: "https://getrelaydesk.space/mcp"
policy:
  allow_implicit_invocation: false
