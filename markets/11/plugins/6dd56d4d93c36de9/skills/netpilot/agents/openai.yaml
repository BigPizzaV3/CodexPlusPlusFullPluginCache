# Skill dependency declaration (OpenAI build/skills: "If a skill requires an
# MCP server, declare the dependency in `agents/openai.yaml`"; "A dependency
# makes the required tool available; it does not replace clear workflow
# instructions"). `value` is the server name in ../../../mcp.json; `url` is
# the same endpoint. Pinned by tests/unit/test_agent_route/test_openai_plugin_package.py.
# submission-errors: "interface is required in agents/openai.yaml when that
# file is included"; "interface.display_name is required and must not be
# empty"; "interface.short_description is required and must not be empty";
# "interface.default_prompt must be a string when provided". snake_case here,
# camelCase in plugin.json.
interface:
  display_name: "NetPilot"
  short_description: "AI network lab from a prompt"
  default_prompt: "Build a VXLAN EVPN lab on Nokia SR Linux, two leaves and a spine, and show me the type 2 and type 5 routes."
dependencies:
  tools:
    - type: "mcp"
      value: "netpilot"
      description: "NetPilot lab VM, design, Packet Tracer and device CLI tools"
      transport: "streamable_http"
      url: "https://agent.netpilot.io/mcp"
