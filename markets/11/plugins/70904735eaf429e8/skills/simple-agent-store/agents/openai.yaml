interface:
  display_name: "Simple Agent Store"
  short_description: "Save and retrieve your notes across connected agents"
  default_prompt: "Use $simple-agent-store to save this note for later."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "simple-agent-store"
      description: "The user's connected Simple Agent Store"
      transport: "streamable_http"
      url: "https://www.simpleagentstore.com/api/mcp"
