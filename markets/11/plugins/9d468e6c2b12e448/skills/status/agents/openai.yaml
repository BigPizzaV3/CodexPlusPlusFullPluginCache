interface:
  display_name: "sun:status"
  short_description: "Check a SUN generation and fetch its audio"
  brand_color: "#FFDC00"
  default_prompt: "Use $status to check whether what I asked SUN for is ready."

dependencies:
  tools:
    - type: "mcp"
      value: "sun"
      description: "SUN MCP server for checking generation progress and fetching audio."
      transport: "streamable_http"
      url: "https://api.sunapp.ai/mcp"
