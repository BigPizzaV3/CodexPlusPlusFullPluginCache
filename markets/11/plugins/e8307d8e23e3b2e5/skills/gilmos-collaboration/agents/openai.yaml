interface:
  display_name: "gilmOS · Chat et agenda"
  short_description: "Échanges d’équipe et planification de production"
  default_prompt: "Use $gilmos-collaboration to read my project's chat and plan its resource delivery dates in the gilmOS agenda."

dependencies:
  tools:
    - type: "mcp"
      value: "gilmos"
      description: "Authenticated gilmOS chat and production calendar tools"
      transport: "streamable_http"
      url: "https://app.gilm.ai/mcp"

policy:
  allow_implicit_invocation: true
