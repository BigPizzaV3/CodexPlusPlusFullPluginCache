interface:
  display_name: "Hidden Option Diagnosis"
  short_description: "Explain why a Simplio3D option or part is hidden"
  default_prompt: "Explain why this option is hidden in my Simplio3D configurator when I pick these selections."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
