interface:
  display_name: "3D Target Check"
  short_description: "Check that Simplio3D options target real 3D parts"
  default_prompt: "Check that every 3D part my Simplio3D configurator's options and rules target exists in the model."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
