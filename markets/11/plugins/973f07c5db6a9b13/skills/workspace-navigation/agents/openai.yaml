interface:
  display_name: "Workspace Navigation"
  short_description: "Find Simplio3D projects, options and models by name"
  default_prompt: "List my Simplio3D projects and tell me which workspace and plan I'm connected to."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
