interface:
  display_name: "Publish Readiness"
  short_description: "Check if a Simplio3D configurator is ready to publish"
  default_prompt: "Is my Simplio3D configurator ready to publish? Give me a verdict and what to fix first."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
