interface:
  display_name: "Configurator Audit"
  short_description: "Audit a Simplio3D configurator and explain every fix"
  default_prompt: "Audit my Simplio3D configurator and tell me what needs fixing before I publish it."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
