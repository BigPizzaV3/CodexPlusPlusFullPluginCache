interface:
  display_name: "Pricing"
  short_description: "Explain Simplio3D pricing and calculate a configuration"
  default_prompt: "Explain how my Simplio3D configurator is priced and calculate the price of a configuration."
dependencies:
  tools:
    - type: "mcp"
      value: "simplio3d"
      description: "Simplio3D MCP server: read access to the user's Simplio3D workspace and documentation"
      transport: "streamable_http"
      url: "https://app.simplio3d.ai/mcp"
policy:
  allow_implicit_invocation: true
