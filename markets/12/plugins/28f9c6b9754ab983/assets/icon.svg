  <!-- Sparkle marks around camera -->
  <line x1="108" y1="30" x2="114" y2="24" stroke="#131313" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="116" y1="36" x2="122" y2="34" stroke="#131313" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="112" y1="42" x2="117" y2="46" stroke="#131313" stroke-width="3.5" stroke-linecap="round"/>


