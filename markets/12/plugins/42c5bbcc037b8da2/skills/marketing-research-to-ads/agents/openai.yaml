interface:
  display_name: "Ad Strategist"
  short_description: "Static ads from product research"
  default_prompt: "Use $marketing-research-to-ads: Research this product and its competitors, then create 5 static Meta ads with distinct angles."
dependencies:
  tools:
    - type: "mcp"
      value: "runcomfy"
      description: "RunComfy generation tools, status and results"
      transport: "streamable_http"
      url: "https://mcp.runcomfy.com/openai/mcp"
policy:
  allow_implicit_invocation: true
