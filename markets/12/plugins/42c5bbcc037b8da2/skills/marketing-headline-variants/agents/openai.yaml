interface:
  display_name: "Headline Multiplier"
  short_description: "Test new headlines on one ad"
  default_prompt: "Use $marketing-headline-variants: Create 10 versions of this ad, changing only the headline. Keep everything else unchanged."
dependencies:
  tools:
    - type: "mcp"
      value: "runcomfy"
      description: "RunComfy generation tools, status and results"
      transport: "streamable_http"
      url: "https://mcp.runcomfy.com/openai/mcp"
policy:
  allow_implicit_invocation: true
