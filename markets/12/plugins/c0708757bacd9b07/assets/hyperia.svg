<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon ring -->
  <path d="M60 8 L101 32 L101 88 L60 112 L19 88 L19 32 Z"
        stroke="url(#hexGrad)" stroke-width="2.5" fill="none"
        opacity="0.6" filter="url(#glow)"/>

  <!-- Inner hexagon -->
  <path d="M60 24 L88 40 L88 80 L60 96 L32 80 L32 40 Z"
        stroke="url(#hexGrad)" stroke-width="1" fill="none"
        opacity="0.3"/>

  <!-- Central node — glowing circle -->
  <circle cx="60" cy="60" r="16" fill="url(#dotGrad)" filter="url(#glowStrong)" opacity="0.9"/>

  <!-- Inner dot -->
  <circle cx="60" cy="60" r="6" fill="#f0f0f8"/>

  <!-- Connecting lines from center to hex vertices -->
  <line x1="60" y1="60" x2="60" y2="28" stroke="#c084fc" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="88" y2="44" stroke="#c084fc" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="88" y2="76" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="60" y2="92" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="32" y2="76" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="32" y2="44" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
</svg>
