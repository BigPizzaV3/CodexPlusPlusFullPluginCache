interface:
  display_name: "Make a training plan"
  short_description: "Build a weekly ballet plan from real Broche classes"
  default_prompt: "Use $make-a-training-plan to build a weekly ballet practice plan from Broche classes."

dependencies:
  tools:
    - type: "mcp"
      value: "broche"
      description: "Broche Ballet classes, programs, and the dancer's current week"
      transport: "streamable_http"
      url: "https://api.brocheballetonline.com/mcp"
