interface:
  display_name: "Zovo PDF to Spreadsheet"
  short_description: "PDF tables into a spreadsheet"
  brand_color: "#1D6F42"
  default_prompt: "Convert the tables in the attached PDF to Excel, one sheet per table"
dependencies:
  tools:
    - type: "mcp"
      value: "pdf-to-excel"
      description: "Turn the tables in a text PDF into a real Excel workbook and CSV files."
      transport: "streamable_http"
      url: "https://pdf-to-excel.zovo.one/mcp"
