    - type: "mcp"
      value: "sagi-consultas"
      description: "Ponte autenticada de consultas entre o ChatGPT e a API SAGI."
      transport: "streamable_http"
      url: "https://mcp.sagierp.com.br/mcp"
policy:
  allow_implicit_invocation: true
