interface:
  display_name: "Skinow Ski Weather"
  short_description: "Compare snow, weather, lifts, maps and ski history"
  default_prompt: "Use $ski-weather to compare snow and mountain conditions for my ski shortlist."
dependencies:
  tools:
    - type: "mcp"
      value: "skinow"
      description: "Skinow weather and ski planning MCP"
      transport: "streamable_http"
      url: "https://skinow.co/openai/mcp"
policy:
  allow_implicit_invocation: true
