interface:
  display_name: "Skinow Trip Planner"
  short_description: "Keep one living ski trip report for your group"
  default_prompt: "Use $plan-ski-trip to save a living trip report for my group and keep our choices and corrections together."
dependencies:
  tools:
    - type: "mcp"
      value: "skinow"
      description: "Skinow weather and living ski trip planning MCP"
      transport: "streamable_http"
      url: "https://skinow.co/openai/mcp"
policy:
  allow_implicit_invocation: true
