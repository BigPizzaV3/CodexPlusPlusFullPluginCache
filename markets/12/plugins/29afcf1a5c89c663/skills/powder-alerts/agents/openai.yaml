interface:
  display_name: "Skinow Powder Alerts"
  short_description: "Get resort or country snow-alert signup links"
  default_prompt: "Use $powder-alerts to help me choose and set up a snow alert."
dependencies:
  tools:
    - type: "mcp"
      value: "skinow"
      description: "Skinow weather and ski planning MCP"
      transport: "streamable_http"
      url: "https://skinow.co/openai/mcp"
policy:
  allow_implicit_invocation: true
