<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 122">
  <!-- Transparent background on purpose: a solid-black square favicon
       trips Chrome's dark-mode low-contrast heuristic, which paints a
       white outline around the whole icon. With a transparent ground and
       a scheme-aware glyph there is nothing for Chrome to "protect" —
       the mark rides directly on the tab in both themes. PNG/ICO
       fallbacks (black square) remain for browsers without SVG favicon
       support. -->
  <style>
    rect { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #ffffff; }
    }
  </style>
  <rect x="0" y="0" width="14" height="122"/>
  <rect x="46" y="0" width="96" height="14"/>
  <rect x="46" y="54" width="96" height="14"/>
  <rect x="46" y="108" width="96" height="14"/>
</svg>
