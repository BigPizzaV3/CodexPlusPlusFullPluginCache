<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CraftGenie">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2E63C7"/>
      <stop offset="1" stop-color="#1D4A9E"/>
    </radialGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="200" y1="190" x2="300" y2="400">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DDE3EE"/>
      <stop offset="1" stop-color="#A9B3C7"/>
    </linearGradient>
    <linearGradient id="genie" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="110">
      <stop offset="0" stop-color="#1E7FD6" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#2FA8EE"/>
      <stop offset="1" stop-color="#8BE6FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2A66" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- genie rising from the G -->
  <path d="M258 312 C 224 272, 300 246, 268 200 C 246 170, 300 150, 284 118 C 274 98, 244 100, 240 120"
        fill="none" stroke="url(#genie)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="246" cy="112" r="21" fill="#8BE6FF" filter="url(#glow)"/>
  <circle cx="241" cy="106" r="7" fill="#FFFFFF"/>
  <!-- the G -->
  <g filter="url(#shadow)">
    <path d="M318 222 A 96 96 0 1 0 352 300" fill="none" stroke="url(#silver)" stroke-width="54" stroke-linecap="round"/>
    <path d="M352 300 L 270 300" fill="none" stroke="url(#silver)" stroke-width="44" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M150 196 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path d="M184 168 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M346 168 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M370 238 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <circle cx="200" cy="200" r="4"/>
    <circle cx="352" cy="216" r="4"/>
  </g>
</svg>
