interface:
  display_name: "Choose an AI model"
  short_description: "Pick or compare AI models"
  default_prompt: "Which AI model should I use for coding, and what would 1,000 messages cost?"
policy:
  products: [CHAT]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "whizi-model-finder"
      description: "Whizi Model Finder: recommends and compares AI models with prices"
      transport: "streamable_http"
      url: "https://whizi.io/mcp"
