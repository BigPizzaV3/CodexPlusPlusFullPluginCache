interface:
  display_name: "Zovo Org Chart Maker"
  short_description: "Org charts from a team list"
  brand_color: "#3B4C9A"
  default_prompt: "Make an org chart: Ada Lee (CEO); Ben Cole (VP Engineering) reports to Ada Lee; Cy Park reports to Ben Cole"
dependencies:
  tools:
    - type: "mcp"
      value: "org-chart"
      description: "Turn a team list into a laid-out org chart with SVG and PDF downloads."
      transport: "streamable_http"
      url: "https://org-chart.zovo.one/mcp"
