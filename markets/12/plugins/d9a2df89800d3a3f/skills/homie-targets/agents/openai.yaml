interface:
  display_name: "Homie targets"
  short_description: "Manage target lists and key relationships"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#005244"
  default_prompt: "Use $homie-targets to show my target company lists."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "homie"
      description: "Read and manage Homie target lists and relationship priorities"
      transport: "streamable_http"
      url: "https://app.usehomie.com/mcp"
