interface:
  display_name: "Homie"
  short_description: "Find people to approach and who can introduce you"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#005244"
  default_prompt: "Use $homie to find how I can reach Stripe."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "homie"
      description: "Find company access, prospects, investors, hires and experts through Homie connections"
      transport: "streamable_http"
      url: "https://app.usehomie.com/mcp"
