interface:
  display_name: "Zovo Flashcards"
  short_description: "Review, print & export cards"
  brand_color: "#6D4BC4"
  default_prompt: "Make flashcards for Spanish greetings: hello = hola; thank you = gracias."
dependencies:
  tools:
    - type: "mcp"
      value: "flashcard-studio"
      description: "Flip supplied pairs, review, and print cut-out cards."
      transport: "streamable_http"
      url: "https://flashcard-studio.zovo.one/mcp"
