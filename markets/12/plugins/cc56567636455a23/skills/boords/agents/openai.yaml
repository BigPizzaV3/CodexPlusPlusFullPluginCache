interface:
  display_name: "Boords"
  short_description: "Write scripts, build storyboards and review feedback in Boords."
  icon_small: "./assets/composer-icon.png"
  icon_large: "./assets/logo.png"
  brand_color: "#FFC700"
  default_prompt: "Use Boords to work on my script or storyboard."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "boords"
      description: "Boords projects, scripts, storyboards, frames, comments and the approval panel"
      transport: "streamable_http"
      url: "https://app.boords.com/mcp"
