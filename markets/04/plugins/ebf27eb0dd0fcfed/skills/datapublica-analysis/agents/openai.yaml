interface:
  display_name: "Datapublica analysis"
  short_description: "Analyze Danish companies with Datapublica"
  default_prompt: "Use $datapublica-analysis to analyze Danish companies and explain the results."
dependencies:
  tools:
    - type: "mcp"
      value: "datapublica"
      description: "Current Danish company data and read-only SQL analysis"
      transport: "streamable_http"
      url: "https://mcp.datapublica.dk/mcp"
policy:
  allow_implicit_invocation: true
