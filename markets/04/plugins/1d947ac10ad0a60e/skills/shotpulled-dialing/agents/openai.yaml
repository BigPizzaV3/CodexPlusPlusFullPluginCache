interface:
  display_name: "ShotPulled — dial in espresso"
  short_description: "Diagnose a shot from how it tasted and get one change at a time"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.png"
  brand_color: "#B7741F"
  default_prompt: "My last shot was sour — help me dial it in."

policy:
  # Implicit invocation is wanted: someone saying "my shot came out sour" is
  # asking for this whether or not they know the skill exists.
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "shotpulled"
      description: "ShotPulled MCP server — beans, shots, equipment and the dialing engine"
      transport: "streamable_http"
      url: "https://mcp.shotpulled.com/mcp"
