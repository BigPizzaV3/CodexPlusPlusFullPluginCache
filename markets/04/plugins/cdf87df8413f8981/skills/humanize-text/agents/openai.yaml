interface:
  display_name: "Humanize text"
  short_description: "Make AI drafts read naturally"
  brand_color: "#CE5811"
  default_prompt: "Use $humanize-text to rewrite this draft so it reads naturally while preserving its meaning and formatting."

dependencies:
  tools:
    - type: "mcp"
      value: "reversegpt"
      description: "ReverseGPT text humanization service"
      transport: "streamable_http"
      url: "https://www.reversegpt.ai/api/mcp"

policy:
  allow_implicit_invocation: true
