interface:
  display_name: "Research with EduInsights"
  short_description: "Research colleges, fields, careers, and AI use"
  brand_color: "#5452E8"
  default_prompt: "Use $research-with-eduinsights to answer this education or workforce question with traceable evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "eduinsights"
      description: "Read-only public evidence on U.S. colleges, fields, careers, and observed AI use"
      transport: "streamable_http"
      url: "https://mcp.eduinsights.ai/mcp"

policy:
  allow_implicit_invocation: true
