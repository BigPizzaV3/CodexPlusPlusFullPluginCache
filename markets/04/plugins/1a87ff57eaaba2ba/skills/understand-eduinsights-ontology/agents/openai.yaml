interface:
  display_name: "Understand the EduInsights ontology"
  short_description: "Explain the data model and choose the right mart"
  default_prompt: "Use $understand-eduinsights-ontology to explain how EduInsights models this question and which semantic mart fits it."

dependencies:
  tools:
    - type: "mcp"
      value: "eduinsights"
      description: "Read-only public data on U.S. colleges, fields, careers, and observed AI use"
      transport: "streamable_http"
      url: "https://mcp.eduinsights.ai/mcp"

policy:
  allow_implicit_invocation: true
