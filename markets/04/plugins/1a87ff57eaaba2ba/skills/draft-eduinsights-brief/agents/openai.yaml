interface:
  display_name: "Draft an EduInsights brief"
  short_description: "Turn research into a clear decision brief"
  brand_color: "#5452E8"
  default_prompt: "Use $draft-eduinsights-brief to create a concise, sourced decision brief from this question or evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "eduinsights"
      description: "Read-only public evidence on U.S. colleges, fields, careers, and observed AI use"
      transport: "streamable_http"
      url: "https://mcp.eduinsights.ai/mcp"

policy:
  allow_implicit_invocation: true
