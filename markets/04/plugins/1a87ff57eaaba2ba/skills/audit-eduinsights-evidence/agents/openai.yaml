interface:
  display_name: "Audit EduInsights evidence"
  short_description: "Check sources, coverage, and evidence limits"
  brand_color: "#5452E8"
  default_prompt: "Use $audit-eduinsights-evidence to review these findings for source, coverage, period, and interpretation risks."

dependencies:
  tools:
    - type: "mcp"
      value: "eduinsights"
      description: "Read-only public evidence on U.S. colleges, fields, careers, and observed AI use"
      transport: "streamable_http"
      url: "https://mcp.eduinsights.ai/mcp"

policy:
  allow_implicit_invocation: true
