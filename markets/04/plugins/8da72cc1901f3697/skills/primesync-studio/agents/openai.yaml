interface:
  display_name: "PrimeSync Studio"
  short_description: "Build and validate trader-owned strategies"
  icon_small: "./assets/primesync-project-icon.png"
  icon_large: "./assets/primesync-project-icon.png"
  brand_color: "#000000"
  default_prompt: "Use $primesync-studio to turn my trading rules into an audited TradingView strategy."

dependencies:
  tools:
    - type: "mcp"
      value: "primesync-studio"
      description: "PrimeSync strategy building, audit, and validation tools"
      transport: "streamable_http"
      url: "https://ai.primesync.me/mcp/v1"

policy:
  allow_implicit_invocation: true
