interface:
  display_name: "UGC Ads"
  short_description: "Creator-style product ads"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#6C5CE7"
  default_prompt: "Make an unboxing video for my product"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "imagine-art"
      description: "ImagineArt generation and asset tools"
      transport: "streamable_http"
      url: "https://mcp.imagine.art/"
