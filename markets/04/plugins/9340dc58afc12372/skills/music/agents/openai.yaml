interface:
  display_name: "Sound"
  short_description: "Music and soundtracks"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#6C5CE7"
  default_prompt: "Make a soundtrack for my ad"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "imagine-art"
      description: "ImagineArt generation and asset tools"
      transport: "streamable_http"
      url: "https://mcp.imagine.art/"
