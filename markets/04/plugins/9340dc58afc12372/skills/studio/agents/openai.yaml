interface:
  display_name: "Studio"
  short_description: "Raw generation and assets"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#6C5CE7"
  default_prompt: "Generate an image of a mountain at dusk"

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
