interface:
  display_name: "Blender"
  short_description: "Editable 3D scenes and renders"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#6C5CE7"
  default_prompt: "Use $blender to build an editable product turntable with ImagineArt textures."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "imagine-art"
      description: "ImagineArt generation and asset tools"
      transport: "streamable_http"
      url: "https://mcp.imagine.art/"
