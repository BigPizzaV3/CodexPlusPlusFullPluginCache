interface:
  display_name: "Configure Memory"
  short_description: "Use the user's own portable memory profile"
  icon_small: "./assets/configure-symbol.svg"
  icon_large: "./assets/configure-app-icon-512.png"
  default_prompt: "Use $configure-memory to save my available non-sensitive work, project, preference and goal memories to Configure and report what was saved."

dependencies:
  tools:
    - type: "mcp"
      value: "configure"
      description: "Configure memory profile tools (read, search, remember, remember many, forget)"
      transport: "streamable_http"
      url: "https://mcp-chatgpt.configure.dev/mcp"
