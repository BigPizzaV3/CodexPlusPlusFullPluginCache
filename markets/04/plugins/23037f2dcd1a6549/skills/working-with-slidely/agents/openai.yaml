# interface is optional overall, but once this file exists OpenAI requires it, along with
# display_name and short_description. dependencies.tools declares the MCP server the skill
# drives; without it the tools may not be available when the skill activates.
interface:
  display_name: "Collaborate with Slidely"
  short_description: "Collaborate with Slidely to create or edit a presentation"
  default_prompt: "Create a presentation with Slidely, pick a design, and build the slides."

dependencies:
  tools:
    - type: "mcp"
      value: "slidely"
      description: "Create and edit presentations with Slidely"
      transport: "streamable_http"
      url: "https://prod.slidely.ai/mcp"
