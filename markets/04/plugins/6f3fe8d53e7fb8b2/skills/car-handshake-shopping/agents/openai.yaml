interface:
  display_name: "Car Handshake shopping"
  short_description: "Find and compare cars for sale"
  default_prompt: "Use $car-handshake-shopping to find used SUVs near Dallas under $30,000 with Apple CarPlay."

dependencies:
  tools:
    - type: "mcp"
      value: "car-handshake"
      description: "Search participating dealer inventory, compare vehicles and send confirmed dealer requests."
      transport: "streamable_http"
      url: "https://mcp.carhandshake.com/mcp/chatgpt"

policy:
  allow_implicit_invocation: true
