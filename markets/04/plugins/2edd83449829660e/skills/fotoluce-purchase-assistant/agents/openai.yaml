interface:
  display_name: "Fotoluce Purchase Assistant"
  short_description: "Manage cart and continue to checkout"
  default_prompt: "Use $fotoluce-purchase-assistant to review my Fotoluce cart and continue safely to checkout."
dependencies:
  tools:
    - type: "mcp"
      value: "fotoluce"
      description: "Read and update the linked Fotoluce cart and create hosted checkout links"
      transport: "streamable_http"
      url: "https://www.fotoluce.it/mcp"
