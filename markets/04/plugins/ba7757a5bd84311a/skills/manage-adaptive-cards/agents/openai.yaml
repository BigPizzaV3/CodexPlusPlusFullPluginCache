interface:
  display_name: "Manage Adaptive Cards"
  short_description: "Build and manage Team Chat Adaptive Cards"
  default_prompt: "Use $manage-adaptive-cards to build and post an Adaptive Card status update."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Create, update, and read the authenticated user's RingCentral Team Chat Adaptive Cards."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
