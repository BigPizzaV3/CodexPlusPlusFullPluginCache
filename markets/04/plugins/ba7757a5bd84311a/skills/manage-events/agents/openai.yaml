interface:
  display_name: "Manage Events"
  short_description: "Manage Team Chat events"
  default_prompt: "Use $manage-events to create, update, or delete a Team Chat event."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Read and manage the authenticated user's RingCentral Team Chat events."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
