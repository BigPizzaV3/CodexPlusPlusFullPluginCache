interface:
  display_name: "Manage Teams"
  short_description: "Manage Team Chat teams and membership"
  default_prompt: "Use $manage-teams to create or manage a Team Chat team and its membership."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Manage the authenticated user's RingCentral Team Chat teams and membership."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
