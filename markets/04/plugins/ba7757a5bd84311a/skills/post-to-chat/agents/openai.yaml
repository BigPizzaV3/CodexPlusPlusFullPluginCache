interface:
  display_name: "Post to Chat"
  short_description: "Send, edit, and delete Team Chat posts"
  default_prompt: "Use $post-to-chat to post an update to a chat or reply in a thread."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Send and manage the authenticated user's RingCentral Team Chat posts."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
