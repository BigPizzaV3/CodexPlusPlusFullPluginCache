interface:
  display_name: "Manage Tasks"
  short_description: "Manage Team Chat tasks"
  default_prompt: "Use $manage-tasks to create, update, complete, reopen, or delete a Team Chat task."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Read and manage the authenticated user's RingCentral Team Chat tasks."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
