interface:
  display_name: "Manage Notes"
  short_description: "Manage Team Chat notes"
  default_prompt: "Use $manage-notes to create, update, publish, lock, or delete a Team Chat note."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Read and manage the authenticated user's RingCentral Team Chat notes."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
