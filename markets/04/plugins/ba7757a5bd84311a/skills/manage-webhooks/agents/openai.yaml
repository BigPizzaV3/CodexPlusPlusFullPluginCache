interface:
  display_name: "Manage Webhooks"
  short_description: "Manage Team Chat incoming webhooks"
  default_prompt: "Use $manage-webhooks to create, activate, suspend, or delete a Team Chat incoming webhook."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Manage the authenticated user's RingCentral Team Chat incoming webhooks."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
