interface:
  display_name: "Read Team Chat"
  short_description: "Catch up on Team Chat and resolve people"
  default_prompt: "Use $read-team-chat to catch me up on recent Team Chat conversations, tasks, notes, and events."

dependencies:
  tools:
    - type: "mcp"
      value: "ringcentral-team-chat"
      description: "Read the authenticated user's RingCentral Team Chat activity and resolve people."
      transport: "streamable_http"
      url: "https://rc-platform-phone-plugin-9d4587b77588.herokuapp.com/team-chat/mcp"

policy:
  allow_implicit_invocation: true
