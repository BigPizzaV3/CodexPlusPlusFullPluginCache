interface:
  display_name: "BrainOrder"
  short_description: "Manage BrainOrder tasks, notes, and agenda"
  default_prompt: "Use $brain-order to review my agenda and help manage my tasks."

dependencies:
  tools:
    - type: "mcp"
      value: "brain-order"
      description: "Read and manage the authenticated user's BrainOrder workspace"
      transport: "streamable_http"
      url: "https://mcp.brainorder.pp.ua/mcp"

policy:
  allow_implicit_invocation: true
