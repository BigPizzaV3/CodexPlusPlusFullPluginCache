interface:
  display_name: "Run a FLORA technique"
  short_description: "Apply a saved FLORA visual workflow to an image."
  default_prompt: "Use a FLORA technique on this image"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "flora"
      description: "FLORA MCP server"
      transport: "streamable_http"
      url: "https://agents.flora.ai/mcp"
