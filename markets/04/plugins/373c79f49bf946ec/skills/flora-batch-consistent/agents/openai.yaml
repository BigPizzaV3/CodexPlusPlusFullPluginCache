interface:
  display_name: "Batch a FLORA technique"
  short_description: "Apply one FLORA workflow across many items, consistently."
  default_prompt: "Run this list through a FLORA technique"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "flora"
      description: "FLORA MCP server"
      transport: "streamable_http"
      url: "https://agents.flora.ai/mcp"
