interface:
  display_name: "Iterate on a FLORA project"
  short_description: "Inspect an existing FLORA canvas and regenerate work on it."
  default_prompt: "Show me what's in my FLORA project"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "flora"
      description: "FLORA MCP server"
      transport: "streamable_http"
      url: "https://agents.flora.ai/mcp"
