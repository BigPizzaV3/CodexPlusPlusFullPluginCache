interface:
  display_name: "Create a SlideForge Presentation"
  short_description: "Generate and export polished AI slide decks"
  brand_color: "#F26B38"
  default_prompt: "Use $create-slideforge-presentation to create and export a presentation about my topic."

dependencies:
  tools:
    - type: "mcp"
      value: "slideforge"
      description: "SlideForge presentation generation and export tools"
      transport: "streamable_http"
      url: "https://mcp.slideforge.io/mcp"

policy:
  allow_implicit_invocation: true
