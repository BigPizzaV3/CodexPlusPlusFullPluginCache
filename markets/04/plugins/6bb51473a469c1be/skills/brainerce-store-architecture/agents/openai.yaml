# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Catalog structure"
  short_description: "Decide what becomes a variant, a custom field, a category or a tag"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "How should I structure my catalog?"

policy:
  allow_implicit_invocation: true

# This one DOES declare the server, unlike the other two advisory skills. Review
# mode is not advice: it reads the merchant's actual catalog and judges it, and
# planning mode ends in categories and tags that get created. The tools named
# below are the read set plus the three taxonomy and custom-field writes the
# improvement plan actually uses.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses count_products, list_products, get_product, list_categories, list_tags and list_product_metafields to audit an existing catalog, and create_category, create_tag, create_product, update_product and set_product_metafield to build the structure it recommends."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
