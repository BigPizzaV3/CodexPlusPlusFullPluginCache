# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Launch a sale"
  short_description: "Set up a discount or coupon and confirm it is live"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Take 20% off everything next week."

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. Declaring the dependency makes the tools
# available to the skill; it does not replace the routing instructions in
# SKILL.md, which name each tool and the order to call them in.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses create_discount_rule, list_discount_rules, toggle_discount_rule, create_coupon, list_coupons, preview_coupon_for_order, list_products, list_categories and get_store, for creating a promotion and reading it back to confirm it exists."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
