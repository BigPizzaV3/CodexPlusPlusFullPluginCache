# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Store health check"
  short_description: "Sweep for drafts, empty stock, overrunning promotions and stuck orders"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Check my store and tell me what needs fixing."

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. Declaring the dependency makes the tools
# available to the skill; it does not replace the routing instructions in
# SKILL.md, which name each tool and the order to call them in.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses list_products, get_product_inventory, get_top_selling_products, list_discount_rules, list_coupons, toggle_discount_rule, get_orders_by_status, get_recent_orders, list_product_reviews and get_product_review_stats, for the read-only sweep."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
