# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Handle an order"
  short_description: "Look up one order and fulfil, update or cancel it safely"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Where is order 1042?"

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. Declaring the dependency makes the tools
# available to the skill; it does not replace the routing instructions in
# SKILL.md, which name each tool and the order to call them in.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses get_order, list_orders, get_recent_orders, get_orders_by_status, update_order_status, fulfill_order, cancel_order, get_customer, get_customer_orders and get_store, for working a single order."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
