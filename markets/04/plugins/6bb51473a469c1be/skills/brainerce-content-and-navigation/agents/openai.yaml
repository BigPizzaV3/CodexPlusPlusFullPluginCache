# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Pages and navigation"
  short_description: "Static pages, header links, announcements, blog and the SEO around them"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Where do I write my About page and add it to the menu?"

policy:
  allow_implicit_invocation: true

# No dependencies block on purpose, and this one is not the usual reason. The
# other tool-less skills are developer knowledge; this skill is aimed at
# merchants and WOULD execute if it could. It cannot: `/api/mcp/openai`
# publishes no content, page, blog or navigation tool, so every route in
# SKILL.md is a dashboard step. Declaring the server here would make ChatGPT ask
# for an OAuth connection this skill can do nothing with, and would imply the
# assistant is about to edit a page it has no way to reach.
