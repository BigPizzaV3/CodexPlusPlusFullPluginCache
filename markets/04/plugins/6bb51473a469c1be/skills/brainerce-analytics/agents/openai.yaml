# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Store analytics"
  short_description: "Answer how much, how many and what is the trend with the right report"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "How much did I make this month compared to last?"

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. Declaring the dependency makes the tools
# available to the skill; it does not replace the routing instructions in
# SKILL.md, which name each tool and the order to call them in.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses get_store_analytics_summary, get_orders_stats, get_average_order_value, get_top_selling_products, get_orders_by_status, get_recent_orders, count_products, list_customers, get_customer, get_customer_orders, get_product_review_stats, list_product_reviews and get_store, for reporting."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
