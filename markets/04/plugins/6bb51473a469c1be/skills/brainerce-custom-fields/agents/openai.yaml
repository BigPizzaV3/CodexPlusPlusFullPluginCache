# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Custom fields"
  short_description: "Put structured data on products, and know which half is a dashboard step"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Add care instructions to my linen products."

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. This skill executes: it writes custom-field
# VALUES. It cannot create the field definitions, which is a dashboard step, and
# SKILL.md says so in those words rather than letting the model discover it as a
# failed call. The read tools below are not optional extras: a definitionId is
# reachable ONLY from a product that already carries that field, so the reads
# are how any write becomes possible at all.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses list_product_metafields and get_product_metafield to read a field's definitionId and current value, list_products and get_product to find the products to write to, and set_product_metafield to write the value."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
