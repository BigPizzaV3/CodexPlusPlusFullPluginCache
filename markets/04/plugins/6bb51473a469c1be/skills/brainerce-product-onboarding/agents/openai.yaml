# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Add a product"
  short_description: "Create a product and finish it: category, tags, stock, publishing"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "I have a new product to add to my shop."

policy:
  allow_implicit_invocation: true

# The Brainerce admin MCP server. Declaring the dependency makes the tools
# available to the skill; it does not replace the routing instructions in
# SKILL.md, which name each tool and the order to call them in.
dependencies:
  tools:
    - type: "mcp"
      value: "brainerce"
      description: "Brainerce store management. This skill uses create_product, update_product, duplicate_product, get_product, list_products, set_product_stock, get_product_inventory, list_categories, create_category, list_tags, create_tag and get_store, for the full add-a-product sequence."
      transport: "streamable_http"
      url: "https://mcp.brainerce.com/api/mcp/openai"
