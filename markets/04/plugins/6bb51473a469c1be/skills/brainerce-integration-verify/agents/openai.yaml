# Branding and behaviour for this skill inside ChatGPT and Codex.
# Interface keys are snake_case here; the plugin manifest uses its own casing.
interface:
  display_name: "Verify integration"
  short_description: "Audit a build against the mandatory features and critical rules"
  icon_small: "./assets/icon.png"
  brand_color: "#182848"
  default_prompt: "Check my Brainerce integration before I ship it."

policy:
  allow_implicit_invocation: true

# No dependencies block on purpose. This skill is developer knowledge and calls
# no tool on the Brainerce admin MCP server, so declaring that server would make
# ChatGPT ask the developer to connect a merchant account it never uses. The
# material it needs travels with the skill, under references/.
