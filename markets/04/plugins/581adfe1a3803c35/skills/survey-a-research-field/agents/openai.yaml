interface:
  display_name: "Survey a Research Field"
  short_description: "Measure a research field by exact publication counts"
  icon_small: "./assets/pendar-logo.png"
  icon_large: "./assets/pendar-logo.png"
  default_prompt: "Use $survey-a-research-field to map this field's size, growth, and who publishes it."

dependencies:
  tools:
    - type: "mcp"
      value: "pendar"
      description: "Count and characterise every paper matching a topic"
      transport: "streamable_http"
      url: "https://pendar.ai/mcp"
