interface:
  display_name: "Trace Citation Impact"
  short_description: "Follow who has built on a paper, and where it spread"
  icon_small: "./assets/pendar-logo.png"
  icon_large: "./assets/pendar-logo.png"
  default_prompt: "Use $trace-citation-impact to map who built on this paper, which fields picked it up, and whether citations are still rising."

dependencies:
  tools:
    - type: "mcp"
      value: "pendar"
      description: "Walk a paper's citation neighbourhood and analyse its citers"
      transport: "streamable_http"
      url: "https://pendar.ai/mcp"
