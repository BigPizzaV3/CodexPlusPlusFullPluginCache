interface:
  display_name: "Verify Citations"
  short_description: "Confirm papers exist, match their citation, and are not retracted"
  icon_small: "./assets/pendar-logo.png"
  icon_large: "./assets/pendar-logo.png"
  default_prompt: "Use $verify-citations to check these references are real and unretracted."

dependencies:
  tools:
    - type: "mcp"
      value: "pendar"
      description: "Resolve a citation to its canonical record and retraction status"
      transport: "streamable_http"
      url: "https://pendar.ai/mcp"
