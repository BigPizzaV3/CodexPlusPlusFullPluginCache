interface:
  display_name: "RescueTime"
  short_description: "Analyze RescueTime and control focus sessions"
  default_prompt: "Use $rescuetime to summarize how I spent my time today."

dependencies:
  tools:
    - type: "mcp"
      value: "rescuetime"
      description: "RescueTime activity, project-time, and focus-control tools"
      transport: "streamable_http"
      url: "https://www.rescuetime.com/mcp"

policy:
  allow_implicit_invocation: true
