dependencies:
  tools:
    - type: "mcp"
      value: "trooth_public_trust_profile"
      description: "Look up a company's canonical witnessed profile on the Trooth Network (the record at trooth.co/network/company/{slug})"
      transport: "streamable_http"
      url: "https://api.trooth.co/public/mcp"
    - type: "mcp"
      value: "trooth_outside_in_read"
      description: "Live neutral read of a domain's public security surface"
      transport: "streamable_http"
      url: "https://api.trooth.co/public/mcp"
    - type: "mcp"
      value: "trooth_verify"
      description: "Verify a Trooth Trust Ledger Token"
      transport: "streamable_http"
      url: "https://api.trooth.co/public/mcp"
