interface:
  display_name: "ReformCue routine builder"
  short_description: "Create moves and build ReformCue routines"
  default_prompt: "Use $reformcue-routine-builder to create a move or build a ReformCue routine from my authorized library."

dependencies:
  tools:
    - type: "mcp"
      value: "reformcue"
      description: "Authenticated ReformCue context, move creation and lookup, routine history, and atomic routine creation tools."
      transport: "streamable_http"
      url: "https://www.reformcue.com/mcp"

policy:
  allow_implicit_invocation: true
