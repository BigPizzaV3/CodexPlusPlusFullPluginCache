interface:
  display_name: "HoneyBook Project Pipeline"
  short_description: "Review projects across pipeline stages"
  default_prompt: "Use $honeybook-project-pipeline to show my active project pipeline overview."

dependencies:
  tools:
    - type: "mcp"
      value: "honeybook"
      description: "Access HoneyBook projects and pipeline data"
      transport: "streamable_http"
      url: "https://mcp.api.honeybook.com/mcp"

policy:
  allow_implicit_invocation: true
