interface:
  display_name: "Cal Plus Habit Insights"
  short_description: "Streaks, consistency and which habits are slipping or building — from your Cal Plus data, read-only."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#FFF600"
  default_prompt: "Which of my habits am I slipping on, and which one should I rebuild first?"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "calplus"
      description: "Cal Plus connector — read-only access to the user's own logged data"
      transport: "streamable_http"
      url: "https://mcp.calplus.app/mcp"
