interface:
  display_name: "Cal Plus Game Plan"
  short_description: "Today's strategy from your Cal Plus data: focus, meals, training, hydration — read-only."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#FFF600"
  default_prompt: "Build my game plan for today."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "calplus"
      description: "Cal Plus connector — read-only access to the user's own logged data"
      transport: "streamable_http"
      url: "https://mcp.calplus.app/mcp"
