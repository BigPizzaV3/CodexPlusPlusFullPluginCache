interface:
  display_name: "Cal Plus Coach"
  short_description: "Coaching from your own Cal Plus nutrition, workouts, weight and habits — read-only."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#FFF600"
  default_prompt: "How has my nutrition been over the last month, and what's the one thing I should change?"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "calplus"
      description: "Cal Plus connector — read-only access to the user's own logged data"
      transport: "streamable_http"
      url: "https://mcp.calplus.app/mcp"
