interface:
  display_name: "metri Calories"
  short_description: "Log meals and review your calorie diary"
  default_prompt: "Use $metri-calories to log what I ate today."

dependencies:
  tools:
    - type: "mcp"
      value: "metri"
      description: "Private metri food diary MCP server"
      transport: "streamable_http"
      url: "https://mcp.metri-diary.com/mcp"

policy:
  allow_implicit_invocation: true
