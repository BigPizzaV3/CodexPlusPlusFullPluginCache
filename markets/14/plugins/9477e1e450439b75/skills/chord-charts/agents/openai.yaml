interface:
  display_name: "Zovo Chord Chart Maker"
  short_description: "Printable chord diagrams"
  brand_color: "#2457B8"
  default_prompt: "Printable guitar chord chart for G, Em, C, D, Am7 and Dsus4"
dependencies:
