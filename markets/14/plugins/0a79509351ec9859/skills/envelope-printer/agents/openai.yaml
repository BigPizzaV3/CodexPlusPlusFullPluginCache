interface:
  display_name: "Zovo Envelope Printer"
  short_description: "Print addresses on envelopes"
  brand_color: "#8A4B2A"
  default_prompt: "Print #10 envelopes for Jane Smith, 123 Main St Apt 4B, Springfield IL 62704 from 42 Oak Lane, Portland OR 97205"
dependencies:
  tools:
    - type: "mcp"
      value: "envelope-printer"
      description: "Print addresses on envelopes from a list or spreadsheet, at the real envelope size."
      transport: "streamable_http"
      url: "https://envelope-printer.zovo.one/mcp"
