<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d7460"/>
      <stop offset=".55" stop-color="#6b573f"/>
      <stop offset="1" stop-color="#4b3a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".85">
      <stop offset="0" stop-color="#f4d9a0" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#f4d9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f8dfa0"/>
      <stop offset=".48" stop-color="#edc45a"/>
      <stop offset="1" stop-color="#cf9a2c"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fbf4e7"/>
      <stop offset="1" stop-color="#e6d6bf"/>
    </linearGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#22170d" flood-opacity=".55"/>
    </filter>
    <filter id="frontShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1d1309" flood-opacity=".6"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <g stroke="#e7c987" stroke-opacity=".10" stroke-width="2">
      <path d="M128 0V512M256 0V512M384 0V512M0 128H512M0 256H512M0 384H512"/>
    </g>

    <g transform="rotate(-11 178 190)" filter="url(#tileShadow)">
      <rect x="80" y="92" width="196" height="196" rx="38" fill="url(#cream)"/>
      <rect x="80" y="92" width="196" height="196" rx="38" fill="none" stroke="#fffaf0" stroke-opacity=".75" stroke-width="3"/>
      <text x="178" y="234" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" fill="#a08e78">2</text>
    </g>

    <g transform="rotate(4 322 326)" filter="url(#frontShadow)">
      <rect x="202" y="212" width="240" height="240" rx="46" fill="url(#gold)"/>
      <rect x="202" y="212" width="240" height="240" rx="46" fill="none" stroke="#fff3cf" stroke-opacity=".8" stroke-width="3"/>
      <rect x="214" y="224" width="216" height="216" rx="38" fill="none" stroke="#8b5f12" stroke-opacity=".18" stroke-width="2"/>
      <text x="322" y="372" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#4a3208">2048</text>
    </g>

    <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#f6dda2" stroke-opacity=".34" stroke-width="4"/>
  </g>
</svg>
