<?xml version="1.0"?>
<!-- 星盘通品牌标记（2026-07 定稿·反白版）：铜绿底 + 骨白准星，直角满幅。
     几何为 png/accent/app-icon-1024.png 的亚像素实测值（1024 画布，中心 512）：
     外环 r305 / 内环 r96，环描边 30；准星线 112→912，线描边 28；中心点 r26。
     准星线四段止于内环中线（被环描边盖住），复现原图内环挖空效果。
     注意：环与准星线描边宽度不同（30 / 28），非笔误。禁止重绘或调整比例。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="星盘通">
  <title>星盘通</title>
  <rect width="1024" height="1024" fill="#1d5851"/>
  <g fill="none" stroke="#faf8f0">
    <path stroke-width="28" d="M512 112v304M512 608v304M112 512h304M608 512h304"/>
    <circle cx="512" cy="512" r="305" stroke-width="30"/>
    <circle cx="512" cy="512" r="96" stroke-width="30"/>
    <circle cx="512" cy="512" r="26" fill="#faf8f0" stroke="none"/>
  </g>
</svg>
