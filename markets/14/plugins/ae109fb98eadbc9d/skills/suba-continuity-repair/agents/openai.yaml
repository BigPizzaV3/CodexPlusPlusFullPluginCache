interface:
  display_name: "SubA continuity repair"
  short_description: "Review and save subtitle corrections with a change log"
  default_prompt: "Use $suba-continuity-repair to review the completed SubA translation, save supported corrections, and deliver the revised subtitle with a change log."
dependencies:
  tools:
    - type: "mcp"
      value: "suba"
      description: "Read, revise, check and export the same SubA subtitle job"
      transport: "streamable_http"
      url: "https://mcp.entendu.studio/v1"
policy:
  allow_implicit_invocation: true
