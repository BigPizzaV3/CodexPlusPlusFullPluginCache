interface:
  display_name: "Zovo Spreadsheet Checker"
  short_description: "Check spreadsheets for errors"
  brand_color: "#1F7A5A"
  default_prompt: "Check this spreadsheet for errors before I import it into our CRM"
dependencies:
  tools:
    - type: "mcp"
      value: "sheet-validate"
      description: "Check a spreadsheet for errors before you import or send it, with each problem cell, its row, column and value."
      transport: "streamable_http"
      url: "https://sheet-validate.zovo.one/mcp"
