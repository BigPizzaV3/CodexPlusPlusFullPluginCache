interface:
  display_name: "Bible Study"
  short_description: "Study Scripture with SABDA resources"
  default_prompt: "Use $bible-study to study a Bible passage with SABDA resources."

dependencies:
  tools:
    - type: "mcp"
      value: "sabda-bible-mcp"
      description: "SABDA Bible MCP server for Bible, study, devotional, and ministry resources"
      transport: "streamable_http"
      url: "https://mcp.sabda.org/alkitab/"

policy:
  allow_implicit_invocation: true
