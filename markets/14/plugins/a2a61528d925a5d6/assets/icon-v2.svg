<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">iPlugin Weiqi</title>
  <desc id="desc">A 19×19 Go board with one black and one white stone, framed in jade and gold.</desc>
  <defs>
