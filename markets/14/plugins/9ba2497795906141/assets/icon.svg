<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title">
  <title id="mark-title">Fatma Süha</title>
  <!--
    Square brand mark, derived mechanically from fatmasuha-logo.svg: the same two
    leaf paths, in the same colours, cropped out of the 420x96 wordmark and
    centred on the tenant primary (#61554E). Nothing here is invented — the
    wordmark's lettering is unreadable below ~64px, so the leaf alone carries the
    mark at favicon sizes. The transform maps the leaf bounding box
    (x 38..100, y 28..70) into a 44x44 content area inside this 64x64 canvas.
    If the owner supplies a designed icon, replace this file and re-run
    `scripts/fatmasuha/generate-brand-icons.ts`; nothing else needs to change.
  -->
  <rect width="64" height="64" rx="12" fill="#61554E"/>
  <g transform="translate(-16.968 -2.774) scale(0.70968)">
    <path fill="#E6C25B" d="M38 70c17-24 34-35 55-42-8 15-20 31-39 42H38Z"/>
    <path fill="#F0EEE9" d="M58 70c11-18 25-29 42-37-5 15-15 28-31 37H58Z" opacity=".72"/>
  </g>
</svg>
