interface:
  display_name: "Create ShipPDF Template"
  short_description: "Design reusable ShipPDF layouts and data fields"
  default_prompt: "Use $shippdf-create-template to create a reusable PDF template in my ShipPDF workspace."

dependencies:
  tools:
    - type: "mcp"
      value: "shippdf"
      description: "ShipPDF template and document tools"
      transport: "streamable_http"
      url: "https://mcp.shippdf.com/"
