interface:
  display_name: "Generate ShipPDF Document"
  short_description: "Generate a PDF and retrieve its download link"
  default_prompt: "Use $shippdf-generate-document to generate a PDF from my ShipPDF template and supplied data."

dependencies:
  tools:
    - type: "mcp"
      value: "shippdf"
      description: "ShipPDF template and document tools"
      transport: "streamable_http"
      url: "https://mcp.shippdf.com/"
