interface:
  display_name: "Create or check spend request"
  short_description: "Create Custodia spend requests and check their approval status"
  default_prompt: "Use $create-spend-request to request a USD 300 spend permission for a team building event."
dependencies:
  tools:
    - type: "mcp"
      value: "custodia"
      description: "Authenticated Custodia MCP exposing spend_request_prepare, spend_request_check_duplicates, spend_permission_request, and spend_request_get_status"
      transport: "streamable_http"
      url: "https://mcp.sandbox.custodia-tech.com/mcp"
