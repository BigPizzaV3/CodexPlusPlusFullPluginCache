interface:
  icon_small: "./assets/venril-icon.png"
  icon_large: "./assets/venril-icon.png"
  brand_color: "#1E1B4B"
  display_name: "Capture Venril Work"
  short_description: "Turn requests into clear Venril tasks"
  default_prompt: "Use $venril-capture-work to capture these requests in Venril."

dependencies:
  tools:
    - type: "mcp"
      value: "venril"
      description: "Read and manage approved Venril workspaces"
      transport: "streamable_http"
      url: "https://www.venril.com/api/mcp"
