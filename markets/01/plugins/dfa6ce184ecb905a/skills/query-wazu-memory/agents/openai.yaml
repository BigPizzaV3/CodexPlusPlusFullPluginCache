interface:
  display_name: "Query Wazu Memory"
  short_description: "Search and investigate grounded Wazu evidence"
  default_prompt: "Use $query-wazu-memory to investigate this using my Wazu evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "wazu"
      description: "Read authorized Wazu personal and cohort evidence"
      transport: "streamable_http"
      url: "https://mcp.wazu.me/mcp"
policy:
  allow_implicit_invocation: true
