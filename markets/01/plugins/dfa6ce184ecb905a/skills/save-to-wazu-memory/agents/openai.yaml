interface:
  display_name: "Save to Wazu Memory"
  short_description: "Save verified information into a Wazu cohort"
  default_prompt: "Use $save-to-wazu-memory to save this into the correct Wazu cohort."
dependencies:
  tools:
    - type: "mcp"
      value: "wazu"
      description: "Write user-authorized information to a Wazu cohort"
      transport: "streamable_http"
      url: "https://mcp.wazu.me/mcp"
policy:
  allow_implicit_invocation: true
