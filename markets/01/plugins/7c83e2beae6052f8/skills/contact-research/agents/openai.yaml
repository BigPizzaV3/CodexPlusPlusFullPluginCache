interface:
  display_name: "Contact Research"
  short_description: "Research a person with Common Room signals"
  default_prompt: "Research this contact in Common Room and surface the strongest conversation angles."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "common-room"
      description: "Common Room MCP server"
      transport: "streamable_http"
      url: "https://mcp.commonroom.io/mcp"
