interface:
  display_name: "Call Prep"
  short_description: "Prepare for customer and prospect calls"
  default_prompt: "Prepare me for this call using Common Room account and attendee signals."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "common-room"
      description: "Common Room MCP server"
      transport: "streamable_http"
      url: "https://mcp.commonroom.io/mcp"
