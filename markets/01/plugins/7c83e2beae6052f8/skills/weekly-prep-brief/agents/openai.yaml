interface:
  display_name: "Weekly Prep Brief"
  short_description: "Prepare for the week's external meetings"
  default_prompt: "Create my weekly meeting brief using calendar context and Common Room signals."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "common-room"
      description: "Common Room MCP server"
      transport: "streamable_http"
      url: "https://mcp.commonroom.io/mcp"
