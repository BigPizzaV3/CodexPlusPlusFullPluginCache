interface:
  display_name: "Prospect"
  short_description: "Build targeted Common Room prospect lists"
  default_prompt: "Build a targeted prospect list in Common Room and help refine the criteria."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "common-room"
      description: "Common Room MCP server"
      transport: "streamable_http"
      url: "https://mcp.commonroom.io/mcp"
