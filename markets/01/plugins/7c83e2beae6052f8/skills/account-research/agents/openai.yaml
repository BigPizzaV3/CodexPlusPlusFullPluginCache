interface:
  display_name: "Account Research"
  short_description: "Research a company with Common Room signals"
  default_prompt: "Research this account using Common Room and recommend signal-backed next steps."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "common-room"
      description: "Common Room MCP server"
      transport: "streamable_http"
      url: "https://mcp.commonroom.io/mcp"
