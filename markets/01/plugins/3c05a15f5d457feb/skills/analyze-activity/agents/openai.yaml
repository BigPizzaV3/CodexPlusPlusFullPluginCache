interface:
  display_name: "Workout Analysis"
  short_description: "In-depth analysis of a completed run, ride, or swim."
  default_prompt: "Analyze my most recent activity in depth and compare it to my recent training."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "ai-endurance"
      description: "AI Endurance MCP server (getRunningActivity, getCyclingActivity, getSwimmingActivity and their Detail variants)"
      transport: "streamable_http"
      url: "https://aiendurance.com/api/mcp"
