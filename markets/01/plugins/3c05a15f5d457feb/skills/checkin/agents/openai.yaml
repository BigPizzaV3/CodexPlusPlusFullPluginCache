interface:
  display_name: "Daily Check-in"
  short_description: "Review your recovery and get advice on today's training."
  default_prompt: "Run my daily check-in: review my recovery data and today's planned workout, then advise on what I should do today given how I'm feeling."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "ai-endurance"
      description: "AI Endurance MCP server (getRecoveryModel, getPlannedWorkouts, changeWorkoutAdvice, changeWorkoutDate, skipWorkout)"
      transport: "streamable_http"
      url: "https://aiendurance.com/api/mcp"
