interface:
  display_name: "Weather Adjustment"
  short_description: "Pace today's run for the forecast at your location."
  default_prompt: "I'd like to adjust today's run for the weather. Check the forecast for my location and tell me how to pace the workout in those conditions."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "ai-endurance"
      description: "AI Endurance MCP server (getPlannedWorkouts, changeWorkoutAdvice)"
      transport: "streamable_http"
      url: "https://aiendurance.com/api/mcp"
