interface:
  display_name: "Weekly Replan"
  short_description: "Review plan progress and adjust the upcoming week."
  default_prompt: "Review what I've completed versus what was planned and propose modifications for the upcoming 7 days to get me back on track."
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "ai-endurance"
      description: "AI Endurance MCP server (getPlanProgress, getPlannedWorkouts, changeWorkoutDate, skipWorkout, changeWorkoutAdvice, create*Workout)"
      transport: "streamable_http"
      url: "https://aiendurance.com/api/mcp"
