interface:
  display_name: "Recall from Hjarni"
  short_description: "Load relevant Hjarni context before work."
  brand_color: "#b5510a"
  default_prompt: "Use $hjarni-recall to check my Hjarni notes for context before we start."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hjarni"
      description: "Hjarni knowledge base MCP server"
      transport: "streamable_http"
      url: "https://hjarni.com/mcp"
