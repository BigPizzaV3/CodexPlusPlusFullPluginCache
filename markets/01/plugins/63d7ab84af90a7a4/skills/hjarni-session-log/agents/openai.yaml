interface:
  display_name: "Session log to Hjarni"
  short_description: "Save an explicit session log to Hjarni."
  brand_color: "#b5510a"
  default_prompt: "Use $hjarni-session-log to log this session to Hjarni."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "hjarni"
      description: "Hjarni knowledge base MCP server"
      transport: "streamable_http"
      url: "https://hjarni.com/mcp"
