interface:
  display_name: "Remember in Hjarni"
  short_description: "Save durable knowledge to Hjarni."
  brand_color: "#b5510a"
  default_prompt: "Use $hjarni-remember to save this in Hjarni:"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hjarni"
      description: "Hjarni knowledge base MCP server"
      transport: "streamable_http"
      url: "https://hjarni.com/mcp"
