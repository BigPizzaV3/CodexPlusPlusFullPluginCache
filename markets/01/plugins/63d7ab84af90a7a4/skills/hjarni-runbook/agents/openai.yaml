interface:
  display_name: "Runbook to Hjarni"
  short_description: "Save a reusable runbook to Hjarni."
  brand_color: "#b5510a"
  default_prompt: "Use $hjarni-runbook to save this as a runbook in Hjarni."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "hjarni"
      description: "Hjarni knowledge base MCP server"
      transport: "streamable_http"
      url: "https://hjarni.com/mcp"
