# Optional metadata for the ChatGPT / Codex skill runtime.
# See https://learn.chatgpt.com/docs/build-skills
interface:
  display_name: "Windsor.ai"
  short_description: "Analyze data and run supported actions across 350+ sources via Windsor.ai."
  brand_color: "#232426"

policy:
  # Let ChatGPT trigger the skill on its own when a request matches the
  # description in SKILL.md (analyzing connected data or running an action).
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
