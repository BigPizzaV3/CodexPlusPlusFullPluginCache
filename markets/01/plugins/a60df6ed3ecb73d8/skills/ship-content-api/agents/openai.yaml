interface:
  display_name: "Ship in my app"
  short_description: "Embed, stream, or custom player"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.png"
  brand_color: "#11CC88"
  default_prompt: "Ship Hyperhuman workouts in my web app"

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "hyperhuman"
      description: "Hyperhuman Content API and Teams MCP"
      transport: "sse"
      url: "https://mcp.hyperhuman.cc/mcp"
