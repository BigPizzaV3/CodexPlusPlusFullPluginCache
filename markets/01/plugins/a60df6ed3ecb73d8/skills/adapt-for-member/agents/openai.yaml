interface:
  display_name: "Adapt for a member"
  short_description: "Recommend or reshape a session"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.png"
  brand_color: "#11CC88"
  default_prompt: "Adapt a Hyperhuman workout for an intermediate member with dumbbells"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hyperhuman"
      description: "Hyperhuman Content API and Teams MCP"
      transport: "sse"
      url: "https://mcp.hyperhuman.cc/mcp"
