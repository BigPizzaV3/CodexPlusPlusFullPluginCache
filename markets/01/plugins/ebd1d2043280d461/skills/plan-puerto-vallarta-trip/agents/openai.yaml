interface:
  display_name: "Plan a Puerto Vallarta trip"
  short_description: "Local guide + trip planner for Puerto Vallarta's Zona Romántica"
  brand_color: "#0A7B8A"

policy:
  # true = let ChatGPT invoke the skill automatically when a prompt matches the
  # description (not only on explicit $skill mention). This is the point of the
  # skill for broad discovery, so we set it explicitly even though true is default.
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "amapas-vacation-rental"
      description: "Amapas booking MCP server (find_puerto_vallarta_rental + add_booking)"
      transport: "streamable_http"
      url: "https://booking.amapas353.com/mcp"
