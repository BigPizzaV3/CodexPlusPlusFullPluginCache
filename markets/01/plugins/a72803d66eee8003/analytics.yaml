version: 1

operations:
  metrics_probe:
    path: ./scripts/metrics/1_probe_metrics.py
    measurements:
      metrics_probe: {}
      plugin_version:
        dimensions:
          component: [major, minor, patch]
  controller_launch:
    path: ./scripts/metrics/2_start_controller.py
    measurements:
      controller_launch:
        dimensions:
          outcome: [ready, startup_failure, launch_unobserved]
  replay_start:
    path: ./scripts/metrics/3_report_start_metrics.py
    measurements:
