          start_requested: [yes, no]
          run_observed: [yes, no]
          reporting_complete: [yes, no]
      final_prestart_timeout: {}
      attempt_model:
        dimensions:
          model_slot: [one, two, three, four, five, six, seven, eight]
          codex_model: [sol, terra, luna, other]
          status: [completed, failed, cancelled, launch_failed, unresolved, unreadable]
      replay:
        dimensions:
          model_slot: [one, two, three, four, five, six, seven, eight]
          codex_model: [sol, terra, luna, other]
          claude_model: [fable, opus, sonnet, haiku, other]
          source: [imported, sample]
          status: [completed, failed, cancelled]
      failure:
